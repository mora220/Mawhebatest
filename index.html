 ['pct','ربح تاجر 20٪ عندما باع سلعة بـ 360 ريالًا. كم كانت تكلفتها؟','A trader made a 20% profit by selling an item for 360 riyals. What did it cost him?',['300','288','340','432'],['300','288','340','432'],'سعر البيع = 120٪ من التكلفة، فالتكلفة 360 ÷ 1.2 = 300.','Selling price = 120% of cost, so cost = 360 ÷ 1.2 = 300.'],
 ['ratio','في خلطة عصير: لتران من المركّز لكل 7 لترات ماء. كم لترًا من المركّز يلزم لـ 35 لتر ماء؟','A drink uses 2 litres of concentrate for every 7 litres of water. How much concentrate for 35 litres of water?',['10','14','5','7'],['10','14','5','7'],'35 ÷ 7 = 5 أمثال، فالمركّز 2 × 5 = 10 لترات.','35 is 5 times 7, so concentrate = 2 × 5 = 10 litres.'],
 ['ratio','7 عمال ينجزون عملًا في 12 يومًا. في كم يومًا ينجزه 21 عاملًا بالكفاءة نفسها؟','7 workers finish a job in 12 days. How many days would 21 workers take at the same rate?',['4','36','6','3'],['4','36','6','3'],'تناسب عكسي: العمال ثلاثة أمثال، فالأيام ثلث: 12 ÷ 3 = 4 أيام.','Inverse proportion: three times the workers, a third of the days: 12 ÷ 3 = 4.'],
 ['geo','كم ضلعًا للمضلع المنتظم الذي قياس كل زاوية داخلية فيه 120°؟','How many sides does a regular polygon with 120° interior angles have?',['6','5','8','3'],['6','5','8','3'],'الزاوية الخارجية 180 − 120 = 60°، وعدد الأضلاع 360 ÷ 60 = 6.','Exterior angle = 60°, so sides = 360 ÷ 60 = 6.'],
 ['area','مربع طول ضلعه 28 سم، بداخله 4 دوائر متماسة قطر كل منها 14 سم. ما مساحة الجزء المظلل؟ (π ≈ 22/7)','A 28 cm square holds 4 touching circles, each 14 cm across. What is the shaded area? (π ≈ 22/7)',['168 سم²','616 سم²','784 سم²','154 سم²'],['168 cm²','616 cm²','784 cm²','154 cm²'],'مساحة المربع 784، ومساحة الدائرة 22/7 × 49 = 154، والدوائر الأربع 616، والمظلل 784 − 616 = 168.','Square 784; each circle 22/7 × 49 = 154, four make 616; shaded 784 − 616 = 168.',{fig:circ4('ضلع المربع 28 سم')},{fig:circ4('side = 28 cm')}],
 ['stat','درجات الحرارة في 5 أيام: 30 ، 32 ، 29 ، 35 ، 34. ما المدى؟','Temperatures over 5 days: 30, 32, 29, 35, 34. What is the range?',['6','5','32','4'],['6','5','32','4'],'المدى = أكبر قيمة − أصغر قيمة = 35 − 29 = 6.','Range = highest − lowest = 35 − 29 = 6.'],
 ['cnt','كم مربعًا (بجميع الأحجام) في شبكة 3 × 3؟','How many squares of all sizes are in a 3 × 3 grid?',['14','9','13','10'],['14','9','13','10'],'9 صغيرة + 4 من 2×2 + 1 كبير = 14.','9 small + 4 of size 2×2 + 1 large = 14.',{fig:gridSh(3,3,[],40)}],
 ['chem','الرمز الكيميائي لعنصر الصوديوم هو:','The chemical symbol for sodium is:',['Na','S','So','Sd'],['Na','S','So','Sd'],'رمز الصوديوم Na من اسمه اللاتيني Natrium، أما S فهو الكبريت.','Sodium is Na, from its Latin name Natrium; S is sulfur.'],
 ['bio','يعود الدم المحمّل بالأكسجين من الرئتين إلى:','Oxygen-rich blood from the lungs goes back to:',['القلب','الكبد','الكليتين','المعدة'],['the heart','the liver','the kidneys','the stomach'],'يعود الدم من الرئتين إلى القلب ليضخه إلى أنحاء الجسم.','Blood returns from the lungs to the heart, which pumps it round the body.'],
 ['phy','يمر تيار شدته 2 أمبير في مقاومة 6 أوم. ما فرق الجهد؟','A current of 2 A flows through a 6 Ω resistor. What is the voltage?',['12 فولت','3 فولت','8 فولت','4 فولت'],['12 V','3 V','8 V','4 V'],'قانون أوم: الجهد = التيار × المقاومة = 2 × 6 = 12 فولت.','Ohm’s law: V = I × R = 2 × 6 = 12 V.'],
 ['earth','تحدث الزلازل غالبًا عند:','Earthquakes most often happen at:',['حدود الصفائح الأرضية','مراكز المحيطات الهادئة دائمًا','قمم الجبال الجليدية','الصحاري فقط'],['the edges of tectonic plates','always in calm ocean centres','icy mountain tops','deserts only'],'تتحرك الصفائح الأرضية وتحتك عند حدودها فتحدث الزلازل.','Plates move and grind at their edges, causing earthquakes.'],
 ['phy','لماذا تبدو الملعقة مكسورة في كوب الماء؟','Why does a spoon look bent in a glass of water?',['بسبب انكسار الضوء','بسبب انعكاس الصوت','لأن الماء يثني المعدن','بسبب الحرارة'],['because light refracts','because sound reflects','because water bends metal','because of heat'],'ينكسر الضوء عند انتقاله من الماء إلى الهواء فتظهر الملعقة مكسورة.','Light bends as it passes from water into air, so the spoon looks broken.'],
 ['gear','الترس (أ) فيه 24 سنًّا ويعشق الترس (ب) الذي فيه 12 سنًّا. إذا دار (أ) 5 دورات، فكم دورة يدور (ب)؟','Gear A has 24 teeth and meshes with gear B, which has 12. If A turns 5 times, how many times does B turn?',['10','5','2.5','12'],['10','5','2.5','12'],'يمر 24 × 5 = 120 سنًّا، و 120 ÷ 12 = 10 دورات.','24 × 5 = 120 teeth pass; 120 ÷ 12 = 10 turns.',{fig:gTeeth(24,12,'أ','ب')}]
]);
Z27(125,[
 ['rel','«الجَزْر : المدّ» مثل:','“ebb : flow (low tide : high tide)” is like:',['الغروب : الشروق','الشمس : القمر','البحر : الشاطئ','الليل : القمر'],['sunset : sunrise','sun : moon','sea : shore','night : moon'],'الجزر عكس المد، والغروب عكس الشروق.','Ebb is the opposite of flow, as sunset is the opposite of sunrise.'],
 ['ant','مضاد كلمة «التبذير»:','The opposite of “wastefulness” is:',['الاقتصاد','الإسراف','الإنفاق','الكرم'],['thrift','extravagance','spending','generosity'],'التبذير إنفاق المال في غير موضعه، وضده الاقتصاد.','Wastefulness means spending carelessly; its opposite is thrift.'],
 ['syn','مرادف كلمة «الأنَفَة»:','A word close in meaning to “pride (self-respect)” is:',['عزة النفس','الذل','الحزن','الخوف'],['dignity','humiliation','sadness','fear'],'الأنفة هي عزة النفس والترفع عن الدنايا.','It means self-respect and dignity.'],
 ['odd','الكلمة المختلفة هي:','The odd word out is:',['الخفاش','الصقر','النسر','البومة'],['bat','falcon','eagle','owl'],'الصقر والنسر والبومة طيور، أما الخفاش فثديي.','The falcon, eagle and owl are birds; the bat is a mammal.'],
 ['idio','معنى «الجار قبل الدار»:','“Choose the neighbour before the house” means:',['اختر جارك قبل أن تختار بيتك','البيت أهم من الجار','ابنِ بيتك بنفسك','لا تسكن قرب أحد'],['choose your neighbour before your home','the house matters more than the neighbour','build your own house','do not live near anyone'],'الجار الصالح من أهم ما يُنظر إليه عند اختيار السكن.','A good neighbour is one of the most important things when choosing a home.'],
 ['ctx','معنى «نكث العهد»:','“He broke his pledge” means he:',['نقضه ولم يفِ به','حافظ عليه','كتبه','جدده'],['did not keep it','kept it','wrote it down','renewed it'],'نكث العهد أي نقضه.','To break a pledge means not to keep it.'],
 ['logic','إذا كان أ > ب ، و ب > ج ، و د > أ ، فأي العبارات صحيحة حتمًا؟','If A > B, B > C and D > A, which must be true?',['د > ج','ج > أ','ب > د','أ > د'],['D > C','C > A','B > D','A > D'],'الترتيب: د > أ > ب > ج، إذن د > ج.','The order is D > A > B > C, so D > C.'],
 PR('إذا كانت الأرض مربعة، وكانت الشمس كروية، فإن الإنسان لو سار على الأرض في اتجاه واحد سيصل إلى ......','If the Earth is square and the Sun is round, then someone walking in one direction on Earth will reach ......',['حافة الأرض','نقطة البداية','الشمس','القمر'],['the edge of the Earth','the starting point','the Sun','the Moon'],'حسب المقدمة الأرض مربعة لها حواف، فالسائر يصل إلى حافتها.','According to the statement the Earth is square with edges, so the walker reaches an edge.'),
 ['exp','إذا كان 2ˢ = 32 ، فإن س = ......','If 2ˣ = 32, then x = ......',['5','16','6','4'],['5','16','6','4'],'2 × 2 × 2 × 2 × 2 = 32، أي 2⁵.','2 × 2 × 2 × 2 × 2 = 32 = 2⁵.'],
 ['alg','إذا كان س + ص = 10 ، و س − ص = 4 ، فما قيمة س × ص؟','If x + y = 10 and x − y = 4, what is x × y?',['21','24','40','14'],['21','24','40','14'],'بالجمع: 2س = 14 ⇒ س = 7، و ص = 3، و 7 × 3 = 21.','Adding: 2x = 14 ⇒ x = 7, y = 3, and 7 × 3 = 21.'],
 ['patt','العدد التالي: 2 ، 5 ، 10 ، 17 ، 26 ، ......','Next number: 2, 5, 10, 17, 26, ......',['37','35','36','39'],['37','35','36','39'],'الفروق 3 ، 5 ، 7 ، 9 ثم 11: 26 + 11 = 37 (وهي 6² + 1).','Gaps 3, 5, 7, 9, then 11: 26 + 11 = 37 (= 6² + 1).'],
 ['num','عدد إذا ضُرب في نفسه ثم طُرح من الناتج 5 كان 59. ما العدد الموجب؟','A positive number is multiplied by itself and then 5 is subtracted, giving 59. What is it?',['8','9','7','64'],['8','9','7','64'],'العدد × نفسه = 64، فالعدد 8.','The number squared is 64, so it is 8.'],
 ['pct','زاد عدد سكان قرية 10٪ في السنة الأولى، ثم 10٪ في الثانية. إذا كان عددهم 1000، فكم أصبح؟','A village of 1000 grew by 10% in the first year and 10% in the second. What is the population now?',['1210','1200','1100','1221'],['1210','1200','1100','1221'],'نطبق الزيادتين متتاليتين: 1000 + 100 = 1100، ثم 1100 + 110 = 1210.','Apply the increases one after the other: 1000 → 1100 → 1210.'],
 ['ratio','قطع عدّاء 400 متر في 50 ثانية. كم سرعته بالمتر في الثانية؟','A runner covers 400 m in 50 seconds. What is his speed in metres per second?',['8','12.5','80','0.125'],['8','12.5','80','0.125'],'السرعة = المسافة ÷ الزمن = 400 ÷ 50 = 8 م/ث.','Speed = distance ÷ time = 400 ÷ 50 = 8 m/s.'],
 ['age','عمر علي ضعف عمر أخيه، وقبل 5 سنوات كان عمر علي 3 أمثال عمر أخيه. كم عمر علي الآن؟','Ali is twice his brother’s age. Five years ago he was three times his brother’s age. How old is Ali now?',['20','10','15','30'],['20','10','15','30'],'2ص − 5 = 3(ص − 5) ⇒ ص = 10، وعلي 20. تحقق: قبل 5 سنوات 15 و 5.','2b − 5 = 3(b − 5) ⇒ b = 10, Ali is 20. Check: 5 years ago 15 and 5.'],
 ['geo','مربع محيطه 48 سم. ما طول قطره تقريبًا؟ (√2 ≈ 1.4)','A square has a perimeter of 48 cm. About how long is its diagonal? (√2 ≈ 1.4)',['16.8 سم','12 سم','24 سم','14 سم'],['16.8 cm','12 cm','24 cm','14 cm'],'الضلع 12 سم، والقطر = الضلع × √2 = 12 × 1.4 = 16.8 سم.','Side 12 cm; diagonal = side × √2 = 12 × 1.4 = 16.8 cm.'],
 ['vol','خزان على شكل متوازي مستطيلات أبعاده 2 م × 1.5 م × 1 م. كم لترًا يتسع؟','A tank is a cuboid 2 m × 1.5 m × 1 m. How many litres does it hold?',['3000','300','4.5','30000'],['3000','300','4.5','30000'],'الحجم 3 م³، والمتر المكعب = 1000 لتر، فالسعة 3000 لتر.','Volume 3 m³; 1 m³ = 1000 litres, so 3000 litres.'],
 ['stat','متوسط درجات 4 طلاب 15. درجات 3 منهم 12 و 14 و 16. ما درجة الرابع؟','4 pupils have a mean mark of 15. Three scored 12, 14 and 16. What did the fourth score?',['18','15','17','20'],['18','15','17','20'],'المجموع 4 × 15 = 60، والثلاثة 42، فالرابع 18.','Total 4 × 15 = 60; the three make 42, so the fourth scored 18.'],
 ['chance','رُميت قطعتا نقود معًا. ما احتمال ظهور صورتين؟','Two coins are tossed. What is the probability of two heads?',['1/4','1/2','1/3','3/4'],['1/4','1/2','1/3','3/4'],'النواتج: (ص،ص) (ص،ك) (ك،ص) (ك،ك)، والمطلوب ناتج واحد من 4.','Outcomes: HH, HT, TH, TT — one out of four.'],
 ['chem','المركّب الناتج من اتحاد الهيدروجين بالأكسجين هو:','The compound formed when hydrogen combines with oxygen is:',['الماء','ملح الطعام','ثاني أكسيد الكربون','الأمونيا'],['water','table salt','carbon dioxide','ammonia'],'الماء H₂O مكون من هيدروجين وأكسجين.','Water, H₂O, is made of hydrogen and oxygen.'],
 ['bio','الخلايا التي تقاوم الأمراض في الدم هي:','The blood cells that fight disease are:',['خلايا الدم البيضاء','خلايا الدم الحمراء','الصفائح الدموية','البلازما'],['white blood cells','red blood cells','platelets','plasma'],'كريات الدم البيضاء تدافع عن الجسم ضد الميكروبات.','White blood cells defend the body against germs.'],
 ['phy','السرعة = المسافة ÷ ......','Speed = distance ÷ ......',['الزمن','الكتلة','القوة','التسارع'],['time','mass','force','acceleration'],'السرعة هي المسافة المقطوعة في وحدة الزمن.','Speed is the distance travelled per unit of time.'],
 ['earth','أي طبقات الأرض هي الأشد حرارة؟','Which layer of the Earth is the hottest?',['اللب الداخلي','القشرة','الوشاح العلوي','الغلاف الجوي'],['the inner core','the crust','the upper mantle','the atmosphere'],'تزداد الحرارة كلما اتجهنا إلى مركز الأرض، فاللب الداخلي هو الأشد حرارة.','It gets hotter towards the centre, so the inner core is hottest.'],
 ['phy','دلكنا بالونًا بشعر جاف ثم قرّبناه من قصاصات ورق صغيرة فانجذبت إليه. السبب هو:','A balloon rubbed on dry hair picks up small bits of paper. Why?',['الكهرباء الساكنة','المغناطيسية','الجاذبية الأرضية','الرياح'],['static electricity','magnetism','gravity','wind'],'الدلك يشحن البالون بالكهرباء الساكنة فيجذب القصاصات الخفيفة.','Rubbing charges the balloon with static electricity, which attracts light paper.'],
 ['cube','مكعب كبير مكوّن من 27 مكعبًا صغيرًا متماثلًا، طُليت أوجهه الخارجية كلها. كم مكعبًا صغيرًا لم يُطلَ أي وجه منه؟','A large cube made of 27 small cubes is painted on all its outside faces. How many small cubes have no paint at all?',['1','0','8','6'],['1','0','8','6'],'المكعب غير المطلي هو المكعب الأوسط فقط المختفي داخل الكتلة (1 × 1 × 1).','Only the centre cube, hidden inside, has no paint (1 × 1 × 1).']
]);
Z27(126,[
 ['rel','«الشاعر : القصيدة» مثل:','“poet : poem” is like:',['المهندس : التصميم','القارئ : الرواية','الطالب : المدرسة','الجمهور : المسرح'],['engineer : design','reader : novel','pupil : school','audience : theatre'],'الشاعر يُنتج القصيدة، والمهندس يُنتج التصميم.','A poet produces a poem, and an engineer produces a design.'],
 ['ant','مضاد كلمة «الإفراط»:','The opposite of “excess” is:',['التفريط','الزيادة','المبالغة','الإسراف'],['neglect (too little)','increase','exaggeration','extravagance'],'الإفراط مجاوزة الحد بالزيادة، وضده التفريط وهو التقصير.','Excess is going too far; its opposite is falling short.'],
 ['syn','مرادف كلمة «المَنَعة»:','A word close in meaning to “impregnability” is:',['القوة والحصانة','الضعف','المنع','الهزيمة'],['strength and protection','weakness','prohibition','defeat'],'المنعة هي القوة التي تحمي صاحبها.','It means strength that keeps you protected.'],
 ['odd','الكلمة المختلفة هي:','The odd word out is:',['الدائرة','المثلث متساوي الأضلاع','المربع','المستطيل'],['circle','equilateral triangle','square','rectangle'],'المثلث والمربع والمستطيل مضلعات أضلاعها مستقيمة، أما الدائرة فليست مضلعًا.','The triangle, square and rectangle are polygons with straight sides; a circle is not.'],
 ['idio','معنى «خير الكلام ما قلّ ودلّ»:','“The best speech is short and meaningful” means:',['أفضل الكلام القصير الواضح المعنى','الكلام الكثير أفضل','الصمت دائمًا أفضل','الكلام القليل غير مفهوم'],['short, clear speech is best','long speech is better','silence is always better','short speech is unclear'],'الكلام البليغ يوصل المعنى بكلمات قليلة.','Good speech gets the meaning across in few words.'],
 ['ctx','معنى «استشرى المرض»:','“The disease spread unchecked” means it:',['انتشر وتفاقم','شُفي منه المرضى','اختفى','بدأ يضعف'],['spread and grew worse','was cured','disappeared','began to weaken'],'استشرى الشيء أي انتشر وزاد.','It means it spread and became worse.'],
 ['rank','سارة أكبر من هند، وهند أكبر من ريم، ومنى أصغر من ريم. من الثالثة في العمر بدءًا من الأكبر؟','Sara is older than Hind, Hind is older than Reem, and Mona is younger than Reem. Who is third oldest?',['ريم','هند','منى','سارة'],['Reem','Hind','Mona','Sara'],'السؤال عن الثالثة فنرتب بالأسهم: سارة ← هند ← ريم ← منى، والثالثة ريم.','For “third” we use arrows: Sara → Hind → Reem → Mona; third is Reem.'],
 PR('إذا كان الحديد أخف من الريش، وكانت الطيور تبني أعشاشها من الحديد، فإن عش الطائر يكون ......','If iron is lighter than feathers and birds build nests from iron, then a bird’s nest is ......',['خفيفًا','ثقيلًا جدًا','من القش','غير ممكن البناء'],['light','very heavy','made of straw','impossible to build'],'حسب المقدمة الحديد أخف من الريش، فالعش المصنوع منه خفيف.','According to the statement iron is lighter than feathers, so an iron nest is light.'),
 ['alg','إذا كان س = 2 و ص = −3 ، فما قيمة س² − 2س ص + ص²؟','If x = 2 and y = −3, what is x² − 2xy + y²?',['25','1','−5','13'],['25','1','−5','13'],'المقدار = (س − ص)² = (2 − (−3))² = 5² = 25.','The expression is (x − y)² = (2 + 3)² = 25.'],
 ['exp','(3²)³ ÷ 3⁴ = ......','(3²)³ ÷ 3⁴ = ......',['9','3','27','81'],['9','3','27','81'],'(3²)³ = 3⁶، و 3⁶ ÷ 3⁴ = 3² = 9.','(3²)³ = 3⁶, and 3⁶ ÷ 3⁴ = 3² = 9.'],
 ['patt','العدد التالي: 1 ، 1 ، 2 ، 6 ، 24 ، ......','Next number: 1, 1, 2, 6, 24, ......',['120','48','96','720'],['120','48','96','720'],'نضرب في 1 ، 2 ، 3 ، 4 ثم 5: 24 × 5 = 120.','Multiply by 1, 2, 3, 4, then 5: 24 × 5 = 120.'],
 ['num','ما الباقي عند قسمة 2027 على 9؟','What is the remainder when 2027 is divided by 9?',['2','7','5','0'],['2','7','5','0'],'مجموع الأرقام 2 + 0 + 2 + 7 = 11، وباقي قسمة 11 على 9 هو 2.','Digit sum 2 + 0 + 2 + 7 = 11, and 11 leaves remainder 2 when divided by 9.'],
 ['pct','باع تاجر جهازًا بخسارة 15٪ فكان سعر البيع 510 ريالات. ما سعر الشراء؟','A trader sold a device at a 15% loss for 510 riyals. What did he pay for it?',['600','586.5','525','595'],['600','586.5','525','595'],'سعر البيع = 85٪ من سعر الشراء، فالشراء 510 ÷ 0.85 = 600.','Selling price = 85% of cost, so cost = 510 ÷ 0.85 = 600.'],
 ['ratio','يستهلك جهاز 3 كيلوواط ساعة في 5 أيام. كم يستهلك في 30 يومًا؟','A device uses 3 kWh in 5 days. How much does it use in 30 days?',['18','15','10','90'],['18','15','10','90'],'30 يومًا = 6 أمثال 5 أيام، فالاستهلاك 3 × 6 = 18.','30 days is 6 × 5 days, so 3 × 6 = 18 kWh.'],
 ['coord','ما المسافة بين النقطتين أ (1 ، 2) و ب (4 ، 6)؟','What is the distance between A(1, 2) and B(4, 6)?',['5','7','25','√7'],['5','7','25','√7'],'الفرق الأفقي 3 والرأسي 4، والمسافة √(9 + 16) = √25 = 5.','Across 3, up 4: distance = √(9 + 16) = 5.'],
 ['geo','في مثلث قائم الزاوية، قياس إحدى الزاويتين الحادتين 35°. ما قياس الأخرى؟','In a right triangle one acute angle is 35°. What is the other?',['55°','65°','145°','35°'],['55°','65°','145°','35°'],'الحادتان مجموعهما 90°: 90 − 35 = 55°.','The two acute angles add to 90°: 90 − 35 = 55°.'],
 ['area','شبه منحرف طولا قاعدتيه المتوازيتين 8 سم و 12 سم، وارتفاعه 5 سم. ما مساحته؟','A trapezium has parallel sides of 8 cm and 12 cm and a height of 5 cm. What is its area?',['50 سم²','100 سم²','60 سم²','25 سم²'],['50 cm²','100 cm²','60 cm²','25 cm²'],'المساحة = ½ × (8 + 12) × 5 = 50 سم².','Area = ½ × (8 + 12) × 5 = 50 cm².'],
 ['data','يبين الجدول عدد الطلاب في كل نشاط. ما النسبة المئوية لطلاب الرسم من المجموع؟','The table shows pupils in each activity. What percentage do art pupils make of the total?',['25٪','40٪','35٪','20٪'],['25%','40%','35%','20%'],'المجموع 40 + 25 + 35 = 100، وطلاب الرسم 25 أي 25٪.','Total 40 + 25 + 35 = 100; art has 25, i.e. 25%.',{fig:tab(['النشاط','كرة القدم','الرسم','الحاسب'],[['الطلاب','40','25','35']])},{fig:tab(['Activity','Football','Art','Computing'],[['Pupils','40','25','35']])}],
 ['cnt','كم عددًا زوجيًا من رقمين مختلفين يمكن تكوينه من الأرقام 1 ، 2 ، 3 ، 4؟','How many even 2-digit numbers with different digits can be made from 1, 2, 3, 4?',['6','12','8','4'],['6','12','8','4'],'رقم الآحاد 2 أو 4، ولكل منهما 3 اختيارات للعشرات: 2 × 3 = 6.','The ones digit is 2 or 4, each with 3 choices for the tens: 2 × 3 = 6.'],
 ['chem','تحوّل الغاز مباشرة إلى صلب دون المرور بالحالة السائلة يُسمى:','A gas turning straight into a solid without becoming a liquid is called:',['الترسّب (التسامي العكسي)','التسامي','التكاثف','الانصهار'],['deposition','sublimation','condensation','melting'],'التسامي من صلب إلى غاز، وعكسه (من غاز إلى صلب) الترسب.','Sublimation is solid to gas; the reverse, gas to solid, is deposition.'],
 ['bio','الوحدة الأساسية في بناء الكائن الحي هي:','The basic building unit of a living thing is the:',['الخلية','النسيج','العضو','الجهاز'],['cell','tissue','organ','system'],'الخلايا تكوّن الأنسجة، والأنسجة تكوّن الأعضاء، والأعضاء تكوّن الأجهزة.','Cells form tissues, tissues form organs, organs form systems.'],
 ['phy','أي مما يلي رافعة من النوع الأول (نقطة الارتكاز بين القوة والمقاومة)؟','Which is a first-class lever (pivot between the effort and the load)?',['المقص','عربة اليد','ملقط الثلج','كسارة الجوز'],['scissors','a wheelbarrow','ice tongs','a nutcracker'],'في المقص يقع المسمار (الارتكاز) بين اليد والورقة. عربة اليد وكسارة الجوز من النوع الثاني، والملقط من الثالث.','In scissors the pivot sits between the hand and the paper. Wheelbarrows and nutcrackers are second-class; tongs are third-class.'],
 ['earth','السبب الرئيس لحدوث الفصول الأربعة هو:','The main cause of the four seasons is:',['ميل محور الأرض أثناء دورانها حول الشمس','تغيّر بُعد الأرض عن القمر','دوران الأرض حول نفسها','الرياح الموسمية'],['the tilt of Earth’s axis as it orbits the Sun','the changing distance to the Moon','the Earth spinning on its axis','seasonal winds'],'ميل المحور يجعل أشعة الشمس تسقط بزوايا مختلفة على نصفي الأرض خلال السنة.','The tilt makes sunlight hit each half of the Earth at different angles through the year.'],
 ['phy','ما الذي يحدد حدّة الصوت (رفيع أو غليظ)؟','What decides the pitch of a sound (high or low)?',['التردد','السعة','سرعة الصوت','لون المصدر'],['frequency','amplitude','the speed of sound','the colour of the source'],'كلما زاد التردد كان الصوت أحدّ، أما السعة فتحدد شدته.','Higher frequency means higher pitch; amplitude decides loudness.'],
 ['clk','ساعة تتأخر 3 دقائق كل يوم، وضُبطت ظهر يوم السبت. كم تكون متأخرة ظهر السبت التالي؟','A clock loses 3 minutes every day. It is set right at noon on Saturday. How slow is it at noon the next Saturday?',['21 دقيقة','18 دقيقة','24 دقيقة','3 دقائق'],['21 minutes','18 minutes','24 minutes','3 minutes'],'من السبت إلى السبت 7 أيام، و 7 × 3 = 21 دقيقة.','Saturday to Saturday is 7 days: 7 × 3 = 21 minutes.']

 ['idio','معنى «العقل السليم في الجسم السليم»:','“A healthy mind in a healthy body” means:',['صحة الجسم تعين على صحة التفكير','الرياضة تغني عن الدراسة','العقل لا علاقة له بالجسم','المريض لا يفكر'],['a healthy body helps clear thinking','sport replaces studying','the mind has nothing to do with the body','sick people cannot think'],'العناية بالجسم تساعد على نشاط العقل.','Looking after the body helps the mind work well.'],
 ['ctx','معنى «ذاع صيته»:','“His fame spread” means he:',['اشتهر بين الناس','فقد ماله','مرض','سافر'],['became well known','lost his money','fell ill','travelled'],'ذاع أي انتشر، والصيت الشهرة.','It means he became famous among people.'],

 ['num','ما العامل المشترك الأكبر للعددين 48 و 72؟','What is the highest common factor of 48 and 72?',['24','12','144','8'],['24','12','144','8'],'48 = 24 × 2 و 72 = 24 × 3، والعامل المشترك الأكبر 24.','48 = 24 × 2 and 72 = 24 × 3, so the HCF is 24.'],
 ['pct','خُصم 25٪ من سعر جهاز، ثم خُصم 20٪ من السعر الجديد. كم نسبة الخصم الكلية؟','A device is reduced by 25%, then by 20% of the new price. What is the total discount?',['40٪','45٪','50٪','35٪'],['40%','45%','50%','35%'],'لم يُعطَ سعر فنفرضه 100: بعد الخصم الأول 75، وبعد الثاني 75 − 15 = 60، فالخصم الكلي 40٪.','No price is given, so take 100: after the first discount 75, after the second 60, so 40% off in total.'],
 ['ratio','6 آلات تنتج 240 قطعة في 4 ساعات. كم قطعة تنتجها 9 آلات في 6 ساعات؟','6 machines make 240 parts in 4 hours. How many parts do 9 machines make in 6 hours?',['540','360','480','720'],['540','360','480','720'],'تناسب طردي مع الآلات ومع الزمن: 240 × (9 ÷ 6) × (6 ÷ 4) = 240 × 1.5 × 1.5 = 540.','Direct proportion with machines and time: 240 × 9/6 × 6/4 = 540.'],
 ['age','بعد 6 سنوات يصبح عمر سلمان ضعف عمره قبل 4 سنوات. كم عمره الآن؟','In 6 years Salman will be twice the age he was 4 years ago. How old is he now?',['14','10','16','12'],['14','10','16','12'],'س + 6 = 2(س − 4) ⇒ س = 14. تحقق: 20 = 2 × 10.','x + 6 = 2(x − 4) ⇒ x = 14. Check: 20 = 2 × 10.'],
 ['geo','زاوية خارجية لمثلث قياسها 110°، وإحدى الزاويتين الداخليتين البعيدتين 45°. ما قياس الأخرى؟','An exterior angle of a triangle is 110°, and one of the two opposite interior angles is 45°. What is the other?',['65°','70°','135°','55°'],['65°','70°','135°','55°'],'الزاوية الخارجية = مجموع الداخليتين البعيدتين: 110 − 45 = 65°.','An exterior angle equals the sum of the two opposite interior angles: 110 − 45 = 65°.'],

 ['chance','صندوق فيه 5 كرات حمراء و 3 زرقاء. سُحبت كرة حمراء ولم تُرجع. ما احتمال أن تكون الكرة الثانية حمراء أيضًا؟','A box has 5 red and 3 blue balls. A red ball is taken out and not replaced. What is the probability the next ball is red?',['4/7','5/8','1/2','5/7'],['4/7','5/8','1/2','5/7'],'بقي 7 كرات منها 4 حمراء، فالاحتمال 4/7.','7 balls remain, 4 of them red: 4/7.'],

 ['earth','تنتج الرياح بشكل رئيس عن:','Winds are mainly caused by:',['اختلاف الضغط الجوي بين المناطق','دوران القمر','جاذبية الشمس فقط','الزلازل'],['differences in air pressure between places','the Moon going round','the Sun’s gravity alone','earthquakes'],'يتحرك الهواء من مناطق الضغط المرتفع إلى مناطق الضغط المنخفض.','Air moves from high-pressure areas to low-pressure areas.'],

function selectKid(code){
  st.kid=st.user.kids.find(k=>String(k.code)===String(code))||null;
  st.doneKey='mr_pdone_'+(st.kid?st.kid.code:st.user.code);
  done={};try{done=JSON.parse(localStorage.getItem(st.doneKey)||'{}')}catch(e){}
  if(st.kid&&!nameEditable())st.name=st.kid.name||st.kid.code; else{st.name='';try{st.name=localStorage.getItem(nameEditable()?'mr_name_'+st.user.code:'mr_name')||''}catch(e){}}

}
function route(){ if(!st.level){renderLevel();window.scrollTo(0,0);return;} if(st.user)renderStart(); else if(st.authKnown)renderLogin(); else renderBoot(); window.scrollTo(0,0); }
function renderBoot(){
  const T=t(); bclock.hidden=true; st.screen='boot'; updChrome();
  app.innerHTML=`<section class="boot"><div class="spin" aria-hidden="true"></div><p>${T.loading}</p>${st.bootErr?`<p class="err">${T.bootErr[st.bootErr]}</p><button class="btn line" id="rl">${T.retry}</button>`:''}</section>`;
  const rl=document.getElementById('rl'); if(rl)rl.onclick=()=>location.reload();
}
function renderLogin(){
  const T=t(); bclock.hidden=true; st.screen='login'; updChrome();
  app.innerHTML=`<section class="login"><div class="sheet logincard">
    <div class="seal-big">${lang==='en'?'M':'م'}</div>
    <h1>${T.loginTitle}</h1><p class="muted small">${T.loginSub}</p>
    <form id="lf" novalidate>
      <div class="field"><label for="lc">${T.codeLbl}</label><input id="lc" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" dir="ltr"></div>
      <div class="field"><label for="lp">${T.passLbl}</label><div class="pw"><input id="lp" type="password" autocomplete="current-password" dir="ltr"><button type="button" id="eye">${T.showPw}</button></div></div>
      <p class="err" id="lerr" role="alert" ${st.loginErr?'':'hidden'}>${st.loginErr?T.errs[st.loginErr]:''}</p>
      <button class="btn gold" id="lb" type="submit">${T.loginBtn}</button>
    </form>
    <p class="muted small">${T.loginHint}</p>
  </div></section>`;
  const lc=document.getElementById('lc'),lp=document.getElementById('lp'),lb=document.getElementById('lb'),le=document.getElementById('lerr');
  const showErr=k=>{st.loginErr=k;le.textContent=T.errs[k];le.hidden=false;};
  document.getElementById('eye').onclick=e=>{const v=lp.type==='password';lp.type=v?'text':'password';e.target.textContent=v?T.hidePw:T.showPw;};
  document.getElementById('lf').onsubmit=async e=>{
    e.preventDefault();
    const c=lc.value.trim(),p=lp.value.trim();
    if(!c||!p)return showErr('empty');
    if(!window.RG)return showErr('net');
    lb.disabled=true;lb.textContent=T.loggingIn;st.loginErr=null;le.hidden=true;
    try{await window.RG.signIn(c,p);}
    catch(err){showErr(err.code==='auth/too-many-requests'?'many':err.code==='auth/network-request-failed'?'net':'bad');lb.disabled=false;lb.textContent=T.loginBtn;}
  };
  lc.focus();
}
window.MR={
  onUser(p,reason){
    st.authKnown=true; if(reason)st.loginErr=reason;
    if(!p){st.user=null;clearInterval(timer);gm.innerHTML='';if(!['lang','level'].includes(st.screen))renderLogin();return;}
    st.user=p;st.loginErr=null;selectKid(p.kids[0]?p.kids[0].code:null);
    if(!['lang','level'].includes(st.screen)){renderStart();window.scrollTo(0,0);}
  },
  bootFail(kind){ if(st.authKnown)return; st.bootErr=kind; if(st.screen==='boot')renderBoot(); }
};

const TRN={me:null,html:null};
// objects coming from the training frame belong to another JS realm; Firestore only accepts plain objects of this page, so copy them here
const trPlain=o=>JSON.parse(JSON.stringify(o));
function trMe(){
  if(!st.user)return {role:'guest',code:'',name:st.name||''};
  if(st.user.role==='admin')return {role:'admin',code:String(st.user.code),name:'أ. محمد رجب'};
  const k=st.kid;if(!k)return null;
  return {role:st.user.role,code:String(k.code),name:k.name||String(k.code),parentCode:st.user.role==='parent'?String(st.user.code):String(k.parentCode||'')};
}
window.RGT={
  me:()=>TRN.me, lang:()=>lang||'ar', level:()=>st.level, theme:()=>document.documentElement.dataset.theme||'', close:()=>closeTraining(),
  getTraining:code=>window.RG.trGet(code),
  touch:code=>window.RG.trSet(String(code),{code:String(code),lastSeen:Date.now()}).catch(()=>{}),
  saveProgress:(code,id,val)=>window.RG.trSet(String(code),trPlain({code:String(code),progress:{[String(id)]:Number(val)}})),
  addAttempt:rec=>{const m=TRN.me;return window.RG.trAdd(trPlain(Object.assign({},rec,{uid:m.code,code:m.code,studentCode:m.code,byCode:m.code,parentCode:m.parentCode||''})));},
  attempts:async code=>{const m=TRN.me;if(!window.RG||!m||m.role==='guest')return [];
    const [l,ex]=await Promise.all([window.RG.trList(code||null,m.role==='parent'?m.parentCode:null),window.RG.exResults?window.RG.exResults(code||null).catch(e=>{console.warn('examResults',e);return [];}):Promise.resolve([])]);
    const mx=ex.map(r=>({id:r.id,mode:'model',modelName:r.modelName||'',partName:r.partName||'',level:r.level,correct:r.right||0,total:r.total||0,pct:r.percent||0,secs:r.usedSec,limit:r.totalSec,atMs:r.timestamp||0,uid:r.studentCode,code:r.studentCode,name:r.studentName||'',ideaIds:[]}));
    return l.map(a=>Object.assign({},a,{uid:a.studentCode})).concat(mx).sort((a,b)=>(b.atMs||0)-(a.atMs||0));},
  listStudents:async()=>{const r=await window.RG.trStudents();return r.students.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar')).map(s=>{const x=r.tu[s.code]||{};return {uid:s.code,code:s.code,name:s.name||s.code,levels:(x.levels&&x.levels.length)?x.levels:[1,2,3],active:x.active!==false,progress:x.progress||{},lastSeen:x.lastSeen?{toMillis:()=>x.lastSeen}:null,createdMs:0};});},
  updateTraining:(code,patch)=>window.RG.trSet(String(code),trPlain(Object.assign({code:String(code)},patch))),
  examAnswers:id=>window.RG.trAnswers(id)
};
function openTraining(){location.href='index.html?train=1';return;
  TRN.me=trMe();if(!TRN.me){alert(lang==='en'?'Choose the student first.':'اختر الطالب أولًا.');return;}
  try{
  if(!TRN.html)TRN.html=document.getElementById('trainingSrc').textContent.replace(/<\\\/script/g,'</script');
  const en=lang==='en', m=TRN.me;
  const who=m.role==='admin'?(en?'Training dashboard':'لوحة متابعة التدريب'):m.role==='parent'?(en?'Progress report: ':'تقرير التدريب: ')+m.name:(m.name||'');
  let ov=document.getElementById('trainOv');if(!ov){ov=document.createElement('div');ov.id='trainOv';ov.className='train-ov';document.body.appendChild(ov);}
  ov.innerHTML=`<div class="train-bar"><button type="button" class="btn line" id="trainBack">${en?'‹ Tests & compilations':'الاختبارات والتجميعات ›'}</button><div class="tb-t"><b>${en?'Quick Solutions platform':'منصة الحل السريع'}</b>${who?`<small>${esc(who)}</small>`:''}</div></div>`;
  const f=document.createElement('iframe');f.title=en?'Quick Solutions platform':'منصة الحل السريع';f.srcdoc=TRN.html;ov.appendChild(f);
  ov.hidden=false;ov.style.display='flex';window.scrollTo(0,0);document.body.style.overflow='hidden';document.getElementById('trainBack').onclick=closeTraining;
  }catch(e){console.error(e);alert((lang==='en'?'Could not open the training: ':'تعذر فتح التدريب: ')+(e&&e.message||e));}
}
function closeTraining(){const ov=document.getElementById('trainOv');if(!ov||ov.hidden)return;ov.hidden=true;ov.style.display='none';ov.innerHTML='';document.body.style.overflow='';TRN.me=null;}

  if(c==='auth/weak-password')return en?'The password must be at least 6 characters.':'كلمة المرور 6 خانات على الأقل.';
  if(c==='permission-denied')return en?'Firestore refused: publish the updated rules (examStudents).':'قاعدة البيانات رفضت: انشر القواعد المحدّثة (فيها examStudents).';
  return (en?'Something went wrong: ':'حدث خطأ: ')+(c||e&&e.message||e);}

const progKey=()=>(st.doneKey||'mr_pdone').replace('mr_pdone','mr_pprog');
function saveProg(){

  try{localStorage.setItem(progKey(),JSON.stringify({v:2,level:st.level,model:st.model,ans:st.ans,flag:st.flag,cur:st.cur,left:Math.max(1,st.left),total:st.total,name:st.name,ts:Date.now()}))}catch(e){}

function clearProg(){try{localStorage.removeItem(progKey())}catch(e){}}
function loadProg(){
  let p=null;try{p=JSON.parse(localStorage.getItem(progKey())||'null')}catch(e){}
  if(!p||!(p.v===2||(p.v===1&&p.model>12))||!LEVELS[p.level]||!MODELS.some(m=>m.n===p.model)||!(p.left>0))return null;
  return p;
}

function resumeProg(){
  const p=loadProg();if(!p)return;

        <h2 style="font-size:26px">${verdict}</h2>
        <div class="row" style="margin-top:10px;gap:20px">
          <span>${T.correct}: <b class="num" style="color:var(--good)">${right}</b></span>
          <span>${T.wrong}: <b class="num" style="color:var(--bad)">${n-right-blank}</b></span>
          <span>${T.blank}: <b class="num">${blank}</b></span>
          <span>${T.time}: <b class="num">${fmt(used)}</b></span>
        </div>
      </div>
    </div>
    <div class="sync" id="syncNote" role="status" hidden></div>
    <div class="row"><button class="btn gold" id="cert2">${T.certShow}</button></div>
    ${weak.length?`<div class="sheet"><h2 style="font-size:18px;margin-bottom:10px">${T.weak}</h2><div class="chips">${weak.map(w=>`<span>${w}</span>`).join('')}</div></div>`:''}
    <div class="row" style="justify-content:space-between">
      <h2 style="font-size:20px">${T.review}</h2>
      <div class="filt">
        <button data-f="all" aria-pressed="${st.filter==='all'}">${T.fAll}</button>
        <button data-f="wrong" aria-pressed="${st.filter==='wrong'}">${T.fWrong}</button>
        <button data-f="flag" aria-pressed="${st.filter==='flag'}">${T.fFlag}</button>
      </div>
    </div>
    ${list.length?list.map(id=>{const q=Q[id],Lq=L(q);const mine=st.ans[id];const ok=mine===q.ans;return `<article class="rq">
      <div class="meta"><span>${T.qn(Ls.indexOf(id)+1)} · ${Lq.skill}</span><span style="font-weight:700;color:${ok?'var(--good)':'var(--bad)'}">${ok?T.ok:mine===undefined?T.none:T.bad}</span></div>
      <div class="stem">${Lq.pass?`<div class="passage"><b>${T.readLbl}</b>${Lq.pass}</div>`:''}<p>${stemHTML(q)}</p>${Lq.fig?`<div class="fig">${Lq.fig}</div>`:''}</div>
      <div class="opts ${q.figOpts?'grid':''}">${q.order.map((k,pos)=>{const c=pos===q.ans?'ok':pos===mine?'no':'';const tag=pos===q.ans?`<span class="tag" style="color:var(--good)">${T.rightTag}</span>`:pos===mine?`<span class="tag" style="color:var(--bad)">${T.yourTag}</span>`:'';return `<button class="opt ${c}" disabled>${optHTML(q,k,pos,tag)}</button>`}).join('')}</div>
      <div class="why"><b>${T.why}</b> ${Lq.e}</div>
    </article>`}).join(''):`<p class="muted">${T.empty}</p>`}
    <div class="row"><button class="btn gold" id="cert">${T.cert}</button>${nextM?`<button class="btn" id="nextm">${T.start(mFull(nextM.n))}</button>`:''}<button class="btn line" id="again">${T.homePage}</button><button class="btn line" id="toQS">⚡ ${lang==='en'?'Quick Solutions platform':'منصة الحل السريع'}</button></div>
  </section>`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{st.filter=b.dataset.f;renderRes()});
  document.getElementById('again').onclick=()=>{renderStart();window.scrollTo(0,0)};
  const qs=document.getElementById('toQS');if(qs)qs.onclick=openTraining;
  document.getElementById('cert').onclick=()=>showCert(st.model);
  document.getElementById('cert2').onclick=()=>showCert(st.model);
  drawSync();
  const nm=document.getElementById('nextm'); if(nm)nm.onclick=()=>{st.model=nextM.n;renderStart();document.getElementById('go').click()};
}

// ---------- home & language ----------
function goHome(){
  const T=t();
  if(!st.user||!['start','res','exam'].includes(st.screen))return;
  if(st.screen==='exam'){
    gm.innerHTML=`<div class="modal"><div class="sheet"><h2>${T.exitTitle}</h2><p class="muted">${T.exitBody}</p><div class="row"><button class="btn bad" id="hYes">${T.exitYes}</button><button class="btn line" id="hNo">${T.exitNo}</button></div></div></div>`;
    document.getElementById('hYes').onclick=()=>{gm.innerHTML='';clearInterval(timer);renderStart();window.scrollTo(0,0)};
    document.getElementById('hNo').onclick=()=>gm.innerHTML='';
    return;
  }
  gm.innerHTML='';renderStart();window.scrollTo(0,0);
}
document.getElementById('homeBtn').onclick=goHome;
document.getElementById('homeLogo').onclick=goHome;
document.getElementById('langBtn').onclick=()=>{
  setLang(lang==='en'?'ar':'en');
  if(st.screen==='res')renderRes(); else if(st.screen==='login')renderLogin(); else if(st.screen==='boot')renderBoot(); else if(st.screen==='level')renderLevel(); else renderStart();
};
document.getElementById('outBtn').onclick=()=>{
  const T=t();
  gm.innerHTML=`<div class="modal"><div class="sheet"><h2>${T.outTitle}</h2><p class="muted">${st.screen==='exam'?T.outBodyExam:T.outBody}</p><div class="row"><button class="btn bad" id="oYes">${T.outYes}</button><button class="btn line" id="oNo">${T.outNo}</button></div></div></div>`;
  document.getElementById('oNo').onclick=()=>gm.innerHTML='';
  document.getElementById('oYes').onclick=async()=>{closeTraining();gm.innerHTML='';clearInterval(timer);st.screen='login';try{await window.RG.signOut()}catch(e){window.MR.onUser(null)}};
};

// ---------- certificate ----------
function certHTML(model){
  const T=t();
  let date='';try{date=new Date().toLocaleDateString(T.dateLoc,{year:'numeric',month:'long',day:'numeric'})}catch(e){date=new Date().toISOString().slice(0,10)}
  const rows=MODELS.filter(m=>done[m.n]!==undefined&&levelOf(m.n)===st.level);
  const avg=rows.length?Math.round(rows.reduce((a,m)=>a+done[m.n],0)/rows.length):0;
  const body=model?T.cOne(mName(model),partName(modelOf(model).p),done[model]):T.cAll(rows.length,avg,ORDERS[st.level].length,T.levels[st.level].short);
  const d=st.det&&st.det.model===model?st.det:null;
  const table=model?(d?`<table><tr>${T.dCols.map(c=>`<th>${c}</th>`).join('')}</tr><tr><td>${d.right}</td><td>${d.wrong}</td><td>${d.blank}</td><td dir="ltr">${fmt(d.used)}</td></tr></table>`:''):rows.length?`<table><tr>${T.cCols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr><td>${mName(r.n)}</td><td>${partName(r.p)}</td><td dir="ltr">${done[r.n]}%</td></tr>`).join('')}</table>`:'';
  return `<div class="cert" dir="${T.dir}">
    <div class="medal">${lang==='en'?'M':'م'}</div>
    <div class="sub">${T.cProgram} · ${T.levels[st.level].short}</div>
    <div class="ct">${T.cTitle}</div>
    <p>${T.cGrant}</p>
    <div class="nm">${esc(st.name||'')}</div>
    ${body}${table}
    <p>${T.cWish}</p>
    <div class="sig">
      <div><span class="sub">${T.cDate}</span><b>${date}</b></div>
      <div><span class="sub">${T.cTrainer}</span><b>${T.cTrainerName}</b></div>
    </div>
  </div>`;
}
function showCert(model){
  const T=t();
  gm.innerHTML=`<div class="modal"><div class="cert-wrap">${certHTML(model)}
    <div class="row" style="justify-content:center"><button class="btn gold" id="cPrint">${T.print}</button><button class="btn line" id="cClose" style="background:var(--surface)">${T.close}</button></div>
    <p style="text-align:center;font-size:13.5px;margin:0;color:#e6eaf5">${T.printHint}</p>
  </div></div>`;
  document.getElementById('cClose').onclick=()=>gm.innerHTML='';
  document.getElementById('cPrint').onclick=()=>{
    let pc=document.getElementById('printcert');
    if(!pc){pc=document.createElement('div');pc.id='printcert';document.body.appendChild(pc);}
    pc.dir=T.dir; pc.innerHTML=certHTML(model);
    try{window.print()}catch(e){}
  };
}

applyLang();
if(st.screen==='lang')renderLang(); else if(st.screen==='level')renderLevel(); else renderBoot();
</script>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="تجميعات بلس - محاكاة مقياس موهبة - المستويات الأول والثاني والثالث - Mawhiba Test Practice - إعداد المدرب محمد رجب">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>تجميعات بلس · محاكاة مقياس موهبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: ink-blue header band with saffron seal; exam sheet + side console (stacks on phones). RTL throughout. */
:root{
  --bg:#eef1f7; --surface:#ffffff; --panel:#e4e9f3; --line:#d3dae8; --line-2:#b9c3d8;
  --fg:#18213b; --muted:#5a6684; --ink:#1d2b53; --ink-2:#2c3d70;
  --accent:#e0a01b; --accent-soft:#fbf0d6; --accent-ink:#6b4a00; --on-ink:#ffffff;
  --good:#1f8a5a; --good-soft:#dcf2e6; --bad:#c2453a; --bad-soft:#fae2df; --flag:#7a5bc7; --flag-soft:#ece6fa;
  --f-disp:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1322; --surface:#151d31; --panel:#1b2540; --line:#273352; --line-2:#36446a;
  --fg:#e6eaf5; --muted:#9aa6c4; --ink:#c9d4f2; --ink-2:#2b3a68;
  --accent:#f0b440; --accent-soft:#3a2f12; --accent-ink:#f6cf7c; --on-ink:#ffffff;
  --good:#5fd197; --good-soft:#143326; --bad:#f08a80; --bad-soft:#3a1d1b; --flag:#a98cf0; --flag-soft:#2a2245; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1322; --surface:#151d31; --panel:#1b2540; --line:#273352; --line-2:#36446a;
  --fg:#e6eaf5; --muted:#9aa6c4; --ink:#c9d4f2; --ink-2:#2b3a68;
  --accent:#f0b440; --accent-soft:#3a2f12; --accent-ink:#f6cf7c; --on-ink:#ffffff;
  --good:#5fd197; --good-soft:#143326; --bad:#f08a80; --bad-soft:#3a1d1b; --flag:#a98cf0; --flag-soft:#2a2245; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--f-disp);line-height:1.3;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#1d2b53;color:#fff}
.band-in{max-width:1160px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.seal{display:flex;align-items:center;gap:12px}
.seal i{width:40px;height:40px;border-radius:50%;background:#e0a01b;display:grid;place-items:center;font-style:normal;font-family:var(--f-disp);font-weight:700;color:#1d2b53;font-size:18px;flex:none}
.seal b{display:block;font-family:var(--f-disp);font-size:18px;line-height:1.2}
.seal small{display:block;font-size:12.5px;opacity:.85}
.bclock{font-family:var(--f-num);font-size:20px;background:rgba(255,255,255,.1);padding:4px 14px;border-radius:999px}
.bclock.low{background:#c2453a}
.seal{background:none;border:0;color:inherit;padding:0;text-align:start;cursor:pointer}
.bar-end{display:flex;align-items:center;gap:10px}
.homebtn{display:inline-flex;align-items:center;gap:6px;background:#e0a01b;color:#1d2b53;border:0;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.langbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 14px;font-weight:600;font-size:14px}
.langpick{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.langs button{background:var(--surface);border:2px solid var(--line-2);border-radius:14px;padding:26px 18px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.langs button:hover{border-color:var(--accent);background:var(--accent-soft)}
.langs b{font-family:var(--f-disp);font-size:26px;color:var(--ink)}
.langs span{color:var(--muted);font-size:14.5px}
.langs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:480px){.langs{grid-template-columns:1fr}}
.tel{color:var(--fg);font-weight:600;font-family:var(--f-num)}
.contact{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:10px;font-size:14.5px}
.contact a{color:#fff;font-family:var(--f-num);font-weight:600;background:rgba(255,255,255,.12);padding:3px 12px;border-radius:999px;text-decoration:none}
.err{color:var(--bad);font-size:14px;font-weight:600}
.field input.bad{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-soft)}
.namebox{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:14px}

/* login */
.login{max-width:440px;margin:0 auto}
.logincard{display:flex;flex-direction:column;gap:14px;text-align:center}
.logincard h1{font-size:26px}
.logincard form{display:flex;flex-direction:column;gap:14px;text-align:start}
.seal-big{width:64px;height:64px;border-radius:50%;background:#1d2b53;color:#e0a01b;display:grid;place-items:center;margin:0 auto;font-family:var(--f-disp);font-size:28px;font-weight:700}
.pw{display:flex;gap:8px}.pw input{flex:1;min-width:0}
.pw button{border:1px solid var(--line-2);background:var(--panel);color:var(--fg);border-radius:10px;padding:0 14px;font-size:14px;font-weight:600}
.small{font-size:13.5px;margin:0}
.who-box b{font-family:var(--f-disp);font-size:21px;display:block;color:var(--ink)}
.kids{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.kids button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600}
.kids button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1d2b53}
.boot{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:64px;color:var(--muted);text-align:center}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* certificate */
.cert-wrap{max-width:760px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.cert{background:#fffdf7;color:#1d2b53;border:3px solid #1d2b53;outline:6px solid #e0a01b;outline-offset:-14px;border-radius:6px;padding:44px 40px;text-align:center;font-family:var(--f-body);position:relative}
.cert .ct{font-family:var(--f-disp);font-size:clamp(26px,5vw,40px);font-weight:700;margin:6px 0 4px}
.cert .sub{font-size:15px;color:#5a6684}
.cert .nm{font-family:var(--f-disp);font-size:clamp(24px,5vw,34px);font-weight:700;color:#b07b0a;border-bottom:2px dashed #e0a01b;display:inline-block;padding:0 18px 4px;margin:10px 0}
.cert p{margin:6px 0;font-size:17px;line-height:1.9}
.cert table{margin:12px auto;border-collapse:collapse;font-size:14.5px}
.cert td,.cert th{border:1px solid #c9b98a;padding:4px 12px}
.cert th{background:#f6eccf}
.cert .sig{display:flex;justify-content:space-between;gap:16px;margin-top:26px;font-size:14.5px;flex-wrap:wrap}
.cert .sig div{min-width:150px}
.cert .sig b{display:block;font-family:var(--f-disp);font-size:16px}
.cert .medal{width:64px;height:64px;margin:0 auto;border-radius:50%;background:#e0a01b;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:26px;color:#1d2b53;box-shadow:0 0 0 6px #fbf0d6}
#printcert{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff!important}
  body>*:not(#printcert){display:none!important}
  #printcert{display:block!important}
  .cert{outline-offset:-14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:24px 48px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.btn{border:0;border-radius:10px;padding:12px 22px;font-weight:600;background:var(--ink-2);color:var(--on-ink)}
:root:not([data-theme="dark"]) .btn:not(.gold):not(.line):not(.bad){background:#1d2b53}
.btn.gold{background:var(--accent);color:#1d2b53}
.btn.line{background:transparent;color:var(--fg);border:1px solid var(--line-2)}
.btn.bad{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}

/* start */
.start{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.hero{background:#1d2b53;color:#fff;border-radius:14px;padding:28px 24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-start:-60px;bottom:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(224,160,27,.35)}
.hero h1{font-size:clamp(26px,5vw,36px)}
.hero p{margin:8px 0 0;max-width:52ch;opacity:.9}
.hero .by{display:inline-block;margin-top:14px;background:#e0a01b;color:#1d2b53;font-weight:700;padding:4px 14px;border-radius:999px;font-size:14px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fact b{display:block;font-family:var(--f-num);font-size:24px;color:var(--ink)}
.fact span{font-size:13.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-weight:600;font-size:14px;color:var(--muted)}
.field input{font:inherit;padding:12px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--fg)}
.parts{display:flex;flex-direction:column;gap:14px}
.part h3{font-size:14.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.modes button{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:10px 8px;text-align:center;line-height:1.4}
.modes button b{display:block;font-size:15px}
.modes button span{font-size:12.5px;color:var(--muted)}
.modes button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.rules{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}

/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.qn{font-family:var(--f-disp);font-weight:700;font-size:18px;color:var(--ink)}
.sec{font-size:13px;font-weight:600;padding:3px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.stem{font-size:19px;font-weight:600;line-height:1.8;display:flex;flex-direction:column;gap:14px;min-width:0}
.stem p{margin:0}
.passage{background:var(--panel);border-inline-start:4px solid var(--accent);border-radius:8px;padding:12px 16px;font-weight:400;font-size:16.5px}
.passage b{display:block;font-size:13px;color:var(--muted)}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:40px;line-height:1.1;display:inline-block}
.ana{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.ana span{min-width:64px;min-height:64px;border:1px solid #d3dae8;border-radius:10px;display:grid;place-items:center;font-family:var(--f-disp);font-size:28px;padding:4px}
.ana span .emo{font-size:44px}
.ana b{font-size:24px;color:#5a6684}
@media (max-width:480px){.ana{gap:4px;flex-wrap:nowrap}.ana span{min-width:52px;min-height:52px;font-size:22px;padding:2px}.ana span .emo{font-size:32px}.ana b{font-size:18px}}
.fig{background:#fff;color:#1d2b53;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto}
.fig svg{display:block;margin:0 auto;max-width:100%;height:auto}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opts.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 14px;font-size:18px;min-height:56px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .L{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel);font-family:var(--f-disp);font-weight:700;color:var(--ink)}
.opt .c{min-width:0}
.opt .c svg{display:block;height:74px;width:auto;max-width:100%;background:#fff;border-radius:8px;color:#1d2b53}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .L{background:var(--accent);color:#1d2b53}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok .L{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .L{background:var(--bad);color:#fff}
.opt .tag{margin-inline-start:auto;font-size:13px;font-weight:700;white-space:nowrap}
.opt[disabled]{cursor:default}
.nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.flagrow{display:inline-flex;gap:8px;align-items:center;margin-top:16px;color:var(--muted);cursor:pointer}
.flagrow input{width:20px;height:20px;accent-color:var(--flag)}

.console{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:84px}
.who{display:flex;align-items:center;gap:10px}
.who i{width:42px;height:42px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--ink);flex:none}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center;font-size:12.5px;color:var(--muted)}
.tally b{display:block;font-family:var(--f-num);font-size:20px;color:var(--fg)}
.pal{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.pal button{position:relative;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 0;font-family:var(--f-num);font-size:13.5px}
.pal button.a{background:var(--ink-2);border-color:var(--ink-2);color:#fff}
:root:not([data-theme="dark"]) .pal button.a{background:#1d2b53;border-color:#1d2b53}
.pal button.f::after{content:"";position:absolute;top:2px;left:2px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.pal button.cur{box-shadow:0 0 0 2px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:11px;height:11px;border-radius:3px;border:1px solid var(--line-2)}

.modal{position:fixed;inset:0;z-index:30;background:rgba(8,12,24,.6);display:grid;place-items:center;padding:16px}
.modal .sheet{max-width:520px;width:100%}
.modal h2{font-size:21px;margin-bottom:8px}

/* figure helpers */
.seq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-family:var(--f-disp);font-size:24px}
.seq svg{height:78px;width:auto}
.ntab{border-collapse:collapse;margin:0 auto;font-family:var(--f-num);font-size:18px}
.ntab td,.ntab th{border:1px solid #9aa6c4;padding:6px 12px;text-align:center;min-width:44px}
.ntab th{font-family:var(--f-body);font-size:14px;background:#eef1f7}
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px}
.pyr div{display:flex;gap:6px}
.pyr span{width:46px;height:38px;border:2px solid #1d2b53;border-radius:8px;display:grid;place-items:center;font-family:var(--f-num);font-size:17px}
.mx{display:grid;grid-template-columns:repeat(3,76px);justify-content:center}
.mx>div{width:76px;height:76px;border:1px solid #9aa6c4;display:grid;place-items:center;font-family:var(--f-disp);font-size:26px}
.mx svg{width:58px;height:58px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--bad-soft);color:var(--bad);padding:4px 12px;border-radius:999px;font-size:14px;font-weight:600}

/* results */
.res{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.score{display:grid;grid-template-columns:170px 1fr;gap:24px;align-items:center}
.ring{width:170px;height:170px}
.bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.barc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.barc .t{display:flex;justify-content:space-between;font-weight:600}
.bar{height:9px;border-radius:9px;background:var(--panel);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.filt{display:flex;gap:8px;flex-wrap:wrap}
.filt button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:600;font-size:14px}
.filt button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1d2b53}
.rq{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;min-width:0}
.rq .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:10px}
.rq .stem{font-size:16.5px}
.rq .opts{gap:8px;margin-top:12px}
.rq .opt{font-size:16px;min-height:0;padding:8px 12px}
.rq .opt .L{width:30px;height:30px}
.why{margin-top:12px;background:var(--panel);border-radius:10px;padding:10px 14px;font-size:15.5px}
.why b{color:var(--accent-ink)}
.foot{text-align:center;color:var(--muted);font-size:13.5px;padding:0 16px 28px}
.foot b{color:var(--fg)}
.wacon{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:14px}
.wacon a{font-family:var(--f-body);display:inline-flex;align-items:center;gap:7px;text-decoration:none;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px}
.wacon .wa{background:#25d366;color:#fff}
.wacon .wa:hover{background:#1ebe5b}
.wacon .tel{color:var(--fg);border:1.5px solid var(--line);background:var(--surface)}
.wacon .tel b{color:inherit;font-weight:800}

@media (max-width:860px){
  .exam{grid-template-columns:1fr}
  .console{position:static;order:-1}
  .pal{grid-template-columns:repeat(10,minmax(0,1fr))}
}
@media (max-width:560px){
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts.grid{grid-template-columns:1fr}
  .score{grid-template-columns:1fr;justify-items:center;text-align:center}
  .bars{grid-template-columns:1fr}
  .pal{grid-template-columns:repeat(8,minmax(0,1fr))}
  .sheet{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sync{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;border:1px solid var(--line);font-size:15px;line-height:1.7}
.sync.saving{color:var(--muted)}
.sync.ok{border-color:var(--good);background:var(--good-soft)}
.sync.fail{border-color:var(--bad);background:var(--bad-soft)}
.sync span{flex:1;min-width:200px}
.prog{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:14px;border:1.5px solid var(--accent);background:var(--panel)}
.prog b{font-size:17px}
.prog .row{margin-top:8px}

/* «التدريب حسب الأفكار» */
.train-card{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:14px 16px;box-shadow:0 6px 18px -14px rgba(29,43,83,.5);transition:transform .15s}
.plus-card{text-decoration:none;color:inherit;margin-top:-6px;border-color:#2f9e6b}.plus-card .tc-ico{background:#2f9e6b;color:#fff;font-weight:800}.plus-card .tc-go{color:#2f9e6b}
.train-card:hover{transform:translateY(-1px)}
.tc-ico{width:46px;height:46px;border-radius:12px;background:#1d2b53;color:#e0a01b;display:grid;place-items:center;font-size:22px;flex:none}
.tc-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.tc-txt b{font-family:var(--f-disp);font-size:17px;color:var(--ink)}
.tc-txt small{color:var(--muted);font-size:13.5px;line-height:1.6}
.tc-go{font-size:26px;color:var(--accent);font-weight:700}
.train-ov{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;height:100dvh;z-index:9999;display:flex;flex-direction:column;background:var(--bg);-webkit-overflow-scrolling:touch}
.train-ov[hidden]{display:none}
.train-bar{display:flex;align-items:center;gap:12px;background:#1d2b53;color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:4px solid #e0a01b}
.train-bar .btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 14px;border-radius:10px}
.tb-t{display:flex;flex-direction:column;min-width:0;line-height:1.35}.tb-t b{font-family:var(--f-disp);font-size:17px}.tb-t small{opacity:.8;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.train-ov iframe{flex:1 1 auto;min-height:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}

/* حسابات منصة الاختبارات */
.acc{display:flex;flex-direction:column;gap:14px}
.acc-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.acc-form{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;background:var(--panel);border-radius:12px;padding:16px}
.acc-form input{width:100%;min-width:0;box-sizing:border-box}
.acc-sub{display:flex;align-items:center;gap:8px;font-size:18px}
.acc-sub .chip{background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:0 10px;font-size:14px}
.acc-list{display:flex;flex-direction:column;gap:8px}
.acc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.acc-info{display:flex;flex-direction:column;min-width:0}.acc-info span{font-family:var(--f-num);color:var(--muted);font-size:14px}
.acc-acts{display:flex;gap:6px}.btn.sm{padding:6px 12px;font-size:14px}.btn.danger{color:var(--bad);border-color:var(--bad)}
.okmsg{color:var(--good);font-weight:600}

// ================= figure helpers =================
const T = (x,y,t,fs=18)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${fs}" fill="currentColor" stroke="none" font-family="IBM Plex Mono,Readex Pro,Tahoma,sans-serif">${t}</text>`;

const arrow = deg=>S(90,90,`<g transform="rotate(${deg} 45 45)"><path d="M45 74 V18 M27 35 L45 16 L63 35" stroke-width="6"/></g>`);
const poly = (n,fill=GOLD+'33')=>{const p=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;p.push((45+33*Math.cos(a)).toFixed(1)+','+(45+33*Math.sin(a)).toFixed(1));}return S(90,90,`<polygon points="${p.join(' ')}" fill="${fill}"/>`)};

const tab = (head,rows)=>`<table class="ntab">${head?`<tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>`:''}${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table>`;

 ant:{ar:'في فصل الصيف كانت نملة صغيرة تجمع حبوب القمح وتحملها إلى بيتها تحت الأرض، بينما كان الجندب يقفز ويغني طوال اليوم. سألها الجندب: لماذا تتعبين نفسك والطعام كثير؟ فقالت النملة: أجمع طعامي للشتاء. وحين جاء الشتاء وغطى الثلج الأرض جاع الجندب، أما النملة فكانت تأكل في بيتها الدافئ.',
      en:'In summer, a little ant collected grains of wheat and carried them to her home under the ground, while the grasshopper jumped and sang all day. The grasshopper asked her: “Why do you tire yourself when there is plenty of food?” The ant said: “I am saving my food for the winter.” When winter came and snow covered the ground, the grasshopper was hungry, but the ant ate in her warm home.'},

       en:'The palm tree is a blessed tree that grows in hot regions and needs little water. People eat its fruit, dates, and make baskets and mats from its fronds. In the past, they used its trunks to build the roofs of houses. A palm tree lives for decades and starts giving fruit four to eight years after it is planted.'},
 bike:{ar:'أهدى الأب ابنه سلمان دراجة جديدة يوم نجاحه. فرح سلمان كثيرًا وخرج يركبها بسرعة دون أن يلبس الخوذة، فسقط وجُرحت ركبته. عاد إلى البيت باكيًا، فضمّد أبوه جرحه وقال له: الدراجة متعة، لكن السلامة أولًا. ومنذ ذلك اليوم لم يركب سلمان دراجته إلا وعلى رأسه الخوذة.',

Z27(111,[
 ['ant','مضاد كلمة «الإقدام»:','The opposite of “boldness” is:',['الإحجام','الشجاعة','التقدّم','الإسراع'],['holding back','courage','moving forward','hurrying'],'الإقدام هو التقدم بجرأة، وضده الإحجام أي التراجع.','Boldness means stepping forward bravely; its opposite is holding back.'],
 ['odd','الكلمة المختلفة هي:','The odd word out is:',['جبل','نهر','بحر','بحيرة'],['mountain','river','sea','lake'],'النهر والبحر والبحيرة مسطحات مائية، أما الجبل فيابسة.','River, sea and lake are bodies of water; a mountain is land.'],
 ['rel','العلاقة بين «الماء : العطش» تشبه العلاقة بين:','“water : thirst” is like:',['الطعام : الجوع','النار : الدخان','الشمس : النهار','القلم : الورقة'],['food : hunger','fire : smoke','sun : daytime','pen : paper'],'الماء يزيل العطش، والطعام يزيل الجوع.','Water takes away thirst, and food takes away hunger.'],
 ['seq','رتّب أعمال المزارع حسب حدوثها: يحصد ، يبذر ، يسقي ، يحرث','Put the farmer’s jobs in order: harvests, sows, waters, ploughs',['يحرث ، يبذر ، يسقي ، يحصد','يبذر ، يحرث ، يسقي ، يحصد','يحرث ، يسقي ، يبذر ، يحصد','يسقي ، يحرث ، يبذر ، يحصد'],['ploughs, sows, waters, harvests','sows, ploughs, waters, harvests','ploughs, waters, sows, harvests','waters, ploughs, sows, harvests'],'تُحرث الأرض أولًا، ثم تُبذر البذور، ثم تُسقى، وأخيرًا يُحصد الزرع.','First the soil is ploughed, then seeds are sown, then watered, and finally the crop is harvested.'],

 ['ctx','معنى كلمة «يقِظ» في: «كان الحارس يقظًا طوال الليل»:','In “The guard stayed alert all night”, “alert” means:',['منتبه','نائم','خائف','متعب'],['watchful','asleep','afraid','tired'],'اليقظ هو المنتبه الذي لا يغفل.','Alert means watchful and paying attention.'],
 ['idio','المثل «من جدّ وجد» يُضرب لمن:','The saying “Whoever works hard finds success” is said about someone who:',['يجتهد فينال ما يريد','يبحث عن شيء ضائع','يتكاسل ثم يندم','يسافر كثيرًا'],['works hard and gets what he wants','looks for something lost','is lazy and then regrets it','travels a lot'],'الجِدّ هو الاجتهاد، ومن اجتهد وصل إلى هدفه.','Working hard leads to reaching your goal.'],
 ['patt','العدد التالي: 2 ، 3 ، 5 ، 8 ، 13 ، ......','Next number: 2, 3, 5, 8, 13, ......',['21','18','20','26'],['21','18','20','26'],'كل عدد = مجموع العددين السابقين له: 8 + 13 = 21.','Each number is the sum of the two before it: 8 + 13 = 21.'],
 ['place','أنا عدد من ثلاثة أرقام: رقم مئاتي 4، ورقم آحادي ضعف رقم مئاتي، ورقم عشراتي أقل من رقم آحادي بـ 3. من أنا؟','I am a 3-digit number. My hundreds digit is 4, my ones digit is double my hundreds digit, and my tens digit is 3 less than my ones digit. What am I?',['458','485','548','845'],['458','485','548','845'],'المئات 4، والآحاد 8، والعشرات 8 − 3 = 5، فالعدد 458.','Hundreds 4, ones 8, tens 8 − 3 = 5: the number is 458.'],
 ['prob','في مزرعة دجاج وأغنام، عدد الرؤوس 20 وعدد الأرجل 56. كم عدد الأغنام؟','A farm has hens and sheep: 20 heads and 56 legs. How many sheep are there?',['8','12','10','14'],['8','12','10','14'],'لو كانت كلها دجاجًا لكانت الأرجل 40، والزيادة 16 رجلًا، ولكل خروف رجلان زيادة، فالأغنام 16 ÷ 2 = 8.','If all were hens there would be 40 legs; the extra 16 legs come from sheep, 2 extra each, so 8 sheep.'],
 ['frac','أنفق خالد ربع ما معه، ثم أنفق نصف الباقي، فبقي معه 30 ريالًا. كم كان معه في البداية؟','Khaled spent a quarter of his money, then half of what was left, and had 30 riyals left. How much did he have at first?',['80','60','120','90'],['80','60','120','90'],'نرجع للخلف: قبل إنفاق النصف كان معه 60، وهذه ثلاثة أرباع المبلغ، فالمبلغ 80.','Work backwards: before spending half he had 60, which is three quarters of the total, so he had 80.'],
 ['area','مستطيل طوله 8 سم وعرضه 5 سم، قُصّ من أحد أركانه مربع طول ضلعه 3 سم. ما مساحة الجزء الباقي؟','A rectangle is 8 cm by 5 cm. A square of side 3 cm is cut from one corner. What is the area of the remaining shape?',['31 سم²','37 سم²','40 سم²','34 سم²'],['31 cm²','37 cm²','40 cm²','34 cm²'],'مساحة المستطيل 40، ومساحة المربع 9، والباقي 40 − 9 = 31 سم².','The rectangle is 40 cm² and the square 9 cm², so 40 − 9 = 31 cm².'],
 ['meas','في السؤال السابق نفسه، ما محيط الشكل الباقي بعد قص المربع؟','For the same shape (8 cm by 5 cm with a 3 cm square cut from a corner), what is the perimeter of the remaining shape?',['26 سم','20 سم','32 سم','23 سم'],['26 cm','20 cm','32 cm','23 cm'],'قص مربع من الركن لا يغير المحيط؛ لأن الضلعين الداخليين الجديدين يعوّضان ما أُزيل، فيبقى 2 × (8 + 5) = 26 سم.','Cutting a square from a corner keeps the perimeter the same, because the two new inner sides replace the removed parts: 2 × (8 + 5) = 26 cm.'],
 ['clk','الساعة الآن 10:45 صباحًا. كم تكون بعد 150 دقيقة؟','It is 10:45 in the morning. What time will it be in 150 minutes?',['1:15 مساءً','12:15 مساءً','1:45 مساءً','12:45 مساءً'],['1:15 p.m.','12:15 p.m.','1:45 p.m.','12:45 p.m.'],'150 دقيقة = ساعتان ونصف، و 10:45 + 2:30 = 1:15 مساءً.','150 minutes = 2 hours 30 minutes; 10:45 + 2:30 = 1:15 p.m.'],
 ['numr','في كل دائرة: العدد العلوي = حاصل ضرب العددين السفليين. ما العدد الناقص؟','In each circle the top number is the product of the two bottom numbers. What is missing?',['42','13','36','48'],['42','13','36','48'],'3 × 4 = 12، 4 × 5 = 20، و 6 × 7 = 42.','3 × 4 = 12, 4 × 5 = 20, and 6 × 7 = 42.',{fig:seq([numCirc(12,3,4),numCirc(20,4,5),numCirc('؟',6,7)])}],

 ['phy','في المقص، أين تقع نقطة الارتكاز؟','Where is the pivot (fulcrum) of a pair of scissors?',['عند المسمار الذي يربط نصلَي المقص','عند طرف النصل','عند مكان الأصابع','عند الورقة المقصوصة'],['at the screw that joins the two blades','at the tip of the blade','where the fingers go','at the paper being cut'],'المقص رافعة نقطة ارتكازها المسمار الذي يدور حوله النصلان.','Scissors are a lever; the pivot is the screw the blades turn around.'],

 ['earth','يتعاقب الليل والنهار بسبب:','Day and night happen because of:',['دوران الأرض حول نفسها','دوران الأرض حول الشمس','دوران القمر حول الأرض','حركة السحب'],['the Earth spinning on its axis','the Earth going round the Sun','the Moon going round the Earth','the movement of clouds'],'دوران الأرض حول محورها كل 24 ساعة يجعل جزءًا منها يواجه الشمس (نهار) والآخر بعيدًا عنها (ليل).','The Earth spins once every 24 hours, so one side faces the Sun (day) while the other faces away (night).'],

 ['area','مربع محيطه 36 سم. ما مساحته؟','A square has a perimeter of 36 cm. What is its area?',['81 سم²','36 سم²','144 سم²','72 سم²'],['81 cm²','36 cm²','144 cm²','72 cm²'],'طول الضلع 36 ÷ 4 = 9، والمساحة 9 × 9 = 81 سم².','Side = 36 ÷ 4 = 9 cm; area = 9 × 9 = 81 cm².'],
 ['numr','في كل مثلث: العدد في الوسط = حاصل ضرب العددين السفليين ناقص العدد العلوي. ما العدد الناقص؟','In each triangle the middle number = product of the two bottom numbers minus the top number. What is missing?',['16','21','26','15'],['16','21','26','15'],'4 × 5 − 2 = 18، 6 × 2 − 3 = 9، و 7 × 3 − 5 = 16.','4 × 5 − 2 = 18, 6 × 2 − 3 = 9, and 7 × 3 − 5 = 16.',{fig:seq([numTri(2,4,5,18),numTri(3,6,2,9),numTri(5,7,3,'؟')])}],
 ['nxt','ما الشكل التالي في النمط؟','Which shape comes next?',[shp('s','f'),shp('c','f'),shp('s','o'),shp('t','f')],null,'كل شكل يظهر فارغًا ثم بنقطة ثم مظللًا، والدائرة اكتملت وبدأ المربع، فالتالي مربع مظلل.','Each shape appears empty, then with a dot, then filled. The circle is done and the square has started, so next is a filled square.',{figOpts:true,fig:seq([shp('c','o'),shp('c','d'),shp('c','f'),shp('s','o'),shp('s','d'),sep('؟')])}],
 ['gear','أربعة تروس متعاشقة في صف واحد. إذا دار الترس الأول مع عقارب الساعة، فكيف يدور الترس الرابع؟','Four gears touch in a row. If the first turns clockwise, how does the fourth turn?',['عكس عقارب الساعة','مع عقارب الساعة','لا يدور','لا يمكن تحديده'],['anticlockwise','clockwise','it does not turn','cannot be told'],'التروس تتبادل الاتجاه: الفردية مع عقارب الساعة والزوجية عكسها، فالرابع عكس عقارب الساعة.','The direction alternates: odd gears clockwise, even gears anticlockwise, so gear 4 turns anticlockwise.',{fig:gearRow(4,true)}],
 ['phy','أي المواد الآتية عازلة للكهرباء؟','Which material does NOT let electricity pass (an insulator)?',['المطاط','النحاس','الحديد','الألومنيوم'],['rubber','copper','iron','aluminium'],'المطاط عازل، أما النحاس والحديد والألومنيوم فمعادن موصلة.','Rubber is an insulator; copper, iron and aluminium are metals that conduct.'],
 ['phy','عند وضع ملعقة معدنية في كوب شاي ساخن يسخن طرفها الآخر. تنتقل الحرارة هنا بـ:','A metal spoon in hot tea gets hot at the other end. The heat travels by:',['التوصيل','الإشعاع','الحمل','التبخر'],['conduction','radiation','convection','evaporation'],'انتقال الحرارة خلال المادة الصلبة من جزء لآخر يسمى التوصيل.','Heat moving through a solid from one part to another is conduction.'],
 ['bio','أي الحيوانات الآتية من الزواحف؟','Which animal is a reptile?',['السلحفاة','الضفدع','الحوت','البطريق'],['the tortoise','the frog','the whale','the penguin'],'السلحفاة من الزواحف، والضفدع برمائي، والحوت ثديي، والبطريق طائر.','The tortoise is a reptile; the frog is an amphibian, the whale a mammal and the penguin a bird.'],
 ['earth','أقرب كوكب إلى الشمس هو:','The planet closest to the Sun is:',['عطارد','الأرض','المريخ','المشتري'],['Mercury','Earth','Mars','Jupiter'],'ترتيب الكواكب من الشمس: عطارد ثم الزهرة ثم الأرض ثم المريخ...','From the Sun: Mercury, Venus, Earth, Mars...'],
 ['chem','خلطنا رملًا بماء. كيف نفصلهما بسهولة؟','Sand is mixed with water. How can we separate them easily?',['بالترشيح','بالمغناطيس','بالتجميد','بالرجّ'],['by filtering','with a magnet','by freezing','by shaking'],'ورقة الترشيح تسمح بمرور الماء وتحجز حبيبات الرمل.','A filter lets the water through and holds back the sand.'],
 ['data','يبين الجدول سعر الكيلوجرام من الفاكهة. اشترت هند 2 كجم تفاحًا و 1 كجم عنبًا. كم دفعت؟','The table shows prices per kilogram. Hind bought 2 kg of apples and 1 kg of grapes. How much did she pay?',['30','27','21','33'],['30','27','21','33'],'التفاح 2 × 9 = 18، والعنب 12، والمجموع 30 ريالًا.','Apples 2 × 9 = 18, grapes 12: total 30 riyals.',{fig:tab(['الفاكهة','موز','تفاح','عنب'],[['السعر (ريال)','6','9','12']])},{fig:tab(['Fruit','Banana','Apple','Grapes'],[['Price (SAR)','6','9','12']])}],
 ['rank','رتّب الأعداد تصاعديًا ثم اختر العدد الثاني: 0.7 ، 0.07 ، 0.77 ، 0.17','Put the numbers in increasing order and choose the second: 0.7, 0.07, 0.77, 0.17',['0.17','0.07','0.7','0.77'],['0.17','0.07','0.7','0.77'],'السؤال عن الثاني فنرتب كاملًا: 0.07 ← 0.17 ← 0.7 ← 0.77، والثاني 0.17.','For “second” we order all: 0.07 → 0.17 → 0.7 → 0.77; the second is 0.17.']
]);
Z27(113,[
 ['ant','مضاد كلمة «الوفرة»:','The opposite of “plenty” is:',['الندرة','الكثرة','الزيادة','الغنى'],['scarcity','abundance','increase','wealth'],'الوفرة كثرة الشيء، وضدها الندرة أي قلته.','Plenty means a lot; its opposite is scarcity, very little.'],
 ['odd','الكلمة المختلفة في المعنى:','Which word has a different meaning from the others?',['ظلام','ضياء','نور','سناء'],['darkness','brightness','light','glow'],'الضياء والنور والسناء كلها بمعنى الضوء، أما الظلام فعكسها.','Brightness, light and glow all mean light; darkness is the opposite.'],
 ['rel','«كاتب : رواية» مثل:','“writer : novel” is like:',['رسام : لوحة','قارئ : كتاب','معلم : طالب','بائع : سوق'],['painter : painting','reader : book','teacher : pupil','seller : market'],'الكاتب يُنتج الرواية، والرسام يُنتج اللوحة.','A writer creates a novel, and a painter creates a painting.'],
 ['seq','رتّب من الأصغر إلى الأكبر: قارة ، مدينة ، دولة ، حيّ','Order from smallest to largest: continent, city, country, neighbourhood',['حيّ ، مدينة ، دولة ، قارة','مدينة ، حيّ ، دولة ، قارة','حيّ ، دولة ، مدينة ، قارة','قارة ، دولة ، مدينة ، حيّ'],['neighbourhood, city, country, continent','city, neighbourhood, country, continent','neighbourhood, country, city, continent','continent, country, city, neighbourhood'],'الحي جزء من المدينة، والمدينة جزء من الدولة، والدولة جزء من القارة.','A neighbourhood is part of a city, a city part of a country, a country part of a continent.'],
 PR('إذا كان القمر يُضيء في النهار فقط، وكانت الشمس تشرق صباحًا، فإننا نرى القمر ......','If the Moon shines only in the daytime and the Sun rises in the morning, then we see the Moon ......',['في النهار','في الليل','في الفجر فقط','في الشتاء فقط'],['in the daytime','at night','only at dawn','only in winter'],'حسب المقدمة القمر يضيء في النهار فقط، فنراه نهارًا.','According to the statement the Moon shines only by day, so we see it in the daytime.'),
 ['ctx','معنى كلمة «شاحب» في: «بدا وجهه شاحبًا بعد المرض»:','In “His face looked pale after the illness”, “pale” means:',['تغيّر لونه إلى الصفرة','مشرق','مبتسم','غاضب'],['lost its colour','bright','smiling','angry'],'الشاحب هو من تغير لونه وذهبت نضارته، كما يحدث بعد المرض.','Pale means having lost its normal colour, as after an illness.'],
 ['logic','جميع الطيور لها ريش، والبطريق طائر. نستنتج أن:','All birds have feathers, and a penguin is a bird. So:',['البطريق له ريش','البطريق يطير','كل ما له ريش بطريق','البطريق ليس له ريش'],['a penguin has feathers','a penguin can fly','everything with feathers is a penguin','a penguin has no feathers'],'ما ينطبق على كل الطيور ينطبق على البطريق. أما الطيران فلم يُذكر في المقدمات.','What is true of all birds is true of the penguin; flying was not mentioned.'],
 ['patt','العدد التالي: 81 ، 27 ، 9 ، 3 ، ......','Next number: 81, 27, 9, 3, ......',['1','0','6','2'],['1','0','6','2'],'كل عدد ثلث العدد الذي قبله: 3 ÷ 3 = 1.','Each number is a third of the one before: 3 ÷ 3 = 1.'],

 ['ratio','ثمن 4 أقلام 18 ريالًا. كم ثمن 10 أقلام؟','4 pens cost 18 riyals. How much do 10 pens cost?',['45','40','36','50'],['45','40','36','50'],'ثمن القلم 18 ÷ 4 = 4.5، وثمن 10 أقلام 45 ريالًا.','One pen costs 18 ÷ 4 = 4.5, so 10 pens cost 45 riyals.'],
 ['frac','أي الكسور الآتية يساوي 0.75؟','Which fraction equals 0.75?',['3/4','7/5','1/4','5/7'],['3/4','7/5','1/4','5/7'],'0.75 = 75/100 = 3/4.','0.75 = 75/100 = 3/4.'],
 ['area','حديقة مستطيلة طولها 12 م وعرضها 7 م، يحيط بها من الخارج ممر عرضه 1 م. ما مساحة الممر؟','A rectangular garden is 12 m by 7 m with a path 1 m wide all around the outside. What is the area of the path?',['42 م²','38 م²','84 م²','40 م²'],['42 m²','38 m²','84 m²','40 m²'],'الحديقة مع الممر 14 × 9 = 126، والحديقة وحدها 84، والممر 126 − 84 = 42 م².','Garden with path: 14 × 9 = 126; garden alone: 84; path: 126 − 84 = 42 m².'],
 ['clk','غادر قطار الساعة 11:50 صباحًا ووصل الساعة 2:25 مساءً. كم استغرقت الرحلة؟','A train left at 11:50 a.m. and arrived at 2:25 p.m. How long was the journey?',['ساعتان و 35 دقيقة','ساعتان و 25 دقيقة','3 ساعات و 35 دقيقة','ساعة و 35 دقيقة'],['2 h 35 min','2 h 25 min','3 h 35 min','1 h 35 min'],'من 11:50 إلى 12:00 عشر دقائق، ومن 12:00 إلى 2:25 ساعتان و 25 دقيقة، فالمجموع ساعتان و 35 دقيقة.','11:50 to 12:00 is 10 min; 12:00 to 2:25 is 2 h 25 min; total 2 h 35 min.'],
 ['cnt','5 أصدقاء صافح كل منهم الآخرين مرة واحدة فقط. كم مصافحة حدثت؟','5 friends each shake hands once with every other friend. How many handshakes are there?',['10','20','25','5'],['10','20','25','5'],'الأول يصافح 4، والثاني 3 جددًا، والثالث 2، والرابع 1: 4 + 3 + 2 + 1 = 10.','The first shakes 4 hands, the second 3 new ones, then 2, then 1: 4 + 3 + 2 + 1 = 10.'],
 ['sym','إذا كان ★ = 3 ، و ■ = ★ + ★ + 1 ، فما قيمة ■ × ★؟','If ★ = 3 and ■ = ★ + ★ + 1, what is ■ × ★?',['21','10','18','24'],['21','10','18','24'],'■ = 3 + 3 + 1 = 7، و 7 × 3 = 21.','■ = 3 + 3 + 1 = 7, and 7 × 3 = 21.'],
 ['patt','درج من المربعات: صفه الأول مربع واحد، والثاني مربعان، وهكذا. الدرج المرسوم له 4 صفوف وفيه 10 مربعات. كم مربعًا يلزم لدرج من 8 صفوف؟','A staircase of squares has 1 square in the first row, 2 in the second, and so on. The one shown has 4 rows and 10 squares. How many squares does an 8-row staircase need?',['36','32','40','28'],['36','32','40','28'],'1 + 2 + 3 + 4 + 5 + 6 + 7 + 8 = 36 مربعًا.','1 + 2 + 3 + 4 + 5 + 6 + 7 + 8 = 36 squares.',{fig:stairs(4)}],
 ['gear','إذا دار الترس (أ) عكس عقارب الساعة، ففي أي اتجاه يدور الترس (ب)؟','If gear A turns anticlockwise, which way does gear B turn?',['مع عقارب الساعة','عكس عقارب الساعة','لا يدور','يدور في الاتجاهين'],['clockwise','anticlockwise','it does not turn','both ways'],'الترس المتعاشق مع (أ) يدور عكسه، فيدور (ب) مع عقارب الساعة.','A gear touching A turns the opposite way, so B turns clockwise.',{fig:g3(false)}],
 ['phy','لماذا تطفو قطعة الخشب على الماء بينما يغوص المسمار؟','Why does a piece of wood float while a nail sinks?',['لأن كثافة الخشب أقل من كثافة الماء','لأن الخشب أثقل من المسمار دائمًا','لأن المسمار أكبر حجمًا','لأن الماء يدفع المعادن إلى أسفل'],['wood is less dense than water','wood is always heavier than a nail','the nail is bigger','water pushes metals down'],'الجسم الأقل كثافة من الماء يطفو، والحديد أكثر كثافة من الماء فيغوص.','Things less dense than water float; iron is denser than water, so it sinks.'],
 ['bio','ما وظيفة الرئتين؟','What do the lungs do?',['تبادل الغازات أثناء التنفس','هضم الطعام','ضخ الدم','تكوين العظام'],['exchange gases when we breathe','digest food','pump blood','build bones'],'في الرئتين يدخل الأكسجين إلى الدم ويخرج ثاني أكسيد الكربون.','In the lungs oxygen goes into the blood and carbon dioxide comes out.'],
 ['earth','أي الظواهر الآتية مرتبط بدوران الأرض حول الشمس مع ميل محورها؟','Which of these is linked to the Earth going round the Sun on its tilted axis?',['تعاقب الفصول الأربعة','تعاقب الليل والنهار','شروق القمر','هبوب الرياح يوميًا'],['the four seasons','day and night','moonrise','daily winds'],'دوران الأرض حول الشمس مع ميل محورها يسبب الفصول، أما الليل والنهار فسببه دورانها حول نفسها.','The yearly journey round the Sun on a tilted axis causes the seasons; spinning on its axis causes day and night.'],
 ['chem','تركنا كوب ماء في الشمس مدة طويلة فقلّ الماء. السبب هو:','A glass of water left in the sun for a long time has less water. Why?',['التبخر','التكاثف','التجمد','الانصهار'],['evaporation','condensation','freezing','melting'],'حرارة الشمس تحول جزءًا من الماء إلى بخار يخرج إلى الهواء.','The Sun’s heat turns some water into vapour that goes into the air.'],
 ['path','غرفة سارة تقع شمال المطبخ، والمطبخ يقع غرب الصالة. أين تقع الصالة بالنسبة إلى المطبخ؟','Sara’s room is north of the kitchen, and the kitchen is west of the living room. Where is the living room from the kitchen?',['شرقه','غربه','شماله','جنوبه'],['east of it','west of it','north of it','south of it'],'إذا كان المطبخ غرب الصالة، فالصالة شرق المطبخ.','If the kitchen is west of the living room, the living room is east of the kitchen.'],
 ['data','يبين الجدول عدد زوار متحف خلال 4 أيام. ما متوسط عدد الزوار في اليوم؟','The table shows museum visitors over 4 days. What is the mean number per day?',['115','120','110','460'],['115','120','110','460'],'المجموع 120 + 95 + 140 + 105 = 460، والمتوسط 460 ÷ 4 = 115.','Total 120 + 95 + 140 + 105 = 460; mean 460 ÷ 4 = 115.',{fig:tab(['اليوم','الأحد','الاثنين','الثلاثاء','الأربعاء'],[['الزوار','120','95','140','105']])},{fig:tab(['Day','Sun','Mon','Tue','Wed'],[['Visitors','120','95','140','105']])}],
 ['chance','رُمي حجر نرد مرة واحدة. ما احتمال ظهور عدد زوجي؟','A dice is rolled once. What is the probability of an even number?',['1/2','1/3','1/6','2/3'],['1/2','1/3','1/6','2/3'],'الأعداد الزوجية 2 و 4 و 6، أي 3 من 6 = 1/2.','The even numbers are 2, 4, 6: 3 out of 6 = 1/2.']

 ['frac','مع فهد 60 ريالًا، صرف خُمسها. كم بقي معه؟','Fahad had 60 riyals and spent a fifth. How much is left?',['48','12','55','40'],['48','12','55','40'],'خمس 60 = 12، والباقي 60 − 12 = 48.','A fifth of 60 is 12, so 60 − 12 = 48 is left.'],
 ['meas','إبريق سعته لتران و 500 مل. كم كوبًا سعته 250 مل يملأ؟','A jug holds 2 litres 500 ml. How many 250 ml cups can it fill?',['10','8','12','25'],['10','8','12','25'],'اللتران و 500 مل = 2500 مل، و 2500 ÷ 250 = 10 أكواب.','2 l 500 ml = 2500 ml; 2500 ÷ 250 = 10 cups.'],
 ['age','مجموع عمري أخوين 20 سنة، والفرق بينهما 4 سنوات. كم عمر الأكبر؟','Two brothers’ ages add up to 20 and differ by 4. How old is the older one?',['12','8','16','10'],['12','8','16','10'],'(20 + 4) ÷ 2 = 12 للأكبر، والأصغر 8.','(20 + 4) ÷ 2 = 12 for the older; the younger is 8.'],
 ['area','مثلث قاعدته 10 سم وارتفاعه 6 سم. ما مساحته؟','A triangle has a base of 10 cm and a height of 6 cm. What is its area?',['30 سم²','60 سم²','16 سم²','32 سم²'],['30 cm²','60 cm²','16 cm²','32 cm²'],'مساحة المثلث = ½ × القاعدة × الارتفاع = ½ × 10 × 6 = 30.','Area = ½ × base × height = ½ × 10 × 6 = 30.'],
 ['numr','أوجد العدد الناقص: 4 ← 9 ، 6 ← 13 ، 10 ← 21 ، 7 ← ......','Find the missing number: 4 → 9, 6 → 13, 10 → 21, 7 → ......',['15','14','16','17'],['15','14','16','17'],'القاعدة: نضرب في 2 ثم نجمع 1، و 7 × 2 + 1 = 15.','Rule: multiply by 2 and add 1; 7 × 2 + 1 = 15.'],
 ['nxt','ما الساعة التالية في النمط؟','Which clock comes next?',[clockF(7,0),clockF(6,0),clockF(8,0),clockF(9,0)],null,'تتقدم الساعة ساعتين كل مرة: 1 ثم 3 ثم 5 ثم 7.','Each clock is two hours later: 1, 3, 5, then 7 o’clock.',{figOpts:true,fig:seq([clockF(1,0),clockF(3,0),clockF(5,0),sep('؟')])}],
 ['phy','دفعنا عربة فارغة وعربة ممتلئة بالقوة نفسها. أيهما تتحرك أسرع؟','An empty trolley and a full trolley are pushed with the same force. Which moves faster?',['الفارغة','الممتلئة','تتحركان بالسرعة نفسها','لا تتحرك أي منهما'],['the empty one','the full one','both at the same speed','neither moves'],'كلما قلت الكتلة زادت السرعة التي تكسبها بالقوة نفسها.','The smaller the mass, the faster it moves for the same push.'],
 ['phy','تصل حرارة الشمس إلى الأرض عن طريق:','Heat from the Sun reaches the Earth by:',['الإشعاع','التوصيل','الحمل','الاحتكاك'],['radiation','conduction','convection','friction'],'بين الشمس والأرض فراغ، والإشعاع هو الطريقة الوحيدة التي تنتقل بها الحرارة عبر الفراغ.','Space is empty between the Sun and the Earth; only radiation can carry heat through empty space.'],
 ['bio','الكائنات الحية التي تصنع غذاءها بنفسها تسمى:','Living things that make their own food are called:',['المنتجات','المستهلكات','المحللات','المفترسات'],['producers','consumers','decomposers','predators'],'النباتات منتجات تصنع غذاءها بالبناء الضوئي.','Plants are producers; they make food by photosynthesis.'],
 ['earth','الطبقة الغازية التي تحيط بالأرض تسمى:','The layer of gases around the Earth is called:',['الغلاف الجوي','القشرة الأرضية','الوشاح','اللب'],['the atmosphere','the crust','the mantle','the core'],'الغلاف الجوي طبقة من الغازات تحيط بالأرض وفيها الهواء الذي نتنفسه.','The atmosphere is the layer of gases around the Earth, including the air we breathe.'],
 ['chem','أي مما يلي مخلوط وليس مادة نقية؟','Which of these is a mixture, not a pure substance?',['ماء البحر','الماء المقطر','الذهب الخالص','الأكسجين'],['sea water','distilled water','pure gold','oxygen'],'ماء البحر خليط من الماء والأملاح وغيرها.','Sea water is a mixture of water, salts and other things.'],
 ['path','بدأت نملة من النقطة (أ) فمشت خطوتين يمينًا، ثم 3 خطوات إلى أعلى، ثم خطوتين يسارًا. كم خطوة تبعد الآن عن (أ) في خط مستقيم؟','An ant starts at point A, walks 2 steps right, 3 steps up, then 2 steps left. How many steps is it from A in a straight line?',['3','7','5','2'],['3','7','5','2'],'الخطوتان يمينًا ثم يسارًا تلغيان بعضهما، فتبقى 3 خطوات إلى أعلى.','The 2 steps right and 2 left cancel out, leaving 3 steps up.'],
 ['data','يبين الجدول عدد الكتب المبيعة في معرض. ما النسبة بين كتب الشعر وكتب القصص؟','The table shows books sold at a fair. What is the ratio of poetry books to story books?',['5 : 12','12 : 5','5 : 9','1 : 2'],['5 : 12','12 : 5','5 : 9','1 : 2'],'الشعر 25 والقصص 60، و 25 : 60 بالقسمة على 5 تصبح 5 : 12.','Poetry 25, stories 60; 25 : 60 divided by 5 gives 5 : 12.',{fig:tab(['النوع','علمية','قصص','شعر'],[['المبيع','45','60','25']])},{fig:tab(['Type','Science','Stories','Poetry'],[['Sold','45','60','25']])}],
 ['rank','أي الأوزان الآتية هو الأكبر؟','Which mass is the greatest?',['2 كجم','1900 جم','1.5 كجم','1250 جم'],['2 kg','1900 g','1.5 kg','1250 g'],'السؤال عن الأكبر فنحول إلى الجرام ونستبعد: 1250 و 1500 و 1900 كلها أقل من 2000، فيبقى 2 كجم.','For “greatest” convert to grams and eliminate: 1250, 1500 and 1900 are all less than 2000, so 2 kg is left.']
]);
Z27(115,[
 ['ant','مضاد كلمة «الصعود»:','The opposite of “going up” is:',['الهبوط','الارتفاع','التسلق','الوقوف'],['going down','rising','climbing','standing'],'الصعود الارتفاع إلى أعلى، وضده الهبوط.','Going up is the opposite of going down.'],
 ['odd','الكلمة المختلفة هي:','The odd word out is:',['وسادة','قلم','دفتر','مسطرة'],['pillow','pen','notebook','ruler'],'القلم والدفتر والمسطرة أدوات مدرسية، أما الوسادة فللنوم.','Pen, notebook and ruler are school things; a pillow is for sleeping.'],
 ['rel','«نجّار : منشار» مثل:','“carpenter : saw” is like:',['خيّاط : إبرة','طبيب : مريض','مزارع : قمح','طبّاخ : مطعم'],['tailor : needle','doctor : patient','farmer : wheat','cook : restaurant'],'النجار يستخدم المنشار، والخياط يستخدم الإبرة (صاحب مهنة : أداته).','A carpenter uses a saw, and a tailor uses a needle (worker : tool).'],
 ['seq','رتّب من الأصغر إلى الأكبر: كلمة ، حرف ، جملة ، فقرة','Order from smallest to largest: word, letter, sentence, paragraph',['حرف ، كلمة ، جملة ، فقرة','كلمة ، حرف ، جملة ، فقرة','حرف ، جملة ، كلمة ، فقرة','فقرة ، جملة ، كلمة ، حرف'],['letter, word, sentence, paragraph','word, letter, sentence, paragraph','letter, sentence, word, paragraph','paragraph, sentence, word, letter'],'الحروف تكوّن الكلمة، والكلمات تكوّن الجملة، والجمل تكوّن الفقرة.','Letters make words, words make sentences, sentences make paragraphs.'],
 PR('إذا كانت الكتب تنمو في الحقول، وكانت الأقلام تُصنع في المصانع، فإن المزارع يحصد من حقله ......','If books grow in fields and pens are made in factories, then the farmer harvests ...... from his field',['الكتب','الأقلام','القمح','المصانع'],['books','pens','wheat','factories'],'حسب المقدمة الكتب تنمو في الحقول، فالمزارع يحصد الكتب.','According to the statement books grow in fields, so the farmer harvests books.'),
 ['ctx','معنى «أبرمَ» في: «أبرم التاجران عقدًا»:','In “The two traders concluded a contract”, “concluded” means:',['عقداه وأتمّاه','ألغياه','كتبا فيه شعرًا','نسياه'],['made and completed it','cancelled it','wrote a poem in it','forgot it'],'أبرم العقد أي أحكمه وأتمه.','To conclude a contract means to make it final.'],
 ['idio','النصيحة «اختر الرفيق قبل الطريق» تعني:','The advice “Choose your companion before the road” means:',['اختر الصديق المناسب قبل أن تبدأ رحلتك أو عملك','اختر أقصر طريق','لا تسافر وحدك أبدًا','الطريق أهم من الرفيق'],['choose the right friend before you start a journey or task','choose the shortest road','never travel alone','the road matters more than the friend'],'الرفيق الصالح يعينك في الطريق، فاختره قبل أن تبدأ.','A good companion helps you on the way, so choose one first.'],
 ['patt','العدد التالي: 5 ، 10 ، 9 ، 18 ، 17 ، ......','Next number: 5, 10, 9, 18, 17, ......',['34','16','35','33'],['34','16','35','33'],'نضرب في 2 ثم نطرح 1 بالتناوب: 17 × 2 = 34.','Alternately multiply by 2 and subtract 1: 17 × 2 = 34.'],
 ['ops','999 + 99 + 9 = ......','999 + 99 + 9 = ......',['1107','1097','1117','1007'],['1107','1097','1117','1007'],'999 + 99 = 1098، و 1098 + 9 = 1107.','999 + 99 = 1098, and 1098 + 9 = 1107.'],
 ['prob','سيارة تسير بسرعة 80 كم في الساعة. كم كيلومترًا تقطع في ساعتين ونصف؟','A car travels at 80 km per hour. How far does it go in two and a half hours?',['200','160','240','180'],['200','160','240','180'],'في ساعتين 160 كم، وفي نصف ساعة 40 كم، فالمجموع 200 كم.','160 km in 2 hours plus 40 km in half an hour: 200 km.'],
 ['frac','أي الكسور الآتية هو الأصغر؟','Which fraction is the smallest?',['2/9','1/3','2/5','3/7'],['2/9','1/3','2/5','3/7'],'السؤال عن الأصغر فنستبعد: 1/3 = 3/9 أكبر من 2/9، و 2/5 و 3/7 كل منهما أكبر من 1/3، فيبقى 2/9.','For “smallest” we eliminate: 1/3 = 3/9 is more than 2/9, and 2/5 and 3/7 are both more than 1/3, so 2/9 is left.'],
 ['meas','مستطيل محيطه 30 سم وطوله 9 سم. ما عرضه؟','A rectangle has a perimeter of 30 cm and a length of 9 cm. What is its width?',['6 سم','21 سم','12 سم','3 سم'],['6 cm','21 cm','12 cm','3 cm'],'نصف المحيط 15 = الطول + العرض، فالعرض 15 − 9 = 6 سم.','Half the perimeter is 15 = length + width, so width = 15 − 9 = 6 cm.'],
 ['age','عمر الأب الآن 40 سنة، وعمر ابنه 10 سنوات. منذ كم سنة كان عمر الأب 7 أمثال عمر ابنه؟','A father is 40 and his son is 10. How many years ago was the father 7 times the son’s age?',['5','3','4','6'],['5','3','4','6'],'قبل 5 سنوات: الأب 35 والابن 5، و 35 = 7 × 5.','5 years ago the father was 35 and the son 5; 35 = 7 × 5.'],
 ['cnt','شريط مقسوم إلى 4 خانات متجاورة. كم مستطيلًا (بما فيها المربعات) يمكن عدّه في الشكل؟','A strip is split into 4 boxes in a row. How many rectangles (including squares) can you count?',['10','4','8','6'],['10','4','8','6'],'خانات مفردة 4، وكل خانتين 3، وكل 3 خانات 2، والشريط كله 1: 4 + 3 + 2 + 1 = 10.','Single boxes 4, pairs 3, threes 2, the whole strip 1: 4 + 3 + 2 + 1 = 10.',{fig:gridSh(4,1,[],46)}],
 ['sym','إذا كان 3 ◆ 4 = 25 ، و 5 ◆ 2 = 29 ، فإن 1 ◆ 6 = ......','If 3 ◆ 4 = 25 and 5 ◆ 2 = 29, then 1 ◆ 6 = ......',['37','49','13','36'],['37','49','13','36'],'القاعدة: مربع الأول + مربع الثاني: 9 + 16 = 25، 25 + 4 = 29، و 1 + 36 = 37.','Rule: square each number and add: 9 + 16 = 25, 25 + 4 = 29, and 1 + 36 = 37.'],
 ['mat','ما الشكل الناقص في المصفوفة؟','Which shape completes the grid?',[shp('s','d'),shp('s','f'),shp('c','d'),shp('t','d')],null,'في كل صف تظهر الدائرة والمربع والمثلث مرة واحدة بالنمط نفسه، والصف الثالث بنقطة وينقصه المربع.','Each row has a circle, a square and a triangle in the same style; the third row has dots and is missing the square.',{figOpts:true,fig:mx([shp('c','o'),shp('s','o'),shp('t','o'),shp('s','f'),shp('t','f'),shp('c','f'),shp('t','d'),shp('c','d'),sep('؟')])}],
 ['phy','ينتقل الصوت أسرع في:','Sound travels fastest through:',['الحديد','الهواء','الفراغ','الماء'],['iron','air','empty space','water'],'الصوت أسرع في المواد الصلبة ثم السوائل ثم الغازات، ولا ينتقل في الفراغ.','Sound is fastest in solids, then liquids, then gases, and cannot travel through empty space.'],
 ['phy','لماذا يُصنع مقبض المقلاة من البلاستيك أو الخشب؟','Why is a frying pan handle made of plastic or wood?',['لأنهما عازلان للحرارة','لأنهما موصلان للحرارة','لأنهما أثقل من المعدن','لتلوين المقلاة'],['they are heat insulators','they conduct heat well','they are heavier than metal','to colour the pan'],'البلاستيك والخشب لا يوصلان الحرارة جيدًا، فلا تحترق اليد.','Plastic and wood do not conduct heat well, so your hand does not get burnt.'],
 ['bio','تحوّل اليرقة إلى عذراء ثم إلى فراشة يسمى:','A caterpillar turning into a pupa and then a butterfly is called:',['التحول الكامل','التكاثر الخضري','التلقيح','الهجرة'],['complete metamorphosis','vegetative reproduction','pollination','migration'],'الفراشة تمر بأربع مراحل: بيضة، يرقة، عذراء، حشرة كاملة، وهذا هو التحول الكامل.','A butterfly has four stages: egg, caterpillar, pupa, adult; this is complete metamorphosis.'],
 ['earth','أي مما يأتي مصدر طاقة متجددة؟','Which is a renewable energy source?',['الرياح','النفط','الفحم','الغاز الطبيعي'],['wind','oil','coal','natural gas'],'الرياح لا تنفد، أما النفط والفحم والغاز فتنفد مع الوقت.','Wind does not run out; oil, coal and gas do.'],
 ['chem','يحتاج صدأ الحديد إلى:','Iron needs ...... to rust:',['الماء والأكسجين','الرمل والملح','الضوء فقط','الحرارة فقط'],['water and oxygen','sand and salt','light only','heat only'],'يصدأ الحديد عند تفاعله مع الأكسجين بوجود الماء أو الرطوبة.','Iron rusts when it reacts with oxygen in the presence of water.'],
 ['clk','عقرب الدقائق يشير إلى 12، ثم دار ربع دورة مع عقارب الساعة. إلى أي رقم يشير الآن؟','The minute hand points to 12, then turns a quarter turn clockwise. Which number does it point to now?',['3','6','9','4'],['3','6','9','4'],'ربع الدورة = 15 دقيقة، فيشير إلى الرقم 3.','A quarter turn is 15 minutes, so it points to 3.'],
 ['data','يبين الجدول درجات طالب (من 20). ما المادة التي تأتي ثانيًا من الأعلى؟','The table shows a pupil’s marks (out of 20). Which subject is second highest?',['الرياضيات','لغتي','العلوم','الإنجليزي'],['Maths','Arabic','Science','English'],'نرتب: لغتي 20 ← الرياضيات 18 ← العلوم 16 ← الإنجليزي 14، فالثانية الرياضيات.','Order: Arabic 20 → Maths 18 → Science 16 → English 14; second is Maths.',{fig:tab(['المادة','الرياضيات','العلوم','لغتي','الإنجليزي'],[['الدرجة','18','16','20','14']])},{fig:tab(['Subject','Maths','Science','Arabic','English'],[['Mark','18','16','20','14']])}],
 ['chance','في صندوق 4 بطاقات مرقمة 1 ، 2 ، 3 ، 4. سُحبت بطاقة. ما احتمال أن يكون رقمها أكبر من 1؟','A box has 4 cards numbered 1, 2, 3, 4. One is drawn. What is the probability it is greater than 1?',['3/4','1/4','1/2','1'],['3/4','1/4','1/2','1'],'البطاقات الأكبر من 1 هي 2 و 3 و 4، أي 3 من 4.','Cards greater than 1 are 2, 3, 4: 3 out of 4.']

 ['syn','مرادف كلمة «الفَطِن»:','A word that means the same as “sharp-minded” is:',['الذكي','الغافل','البخيل','الكسول'],['clever','careless','mean','lazy'],'الفطن هو الذكي سريع الفهم.','Sharp-minded means clever and quick to understand.'],
 ['odd','الكلمة المختلفة هي:','The odd word out is:',['القاهرة','الرياض','جدة','الدمام'],['Cairo','Riyadh','Jeddah','Dammam'],'الرياض وجدة والدمام مدن سعودية، أما القاهرة فمدينة مصرية.','Riyadh, Jeddah and Dammam are Saudi cities; Cairo is in Egypt.'],
 ['rel','«دقيقة : ساعة» مثل:','“minute : hour” is like:',['شهر : سنة','يوم : ليلة','صباح : مساء','ساعة : منبّه'],['month : year','day : night','morning : evening','clock : alarm'],'الدقيقة جزء من الساعة، والشهر جزء من السنة.','A minute is part of an hour, and a month is part of a year.'],
 ['seq','رتّب مراحل حياة الضفدع:','Put the life stages of a frog in order:',['بيضة ، شُرغوف ، ضفدع صغير ، ضفدع بالغ','شُرغوف ، بيضة ، ضفدع صغير ، ضفدع بالغ','بيضة ، ضفدع صغير ، شُرغوف ، ضفدع بالغ','ضفدع صغير ، بيضة ، شُرغوف ، ضفدع بالغ'],['egg, tadpole, froglet, adult frog','tadpole, egg, froglet, adult frog','egg, froglet, tadpole, adult frog','froglet, egg, tadpole, adult frog'],'يفقس البيض شراغيف، ثم تنمو لها أرجل فتصبح ضفادع صغيرة ثم بالغة.','Eggs hatch into tadpoles, which grow legs, become froglets and then adult frogs.'],
 PR('إذا كانت الشمس تشرق من الغرب، وكان الماء سائلًا، فإن الشمس تغرب في ......','If the Sun rises in the west and water is a liquid, then the Sun sets in the ......',['الشرق','الغرب','الشمال','الجنوب'],['east','west','north','south'],'حسب المقدمة تشرق الشمس من الغرب، فتغرب في الجهة المقابلة: الشرق.','According to the statement the Sun rises in the west, so it sets on the opposite side: the east.'),
 ['logic','كل من يحضر مبكرًا يحصل على مقعد في الأمام. حصل ناصر على مقعد في الخلف. إذن:','Everyone who comes early gets a front seat. Nasser got a back seat. So:',['ناصر لم يحضر مبكرًا','ناصر حضر مبكرًا','كل المقاعد الأمامية فارغة','ناصر لا يحب المقاعد الأمامية'],['Nasser did not come early','Nasser came early','all front seats are empty','Nasser does not like front seats'],'لو حضر مبكرًا لحصل على مقعد أمامي حتمًا، فبما أنه في الخلف فهو لم يحضر مبكرًا.','If he had come early he would have a front seat; he does not, so he did not come early.'],
 ['idio','معنى «الوقت كالسيف إن لم تقطعه قطعك»:','“Time is like a sword: if you do not cut it, it cuts you” means:',['استغلّ وقتك وإلا ضاع منك','السيف أهم من الوقت','الوقت خطير دائمًا','لا تحمل السيف'],['use your time well or you will lose it','a sword matters more than time','time is always dangerous','do not carry a sword'],'من لا يستفيد من وقته يضيع منه ويخسر.','If you do not use your time, it slips away and you lose out.'],
 ['patt','العدد التالي: 1 ، 3 ، 7 ، 13 ، 21 ، ......','Next number: 1, 3, 7, 13, 21, ......',['31','29','33','34'],['31','29','33','34'],'الفروق 2 ، 4 ، 6 ، 8 ثم 10: 21 + 10 = 31.','The gaps are 2, 4, 6, 8, then 10: 21 + 10 = 31.'],
 ['place','ما الرقم الذي في منزلة الآلاف في العدد 7384519؟','Which digit is in the thousands place in 7 384 519?',['4','3','8','5'],['4','3','8','5'],'من اليمين: 9 آحاد، 1 عشرات، 5 مئات، 4 آلاف.','From the right: 9 ones, 1 ten, 5 hundreds, 4 thousands.'],
 ['prob','اشترى تاجر 30 صندوقًا بـ 600 ريال، وباع الصندوق الواحد بـ 25 ريالًا. كم ربحه؟','A trader bought 30 boxes for 600 riyals and sold each for 25 riyals. What was his profit?',['150','125','250','100'],['150','125','250','100'],'ثمن البيع 30 × 25 = 750، والربح 750 − 600 = 150 ريالًا.','He sold them for 30 × 25 = 750, so profit = 750 − 600 = 150.'],
 ['frac','إذا كان ثلث عدد = 12، فما ربع هذا العدد؟','If a third of a number is 12, what is a quarter of it?',['9','12','16','4'],['9','12','16','4'],'العدد 12 × 3 = 36، وربعه 36 ÷ 4 = 9.','The number is 12 × 3 = 36, and a quarter of it is 9.'],
 ['area','غرفة مربعة طول ضلعها 4 م. كم بلاطة مربعة طول ضلعها 50 سم تلزم لتغطية أرضيتها؟','A square room is 4 m long on each side. How many 50 cm square tiles cover the floor?',['64','32','16','80'],['64','32','16','80'],'في كل ضلع 400 ÷ 50 = 8 بلاطات، والمجموع 8 × 8 = 64 بلاطة.','Each side fits 400 ÷ 50 = 8 tiles, so 8 × 8 = 64 tiles.'],

 ['geo','مستطيل طوله 12 سم وطول قطره 13 سم. ما عرضه؟','A rectangle is 12 cm long and its diagonal is 13 cm. What is its width?',['5 سم','1 سم','25 سم','7 سم'],['5 cm','1 cm','25 cm','7 cm'],'حسب فيثاغورس: العرض² = 13² − 12² = 169 − 144 = 25، فالعرض 5 سم.','By Pythagoras: width² = 13² − 12² = 25, so the width is 5 cm.'],

 ['ratio','يُنهي عامل عملًا في 6 أيام، ويُنهيه آخر في 12 يومًا. في كم يومًا ينهيانه معًا؟','One worker finishes a job in 6 days and another in 12 days. How long do they take together?',['4','9','6','18'],['4','9','6','18'],'في اليوم ينجزان 1/6 + 1/12 = 3/12 = 1/4 من العمل، فيحتاجان 4 أيام.','Each day they do 1/6 + 1/12 = 1/4 of the job, so 4 days.'],

 ['stat','متوسط 5 أعداد يساوي 12. أضيف عدد سادس فأصبح المتوسط 13. ما العدد السادس؟','The mean of 5 numbers is 12. A sixth number is added and the mean becomes 13. What is the sixth number?',['18','13','12','15'],['18','13','12','15'],'المجموع قبل الإضافة 5 × 12 = 60، وبعدها 6 × 13 = 78، فالعدد 78 − 60 = 18.','Total before: 5 × 12 = 60; after: 6 × 13 = 78; the new number is 18.'],
 ['chem','العدد الذري لعنصر يساوي عدد:','The atomic number of an element equals the number of:',['البروتونات في نواته','النيوترونات في نواته','البروتونات والنيوترونات معًا','الإلكترونات المفقودة'],['protons in its nucleus','neutrons in its nucleus','protons and neutrons together','lost electrons'],'العدد الذري هو عدد البروتونات، أما مجموع البروتونات والنيوترونات فهو العدد الكتلي.','The atomic number is the number of protons; protons + neutrons is the mass number.'],

 ['phy','ما وحدة قياس القوة؟','What is the unit of force?',['النيوتن','الجول','الواط','الباسكال'],['the newton','the joule','the watt','the pascal'],'القوة تقاس بالنيوتن، والجول للطاقة، والواط للقدرة، والباسكال للضغط.','Force is in newtons; joules are energy, watts power, pascals pressure.'],
 ['earth','يحدث المدّ والجزر في البحار بشكل رئيس بسبب:','Tides in the sea are mainly caused by:',['جاذبية القمر','الرياح','دوران الأرض حول الشمس','الزلازل'],['the Moon’s gravity','wind','the Earth going round the Sun','earthquakes'],'جاذبية القمر تشد مياه البحار فيرتفع منسوبها وينخفض.','The Moon’s pull on the oceans makes the water rise and fall.'],

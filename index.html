<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة موهبة للتدريب | إعداد محمد رجب</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 0; color: #333; }
        .header { background-color: #1a5276; color: white; padding: 20px; text-align: center; border-bottom: 4px solid #f39c12; }
        .header h1 { margin: 0; font-size: 28px; }
        .header p { margin: 5px 0 0; font-size: 16px; color: #d4e6f1; }
        .container { max-width: 800px; margin: 30px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2980b9; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .categories { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .category-btn { background-color: #ecf0f1; color: #2c3e50; border: 2px solid #bdc3c7; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .category-btn:hover { background-color: #3498db; color: white; border-color: #2980b9; }
        
        .question-box { background-color: #fdfefe; border-right: 5px solid #3498db; padding: 15px 20px; border-radius: 5px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .q-text { direction: ltr; text-align: left; font-size: 20px; font-weight: 600; color: #2c3e50; margin: 0; }
        
        .options { list-style-type: none; padding: 0; direction: ltr; }
        .options li { background: #fff; margin: 12px 0; padding: 15px; border: 2px solid #e5e8e8; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 18px; text-align: left; }
        .options li:hover { background: #f4f6f7; border-color: #d5d8dc; }
        .options li.selected { background: #3498db; color: white; border-color: #2980b9; font-weight: bold; }
        
        .action-btn { background-color: #27ae60; color: white; border: none; padding: 15px 20px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.3s; }
        .action-btn:hover { background-color: #219150; }
        .hidden { display: none; }
        .score-display { font-size: 24px; font-weight: bold; text-align: center; color: #e74c3c; padding: 20px; background: #fadbd8; border-radius: 8px; margin: 20px 0; }
        .progress { margin-bottom: 15px; font-weight: bold; color: #7f8c8d; }
    </style>
</head>
<body>

    <div class="header">
        <h1>منصة تدريب طلاب موهبة (اختبار القدرات العقلية)</h1>
        <p>إعداد وإشراف المدرب: محمد رجب | للتواصل: 0564826388</p>
    </div>

    <!-- شاشة اختيار القسم -->
    <div class="container" id="category-selection">
        <h2>اختر القسم الذي تريد التدرب عليه:</h2>
        <div class="categories">
            <button class="category-btn" onclick="startQuiz('math')">الاستدلال الرياضي والمكاني 📐</button>
            <button class="category-btn" onclick="startQuiz('verbal')">الاستدلال اللغوي وفهم المقروء 📚</button>
            <button class="category-btn" onclick="startQuiz('science')">الاستدلال العلمي والميكانيكي ⚙️</button>
            <button class="category-btn" onclick="startQuiz('flexibility')">المرونة العقلية 🧠</button>
        </div>
    </div>

    <!-- شاشة الاختبار -->
    <div class="container hidden" id="quiz-section">
        <h2 id="category-title"></h2>
        <div class="progress" id="q-progress"></div>
        <div class="question-box">
            <p class="q-text" id="q-text"></p>
        </div>
        <ul class="options" id="options-list"></ul>
        <button class="action-btn" id="next-btn" onclick="nextQuestion()">Next Question / السؤال التالي</button>
    </div>

    <!-- شاشة النتيجة -->
    <div class="container hidden" id="result-section">
        <h2>اكتمل التدريب في هذا القسم!</h2>
        <div class="score-display" id="final-score"></div>
        <button class="action-btn" onclick="location.reload()">العودة للقائمة الرئيسية</button>
    </div>

    <!-- هنا نربط ملف الأسئلة الخارجي -->
    <script src="data.js"></script>

    <script>
        const categoryNames = {
            math: "الاستدلال الرياضي والمكاني 📐",
            verbal: "الاستدلال اللغوي وفهم المقروء 📚",
            science: "الاستدلال العلمي والميكانيكي ⚙️",
            flexibility: "المرونة العقلية 🧠"
        };

        let currentCategory = '';
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOption = null;

        function startQuiz(category) {
            if (!window.questionsDB || !questionsDB[category] || questionsDB[category].length === 0) {
                alert("تأكد من وجود ملف data.js في نفس المجلد، وأن به أسئلة لهذا القسم.");
                return;
            }

            currentCategory = category;
            currentQuestionIndex = 0;
            score = 0;
            
            document.getElementById('category-selection').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('category-title').innerText = categoryNames[category];
            loadQuestion();
        }

        function loadQuestion() {
            selectedOption = null;
            const qData = questionsDB[currentCategory][currentQuestionIndex];
            const totalQ = questionsDB[currentCategory].length;
            
            document.getElementById('q-progress').innerText = `سؤال ${currentQuestionIndex + 1} من ${totalQ}`;
            document.getElementById('q-text').innerText = "Q: " + qData.q;
            
            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';
            
            qData.opts.forEach((opt, index) => {
                const li = document.createElement('li');
                li.innerText = String.fromCharCode(65 + index) + ") " + opt;
                li.onclick = () => selectOption(li, index);
                optionsList.appendChild(li);
            });
        }

        function selectOption(liElement, index) {
            const allOptions = document.querySelectorAll('.options li');
            allOptions.forEach(opt => opt.classList.remove('selected'));
            liElement.classList.add('selected');
            selectedOption = index;
        }

        function nextQuestion() {
            if(selectedOption === null) {
                alert('Please select an answer first! / الرجاء اختيار إجابة أولاً!');
                return;
            }
            
            const correctAns = questionsDB[currentCategory][currentQuestionIndex].ans;
            if(selectedOption === correctAns) score++;

            currentQuestionIndex++;
            if(currentQuestionIndex < questionsDB[currentCategory].length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');
            const total = questionsDB[currentCategory].length;
            const percentage = Math.round((score / total) * 100);
            document.getElementById('final-score').innerText = `حصلت على ${score} من ${total} (${percentage}%)`;
        }
    </script>
</body>
</html>

V('logic','إذا قطفت هند أزهار، وكانت الحمراء ليست الثانية وبعدها البيضاء، وقطفت الصفراء التي ليست الرابعة وقبلها البرتقالية، فأي زهرة قطفتها هند أولًا؟','Hind picked four flowers. The red one was not second and the white one came after it; the yellow one was not fourth, and the orange one came before it. Which flower did she pick first?',['الحمراء','الصفراء','البرتقالية','البيضاء'],['red','yellow','orange','white'],2,'البيضاء تأتي بعد الحمراء مباشرة، والصفراء بعد البرتقالية مباشرة. لو بدأنا بالحمراء: حمراء، بيضاء، برتقالية، صفراء، فتكون الصفراء الرابعة وهذا ممنوع. إذن: برتقالية، صفراء، حمراء، بيضاء، فأول زهرة البرتقالية.','White comes right after red, and yellow right after orange. Starting with red gives red, white, orange, yellow, but yellow cannot be 4th. So the order is orange, yellow, red, white: orange was first.');
V('logic','قامت المعلمة بترتيب التلاميذ في الروضة، فكان عبد الرحمن بعده علي لكن علي يسبقه مهند الذي كان سابقًا لفهد. فمن الثالث في هذا الترتيب؟','The teacher lined up the children: Abdulrahman, with Ali after him, but Muhannad comes before Ali, and Muhannad is ahead of Fahd. Who is third?',['عبد الرحمن','علي','مهند','فهد'],['Abdulrahman','Ali','Muhannad','Fahd'],1,'الترتيب: عبد الرحمن، مهند، علي، فهد. إذن الثالث علي.','The order is Abdulrahman, Muhannad, Ali, Fahd, so Ali is third.');
V('logic','أثمرت شجرة التفاح بعد شجرة اللوز، وكانت شجرة الكمثرى بينهما، كما سبقت شجرة التين شجرة التفاح. ما الشجرة التي أثمرت في الترتيب الثاني؟','The apple tree bore fruit after the almond tree, with the pear tree between them, and the fig tree came just before the apple tree. Which tree bore fruit second?',['التفاح','التين','الكمثرى','اللوز'],['apple','fig','pear','almond'],2,'الترتيب: اللوز، الكمثرى، التين، التفاح. فالثانية الكمثرى.','The order is almond, pear, fig, apple, so the pear is second.');
V('logic','سعاد أصغر أخواتها، وأكبر منها عبير التي هي أصغر من هدى وأكبر من هند، فما الترتيب من الأصغر إلى الأكبر؟','Suad is the youngest sister. Abeer is older than her, younger than Huda and older than Hind. What is the order from youngest to oldest?',['سعاد – هند – هدى – عبير.','سعاد – هند – عبير – هدى.','سعاد – عبير – هند – هدى.','هدى – عبير – هند – سعاد.'],['Suad – Hind – Huda – Abeer','Suad – Hind – Abeer – Huda','Suad – Abeer – Hind – Huda','Huda – Abeer – Hind – Suad'],1,'سعاد الأصغر، ثم هند، ثم عبير (أكبر من هند)، ثم هدى الأكبر.','Suad is youngest, then Hind, then Abeer (older than Hind), then Huda.');
V('logic','طلب الأب من أبنائه الأربعة: فيصل، خالد، علي، ومهند أن يُحضر كل منهم بطيخة، والفائز هو من يُحضر أصغر بطيخة يوم الجمعة. فإذا كانت بطيخة فيصل أكبر من بطيخة خالد، وبطيخة خالد أكبر من بطيخة علي، وكانت بطيخة مهند الثانية في الترتيب من حيث الصغر، فمن الفائز؟','A father asked his four sons Faisal, Khaled, Ali and Muhannad to bring a watermelon each; the smallest wins. Faisal’s is bigger than Khaled’s, Khaled’s is bigger than Ali’s, and Muhannad’s is the second smallest. Who wins?',['فيصل','خالد','علي','مهند'],['Faisal','Khaled','Ali','Muhannad'],2,'من الأصغر: علي، ثم مهند (الثاني)، ثم خالد، ثم فيصل. فالفائز علي.','From smallest: Ali, Muhannad (second), Khaled, Faisal. Ali wins.');
V('logic','أجري تصويت في أربعة فصول لاختيار النكهة المفضلة من الحليب: الفصل (أ): الموز أكثر من الفانيليا. الفصل (ب): التوت أكثر من الفانيليا وأقل من الموز. الفصل (جـ): الشوكولاته أكثر من التوت. الفصل (د): الفانيليا الأقل بين جميع النكهات. فما النكهة الأكثر تصويتًا؟','Four classes voted for their favourite milk flavour. Class A: banana beat vanilla. Class B: berry beat vanilla but lost to banana. Class C: chocolate beat berry. Class D: vanilla was the lowest of all. Which flavour got the most votes?',['الفانيليا','الشوكولاته','التوت','الموز'],['vanilla','chocolate','berry','banana'],1,'الفانيليا الأقل، والتوت أكثر منها، والموز والشوكولاته كلاهما أكثر من التوت، والشوكولاته جاءت في آخر المقارنات أعلى النكهات، فهي الأكثر تصويتًا حسب الكتاب.','Vanilla is lowest, berry is above it, and banana and chocolate are both above berry; the book takes chocolate as the top flavour.');
V('logic','شارك ستة أطفال في سباق: أحمد أنهى السباق في المركز الثالث. بدر أنهى السباق في المركز السادس خلف عماد مباشرة. فهد أنهى السباق بين أحمد وعماد. استطاع سعد تجاوز عبد الرحمن في آخر لحظة قبل خط النهاية. من الذي فاز بالسباق؟','Six children ran a race. Ahmed came 3rd. Badr came 6th, right behind Emad. Fahd finished between Ahmed and Emad. Saad overtook Abdulrahman just before the finish. Who won?',['فهد','عماد','عبد الرحمن','سعد'],['Fahd','Emad','Abdulrahman','Saad'],3,'عماد الخامس، وفهد الرابع، وأحمد الثالث، فيبقى المركزان الأول والثاني لسعد وعبد الرحمن، وسعد تجاوز عبد الرحمن فهو الأول.','Emad is 5th, Fahd 4th, Ahmed 3rd. Saad and Abdulrahman take 1st and 2nd, and Saad passed Abdulrahman, so Saad won.');
V('idio','"احترام الذات ينتزع احترام الآخرين" يُفهم من العبارة أن:','“Self-respect wins the respect of others.” This means:',['عدم احترام الذات.','احترام الذات يجلب احترام الآخرين.','احترام الآخرين غير مهم.','لا علاقة بين احترام الذات والآخرين.'],['not respecting yourself','respecting yourself brings others’ respect','respecting others does not matter','there is no link between self-respect and others'],1,'من يحترم نفسه يحترمه الآخرون.','People respect those who respect themselves.');
V('idio','"العقول القوية تناقش الأفكار، والعقول المتوسطة تناقش الأحداث، أما العقول الضعيفة فتناقش الأشخاص" تستنتج من ذلك أنه يجب أن:','“Strong minds discuss ideas, average minds discuss events, and weak minds discuss people.” So we should:',['نكثر من الأولى ونقلل من الثانية ونتجنب الثالثة.','نتجنب الأولى والثانية ونكثر من الثالثة.','نكثر من الثالثة، ونقلل من الثانية ونتجنب الأولى.','نكثر من الثانية والثالثة، ونقلل من الأولى.'],['do more of the first, less of the second, and avoid the third','avoid the first two and do more of the third','do more of the third, less of the second, and avoid the first','do more of the second and third, and less of the first'],0,'نكثر من مناقشة الأفكار، ونقلل من مناقشة الأحداث، ونتجنب الحديث عن الأشخاص.','Discuss ideas more, events less, and avoid talking about people.');
V('idio','قال رجل: "لو أصبح سعر رغيف الخبز بدينار، فلن يهمني ما دام الله يرزقني". يدل هذا القول على ........','A man said: “If a loaf of bread cost a dinar, it would not worry me as long as God provides for me.” This shows ........',['الكسل وترك العمل.','الزهد في الحياة ومتعها.','عدم أهمية المال.','صدق التوكل على الله.'],['laziness and giving up work','not caring for life’s pleasures','money does not matter','true trust in God'],3,'الرجل واثق أن الله سيرزقه مهما ارتفعت الأسعار، وهذا صدق التوكل.','He is sure God will provide whatever prices do: true trust in God.');
V('infer','لاحظت أن معلمك يكرر اختيار بعض الطلاب للمشاركة، ويتجاهل الآخرين. فكيف تتعامل مع الموقف بطريقة مناسبة؟','You notice your teacher keeps choosing the same pupils to take part and ignores the others. What is the right way to deal with this?',['الاعتراض على ذلك أمام الطلاب.','تجاهل الموقف وعدم التدخل.','مناقشة المعلم باحترام على انفراد بعد الحصة.','التوقف عن التفاعل داخل الحصة.'],['object in front of the class','ignore it and do nothing','talk to the teacher politely in private after the lesson','stop taking part in lessons'],2,'الأسلوب المناسب هو الحديث مع المعلم باحترام وعلى انفراد.','The right way is to speak to the teacher politely and privately.');
V('infer','ليلى تُبادر إلى إغلاق هاتفها فور شروعها في المذاكرة، فهذا يدل على أنها:','Laila switches off her phone as soon as she starts studying. This shows that she:',['لا تُحب استخدام الجوال.','تنهي مذاكرتها بسرعة.','تفضل الدراسة في أوقات قصيرة.','ترغب في التركيز وتجنب المشتتات.'],['does not like phones','finishes studying quickly','prefers short study times','wants to focus and avoid distractions'],3,'إغلاق الهاتف وقت المذاكرة يبعد المشتتات ويساعد على التركيز.','Switching off the phone removes distractions and helps her focus.');
V('infer','اقترب رجل من شخص بلا مأوى وسأله: "هل تحتاج إلى أي شيء؟" فأجابه: "كنت سأطرح عليك السؤال نفسه" فماذا يقصد بذلك؟','A man asked a homeless person: “Do you need anything?” He answered: “I was going to ask you the same question.” What did he mean?',['لا يريد أموالًا.','يريد أن يُترك بمفرده.','أنه حزين.','أنه لا يريد التحدث عن مشكلاته.'],['he does not want money','he wants to be left alone','he is sad','he does not want to talk about his problems'],3,'رد السؤال على السائل يدل على أنه لا يريد الحديث عن حاله ومشكلاته.','Turning the question back shows he does not want to talk about his own problems.');
V('infer','خرجنا يومًا مبكرًا فكانت الشوارع مزدحمة بشكل غير متوقع، فما السبب الأكثر منطقية لذلك؟','We went out early one day and the streets were unexpectedly busy. What is the most logical reason?',['جميع الناس تأخروا عن أعمالهم.','السيارات كانت تسير ببطء.','الشوارع تكون مزدحمة دائمًا.','يوجد حادث أدى إلى تعطل المرور.'],['everyone was late for work','the cars were slow','the streets are always busy','an accident held up the traffic'],3,'الزحام غير المتوقع في الصباح الباكر سببه الأرجح حادث عطّل المرور.','Unexpected early traffic is most likely caused by an accident.');
V('infer','أسرة ترغب في تقليل تكاليف المعيشة، ما الإجراء الأنسب لتحقيق ذلك؟','A family wants to cut its living costs. What is the best step?',['طلب قرض من البنك.','التخطيط للميزانية والالتزام بها.','شراء الكماليات دون الضروريات.','السكن في مدينة أخرى.'],['take a bank loan','plan a budget and stick to it','buy luxuries instead of essentials','move to another city'],1,'وضع ميزانية والالتزام بها يضبط الإنفاق ويقلل التكاليف.','Making a budget and sticking to it controls spending.');

V('infer','أي الحلول التالية يصلح لمواجهة الفيضانات الناتجة عن الأمطار:','Which solution helps against floods caused by rain?',['صناعة سدود من جذوع الأشجار.','حفر آبار جوفية.','إنشاء قنوات تصريف مياه الأمطار.','زيادة عدد المباني المرتفعة.'],['dams made of tree trunks','digging wells','building rainwater drains','more tall buildings'],2,'قنوات التصريف تنقل مياه الأمطار بعيدًا فتمنع تجمعها.','Drains carry rainwater away so it does not collect.');
V('idio','"مادمت على حق تجاهل ما يزعجك ولاتبرر لأحد". ما العنوان المناسب لهذه المقولة؟','“As long as you are right, ignore what bothers you and do not justify yourself to anyone.” What is a good title for this saying?',['فن التجاهل.','التبرير خدعة.','التجاهل غباء.','الحق لا يحتاج تبرير.'],['the art of ignoring','justifying is a trick','ignoring is foolish','the truth needs no justifying'],3,'الفكرة الرئيسة أن صاحب الحق لا يحتاج إلى تبرير.','The main idea: someone in the right needs no excuses.');
V('infer','يقول أحمد: "أنا آخذ شهيقًا لمدة ثوان ثم أخرجه ببطء". يدل هذا السلوك على:','Ahmed says: “I breathe in for a few seconds and then breathe out slowly.” This shows:',['تحسين جودة الرئة.','طريقة التنفس الصحيحة.','يستعيد نشاط الرئة.','يقلل كمية الأكسجين في جسمه.'],['improving lung quality','the correct way of breathing','restoring lung activity','reducing oxygen in his body'],1,'أخذ الشهيق ثم إخراج الزفير ببطء هو طريقة التنفس الصحيحة.','Breathing in, then out slowly, is the correct way to breathe.');
V('infer','يُروى أن عبد الله بن عمر رضي الله عنهما آذاه رجل بالكلام، فقال ابن عمر دعاءً: "اللهم إن كان صادقًا فاغفرلي، وإن كان كاذبًا فاغفر له" فتعجب الناس من دعائه، يفهم من ذلك أنه:','It is told that a man insulted Abdullah ibn Umar, who prayed: “O God, if he is truthful, forgive me; and if he is lying, forgive him.” This shows that he:',['يريد معرفة هل الرجل صادق أم كاذب.','يخاف من مواجهة الرجل.','يتصف بالحلم والعفو وحُسن الخلق.','متردد في الحكم على الناس.'],['wanted to know if the man was truthful','was afraid of the man','was patient, forgiving and good-mannered','could not judge people'],2,'دعا لنفسه وللرجل بالمغفرة بدل الغضب، وهذا من الحلم والعفو.','He prayed for forgiveness instead of getting angry: patience and forgiveness.');
V('idio','"قيمة كلّ امرئ ما يُحسنه" يُفهم من المقولة السابقة أن:','“Each person’s worth is what he does well.” This means:',['قيمة الإنسان بما يقدم من مهارة وعمل.','قيمة الإنسان بماله فقط.','المهارة موروثة فقط.','الناس سواء في الإنجاز.'],['a person’s worth is in the skill and work he gives','a person’s worth is only his money','skills are only inherited','everyone achieves the same'],0,'قيمة الإنسان فيما يتقنه من علم وعمل.','A person is valued by what he does well.');

Q('meas','مبنى يتألف من ٣ طوابق، طول كل طابق ٣ أمتار، يُراد توصيل أسلاك من أسفل المبنى، بحيث يصل السلك لمنتصف كل طابق. كم إجمالي طول السلك؟','A building has 3 floors, each 3 m high. Wires run from the bottom of the building to the middle of each floor. What is the total length of wire?',['٩ م','١٠٫٥ م','١٣٫٥ م','١٥ م'],['9 m','10.5 m','13.5 m','15 m'],2,'منتصف الطابق الأول ١٫٥ م، والثاني ٣ + ١٫٥ = ٤٫٥ م، والثالث ٦ + ١٫٥ = ٧٫٥ م، والمجموع ١٣٫٥ م.','Middle of floor 1 = 1.5 m, floor 2 = 4.5 m, floor 3 = 7.5 m; total 13.5 m.');
Q('prob','تكلفة دخول شاحنة إلى نفق هي ٤٠ ريالًا، بينما تكلفة دخول السيارة الواحدة ٢٠ ريالًا. إذا دخلت شاحنة محملة بـ ٨ سيارات. فما التكلفة الكلية لعبور ذلك النفق لجميع المركبات؟','A lorry pays 40 riyals to enter a tunnel and each car pays 20 riyals. A lorry carrying 8 cars goes in. What is the total cost for all the vehicles?',['٢٠٠ ريال','٢٢٠ ريال','٢٨٠ ريال','٣٠٠ ريال'],['200 riyals','220 riyals','280 riyals','300 riyals'],0,'٤٠ + ٨ × ٢٠ = ٤٠ + ١٦٠ = ٢٠٠ ريال.','40 + 8 × 20 = 200 riyals.');
Q('patt','إذا كان اليوم هو الإثنين، فما اليوم بعد مضي ١٠٠٠ يوم من الآن؟','If today is Monday, what day will it be 1000 days from now?',['السبت','الأحد','الإثنين','الثلاثاء'],['Saturday','Sunday','Monday','Tuesday'],1,'١٠٠٠ ÷ ٧ = ١٤٢ والباقي ٦، وبعد ٦ أيام من الإثنين يكون الأحد.','1000 ÷ 7 = 142 remainder 6; 6 days after Monday is Sunday.');
Q('frac','احسب قيمة المقدار: (٧ + ٢/٤)(٦ − ٢/٥)(٨ − ١/٧)(١٠ + ٢/٣)','Work out: (7 + 2/4)(6 − 2/5)(8 − 1/7)(10 + 2/3)',['٧٥٢','١٥٤٠','٢١١٠','٣٥٢٠'],['752','1540','2110','3520'],3,'٧٫٥ × ٥٫٦ = ٤٢، ثم ٤٢ × ٥٥/٧ = ٣٣٠، ثم ٣٣٠ × ٣٢/٣ = ٣٥٢٠.','7.5 × 5.6 = 42; 42 × 55/7 = 330; 330 × 32/3 = 3520.');
Q('geo','في الشكل المجاور؛ أسطوانة دائرية قائمة طول نصف قطر قاعدتها ٥ سم، وارتفاعها ١٢ سم، قُسمت إلى نصفين متماثلين، ما محيط الشكل الظاهر بالوسط؟','A cylinder has radius 5 cm and height 12 cm. It is cut into two equal halves. What is the perimeter of the cut face in the middle?',['٢٤ سم','٣٠ سم','٤٤ سم','٥٤ سم'],['24 cm','30 cm','44 cm','54 cm'],2,'المقطع مستطيل بعداه القطر ١٠ سم والارتفاع ١٢ سم، ومحيطه ٢ × (١٠ + ١٢) = ٤٤ سم.','The cut face is a 10 cm × 12 cm rectangle: perimeter 2 × (10 + 12) = 44 cm.',{fig:cyl(true)},{fig:cyl(false)});
Q('area','في الشكل المجاور: دائرتان متطابقتان متماستان من الخارج، ومربع طول ضلعه ٤ سم، فما مساحة الجزء المظلل؟','Two equal circles touch each other, and the square between their centres has side 4 cm. What is the shaded area?',['١٦ − ط','١٦ − ٤ط','٤ − ١٦ط','٤ − ٤ط'],['16 − π','16 − 4π','4 − 16π','4 − 4π'],1,'نصف قطر كل دائرة ٢ سم. المظلل = مساحة المربع − نصفي دائرتين = ١٦ − ط × ٢² = ١٦ − ٤ط سم².','Each radius is 2 cm. Shaded = square − two half circles = 16 − π × 2² = 16 − 4π cm².',{fig:twoC(true)},{fig:twoC(false)});
Q('prob','مريض يحتاج ٣٢ جلسة علاج، ويأخذ ٤ جلسات يوميًا، فإذا بدأ جلسات العلاج يوم الأحد، ففي أي يوم ينتهي من جميع الجلسات؟','A patient needs 32 treatment sessions and has 4 a day. If he starts on Sunday, on which day does he finish?',['الأحد','الإثنين','الثلاثاء','الأربعاء'],['Sunday','Monday','Tuesday','Wednesday'],0,'٣٢ ÷ ٤ = ٨ أيام، أولها الأحد وثامنها الأحد التالي.','32 ÷ 4 = 8 days; day 1 is Sunday and day 8 is the next Sunday.');
Q('prob',PA+'كم ريالًا سيدفع أحمد إذا أراد شراء ١٤ تفاحة و ١٤ برتقالة؟',PAE+'How much will Ahmed pay for 14 apples and 14 oranges?',['٢٠','٢٤','٢٦','٢٨'],['20','24','26','28'],3,'عرضان من الأول (٨ تفاحات و ٦ برتقالات) مع عرض من الثالث (٦ تفاحات و ٨ برتقالات) = ١٤ تفاحة و ١٤ برتقالة، والسعر ٨ + ٨ + ١٢ = ٢٨ ريالًا.','Two of offer 1 (8 apples, 6 oranges) plus one of offer 3 (6 apples, 8 oranges) give 14 and 14, costing 8 + 8 + 12 = 28 riyals.',{fig:offers(true)},{fig:offers(false)},'off');
Q('prob',PA+'اشترى فهد ٣ مجموعات من العرض الأول، واشترى بندر مجموعة من العرض الثاني وأخرى من العرض الثالث، أيهما أفضل من حيث العدد والتكلفة؟',PAE+'Fahd bought 3 sets of offer 1; Bandar bought one set of offer 2 and one of offer 3. Whose deal is better for number and cost?',['بندر','فهد','متساويان','المعطيات غير كافية'],['Bandar','Fahd','the same','not enough information'],0,'فهد: ٢١ ثمرة بـ ٢٤ ريالًا. بندر: ٢٦ ثمرة بـ ٢٣ ريالًا، فهو أكثر عددًا وأقل تكلفة.','Fahd: 21 fruits for 24 riyals. Bandar: 26 fruits for 23 riyals: more fruit for less money.',{fig:offers(true)},{fig:offers(false)},'off');
Q('prob','يجلس رجل داخل قطار يسير بسرعة ٥٠ كم/س، ولاحظ مرور قطار بضائع يسير في الاتجاه المعاكس، وقد استغرق قطار البضائع ٩ ثوانٍ ليمر بالكامل بجوار الرجل، إذا كان طول قطار البضائع ٢٨٠م، فما سرعة قطار البضائع؟','A man sits in a train going at 50 km/h. A goods train passes in the opposite direction and takes 9 seconds to pass him completely. It is 280 m long. How fast is the goods train?',['٥٢ كم/س','٦٢ كم/س','٨٠ كم/س','٨٦ كم/س'],['52 km/h','62 km/h','80 km/h','86 km/h'],1,'السرعة النسبية = ٢٨٠ ÷ ٩ م/ث = ١١٢ كم/س، وهي مجموع السرعتين، فسرعة قطار البضائع = ١١٢ − ٥٠ = ٦٢ كم/س.','Relative speed = 280 m ÷ 9 s = 112 km/h, which is the sum of the speeds: 112 − 50 = 62 km/h.');
Q('ratio','تنظر سارة إلى صورة على هاتفها الذكي. النسبة بين بعديه هي ١٦ : ٩، والصورة تملأ الشاشة بالكامل. عندما تدير هاتفها الذكي، تصبح الصورة أصغر. ما نسبة الجزء من مساحة الشاشة الذي تشغله الصورة الأصغر؟','Sara looks at a picture that fills her 16 : 9 phone screen. When she turns the phone, the picture gets smaller. What fraction of the screen does the smaller picture fill?',['٣/٤','٩/١٦','٢٧/٦٤','٨١/٢٥٦'],['3/4','9/16','27/64','81/256'],3,'بعد التدوير يصبح عرض الصورة ٩ بدل ١٦، فتصغر بنسبة ٩/١٦ في الطول والعرض، ومساحتها (٩/١٦)² = ٨١/٢٥٦ من الشاشة.','After turning, the width shrinks from 16 to 9, so both sides scale by 9/16 and the area by (9/16)² = 81/256.');
Q('prob','يسير رجل داخل قطار بسرعة ١٥ كم/س عكس اتجاه حركة القطار، بينما كان القطار يسير بسرعة ٤٠٠ كم/س، لاحظ الرجل مرور قطار بضائع يسير في الاتجاه المعاكس لحركة القطار الأول وبسرعة ٢٠٠ كم/س، واستغرق مرور قطار البضائع بالكامل أمام الرجل ٦ ثوان. فما طول قطار البضائع؟','A man walks at 15 km/h towards the back of a train moving at 400 km/h. A goods train at 200 km/h passes in the opposite direction and takes 6 seconds to pass him. How long is the goods train?',['٨٠٠ م','٩٠٠ م','٩٧٥ م','١٠٢٥ م'],['800 m','900 m','975 m','1025 m'],2,'سرعة الرجل = ٤٠٠ − ١٥ = ٣٨٥ كم/س، والسرعة النسبية = ٣٨٥ + ٢٠٠ = ٥٨٥ كم/س = ١٦٢٫٥ م/ث، والطول = ١٦٢٫٥ × ٦ = ٩٧٥ م.','The man moves at 400 − 15 = 385 km/h; relative speed = 585 km/h = 162.5 m/s; length = 162.5 × 6 = 975 m.');
Q('geo','لدينا دائرة مركزها (م) وطول نصف قطرها ١٠ سم. تم رسم مربع م س ص ع داخل الدائرة، حيث ص هي نقطة على الدائرة. ما مساحة المثلث س ص ع؟','A circle has centre M and radius 10 cm. Square MXYZ is drawn inside it, with Y on the circle. What is the area of triangle XYZ?',['٢٥ سم²','٥٠ سم²','٧٥ سم²','١٠٠ سم²'],['25 cm²','50 cm²','75 cm²','100 cm²'],0,'قطر المربع م ص = نصف قطر الدائرة = ١٠ سم، فمساحة المربع = ١٠² ÷ ٢ = ٥٠ سم²، والمثلث نصف المربع = ٢٥ سم².','The square’s diagonal MY is a radius, 10 cm, so the square’s area is 10² ÷ 2 = 50 cm²; the triangle is half: 25 cm².',{fig:sqC(true)},{fig:sqC(false)});
Q('frac','أوجد قيمة المقدار: (١ − ١/٢)(١ − ١/٣)(١ − ١/٤)....(١ − ١/٩٩)','Work out (1 − 1/2)(1 − 1/3)(1 − 1/4)…(1 − 1/99)',['١/١٠','١/٩','١/٩٩','١٠٠/٩٩'],['1/10','1/9','1/99','100/99'],2,'المقدار = ١/٢ × ٢/٣ × ٣/٤ × ... × ٩٨/٩٩، فتختصر الأعداد ويبقى ١/٩٩.','= 1/2 × 2/3 × 3/4 × … × 98/99; everything cancels except 1/99.');
Q('nxt','ما القطعة من الخيارات التي تكمل النمط؟','Which piece completes the pattern?',[tileO('xq'),tileO('q'),tileO('dq'),tileO('x')],null,1,'المربعات تتبادل: مربع بداخله مربع صغير، ثم مربع بداخله مربع صغير وخطان متقاطعان. الجزء الناقص يأتي بعد قطعة فيها الخطان، فهو مربع صغير فقط.','The tiles alternate between a small square and a small square with a cross. The missing tile comes after a crossed tile, so it is the plain small square.',{figOpts:true,fig:tiles()});
Q('alg','إذا كانت: س + ص = ٢ ، ص + ع = ٤ ، ع + ل = ٩، ل + هـ = ١٧ ، هـ + و = ٢٢ فما قيمة س + و ؟','If x + y = 2, y + z = 4, z + l = 9, l + h = 17 and h + w = 22, what is x + w?',['١٢','١٤','١٥','١٨'],['12','14','15','18'],0,'(س + ص) − (ص + ع) + (ع + ل) − (ل + هـ) + (هـ + و) = س + و = ٢ − ٤ + ٩ − ١٧ + ٢٢ = ١٢.','(x+y) − (y+z) + (z+l) − (l+h) + (h+w) = x + w = 2 − 4 + 9 − 17 + 22 = 12.');
Q('ratio','يوجد صندوقان: كتلة الأول ١ كجم، وكتلة الثاني ٤ كجم. فما النسبة بين كتلة الصندوق الأول إلى الثاني؟','Box 1 has a mass of 1 kg and box 2 has 4 kg. What is the ratio of box 1 to box 2?',['٠٫٢٠','٠٫٢٥','٠٫٣٣','٠٫٧٥'],['0.20','0.25','0.33','0.75'],1,'١ ÷ ٤ = ٠٫٢٥','1 ÷ 4 = 0.25');
Q('exp','إذا كان: ٥^(س+٢) = ٧٥ ، فما قيمة ٥^(٣س) ؟','If 5^(x+2) = 75, what is 5^(3x)?',['١٨','٢٧','٦٣','٨١'],['18','27','63','81'],1,'٥^(س+٢) = ٥^س × ٢٥ = ٧٥، إذن ٥^س = ٣، و ٥^(٣س) = ٣³ = ٢٧.','5^(x+2) = 25 × 5^x = 75, so 5^x = 3 and 5^(3x) = 3³ = 27.');
Q('prob','إذا كانت العاملة تستغرق ١٥ دقيقة لتنظيف الغرفة الواحدة، و ١٠ دقائق لتنظيف المطبخ، ويوجد ٧ غرف، واستراحت ٥ دقائق أثناء التنظيف، فمتى تنتهي من العمل إذا بدأت الساعة السادسة؟','A cleaner takes 15 minutes per room and 10 minutes for the kitchen. There are 7 rooms, and she rests for 5 minutes. If she starts at 6:00, when does she finish?',['٧:٤٠','٧:٥٠','٨:٠٠','٨:١٠'],['7:40','7:50','8:00','8:10'],2,'٧ × ١٥ + ١٠ + ٥ = ١٢٠ دقيقة = ساعتان، فتنتهي الساعة ٨:٠٠.','7 × 15 + 10 + 5 = 120 minutes = 2 hours, so she finishes at 8:00.');
Q('frac','في الشكل؛ ٥ مربعات متطابقة، ومستطيل مقسم إلى ٤ أجزاء متطابقة (علمًا بأن مساحة المستطيل نصف مساحة المربع). أوجد نسبة الجزء المظلل إلى الشكل كله.','The picture has 5 equal squares and a rectangle split into 4 equal parts (the rectangle is half a square). What fraction of the whole picture is shaded?',['١/٧','١/٦','١/٥','١/٤'],['1/7','1/6','1/5','1/4'],3,'لو جزء المستطيل = ١، فالمستطيل = ٤ والمربع = ٨، والشكل كله = ٥ × ٨ + ٤ = ٤٤. المظلل = مربع + ٣ أجزاء = ٨ + ٣ = ١١، والنسبة ١١/٤٤ = ١/٤.','Let one rectangle part = 1: rectangle = 4, square = 8, whole = 5 × 8 + 4 = 44. Shaded = one square + 3 parts = 11, and 11/44 = 1/4.',{fig:sq5});
Q('stat','في هذا المربع، جميع الصفوف والأعمدة لها المجموع نفسه. أوجد المتوسط للقيم س ، ص ، ع ، ل.','In this square every row and column has the same total. Find the mean of x, y, z and l.',['٧','٨','٩','١١'],['7','8','9','11'],0,'العمود الأوسط: ١١ + ٥ + ٧ = ٢٣، فكل صف مجموعه ٢٣. الصف الأول: س + ص = ١٢، والأخير: ع + ل = ١٦، والمجموع ٢٨، والمتوسط ٢٨ ÷ ٤ = ٧.','Middle column: 11 + 5 + 7 = 23. Top row: x + y = 12; bottom row: z + l = 16; total 28, mean 28 ÷ 4 = 7.',{fig:magic(true)},{fig:magic(false)});
Q('alg','ما العدد الذي إذا أضفت إليه نصفه وربعه كان الناتج ١٤٠٠؟','Which number, added to its half and its quarter, gives 1400?',['٦٠٠','٧٠٠','٨٠٠','٩٠٠'],['600','700','800','900'],2,'العدد + نصفه + ربعه = ١٫٧٥ × العدد = ١٤٠٠، فالعدد ٨٠٠.','1.75 × the number = 1400, so the number is 800.');
Q('prob','يحتوي منزل على ٣ غرف، وكل غرفة لها ٤ جدران، والجدار الواحد يحتاج ٣٠ بلاطة، فما العدد الكلي للبلاطات اللازمة للمنزل؟','A house has 3 rooms, each room has 4 walls, and each wall needs 30 tiles. How many tiles are needed?',['٢٨٠','٣٠٠','٣٢٠','٣٦٠'],['280','300','320','360'],3,'٣ × ٤ × ٣٠ = ٣٦٠ بلاطة.','3 × 4 × 30 = 360 tiles.');
Q('alg','إذا كانت: س + ص = ١ ، ص + ع = ٤ ، ع + ك = ٩ ، ك + م = ١٦ فما قيمة م − س ؟','If x + y = 1, y + z = 4, z + k = 9 and k + m = 16, what is m − x?',['٨','١٠','١٢','١٣'],['8','10','12','13'],1,'(ك + م) − (ع + ك) + (ص + ع) − (س + ص) = م − س = ١٦ − ٩ + ٤ − ١ = ١٠.','(k+m) − (z+k) + (y+z) − (x+y) = m − x = 16 − 9 + 4 − 1 = 10.');
Q('alg','إذا كانت س ، ص ، ع، ثلاثة أعداد متتالية مجموعها ٢١، فما قيمة س + ع ؟','x, y and z are three consecutive numbers adding up to 21. What is x + z?',['١٢','١٣','١٤','١٦'],['12','13','14','16'],2,'الأعداد ٦ و ٧ و ٨، فـ س + ع = ٦ + ٨ = ١٤.','The numbers are 6, 7, 8, so x + z = 14.');
Q('frac','في الشكل؛ مستطيل مقسم إلى مربعات صغيرة متطابقة. ما نسبة الجزء المظلل؟','The rectangle is split into equal small squares. What fraction is shaded?',['١٢/٥٠','١٨/٥٠','١١/٤٠','١٢/٤٠'],['12/50','18/50','11/40','12/40'],3,'المستطيل ٨ × ٥ = ٤٠ مربعًا، ومساحة الشكل المظلل (بعد جمع المربعات الكاملة وأنصاف المربعات) = ١٢ مربعًا، فالنسبة ١٢/٤٠.','The rectangle has 8 × 5 = 40 squares, and the shaded shape covers 12 squares (adding whole and half squares), so 12/40.',{fig:gridQ});
Q('patt','إشارة تومض مرة واحدة في الساعة الأولى، ومرتين في الساعة الثانية، وثلاث مرات في الساعة الثالثة، وهكذا... فإذا أحصت هند ٢٤ ومضة، ففي أي ساعة بدأت العد؟','A light flashes once in hour 1, twice in hour 2, three times in hour 3, and so on. Hind counted 24 flashes. In which hour did she start counting?',['٥','٦','٧','٨'],['5','6','7','8'],2,'٧ + ٨ + ٩ = ٢٤، فبدأت العد في الساعة السابعة.','7 + 8 + 9 = 24, so she started in hour 7.');
Q('patt','شخص لديه أربعة أحذية: حمراء – زرقاء – خضراء – صفراء، يلبسها بالترتيب نفسه، ما لون الحذاء الذي يرتديه في اليوم ٢٨؟','A man has four pairs of shoes: red, blue, green, yellow, worn in that order. Which colour does he wear on day 28?',['أحمر','أزرق','أخضر','أصفر'],['red','blue','green','yellow'],3,'٢٨ ÷ ٤ = ٧ بلا باقٍ، فيكون اليوم الأخير في الدورة: الأصفر.','28 ÷ 4 = 7 with no remainder, so it is the last colour: yellow.');
Q('age','أحمد مولود في شهر شوال هذا العام، وخالد وُلد بعد أحمد بـ ٧ أشهر، بينما وُلد فهد قبل أحمد بسنتين، أما مازن فوُلد بعد خالد بسنة واحدة. فمن الأكبر سنًا؟','Ahmed was born in Shawwal this year. Khaled was born 7 months after Ahmed, Fahd 2 years before Ahmed, and Mazen 1 year after Khaled. Who is the oldest?',['أحمد','فهد','خالد','مازن'],['Ahmed','Fahd','Khaled','Mazen'],1,'فهد وُلد قبل الجميع (قبل أحمد بسنتين)، فهو الأكبر.','Fahd was born first (2 years before Ahmed), so he is the oldest.');
Q('ratio','في الغابة اصطادت ٥ ثعالب ٥ أرانب خلال ٥ دقائق، فكم دقيقة يحتاج ثعلب واحد لاصطياد أرنب واحد؟','In a forest, 5 foxes caught 5 rabbits in 5 minutes. How many minutes does one fox need to catch one rabbit?',['١','٣','٤','٥'],['1','3','4','5'],3,'كل ثعلب اصطاد أرنبًا واحدًا في ٥ دقائق.','Each fox caught one rabbit in the 5 minutes.');
Q('patt','أوجد الحد ٩٩ من المتتابعة: ٣٥، ٤٠، ٤٥، ٥٠، ٥٥ ، .......','Find the 99th term: 35, 40, 45, 50, 55, …',['٤٧٥','٥٠٥','٥٢٥','٥٧٥'],['475','505','525','575'],2,'الحد = ٣٥ + ٥ × (٩٩ − ١) = ٣٥ + ٤٩٠ = ٥٢٥.','Term = 35 + 5 × 98 = 525.');
Q('patt','أوجد الحد التالي في النمط: ٢، ٥، ١١، ٢٣ ، ٤٧ ، .......','Find the next term: 2, 5, 11, 23, 47, …',['٩٥','٨٣','٧٢','٦٠'],['95','83','72','60'],0,'كل حد = الحد السابق × ٢ + ١: ٤٧ × ٢ + ١ = ٩٥.','Each term = previous × 2 + 1: 47 × 2 + 1 = 95.');
Q('ratio','آلة قهوة تصنع ١٢ كوبًا خلال ساعة واحدة، فكم آلة نحتاج لصنع ١٠ أكواب خلال ١٠ دقائق؟','A coffee machine makes 12 cups an hour. How many machines are needed to make 10 cups in 10 minutes?',['٥','٦','٧','٨'],['5','6','7','8'],0,'الآلة الواحدة تصنع كوبين كل ١٠ دقائق، فنحتاج ١٠ ÷ ٢ = ٥ آلات.','One machine makes 2 cups in 10 minutes, so 10 ÷ 2 = 5 machines.');
Q('prob','تحتاج عملية تفريغ مسبح إلى ٦ ساعات، إذا تم توقيف عملية التفريغ بعد تفريغ نصف المسبح عند الساعة ١١ صباحًا، ثم بدأ تفريغ النصف المتبقي عند الساعة ٥:٣٠ مساءً، فكم استغرق الزمن بين العمليتين؟','Emptying a pool takes 6 hours. It was stopped at 11 a.m. after half was emptied, and the other half was started at 5:30 p.m. How long was the gap between the two?',['٥ ساعات','٥ ساعات ونصف','٦ ساعات','٦ ساعات ونصف'],['5 hours','5½ hours','6 hours','6½ hours'],3,'من ١١ صباحًا إلى ٥:٣٠ مساءً = ٦ ساعات ونصف.','From 11 a.m. to 5:30 p.m. is 6½ hours.');
Q('prob','صرف شخص نصف راتبه، ثم صرف ١٠٠٠ ريال، ثم صرف نصف الباقي، وتبقى معه ٥٠٠ ريال، كم ريالًا راتب هذا الشخص؟','A man spent half his salary, then 1000 riyals, then half of what was left, and had 500 riyals left. What is his salary?',['٣٠٠٠','٣٥٠٠','٤٠٠٠','٦٠٠٠'],['3000','3500','4000','6000'],2,'نعمل عكسيًا: قبل صرف النصف الأخير كان معه ١٠٠٠، وقبل صرف ١٠٠٠ كان معه ٢٠٠٠، وهذا نصف الراتب، فالراتب ٤٠٠٠ ريال.','Work backwards: 1000 before the last half, 2000 before spending 1000; that was half the salary, so the salary is 4000.');
Q('exp','إذا كانت: ٩^س = ٧ ، ٧^ص = ٩ ، فإن س ص = .......','If 9^x = 7 and 7^y = 9, then xy = ……',['١','٧ + ٩','٦٣','٨١'],['1','7 + 9','63','81'],0,'٩^(س ص) = (٩^س)^ص = ٧^ص = ٩، إذن س ص = ١.','9^(xy) = (9^x)^y = 7^y = 9, so xy = 1.');
Q('alg','إذا كانت: س + ص = ١ ، ص + ل = ٩ ، ل + ع = ١٥، ع + و = ٢٥ ، فما قيمة (ل − س) + (و − ل) ؟','If x + y = 1, y + l = 9, l + z = 15 and z + w = 25, what is (l − x) + (w − l)?',['١٢','١٤','١٦','١٨'],['12','14','16','18'],3,'ل − س = (ص + ل) − (س + ص) = ٨، و و − ل = (ع + و) − (ل + ع) = ١٠، والمجموع ١٨.','l − x = 9 − 1 = 8 and w − l = 25 − 15 = 10; total 18.');
Q('area','في الشكل المجاور؛ مربع طول ضلعه ٤ سم، بداخله ٤ دوائر متطابقة ومتماسة من الخارج، فما مساحة الجزء المظلل؟','A 4 cm square holds 4 equal touching circles. What is the shaded area?',['١٦ − ٤ط','٤ط − ١٦','٣١٤','١٦ط'],['16 − 4π','4π − 16','314','16π'],0,'نصف قطر كل دائرة ١ سم، ومساحة الدوائر ٤ × ط = ٤ط، والمظلل ١٦ − ٤ط سم².','Each radius is 1 cm; the circles cover 4π, so the shaded area is 16 − 4π cm².',{fig:circ4b(true)},{fig:circ4b(false)});
Q('geo','مستطيل بعداه ٦٤ سم ، ٤٨ سم، ما أقل عدد من المربعات اللازمة لملء هذا المستطيل؟','A rectangle is 64 cm by 48 cm. What is the least number of equal squares that fill it?',['٨','١٢','١٦','٢٤'],['8','12','16','24'],1,'أكبر مربع يقسم البعدين ضلعه ١٦ سم (العامل المشترك الأكبر)، فالعدد = ٤ × ٣ = ١٢ مربعًا.','The biggest square that fits both sides has side 16 cm (their HCF), giving 4 × 3 = 12 squares.');
Q('geo','قطعت طائرة مسافة ٣٠٠ كلم من المدينة A إلى B، وقطعت مسافة ٤٠٠ كلم من B إلى C، ولكي ترجع أخذ مسافة ١٥٠ كلم من C إلى A فما شكل المثلث الذي يعبر عن رحلة الطائرة؟','A plane flew 300 km from A to B, 400 km from B to C, and 150 km back from C to A. Which triangle shows the trip?',[triO('a'),triO('b'),triO('c'),triO('d')],null,1,'الأضلاع مختلفة الأطوال، و ١٥٠² + ٣٠٠² أقل من ٤٠٠²، فالمثلث مختلف الأضلاع منفرج الزاوية (ب).','The sides are all different, and 150² + 300² is less than 400², so the triangle is scalene with an obtuse angle (B).',{figOpts:true});
Q('meas','لدى نجار قطع خشبية بأطوال ١ م ، ٢ م ، ٣ م ، ٥ م ، ويسمح له باستخدام قطعتين فقط في كل عملية قياس، أي الأطوال التالية لا يمكن تكوينه؟','A carpenter has wooden pieces of 1 m, 2 m, 3 m and 5 m and may use only two pieces for each measurement. Which length can he not make?',['٤ م','٦ م','٧ م','٩ م'],['4 m','6 m','7 m','9 m'],3,'٤ = ١ + ٣ ، ٦ = ١ + ٥ ، ٧ = ٢ + ٥، أما ٩ فأكبر من مجموع أي قطعتين (٥ + ٣ = ٨).','4 = 1 + 3, 6 = 1 + 5, 7 = 2 + 5, but 9 is more than any two pieces (5 + 3 = 8).');
Q('rank','إذا كان فهد يقف في طابور، ويوجد أمامه ٤ أشخاص، بينما يقف سعد في الأمام وعمر في الخلف. فما أقل عدد يمكن أن يتكون منه الطابور؟','Fahd stands in a queue with 4 people in front of him. Saad is at the front and Omar is at the back. What is the smallest possible number of people in the queue?',['٤','٥','٦','٧'],['4','5','6','7'],2,'الأربعة أمام فهد (ومنهم سعد) + فهد + عمر في الخلف = ٦ أشخاص.','The 4 in front (including Saad) + Fahd + Omar at the back = 6.');
Q('geo','يسير سالم ٥ أمتار في اتجاه الشرق، ثم ١٢ مترًا شمالًا، فما أقصر مسافة حتى يعود لنقطة البداية؟','Salem walks 5 m east, then 12 m north. What is the shortest distance back to the start?',['٨ م','١٠ م','١٢ م','١٣ م'],['8 m','10 m','12 m','13 m'],3,'المسافة = √(٥² + ١٢²) = √١٦٩ = ١٣ م.','Distance = √(5² + 12²) = √169 = 13 m.');
Q('geo','اقترحت شركة تصميم تطبيق لها على الشكل المجاور؛ عبارة عن أنصاف دوائر مختلفة الطول. فما محيط الشكل؟','A company designed its app logo from half circles of different sizes. What is the perimeter of the shape?',['٤ ط سم','٣ ط سم','٢ ط سم','ط سم'],['4π cm','3π cm','2π cm','π cm'],1,'نصف دائرة قطرها ٣: ٣ط/٢، ونصف دائرة قطرها ٢: ط، ونصف دائرة قطرها ١: ط/٢، والمجموع ٣ط سم.','Half circles with diameters 3, 2 and 1: 3π/2 + π + π/2 = 3π cm.',{fig:yin(true)},{fig:yin(false)});

C('phy','أمامك ثلاث أنابيب شعرية لها الطول نفسه، لكنها تختلف في القطر الداخلي كما في الشكل. إذا وضعت الأنابيب في الماء، ففي أي أنبوب يرتفع فيه الماء أولًا؟','Three capillary tubes have the same length but different inside widths. They are put in water. In which tube does water rise first?',['١','٢','٣','جميعهم معًا'],['1','2','3','all together'],0,'كلما ضاق قطر الأنبوب الشعري زادت الخاصية الشعرية وارتفع الماء أسرع، والأنبوب (١) هو الأضيق.','The narrower the tube, the stronger the capillary action; tube 1 is the narrowest.',{fig:caps(true)},{fig:caps(false)});

C('gear','في الشكل؛ إذا كان محيط الترس الدائري يساوي نصف طول الترس المستقيم، إذا دار الترس الدائري ثلاث دورات مع عقارب الساعة، فماذا سيحدث للترس المستقيم (أ)؟','The round gear’s circumference is half the length of the straight rack. If the round gear turns 3 times clockwise, what happens to rack (a)?',['سيخرج كاملًا','يخرج ثلثه','تظل ثابتة','لن تسقط'],['it comes out completely','a third comes out','it stays still','it will not fall'],0,'كل دورة تحرك الترس المستقيم مسافة تساوي محيط الترس الدائري (نصف طوله)، فدورتان تخرجانه كاملًا، وبثلاث دورات يخرج كاملًا.','Each turn moves the rack by the gear’s circumference (half its length), so 2 turns already push it out completely; with 3 it is fully out.',{fig:rack(true)},{fig:rack(false)});
C('phy','في الشكل؛ ثقل معلق رأسيًا بواسطة حبلين أفقيين بينهما أربعة حبال رأسية، فإن أكبر قوة شد تكون في ........','A weight hangs from two horizontal ropes joined by four vertical ropes. The greatest pull is in ........',['الحبل (١)','الحبل (٢)','الحبل (٣)','الحبل (٤)'],['rope 1','rope 2','rope 3','rope 4'],0,'الثقل معلق أقرب إلى الحبل (١)، فيتحمل الحبل الأقرب إلى نقطة التعليق الجزء الأكبر من الثقل.','The weight hangs closest to rope 1, so that rope carries most of the load.',{fig:ropes(true)},{fig:ropes(false)});
C('phy','مرآة كروية الشكل تنظر فيها إلى نفسك، كيف سيظهر شكلك؟','You look at yourself in a ball-shaped mirror. How will you look?',['مقلوب ومكبر','مقلوب ومصغر','معتدل ومصغر','معتدل ومكبر'],['upside down and bigger','upside down and smaller','upright and smaller','upright and bigger'],2,'سطح الكرة الخارجي مرآة محدبة، صورتها معتدلة ومصغرة دائمًا.','The outside of a ball is a convex mirror: always upright and smaller.');
C('phy','لماذا يكون الصاروخ مائلًا عند الانطلاق؟','Why does a rocket tilt as it takes off?',['بسبب نقصان الضغط.','بسبب كروية الأرض.','بسبب تأثير درجة الحرارة.','لاكتساب سرعة.'],['because the pressure drops','because the Earth is round','because of temperature','to gain speed'],3,'يميل الصاروخ تدريجيًا ليكتسب سرعة أفقية كافية للدخول في المدار.','The rocket tilts to build up the sideways speed it needs to reach orbit.',{fig:yEI('🚀')});
C('gear','إذا كان الترس الأول له ٥٠ سنًا، دار دورة كاملة، فكم دورة يدورها الترس الثاني الذي له ٣٢ سنًا؟','Gear 1 has 50 teeth and turns once. How many turns does gear 2, with 32 teeth, make?',['١٫٠٩','١٫٤','١٫٥٦','٢٫٨٨'],['1.09','1.4','1.56','2.88'],2,'٥٠ ÷ ٣٢ ≈ ١٫٥٦ دورة.','50 ÷ 32 ≈ 1.56 turns.',{fig:gearsN(true)},{fig:gearsN(false)});
C('bio','يُعرف "المصل": على أنه مادة تحتوي أجسامًا مضادة جاهزة تستخدم لـ ......','A “serum” is a substance with ready-made antibodies, used for ......',['الوقاية فقط','العلاج','قبل المرض','تخفيف الألم'],['prevention only','treatment','before illness','easing pain'],1,'المصل يعطي الجسم أجسامًا مضادة جاهزة لعلاج المرض، أما اللقاح فللوقاية.','A serum gives ready antibodies to treat an illness; a vaccine is for prevention.');
C('bio','أي مما يلي يُعد دليلًا على استعمال بعض الفطريات كمضاد حيوي؟','Which shows that some fungi are used as antibiotics?',['الفطريات تُسرّع نمو البكتيريا.','الفطريات والبكتيريا ينموان معًا.','الفطريات لا تنمو مع البكتيريا.','الفطريات تُبطئ نمو البكتيريا.'],['fungi speed up bacteria growth','fungi and bacteria grow together','fungi do not grow with bacteria','fungi slow down bacteria growth'],3,'المضاد الحيوي يوقف نمو البكتيريا أو يبطئه، مثل فطر البنسيليوم.','An antibiotic stops or slows bacteria, as penicillium mould does.');
C('chem','أراد حسين ملء بالون ليحلق في الهواء لأطول مدة ممكنة مع مراعاة عامل الأمان. أي الغازات الآتية يُعد الخيار الأفضل؟','Hussein wants a balloon to stay up as long as possible, safely. Which gas is best?',['الهيدروجين','الهيليوم','الأكسجين','ثاني أكسيد الكربون'],['hydrogen','helium','oxygen','carbon dioxide'],1,'الهيليوم أخف من الهواء وغير قابل للاشتعال، أما الهيدروجين فقابل للاشتعال.','Helium is lighter than air and does not burn; hydrogen catches fire.');
C('phy','من الشكل، أي هذه العربات يكون قصورها الذاتي هو الأكبر؟','Which cart has the greatest inertia?',['العربة (١) فقط','العربة (٢) فقط.','العربة (٤) فقط.','العربتان (١) و (٢)'],['cart 1 only','cart 2 only','cart 4 only','carts 1 and 2'],0,'القصور الذاتي يعتمد على الكتلة، والعربة (١) هي الأكبر كتلة (٤ كجم).','Inertia depends on mass; cart 1 has the largest mass (4 kg).',{fig:carts(true)},{fig:carts(false)},'cart');
C('phy','من الشكل، أيُّ هذه العربات تستغرق وقتًا أقل للتوقف (بفرض التأثير بنفس قوة الكبح)؟','Which carts take the least time to stop (same braking force)?',['العربة (١) فقط','العربة (٢) فقط.','العربة (٤) فقط.','العربتان (١) و (٤)'],['cart 1 only','cart 2 only','cart 4 only','carts 1 and 4'],3,'زمن التوقف يعتمد على كمية التحرك (الكتلة × السرعة): العربة ١ = ٤ × ١ = ٤، والعربة ٤ = ١ × ٤ = ٤، وهما الأقل (العربة ٢ = ٤٫٥ والعربة ٣ = ٦).','Stopping time depends on momentum (mass × speed): cart 1 = 4 and cart 4 = 4 are the smallest (cart 2 = 4.5, cart 3 = 6).',{fig:carts(true)},{fig:carts(false)},'cart');
C('phy','مركبتان (١)، (٢) تتحركان بقوة متساوية وفي اتجاهين متعاكسين نحو بعضهما. المسافة بين كل مركبة والجدار المقابل لها متساوية. بعد اصطدامهما وارتدادهما، أيهما يصدم الجدار أولًا؟','Vehicles 1 (a heavy lorry) and 2 (a small car) push on each other with equal force when they crash. Each is the same distance from the wall behind it. After bouncing apart, which hits a wall first?',['المركبة (١).','المركبة (٢).','تصلان معًا في نفس اللحظة.','لا تصل أي من المركبتين إلى الجدار.'],['vehicle 1','vehicle 2','both at the same time','neither reaches a wall'],1,'القوة متساوية، والمركبة (٢) أقل كتلة فتكتسب تسارعًا وسرعة ارتداد أكبر، فتصل إلى الجدار أولًا.','With equal force, the lighter vehicle 2 gets a bigger acceleration and bounces back faster, so it reaches its wall first.',{fig:crash(true,true)},{fig:crash(false,true)});
C('phy','مركبتان (١)، (٢) تتحركان بقوة متساوية وفي اتجاهين متعاكسين نحو بعضهما. إذا كانت كتلة المركبة (١) تساوي ثلاثة أمثال كتلة المركبة (٢)، وأثرت عليهما نفس قوة التصادم، فاحسب نسبة تسارع المركبة (٢) إلى تسارع المركبة (١) أثناء التصادم.','Vehicle 1 has three times the mass of vehicle 2, and both feel the same crash force. What is the ratio of vehicle 2’s acceleration to vehicle 1’s?',['١ : ٣','٣ : ١','١ : ١','١ : ٩'],['1 : 3','3 : 1','1 : 1','1 : 9'],1,'التسارع = القوة ÷ الكتلة، فالمركبة الأخف تتسارع ثلاثة أضعاف: ٣ : ١.','Acceleration = force ÷ mass, so the lighter vehicle accelerates 3 times as much: 3 : 1.',{fig:crash(true,false)},{fig:crash(false,false)});
C('phy','ثلاث مصابيح متصلة على التوازي مع مصدر كهربائي له مقاومة داخلية غير مهملة. إذا احترقت فتيلة أحد المصابيح، ماذا يحدث لإضاءة المصباحين الآخرين؟','Three bulbs are in parallel with a source that has some internal resistance. If one bulb burns out, what happens to the other two?',['تزداد الإضاءة','تقل الإضاءة','تظل ثابتة','تنطفئ تمامًا'],['they get brighter','they get dimmer','they stay the same','they go out'],0,'يقل التيار الكلي فيقل الهبوط في الجهد داخل المصدر، فيزداد الجهد على المصباحين وتزداد إضاءتهما قليلًا.','Less total current means less voltage lost inside the source, so the two bulbs get a little more voltage and glow brighter.');
C('phy','في الدائرة الكهربية الموضحة، كيف يمكن زيادة شدة إضاءة المصباح الأزرق عند غلق الدائرة؟','In this circuit, how can the blue bulb be made brighter when the switch is closed?',['توصيل مصباح ثالث على التوازي مع المصباحين.','فصل المصباح الأصفر من الدائرة.','زيادة طول الأسلاك الموصلة للمصباح الأزرق.','عدم إجراء أي تغيير على الدائرة.'],['add a third bulb in parallel','remove the yellow bulb','use longer wires to the blue bulb','change nothing'],1,'فصل المصباح الأصفر يقلل التيار المسحوب من البطارية، فيزداد الجهد المتاح للمصباح الأزرق.','Removing the yellow bulb lowers the current drawn from the battery, so the blue bulb gets more voltage.',{fig:circ2});
C('phy','مصباحان متصلان على التوالي مع بطارية. إذا أُعيد توصيل المصباحان على التوازي مع نفس المصدر. ما نسبة القدرة المستهلكة في الحالة الأولى إلى الحالة الثانية؟','Two bulbs are in series with a battery, then reconnected in parallel to the same battery. What is the ratio of the power used in the first case to the second?',['١ : ٤','٤ : ١','١ : ٢','١ : ١'],['1 : 4','4 : 1','1 : 2','1 : 1'],0,'على التوالي المقاومة الكلية ٢م، وعلى التوازي م/٢، والقدرة = ج²/م، فالنسبة (١/٢م) : (٢/م) = ١ : ٤.','In series the resistance is 2R; in parallel R/2. Power = V²/R, so the ratio is 1/(2R) : 2/R = 1 : 4.');
C('chem','ما هو وجه القصور عند محاولة تمثيل جزيء البنزين العطري (C₆H₆) بنموذج الكرات والعصا التقليدي؟','What is the weakness of showing a benzene molecule (C₆H₆) with the usual ball-and-stick model?',['إظهار حلقة سداسية','عدم تحديد القطبية','ثبات الروابط البديلة','إخفاء ذرات الهيدروجين'],['showing a six-sided ring','not showing polarity','the alternating bonds look fixed','hiding the hydrogen atoms'],2,'الروابط في البنزين متساوية والإلكترونات موزعة على الحلقة، والنموذج يظهرها روابط أحادية وثنائية ثابتة.','Benzene’s bonds are all equal with shared electrons, but the model shows fixed single and double bonds.');
C('chem','يمثل الشكل المجاور نموذجًا لأحد الجزيئات الكيميائية الشهيرة. ما الذي تشير إليه الكرات الزرقاء في هذا النموذج؟','The picture models a well-known molecule. What do the blue balls stand for?',['روابط تساهمية أحادية.','ذرات هيدروجين.','روابط أيونية.','إلكترونات حرّة غير مرتبطة.'],['single covalent bonds','hydrogen atoms','ionic bonds','free electrons'],1,'النموذج لجزيء الماء: كرة الأكسجين الحمراء ترتبط بذرتي هيدروجين (الزرقاء).','It is a water molecule: the red oxygen ball joined to two hydrogen atoms (blue).',{fig:water});
C('chem','في الشكل المجاور، ماذا تمثل الخطوط (أو العصي) الرمادية التي تربط بين الكرات؟','In the picture, what do the grey sticks joining the balls show?',['روابط أيونية','روابط تساهمية','الإلكترونات المفقودة','سحابة إلكترونية'],['ionic bonds','covalent bonds','lost electrons','an electron cloud'],1,'العصي في نموذج الكرات والعصا تمثل الروابط التساهمية بين الذرات.','In a ball-and-stick model the sticks are covalent bonds.',{fig:co2});
C('phy','يمثل الشكل أربع كرات مصمتة مصنوعة من مواد مختلفة النوعية والصلابة. سقطت الكرات الأربع سقوطًا حرًا من نفس الارتفاع نحو سطح أفقي صلب، إذا كان السهم الأحمر الصاعد يمثل ارتفاع الارتداد الذي وصلت إليه كل كرة بعد التصادم مباشرةً، فأي الكرات تُعد الأكثر صلابة ومرونة؟','Four solid balls of different materials fall from the same height onto a hard floor. The red arrows show how high each bounces. Which ball is the hardest and most elastic?',['الكرة (١)','الكرة (٢)','الكرة (٣)','الكرة (٤)'],['ball 1','ball 2','ball 3','ball 4'],0,'الكرة الأكثر صلابة ومرونة تفقد أقل طاقة فترتد أعلى، والكرة (١) ارتدادها هو الأعلى.','The hardest, most elastic ball loses least energy and bounces highest: ball 1.',{fig:balls(true)},{fig:balls(false)});
C('phy','سقطت كرة كتلتها ٥ كجم من أعلى برج ارتفاعه ٢٠ مترًا فإن سرعة الكرة لحظة وصولها لسطح الأرض تساوي ........ م/ث. (بفرض أن عجلة الجاذبية الأرضية تساوى ١٠ م/ث²)','A 5 kg ball falls from a 20 m tower. What is its speed when it hits the ground (g = 10 m/s²)?',['١٠','٢٠','٤٠','١٠٠'],['10','20','40','100'],1,'ع² = ٢ × ١٠ × ٢٠ = ٤٠٠، فالسرعة ٢٠ م/ث.','v² = 2 × 10 × 20 = 400, so v = 20 m/s.');
C('phy','مكعب مصمت نصفه خشب ونصفه حديد يطفو في سائل باتزان مستقر بحيث يكون الخشب لأعلى. إذا قُلب يدويًا تحت الماء ليصبح الحديد لأعلى ثم تُرك حرًا، ماذا يحدث؟','A solid cube, half wood and half iron, floats steadily with the wood on top. It is turned over by hand so the iron is on top, then let go. What happens?',['يظل ثابتًا في الوضع الجديد.','يدور تلقائيًا ليعود لوضعه الأصلي.','يغوص للقاع مباشرة.','يتفتت إلى نصفين.'],['it stays in the new position','it turns back by itself','it sinks straight away','it breaks in half'],1,'مركز الثقل يكون في جهة الحديد، والاتزان المستقر عندما يكون مركز الثقل في الأسفل، فيدور المكعب ليعود الحديد إلى أسفل.','The centre of gravity is on the iron side; it is stable only when that is low, so the cube turns back.');
C('phy','لماذا يضع المهندسون المحركات والمعدات الثقيلة في قاع السفينة وغرف الركاب والهياكل الخفيفة في الأعلى عند تصميم السفن والناقلات البحرية الضخمة؟','Why do engineers put engines and heavy equipment at the bottom of a ship and cabins and light parts on top?',['لزيادة مساحة السطح الملامس للماء.','لخفض مركز ثقل السفينة قدر الإمكان.','لتقليل قوة الطفو المؤثرة على السفينة.','لزيادة سرعة السفينة أثناء الحركة الأمامية.'],['to touch more water','to keep the centre of gravity as low as possible','to reduce buoyancy','to make the ship faster'],1,'خفض مركز الثقل يجعل السفينة أكثر اتزانًا ويمنع انقلابها.','A low centre of gravity keeps the ship stable and stops it rolling over.');
C('phy','كيف تعدل توزيع الكتل والخامات داخل مكعب مصمت مغمور كليًا في سائل متجانس ليكون في اتزان متعادل؟ (بمعنى أنه إذا قمت بتحريكه لأي زاوية يثبت مكانه ولا يعود أو ينقلب)','How should mass be spread inside a solid cube fully under a liquid so it is in neutral balance (stays at any angle you turn it to)?',['جعل الأطراف الخارجية أثقل من المركز بمرتين.','جعل النصف السفلي أثقل بـ ٥ أضعاف.','جعل المكعب متجانس الكثافة تمامًا.','جعل المكعب مفرغًا ومملوء بالهواء المضغوط.'],['make the outside twice as heavy as the centre','make the bottom half 5 times heavier','make the cube exactly even in density','make it hollow and full of compressed air'],2,'إذا كانت الكثافة متجانسة ينطبق مركز الثقل على مركز الطفو، فيبقى المكعب في أي وضع.','With even density the centre of gravity matches the centre of buoyancy, so it stays at any angle.');
C('chem','في الشكل؛ إذا أُزيل غطاء كأس الشاي برفق دون تحريك الوعاء، وتُركت المنظومة لفترة من الزمن؟','A small covered cup of tea stands inside a glass of water. The lid is gently removed without moving anything and left for a while. What happens?',['يظل الشاي داخل الكأس والماء نقيًا دون أي اختلاط.','ينتشر الشاي تدريجيًا في الماء حتى التجانس.','يترسب الشاي في قاع الوعاء كطبقة صلبة معزولة.','يفيض الشاي من الكأس خارج الوعاء دون اختلاط بالماء.'],['the tea stays in the cup and the water stays clear','the tea slowly spreads through the water until even','the tea settles as a solid layer','the tea overflows without mixing'],1,'جزيئات الشاي تنتشر تدريجيًا بالانتشار حتى يتجانس المحلول.','Tea particles spread out by diffusion until the liquid is even.');
C('phy','إذا قُذفت كرة أفقيًا من ارتفاع معين بالقرب من سطح كوكب المريخ، فكيف يكون مسارها؟','A ball is thrown sideways from a height near the surface of Mars. What path does it take?',['تسقط عموديًا لأسفل مباشرة.','تتحرك في مسار منحني نحو سطح المريخ بفعل جاذبيته.','تتحرك بخط مستقيم للفضاء وتفلت من جاذبية المريخ.','تدور حول المريخ في مدار دائري.'],['it falls straight down','it curves down to the surface because of gravity','it goes straight into space','it orbits Mars'],1,'الكرة تحتفظ بسرعتها الأفقية وتسحبها جاذبية المريخ لأسفل، فيكون مسارها منحنيًا.','It keeps its sideways speed while gravity pulls it down, so its path curves.');
C('phy','في رافعة من النوع الثاني، إذا زاد طول ذراع المقاومة حتى أصبح مساويًا لطول ذراع القوة، ماذا يحدث لحالة الرافعة؟','In a second-class lever, the load arm grows until it equals the effort arm. What happens?',['تصبح نوع أول','تفقد ميزتها','تزيد قوتها','تزيد سرعتها'],['it becomes first-class','it loses its advantage','it becomes stronger','it becomes faster'],1,'الفائدة الآلية = ذراع القوة ÷ ذراع المقاومة = ١، فلا توفر الرافعة أي جهد وتفقد ميزتها.','Mechanical advantage = effort arm ÷ load arm = 1, so the lever saves no effort.');
C('phy','قُذفت كرتان متماثلتان (أ) و(ب) أفقيًا من الارتفاع نفسه فوق سطح المريخ في اللحظة ذاتها. حيث السرعة الابتدائية للكرة (أ) ضعف سرعة الكرة (ب). أيهما تصل لسطح الكوكب أولًا؟','Two identical balls A and B are thrown sideways from the same height on Mars at the same moment; A is twice as fast as B. Which lands first?',['الكرة (أ) لسرعتها الأكبر.','الكرة (ب) لقصر مسارها.','تصلان معًا في اللحظة نفسها.','تظل الكرة (أ) معلقة في الغلاف الجوي ولا تسقط مطلقًا.'],['A, because it is faster','B, because its path is shorter','both at the same moment','A never falls'],2,'زمن السقوط يعتمد على الارتفاع فقط، فالسرعة الأفقية لا تغير زمن الوصول.','Fall time depends only on height; sideways speed does not change it.');
C('phy','شاحنة صهريج تسير للأمام على طريق مستقيم، فجأة ضغط السائق على المكابح (الفرامل) بقوة. أي شكل يوضح وضع السائل داخل الصهريج لحظة التوقف؟','A tanker lorry drives forward, then the driver brakes hard. Which picture shows the liquid at the moment it stops?',[tanker('a'),tanker('b'),tanker('c'),'<b>لا شيء مما سبق<br>None of these</b>'],null,0,'بسبب القصور الذاتي يستمر السائل في الحركة للأمام فيرتفع في مقدمة الصهريج.','Because of inertia the liquid keeps moving forward and piles up at the front of the tank.',{figOpts:true});
C('earth','عند تدفق مياه الشلالات وانحدارها تلقائيًا من قمة الجبل إلى قاع المجرى المائي، كيف تتغير درجة حرارة الماء عند القاع (B) مقارنة بالقمة (A) بفرض عدم وجود تبخر؟','Water flows down a waterfall from the top (A) to the bottom (B). With no evaporation, how does the temperature at B compare with A?',['درجة الحرارة عند A أكبر من B.','درجة الحرارة عند B أكبر من A.','درجة الحرارة متساوية عند النقطتين تمامًا.','المعطيات غير كافية لتحديد التغير في درجة الحرارة.'],['A is warmer than B','B is warmer than A','they are exactly the same','not enough information'],1,'طاقة الوضع تتحول إلى طاقة حركة ثم إلى طاقة حرارية عند الاصطدام بالقاع، فترتفع حرارة الماء قليلًا.','Potential energy turns into motion and then heat when the water hits the bottom, so it warms slightly.');
C('phy','وضعت كأسًا مملوءة بالماء بشكل مستقر على حافة نافذة قطار سريع. كيف سيصبح شكل سطح الماء في الكأس عندما ينعطف القطار فجأة نحو اليمين؟','A full glass of water stands on a fast train’s window ledge. How does the water surface look when the train suddenly turns right?',[glass('a'),glass('b'),glass('c'),glass('d')],null,3,'عند انعطاف القطار يمينًا يستمر الماء في حركته بسبب القصور الذاتي فيرتفع في الجهة اليسرى من الكأس.','When the train turns right, inertia keeps the water going, so it rises on the left side of the glass.',{figOpts:true});
C('phy','إذا كنت تسير في خط مستقيم نحو مصدر صوت ثابت، ولاحظت أن الطول الموجي للصوت الذي تسمعه يزداد تدريجيًا كلما تقدمت في حركتك. هذا يعني أنك','You walk in a straight line and notice the wavelength of the sound from a fixed source gets longer as you go. This means you',['تقترب من مصدر الصوت.','تبتعد عن مصدر الصوت.','تتحرك حول المصدر في مسار دائري.','متوقف والمصدر هو الذي يتحرك مبتعدًا.'],['are getting closer to the source','are moving away from the source','are going round the source','have stopped and the source is moving away'],1,'زيادة الطول الموجي (انخفاض التردد) تحدث عند الابتعاد عن المصدر.','A longer wavelength (lower pitch) happens when moving away from the source.');
C('phy','تقف فتاة (ساكنة) على رصيف محطة القطار، ويقترب منها قطار سريع يطلق صفارة بنغمة ثابتة. كيف تبدو لها حدة الصوت (التردد) والطول الموجي للصفارة؟','A girl stands still on a platform as a fast train blowing a steady whistle comes towards her. How do the pitch (frequency) and wavelength sound to her?',['يقل التردد ويزداد الطول الموجي.','يزداد التردد ويقل الطول الموجي.','يظل التردد والطول الموجي ثابتين.','يزداد التردد والطول الموجي معًا.'],['lower frequency, longer wavelength','higher frequency, shorter wavelength','both stay the same','both increase'],1,'عند اقتراب المصدر تتقارب الموجات فيزداد التردد ويقل الطول الموجي.','As the source comes closer the waves bunch up: higher frequency, shorter wavelength.');

C('phy','جسمان لهما نفس كمية التحرك (الزخم الخطي)، أحدهما (ثقيل) كبير الكتلة والآخر (خفيف) صغير الكتلة. كيف تكون الطاقة الحركية للجسم الثقيل مقارنة بالخفيف؟','Two bodies have the same momentum; one is heavy and one is light. How does the heavy body’s kinetic energy compare with the light one’s?',['أكبر من','أقل من','متساوية','لا يمكن تحديدها'],['greater','less','equal','cannot be known'],1,'الطاقة الحركية = (كمية التحرك)² ÷ (٢ × الكتلة)، فالكتلة الأكبر تعطي طاقة أقل.','KE = momentum² ÷ (2 × mass), so the heavier body has less.');

C('phy','شاحنة ضخمة وسيارة صغيرة تتحركان على طريق سريع حيث لهما نفس كمية التحرك. ضغط السائقان على المكابح في نفس اللحظة بنفس القوة الكابحة حتى التوقف. أيهما يقطع مسافة أطول حتى يتوقف؟','A big lorry and a small car have the same momentum. Both brake at the same moment with the same force. Which travels further before stopping?',['الشاحنة','السيارة','متساويتان','لا يمكن التحديد'],['the lorry','the car','the same','cannot tell'],1,'زمن التوقف متساوٍ، لكن السيارة أسرع (لأن كتلتها أقل)، فتقطع مسافة أطول.','They take the same time to stop, but the car is faster (less mass), so it goes further.');
C('phy','شخص يدفع صندوقًا بقوة ٧ نيوتن على سطح أفقي، ثم احتاج فجأة إلى زيادة القوة ٣٠ نيوتن ليحافظ على تحريك الصندوق بنفس السرعة. ما التفسير الفيزيائي المنطقي لهذه الزيادة؟','A man pushes a box with 7 N on flat ground, then suddenly needs 30 N more to keep it moving at the same speed. What is the most logical reason?',['انتقل إلى سطح أملس كالجليد.','نقصت كتلة الصندوق فجأة للنصف.','أصبح السطح مائلًا للأسفل.','بدأ يدفع الصندوق على سطح مائل للأعلى.'],['he moved onto smooth ice','the box suddenly lost half its mass','the ground sloped downhill','he started pushing up a slope'],3,'الدفع لأعلى سطح مائل يحتاج قوة إضافية للتغلب على جزء من وزن الصندوق.','Pushing uphill needs extra force to work against part of the box’s weight.');
C('phy','استخدم عمال بناء سطحًا مائلًا طويلًا لرفع حجر ثقيل إلى الطابق الأول بدل رفعه بحبل عموديًا. السطح المائل قلل القوة المطلوبة لرفع الحجر للنصف. ماذا يحدث للشغل الكلي المبذول في الحالتين مع إهمال الاحتكاك؟','Builders use a long ramp instead of a rope to lift a heavy stone; the ramp halves the force needed. Ignoring friction, what happens to the total work done?',['يقل للنصف','يتضاعف','يظل ثابتًا','يقل للربع'],['halves','doubles','stays the same','falls to a quarter'],2,'السطح المائل يقلل القوة لكنه يزيد المسافة بالنسبة نفسها، فيبقى الشغل ثابتًا.','The ramp halves the force but doubles the distance, so the work stays the same.');
C('phy','مر في جسمين موصلين تياران كهربائيان شدتهما ١ أمبير و ٠٫٥ أمبير، وتولد بين طرفي كل منهما فرق جهد متساوٍ مقداره ٢٠ فولت. ما النسبة بين مقاومة الأول إلى مقاومة الثاني؟','Currents of 1 A and 0.5 A flow through two conductors, each with 20 V across it. What is the ratio of the first resistance to the second?',['١ : ٢','١ : ١','٣ : ٢','٢ : ١'],['1 : 2','1 : 1','3 : 2','2 : 1'],0,'م = ج ÷ ت: الأول ٢٠ أوم، والثاني ٤٠ أوم، فالنسبة ١ : ٢.','R = V ÷ I: 20 Ω and 40 Ω, so 1 : 2.');
C('phy','موصل مقاومته الكهربية ١٠ أوم يمر به تيار شدته ٢ أمبير. إذا زاد فرق الجهد بين طرفيه للضعف، فإن مقاومة الموصل','A conductor of 10 Ω carries 2 A. If the voltage across it is doubled, its resistance',['تقل للنصف','تظل كما هي','تزداد للضعف','تزداد لأربعة أمثالها'],['halves','stays the same','doubles','becomes four times as big'],1,'المقاومة صفة للموصل نفسه (مادته وطوله ومساحته وحرارته)، ولا تتغير بتغير الجهد.','Resistance belongs to the conductor itself; changing the voltage does not change it.');

C('chem','أثناء عملية انصهار المادة النقية، الطاقة الحرارية المكتسبة تزيد طاقة ........ بين الجزيئات.','While a pure substance melts, the heat it takes in increases the ........ energy between the particles.',['الوضع','الحركة','الكيميائية','النووية'],['potential','kinetic','chemical','nuclear'],0,'أثناء الانصهار تبقى الحرارة ثابتة، فالطاقة تذهب لزيادة طاقة الوضع بين الجزيئات وإضعاف الروابط.','During melting the temperature stays the same, so the energy raises the potential energy between particles.');
C('chem','عند الانتقال المباشر من الحالة الغازية إلى الحالة الصلبة دون المرور بالحالة السائلة، فإن العملية تكون ........','When a gas turns straight into a solid without becoming liquid, the process is ........',['ثابتة الحرارة','معزولة حراريًا','ماصة للحرارة','طاردة للحرارة'],['at constant temperature','heat-insulated','heat-absorbing','heat-releasing'],0,'التحول بين الحالات يحدث عند درجة حرارة ثابتة، كما يذكر الكتاب (وهو في الوقت نفسه يطرد حرارة).','Changes of state happen at a constant temperature, as the book’s answer says (the process also gives out heat).');

Q('patt','ما العدد الذي يجب أن يوضع مكان علامة الاستفهام؟','Which number replaces the question mark?',['٤','٩','١٠','١٤'],['4','9','10','14'],'ج','كل عدد = ضعف مجموع العددين اللذين تحته: (٣ + ٢) × ٢ = ١٠، وللتأكد: (٨ + ١٠) × ٢ = ٣٦ وَ (١٠ + ١٤) × ٢ = ٤٨.','Each number is twice the sum of the two below it: (3 + 2) × 2 = 10. Check: (8 + 10) × 2 = 36 and (10 + 14) × 2 = 48.',{fig:pyrF(true)},{fig:pyrF(false)});
Q('clk','إذا كانت الساعة الآن تشير إلى السابعة، وكان عقرب الدقائق يتأخر ٢٠ دقيقة كل ساعة، فكم يكون الوقت الفعلي بعد مرور ٤ ساعات؟','A clock shows 7:00 and its minute hand loses 20 minutes every hour. What time will it show after 4 hours?',['٩:٠٠','٩:٤٠','١٠:٢٠','١١:٢٠'],['9:00','9:40','10:20','11:20'],'ب','في كل ساعة تتقدم الساعة ٤٠ دقيقة فقط، وفي ٤ ساعات: ١٦٠ دقيقة = ساعتان و٤٠ دقيقة، فتشير إلى ٩:٤٠ (حسب مفتاح الكتاب).','Each hour the clock moves only 40 minutes; in 4 hours that is 160 minutes = 2 h 40 min, so it shows 9:40 (the book’s answer).');
Q('prob','إذا كان مجموع ما قرأته نوف ومها = ١٣ صفحة، ومجموع ما قرأته مها وسمية = ١١ صفحة، ومجموع ما قرأه الثلاث ١٦ صفحة، فكم صفحة قرأتها سمية ونوف؟','Nouf and Maha read 13 pages together, Maha and Sumaya 11 pages, and all three 16 pages. How many pages did Sumaya and Nouf read together?',['٣','٥','٨','١٤'],['3','5','8','14'],'ج','سمية = ١٦ − ١٣ = ٣، ونوف = ١٦ − ١١ = ٥، والمجموع ٨.','Sumaya = 16 − 13 = 3 and Nouf = 16 − 11 = 5, so together 8.');
Q('alg','في لعبة رمي السهام قام كل لاعب برمي سهمين فكان تسجيل النقاط: فهد (أ ثم جـ) = ١٥، خالد (ب ثم جـ) = ١٣، حمد (أ ثم ب) = ١٨، ياسر (ب ثم ب) = ؟. كم نقطة حققها ياسر؟','In darts each player threw two arrows: Fahd (A, C) = 15, Khaled (B, C) = 13, Hamad (A, B) = 18, Yasser (B, B) = ?. How many points did Yasser get?',['١٢','١٦','١٨','٢٠'],['12','16','18','20'],'ب','مجموع الثلاثة: ٢(أ + ب + جـ) = ٤٦، فـ أ + ب + جـ = ٢٣، ومنها جـ = ٥ ، ب = ٨، فياسر = ٨ + ٨ = ١٦.','Adding all three: 2(A + B + C) = 46, so A + B + C = 23, C = 5, B = 8; Yasser = 8 + 8 = 16.');
Q('ops','في عملية الضرب المقابلة، أوجد مجموع الأرقام في المربعات.','In this multiplication, find the sum of the digits in the boxes.',['١٥','١٦','١٧','١٨'],['15','16','17','18'],'ج','العدد □□٥ × ٩ = □٢٨□. الناتج ينتهي بـ ٥، ومجموع أرقامه يقبل القسمة على ٩: □ + ٢ + ٨ + ٥ ⇒ □ = ٣، فالناتج ٣٢٨٥ = ٣٦٥ × ٩. المجموع ٣ + ٦ + ٣ + ٥ = ١٧.','□□5 × 9 = □28□. It ends in 5 and its digits must add to a multiple of 9, so the first box is 3: 3285 = 365 × 9. Sum: 3 + 6 + 3 + 5 = 17.',{fig:mulF});
Q('meas','في الشكل التالي؛ إذا علمت أن المسافات بين الأرقام من (أ) إلى (ب) متساوية، فعند أي رقم يمكن زراعة شجرة بحيث تصبح المسافة بينها وبين النقطة (أ) تساوي ١٢٥م؟','The gaps between the numbers from A to B are equal. At which number can a tree be planted so that it is 125 m from A?',['٥','٦','٧','٨'],['5','6','7','8'],'ب','المسافة الكلية ٢٠٥ − ٥ = ٢٠٠ م على ٨ مسافات، كل مسافة ٢٥ م. و ١٢٥ ÷ ٢٥ = ٥ مسافات بعد الرقم ١، فتكون عند الرقم ٦.','The whole distance is 205 − 5 = 200 m in 8 gaps of 25 m. 125 ÷ 25 = 5 gaps after number 1: number 6.',{fig:lineF(true)},{fig:lineF(false)});
Q('logic','إذا توقف المصعد في الطابق الثالث بعد الطابق الخامس، والذي توقف بعد الطابق الحادي عشر وقبل الطابق التاسع، ففي أي طابق توقف المصعد أخيرًا؟','The lift stopped at floor 3 after floor 5; floor 5 came after floor 11 and before floor 9. At which floor did the lift stop last?',['٣','٥','٩','١١'],['3','5','9','11'],'أ','الترتيب: ١١ ثم ٥ ثم ٩ ثم ٣ (حسب مفتاح الكتاب)، فآخر توقف في الطابق الثالث.','The order is 11, 5, 9, then 3 (the book’s answer), so the last stop is floor 3.');

Q('mat','يطبخ أحمد وصفة ويستخدم فيها ميزانًا ذا كفتين كما هو موضح بالشكل المجاور، فإذا استخدم ٥ جم سمسم، فكم جم من الزعتر يستخدمها؟','Ahmed uses a hanging balance for a recipe, as shown. If he uses 5 g of sesame, how many grams of thyme does he use?',['٥','١٠','٢٠','٤٠'],['5','10','20','40'],'ج','الميزان متزن: السمسم ٥ جم يعادله ٥ جم في الطرف الآخر، فالطرف السفلي ١٠ جم، ويعادله ١٠ جم في الجهة المقابلة فيصبح الجانب الأيسر ٢٠ جم، فالزعتر ٢٠ جم.','Every bar balances: sesame 5 g balances another 5 g (10 g); that balances another 10 g (20 g); so the thyme is 20 g.',{fig:mob(true)},{fig:mob(false)});

Q('patt','في الشكل التالي؛ بطاقة صرف آلي مكونة من ١٤ رقمًا، مجموع كل ثلاثة أرقام متجاورة يساوي ٢٠، أوجد قيمة س.','A bank card has 14 digits, and any three neighbouring digits add up to 20. Find x.',['٥','٦','٧','٨'],['5','6','7','8'],'ج','الأرقام تتكرر كل ٣: ٨، ٧، ٥، ٨، ٧، ٥ ... (لأن ٨ + ٧ + ٥ = ٢٠). الرقم الرابع عشر يقع في المكان الثاني من الدورة (١٤ = ٣ × ٤ + ٢)، فهو ٧.','The digits repeat every 3: 8, 7, 5, … (8 + 7 + 5 = 20). The 14th digit is 2nd in its group (14 = 3 × 4 + 2), so it is 7.',{fig:card(true)},{fig:card(false)});

C('gear','يوجد نظام تروس فيه ترس قائد يدور بسرعة ٣٠٠ دورة في الدقيقة، وكان نسبة عدد أسنان الترس الثاني إلى الأول ١ : ٣، فما سرعة دوران الترس الثاني بالدقائق؟','A driving gear turns at 300 turns a minute. The second gear has a third as many teeth as the first. How fast does the second gear turn?',['٢٠٠','٣٠٠','٦٠٠','٩٠٠'],['200','300','600','900'],3,'الترس الثاني أسنانه ثلث الأول، فيدور ٣ أضعاف: ٩٠٠ دورة في الدقيقة.','The second gear has a third of the teeth, so it turns 3 times as fast: 900.');

C('gear','في الشكل؛ جسم معدني (ب) له ٦ شقوق، وتديره عجلة قيادة (أ) مثبت بها ٣ مسامير موزعة بانتظام. لكي يكمل الجسم (ب) دورة كاملة حول نفسه، فإن عجلة القيادة (أ) يجب أن تدور ........','Metal body B has 6 slots and is turned by drive wheel A with 3 evenly spaced pins. For B to make one full turn, A must turn ........',['نصف دورة','دورة واحدة','دورتين','٣ دورات'],['half a turn','one turn','two turns','3 turns'],2,'كل دورة للعجلة (أ) تدخل مساميرها الثلاثة في ٣ شقوق، أي نصف دورة للجسم (ب)، فيحتاج دورتين.','Each turn of A pushes its 3 pins through 3 slots, half a turn of B, so A must turn twice.',{fig:pins(true)},{fig:pins(false)});

C('gear','يوضح الشكل منظومة ميكانيكية مكوّنة من أربع بكرات (A, B, C, D) متصلة بسيور ناقلة للحركة. إذا دارت البكرة A في اتجاه عقارب الساعة، فما اتجاه دوران كل من البكرات B وC وD؟','Four pulleys A, B, C and D are joined by belts. If A turns clockwise, which way do B, C and D turn?',['B وD عكس عقارب الساعة.','C عكس عقارب الساعة، وD معها.','B وC مع عقارب الساعة، وD عكسها.','جميعها مع عقارب الساعة.'],['B and D anticlockwise','C anticlockwise, D clockwise','B and C clockwise, D anticlockwise','all clockwise'],2,'السير المفتوح ينقل الاتجاه نفسه: A ← B ← C مع عقارب الساعة. السير المتقاطع يعكس الاتجاه: D عكس عقارب الساعة.','Open belts keep the direction: A, B and C turn clockwise. The crossed belt reverses it: D turns anticlockwise.',{fig:belts4});
C('phy','في غرفة مظلمة، سُلّطت حزمة ضوئية متوازية على مرآة مستوية معلقة على الحائط. لاحظ شخص واقف جانبًا ظهور بقعة مضيئة على الحائط المقابل، بينما بدا له سطح المرآة مظلمًا. ما التفسير العلمي لهذه الظاهرة؟','In a dark room a parallel beam shines on a flat mirror on the wall. A person standing to one side sees a bright spot on the opposite wall, but the mirror itself looks dark. Why?',['امتصت المرآة جميع الأشعة ولم تعكسها.','حدث انعكاس منتظم بعيدًا عن عين الشخص.','تشتت الضوء الساقط على المرآة.','لا يعكس سطح المرآة الضوء في الظلام.'],['the mirror absorbed all the light','regular reflection sent the light away from his eye','the light was scattered','mirrors do not reflect in the dark'],1,'المرآة تعكس الأشعة كلها في اتجاه واحد (انعكاس منتظم) نحو الحائط، فلا يصل منها شيء إلى عين الشخص.','The mirror reflects all the light in one direction (regular reflection) towards the wall, so none reaches his eye.');

C('phy','كرتان متماثلتان تمامًا وُضعتا على قمة مستويين مائلين أملسين (من الارتفاع نفسه). زاوية ميل المستوى الأول ٣٠°، وزاوية ميل المستوى الثاني ٦٠°. إذا تُركتا معًا من السكون، فأي العبارات التالية صحيحة؟','Two identical balls start from the top of two smooth slopes of the same height, one at 30° and one at 60°. They are let go together. Which is true?',['الكرة على المستوى ٣٠° تصل أولًا.','الكرة على المستوى ٦٠° تصل أولًا.','الكرتان تصلان معًا.','لا يمكن التحديد بدون معرفة طول المستويين.'],['the 30° ball arrives first','the 60° ball arrives first','they arrive together','cannot tell without the lengths'],1,'المستوى الأشد ميلًا أقصر وتسارع الكرة عليه أكبر، فتصل أولًا.','The steeper slope is shorter and gives a bigger acceleration, so that ball arrives first.');

(function(){
  const b=document.createElement('button');b.type='button';b.id='penBtn';b.className='penbtn';
  const c=document.createElement('canvas');c.className='pencv';
  const col=document.createElement('div');col.className='pencol';
  const COLS=['#d6336c','#1d4ed8','#111827','#16a34a'];let ink=COLS[0];
  col.innerHTML=COLS.map((k,i)=>`<button type="button" data-ink="${k}" style="background:${k}" aria-pressed="${i===0}"></button>`).join('');
  document.body.append(c,col,b);
  let on=false,ctx=null,last=null;
  const label=()=>{b.innerHTML=on?`✖ ${lang==='en'?'Cancel pen':'إلغاء القلم'}`:`✏️ ${lang==='en'?'Pen':'القلم'}`;b.setAttribute('aria-pressed',on);};
  const size=()=>{const r=window.devicePixelRatio||1;c.width=Math.round(innerWidth*r);c.height=Math.round(innerHeight*r);c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx=c.getContext('2d');ctx.setTransform(r,0,0,r,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=3;ctx.strokeStyle=ink;};
  const off=()=>{on=false;c.style.display='none';col.style.display='none';if(ctx)ctx.clearRect(0,0,c.width,c.height);last=null;label();};
  b.onclick=()=>{if(on){off();return;}on=true;size();c.style.display='block';col.style.display='flex';label();};
  col.onclick=e=>{const k=e.target.dataset&&e.target.dataset.ink;if(!k)return;ink=k;if(ctx)ctx.strokeStyle=k;col.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.ink===k));};
  const pt=e=>[e.clientX,e.clientY];
  c.addEventListener('pointerdown',e=>{last=pt(e);try{c.setPointerCapture(e.pointerId)}catch(x){}ctx.beginPath();ctx.arc(last[0],last[1],1.4,0,7);ctx.fillStyle=ink;ctx.fill();e.preventDefault();});
  c.addEventListener('pointermove',e=>{if(!last)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;e.preventDefault();});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>c.addEventListener(ev,()=>{last=null;}));
  window.addEventListener('resize',()=>{if(on){const img=ctx.getImageData(0,0,c.width,c.height);size();try{ctx.putImageData(img,0,0)}catch(x){}}});
  window.mrPen=v=>{b.style.display=v?'inline-flex':'none';if(!v&&on)off();else label();};
  window.mrPen(true);
})();

function updChrome(){

const NAME_EDIT_CODES=['28','1','ragab'];

function selectKid(code){
  st.kid=st.user.kids.find(k=>String(k.code)===String(code))||null;
  st.doneKey='mr_xdone_'+(st.kid?st.kid.code:st.user.code);

function route(){ if(!st.level){renderLevel();window.scrollTo(0,0);return;} if(st.user)renderStart(); else if(st.authKnown)renderLogin(); else renderBoot(); window.scrollTo(0,0); }
function renderBoot(){
  const T=t(); bclock.hidden=true; st.screen='boot'; updChrome();

}
function renderLogin(){
  const T=t(); bclock.hidden=true; st.screen='login'; updChrome();
  app.innerHTML=`<section class="login"><div class="sheet logincard">
    <div class="seal-big">${lang==='en'?'M':'م'}</div>
    <h1>${T.loginTitle}</h1><p class="muted small">${T.loginSub}</p>
    <form id="lf" novalidate>
      <div class="field"><label for="lc">${T.codeLbl}</label><input id="lc" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" dir="ltr"></div>
      <div class="field"><label for="lp">${T.passLbl}</label><div class="pw"><input id="lp" type="password" autocomplete="current-password" dir="ltr"><button type="button" id="eye">${T.showPw}</button></div></div>
      <p class="err" id="lerr" role="alert" ${st.loginErr?'':'hidden'}>${st.loginErr?T.errs[st.loginErr]:''}</p>
      <button class="btn gold" id="lb" type="submit">${T.loginBtn}</button>
    </form>

  </div></section>`;
  const lc=document.getElementById('lc'),lp=document.getElementById('lp'),lb=document.getElementById('lb'),le=document.getElementById('lerr');
  const showErr=k=>{st.loginErr=k;le.textContent=T.errs[k];le.hidden=false;};
  document.getElementById('eye').onclick=e=>{const v=lp.type==='password';lp.type=v?'text':'password';e.target.textContent=v?T.hidePw:T.showPw;};
  document.getElementById('lf').onsubmit=async e=>{
    e.preventDefault();
    const c=lc.value.trim(),p=lp.value.trim();
    if(!c||!p)return showErr('empty');
    if(!window.RG)return showErr('net');
    lb.disabled=true;lb.textContent=T.loggingIn;st.loginErr=null;le.hidden=true;
    try{await window.RG.signIn(c,p);}
    catch(err){showErr(err.code==='auth/too-many-requests'?'many':err.code==='auth/network-request-failed'?'net':'bad');lb.disabled=false;lb.textContent=T.loginBtn;}
  };
  lc.focus();
}
window.MR={

    if(!['lang','level'].includes(st.screen)){renderStart();window.scrollTo(0,0);}
  },
  bootFail(kind){ if(st.authKnown)return; st.bootErr=kind; if(st.screen==='boot')renderBoot(); }

const progKey=()=>(st.doneKey||'mr_xdone').replace('mr_xdone','mr_xprog');
function saveProg(){
  if(st.screen!=='exam'||!st.list)return;
  try{localStorage.setItem(progKey(),JSON.stringify({v:2,level:st.level,model:st.model,ans:st.ans,flag:st.flag,cur:st.cur,left:Math.max(1,st.left),total:st.total,name:st.name,ts:Date.now()}))}catch(e){}
}
function clearProg(){try{localStorage.removeItem(progKey())}catch(e){}}
function loadProg(){
  let p=null;try{p=JSON.parse(localStorage.getItem(progKey())||'null')}catch(e){}
  if(!p||!(p.v===2||(p.v===1&&p.model>12))||!LEVELS[p.level]||!MODELS.some(m=>m.n===p.model)||!(p.left>0))return null;
  return p;
}
function progBanner(){
  const p=loadProg();if(!p)return '';const T=t(),n=Q.filter(q=>q.m===p.model).length;
  return `<div class="prog" role="status"><b>${T.progTitle}</b><span>${T.progBody(mFull(p.model),Object.keys(p.ans||{}).length,n,fmt(p.left))}</span><small class="muted">${T.progNote}</small><div class="row"><button type="button" class="btn gold" id="progGo">${T.progGo}</button><button type="button" class="btn line" id="progDrop">${T.progDrop}</button></div></div>`;
}
function resumeProg(){
  const p=loadProg();if(!p)return;
  if(p.level!==st.level){st.level=p.level;try{localStorage.setItem('mr_level',p.level)}catch(e){}}
  st.model=p.model;st.list=Q.filter(q=>q.m===st.model).map(q=>q.id);
  st.ans={};Object.keys(p.ans||{}).forEach(k=>{if(st.list.includes(+k)&&p.ans[k]>=0&&p.ans[k]<4)st.ans[k]=p.ans[k];});
  st.flag=p.flag||{};st.cur=Math.min(Math.max(0,p.cur|0),st.list.length-1);st.left=p.left;st.total=p.total||LEVELS[st.level].mins*60;
  if(p.name&&!st.name)st.name=p.name;
  st.screen='exam';clearInterval(timer);timer=setInterval(tick,1000);renderExam();window.scrollTo(0,0);
}

        kids=[{code,name:x.data().name||"",parentCode:"",examOnly:true}];role="student";
      } else kids=[{code,name:s.data().name||"",parentCode:s.data().parentCode||""}];role="student";
    }
    kids.sort((a,b)=>(a.name||"").localeCompare(b.name||"","ar"));
    window.MR.onUser({code,role,kids});
  }catch(e){console.error(e);window.MR.onUser(null,e.code==="permission-denied"?"perm":"net");try{await A.signOut(auth)}catch(_){}}
});
</script>

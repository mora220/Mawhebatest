<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="تجميعات اكسترا - محاكاة مقياس موهبة - المستويات الأول والثاني والثالث - Mawhiba Test Practice - إعداد المدرب محمد رجب">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>تجميعات اكسترا · محاكاة مقياس موهبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: ink-blue header band with saffron seal; exam sheet + side console (stacks on phones). RTL throughout. */
:root{
  --bg:#eef1f7; --surface:#ffffff; --panel:#e4e9f3; --line:#d3dae8; --line-2:#b9c3d8;
  --fg:#18213b; --muted:#5a6684; --ink:#1d2b53; --ink-2:#2c3d70;
  --accent:#e0a01b; --accent-soft:#fbf0d6; --accent-ink:#6b4a00; --on-ink:#ffffff;
  --good:#1f8a5a; --good-soft:#dcf2e6; --bad:#c2453a; --bad-soft:#fae2df; --flag:#7a5bc7; --flag-soft:#ece6fa;
  --f-disp:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1322; --surface:#151d31; --panel:#1b2540; --line:#273352; --line-2:#36446a;
  --fg:#e6eaf5; --muted:#9aa6c4; --ink:#c9d4f2; --ink-2:#2b3a68;
  --accent:#f0b440; --accent-soft:#3a2f12; --accent-ink:#f6cf7c; --on-ink:#ffffff;
  --good:#5fd197; --good-soft:#143326; --bad:#f08a80; --bad-soft:#3a1d1b; --flag:#a98cf0; --flag-soft:#2a2245; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1322; --surface:#151d31; --panel:#1b2540; --line:#273352; --line-2:#36446a;
  --fg:#e6eaf5; --muted:#9aa6c4; --ink:#c9d4f2; --ink-2:#2b3a68;
  --accent:#f0b440; --accent-soft:#3a2f12; --accent-ink:#f6cf7c; --on-ink:#ffffff;
  --good:#5fd197; --good-soft:#143326; --bad:#f08a80; --bad-soft:#3a1d1b; --flag:#a98cf0; --flag-soft:#2a2245; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--f-disp);line-height:1.3;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#1d2b53;color:#fff}
.band-in{max-width:1160px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.seal{display:flex;align-items:center;gap:12px}
.seal i{width:40px;height:40px;border-radius:50%;background:#e0a01b;display:grid;place-items:center;font-style:normal;font-family:var(--f-disp);font-weight:700;color:#1d2b53;font-size:18px;flex:none}
.seal b{display:block;font-family:var(--f-disp);font-size:18px;line-height:1.2}
.seal small{display:block;font-size:12.5px;opacity:.85}
.bclock{font-family:var(--f-num);font-size:20px;background:rgba(255,255,255,.1);padding:4px 14px;border-radius:999px}
.bclock.low{background:#c2453a}
.seal{background:none;border:0;color:inherit;padding:0;text-align:start;cursor:pointer}
.bar-end{display:flex;align-items:center;gap:10px}
.homebtn{display:inline-flex;align-items:center;gap:6px;background:#e0a01b;color:#1d2b53;border:0;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.langbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 14px;font-weight:600;font-size:14px}
.langpick{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.langs button{background:var(--surface);border:2px solid var(--line-2);border-radius:14px;padding:26px 18px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.langs button:hover{border-color:var(--accent);background:var(--accent-soft)}
.langs b{font-family:var(--f-disp);font-size:26px;color:var(--ink)}
.langs span{color:var(--muted);font-size:14.5px}
.langs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:480px){.langs{grid-template-columns:1fr}}
.tel{color:var(--fg);font-weight:600;font-family:var(--f-num)}
.contact{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:10px;font-size:14.5px}
.contact a{color:#fff;font-family:var(--f-num);font-weight:600;background:rgba(255,255,255,.12);padding:3px 12px;border-radius:999px;text-decoration:none}
.err{color:var(--bad);font-size:14px;font-weight:600}
.field input.bad{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-soft)}
.namebox{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:14px}

/* login */
.login{max-width:440px;margin:0 auto}
.logincard{display:flex;flex-direction:column;gap:14px;text-align:center}
.logincard h1{font-size:26px}
.logincard form{display:flex;flex-direction:column;gap:14px;text-align:start}
.seal-big{width:64px;height:64px;border-radius:50%;background:#1d2b53;color:#e0a01b;display:grid;place-items:center;margin:0 auto;font-family:var(--f-disp);font-size:28px;font-weight:700}
.pw{display:flex;gap:8px}.pw input{flex:1;min-width:0}
.pw button{border:1px solid var(--line-2);background:var(--panel);color:var(--fg);border-radius:10px;padding:0 14px;font-size:14px;font-weight:600}
.small{font-size:13.5px;margin:0}
.who-box b{font-family:var(--f-disp);font-size:21px;display:block;color:var(--ink)}
.kids{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.kids button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600}
.kids button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1d2b53}
.boot{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:64px;color:var(--muted);text-align:center}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* certificate */
.cert-wrap{max-width:760px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.cert{background:#fffdf7;color:#1d2b53;border:3px solid #1d2b53;outline:6px solid #e0a01b;outline-offset:-14px;border-radius:6px;padding:44px 40px;text-align:center;font-family:var(--f-body);position:relative}
.cert .ct{font-family:var(--f-disp);font-size:clamp(26px,5vw,40px);font-weight:700;margin:6px 0 4px}
.cert .sub{font-size:15px;color:#5a6684}
.cert .nm{font-family:var(--f-disp);font-size:clamp(24px,5vw,34px);font-weight:700;color:#b07b0a;border-bottom:2px dashed #e0a01b;display:inline-block;padding:0 18px 4px;margin:10px 0}
.cert p{margin:6px 0;font-size:17px;line-height:1.9}
.cert table{margin:12px auto;border-collapse:collapse;font-size:14.5px}
.cert td,.cert th{border:1px solid #c9b98a;padding:4px 12px}
.cert th{background:#f6eccf}
.cert .sig{display:flex;justify-content:space-between;gap:16px;margin-top:26px;font-size:14.5px;flex-wrap:wrap}
.cert .sig div{min-width:150px}
.cert .sig b{display:block;font-family:var(--f-disp);font-size:16px}
.cert .medal{width:64px;height:64px;margin:0 auto;border-radius:50%;background:#e0a01b;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:26px;color:#1d2b53;box-shadow:0 0 0 6px #fbf0d6}
#printcert{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff!important}
  body>*:not(#printcert){display:none!important}
  #printcert{display:block!important}
  .cert{outline-offset:-14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:24px 48px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.btn{border:0;border-radius:10px;padding:12px 22px;font-weight:600;background:var(--ink-2);color:var(--on-ink)}
:root:not([data-theme="dark"]) .btn:not(.gold):not(.line):not(.bad){background:#1d2b53}
.btn.gold{background:var(--accent);color:#1d2b53}
.btn.line{background:transparent;color:var(--fg);border:1px solid var(--line-2)}
.btn.bad{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}

/* start */
.start{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.hero{background:#1d2b53;color:#fff;border-radius:14px;padding:28px 24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-start:-60px;bottom:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(224,160,27,.35)}
.hero h1{font-size:clamp(26px,5vw,36px)}
.hero p{margin:8px 0 0;max-width:52ch;opacity:.9}
.hero .by{display:inline-block;margin-top:14px;background:#e0a01b;color:#1d2b53;font-weight:700;padding:4px 14px;border-radius:999px;font-size:14px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fact b{display:block;font-family:var(--f-num);font-size:24px;color:var(--ink)}
.fact span{font-size:13.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-weight:600;font-size:14px;color:var(--muted)}
.field input{font:inherit;padding:12px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--fg)}
.parts{display:flex;flex-direction:column;gap:14px}
.part h3{font-size:14.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.modes button{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:10px 8px;text-align:center;line-height:1.4}
.modes button b{display:block;font-size:15px}
.modes button span{font-size:12.5px;color:var(--muted)}
.modes button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.rules{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}

/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.qn{font-family:var(--f-disp);font-weight:700;font-size:18px;color:var(--ink)}
.sec{font-size:13px;font-weight:600;padding:3px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.stem{font-size:19px;font-weight:600;line-height:1.8;display:flex;flex-direction:column;gap:14px;min-width:0}
.stem p{margin:0}
.passage{background:var(--panel);border-inline-start:4px solid var(--accent);border-radius:8px;padding:12px 16px;font-weight:400;font-size:16.5px}
.passage b{display:block;font-size:13px;color:var(--muted)}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:40px;line-height:1.1;display:inline-block}
.ana{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.ana span{min-width:64px;min-height:64px;border:1px solid #d3dae8;border-radius:10px;display:grid;place-items:center;font-family:var(--f-disp);font-size:28px;padding:4px}
.ana span .emo{font-size:44px}
.ana b{font-size:24px;color:#5a6684}
@media (max-width:480px){.ana{gap:4px;flex-wrap:nowrap}.ana span{min-width:52px;min-height:52px;font-size:22px;padding:2px}.ana span .emo{font-size:32px}.ana b{font-size:18px}}
.fig{background:#fff;color:#1d2b53;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto}
.fig svg{display:block;margin:0 auto;max-width:100%;height:auto}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opts.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 14px;font-size:18px;min-height:56px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .L{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel);font-family:var(--f-disp);font-weight:700;color:var(--ink)}
.opt .c{min-width:0}
.opt .c svg{display:block;height:74px;width:auto;max-width:100%;background:#fff;border-radius:8px;color:#1d2b53}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .L{background:var(--accent);color:#1d2b53}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok .L{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .L{background:var(--bad);color:#fff}
.opt .tag{margin-inline-start:auto;font-size:13px;font-weight:700;white-space:nowrap}
.opt[disabled]{cursor:default}
.nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.flagrow{display:inline-flex;gap:8px;align-items:center;margin-top:16px;color:var(--muted);cursor:pointer}
.flagrow input{width:20px;height:20px;accent-color:var(--flag)}

.console{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:84px}
.who{display:flex;align-items:center;gap:10px}
.who i{width:42px;height:42px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--ink);flex:none}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center;font-size:12.5px;color:var(--muted)}
.tally b{display:block;font-family:var(--f-num);font-size:20px;color:var(--fg)}
.pal{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.pal button{position:relative;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 0;font-family:var(--f-num);font-size:13.5px}
.pal button.a{background:var(--ink-2);border-color:var(--ink-2);color:#fff}
:root:not([data-theme="dark"]) .pal button.a{background:#1d2b53;border-color:#1d2b53}
.pal button.f::after{content:"";position:absolute;top:2px;left:2px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.pal button.cur{box-shadow:0 0 0 2px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:11px;height:11px;border-radius:3px;border:1px solid var(--line-2)}

.modal{position:fixed;inset:0;z-index:30;background:rgba(8,12,24,.6);display:grid;place-items:center;padding:16px}
.modal .sheet{max-width:520px;width:100%}
.modal h2{font-size:21px;margin-bottom:8px}

/* figure helpers */
.seq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-family:var(--f-disp);font-size:24px}
.seq svg{height:78px;width:auto}
.ntab{border-collapse:collapse;margin:0 auto;font-family:var(--f-num);font-size:18px}
.ntab td,.ntab th{border:1px solid #9aa6c4;padding:6px 12px;text-align:center;min-width:44px}
.ntab th{font-family:var(--f-body);font-size:14px;background:#eef1f7}
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px}
.pyr div{display:flex;gap:6px}
.pyr span{width:46px;height:38px;border:2px solid #1d2b53;border-radius:8px;display:grid;place-items:center;font-family:var(--f-num);font-size:17px}
.mx{display:grid;grid-template-columns:repeat(3,76px);justify-content:center}
.mx>div{width:76px;height:76px;border:1px solid #9aa6c4;display:grid;place-items:center;font-family:var(--f-disp);font-size:26px}
.mx svg{width:58px;height:58px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--bad-soft);color:var(--bad);padding:4px 12px;border-radius:999px;font-size:14px;font-weight:600}

/* results */
.res{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.score{display:grid;grid-template-columns:170px 1fr;gap:24px;align-items:center}
.ring{width:170px;height:170px}
.bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.barc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.barc .t{display:flex;justify-content:space-between;font-weight:600}
.bar{height:9px;border-radius:9px;background:var(--panel);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.filt{display:flex;gap:8px;flex-wrap:wrap}
.filt button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:600;font-size:14px}
.filt button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1d2b53}
.rq{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;min-width:0}
.rq .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:10px}
.rq .stem{font-size:16.5px}
.rq .opts{gap:8px;margin-top:12px}
.rq .opt{font-size:16px;min-height:0;padding:8px 12px}
.rq .opt .L{width:30px;height:30px}
.why{margin-top:12px;background:var(--panel);border-radius:10px;padding:10px 14px;font-size:15.5px}
.why b{color:var(--accent-ink)}
.foot{text-align:center;color:var(--muted);font-size:13.5px;padding:0 16px 28px}
.foot b{color:var(--fg)}
.wacon{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:14px}
.wacon a{font-family:var(--f-body);display:inline-flex;align-items:center;gap:7px;text-decoration:none;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px}
.wacon .wa{background:#25d366;color:#fff}
.wacon .wa:hover{background:#1ebe5b}
.wacon .tel{color:var(--fg);border:1.5px solid var(--line);background:var(--surface)}
.wacon .tel b{color:inherit;font-weight:800}

@media (max-width:860px){
  .exam{grid-template-columns:1fr}
  .console{position:static;order:-1}
  .pal{grid-template-columns:repeat(10,minmax(0,1fr))}
}
@media (max-width:560px){
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts.grid{grid-template-columns:1fr}
  .score{grid-template-columns:1fr;justify-items:center;text-align:center}
  .bars{grid-template-columns:1fr}
  .pal{grid-template-columns:repeat(8,minmax(0,1fr))}
  .sheet{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sync{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;border:1px solid var(--line);font-size:15px;line-height:1.7}
.sync.saving{color:var(--muted)}
.sync.ok{border-color:var(--good);background:var(--good-soft)}
.sync.fail{border-color:var(--bad);background:var(--bad-soft)}
.sync span{flex:1;min-width:200px}

<script>
// ================= figure helpers =================
const T = (x,y,t,fs=18)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${fs}" fill="currentColor" stroke="none" font-family="IBM Plex Mono,Readex Pro,Tahoma,sans-serif">${t}</text>`;
const S = (w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">${inner}</svg>`;
const GOLD='#e0a01b', GOLDF='#e0a01b55', INK='#1d2b53';
const gridR = (cols,rows,c=46)=>{let s='';for(let i=0;i<=cols;i++)s+=`<line x1="${8+i*c}" y1="8" x2="${8+i*c}" y2="${8+rows*c}"/>`;for(let j=0;j<=rows;j++)s+=`<line x1="8" y1="${8+j*c}" x2="${8+cols*c}" y2="${8+j*c}"/>`;return S(cols*c+16,rows*c+16,s)};
const arrow = deg=>S(90,90,`<g transform="rotate(${deg} 45 45)"><path d="M45 74 V18 M27 35 L45 16 L63 35" stroke-width="6"/></g>`);
const poly = (n,fill=GOLD+'33')=>{const p=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;p.push((45+33*Math.cos(a)).toFixed(1)+','+(45+33*Math.sin(a)).toFixed(1));}return S(90,90,`<polygon points="${p.join(' ')}" fill="${fill}"/>`)};
const flag = t=>S(100,100,`<g transform="${t}"><path d="M35 85 V15 H70 M35 47 H60" stroke-width="7"/></g>`);
const pee  = t=>S(100,100,`<g transform="${t}"><path d="M35 85 V15 H68 V48 H35" stroke-width="7"/></g>`);
const seq = (items)=>`<div class="seq">${items.join('')}</div>`;
const sep = t=>`<span>${t}</span>`;
const net = (cells,labels)=>{const c=40;let mx=0,my=0;cells.forEach(([x,y])=>{mx=Math.max(mx,x);my=Math.max(my,y)});let s='';cells.forEach(([x,y],i)=>{s+=`<rect x="${6+x*c}" y="${6+y*c}" width="${c}" height="${c}" fill="${GOLD}22"/>`;if(labels)s+=T(6+x*c+c/2,6+y*c+c/2+8,labels[i],22);});return S((mx+1)*c+12,(my+1)*c+12,s)};
// shapes for matrices: kind c/s/t, style o (outline) f (filled) d (outline + dot)
const shp = (k,st)=>{const f=st==='f'?INK:'none';let g=k==='c'?`<circle cx="30" cy="30" r="22" fill="${f}"/>`:k==='s'?`<rect x="9" y="9" width="42" height="42" fill="${f}"/>`:`<path d="M30 7 L53 50 H7 Z" fill="${f}"/>`;if(st==='d')g+=`<circle cx="30" cy="${k==='t'?36:30}" r="5" fill="${GOLD}" stroke="none"/>`;return S(60,60,g)};
const dots = (n,k='s')=>{const pos=[[30,30],[18,18,42,42],[16,16,30,30,44,44],[18,18,42,18,18,42,42,42],[16,16,44,16,30,30,16,44,44,44],[18,14,42,14,18,30,42,30,18,46,42,46]];const p=n===1?[30,30]:pos[n-1];let s=k==='s'?`<rect x="5" y="5" width="50" height="50"/>`:`<circle cx="30" cy="30" r="26"/>`;for(let i=0;i<p.length;i+=2)s+=`<circle cx="${p[i]}" cy="${p[i+1]}" r="5" fill="${INK}" stroke="none"/>`;return S(60,60,s)};
const mx = cells=>`<div class="mx">${cells.map(c=>`<div>${c}</div>`).join('')}</div>`;
const numTri = (t,l,r,c)=>S(150,140,`<path d="M75 12 L140 128 H10 Z"/>`+T(75,36,t)+T(28,120,l)+T(122,120,r)+T(75,95,c,22));
const numCirc = (t,l,r)=>S(120,120,`<circle cx="60" cy="60" r="52"/><path d="M8 60 H112 M60 60 V112"/>`+T(60,45,t,20)+T(38,92,l,20)+T(82,92,r,20));
const tab = (head,rows)=>`<table class="ntab">${head?`<tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>`:''}${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table>`;
const pyr = rows=>`<div class="pyr">${rows.map(r=>`<div>${r.map(v=>`<span>${v}</span>`).join('')}</div>`).join('')}</div>`;
const pie = (n,miss)=>{let s='';const cx=80,cy=80,r=66;for(let i=0;i<n-miss;i++){const a1=-Math.PI/2+i*2*Math.PI/n,a2=a1+2*Math.PI/n;s+=`<path d="M${cx} ${cy} L${(cx+r*Math.cos(a1)).toFixed(1)} ${(cy+r*Math.sin(a1)).toFixed(1)} A${r} ${r} 0 0 1 ${(cx+r*Math.cos(a2)).toFixed(1)} ${(cy+r*Math.sin(a2)).toFixed(1)} Z" fill="${GOLD}66"/>`;}return S(160,160,s)};
const moon = k=>{const cx=40,cy=40,r=32;let lit='';if(k==='full')lit=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${GOLD}" stroke="none"/>`;else if(k!=='new'){const rx=k==='half'?0.01:r*0.55,sw=k==='gib'?1:0;lit=`<path d="M${cx} ${cy-r} A${r} ${r} 0 0 1 ${cx} ${cy+r} A${rx} ${r} 0 0 ${sw} ${cx} ${cy-r} Z" fill="${GOLD}" stroke="none"/>`;}return S(80,80,`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#2b3550"/>${lit}<circle cx="${cx}" cy="${cy}" r="${r}" stroke-width="2"/>`)};

// specific figures
const triA = S(200,170,`<path d="M100 15 L185 155 H15 Z"/><path d="M100 15 L72 155 M100 15 L128 155"/>`);
const triB = S(200,170,`<path d="M100 15 L185 155 H15 Z"/><path d="M100 15 V155 M57.5 85 H142.5"/>`);
const triC = S(200,170,`<path d="M100 15 L185 155 H15 Z"/><path d="M57.5 85 H142.5 L100 155 Z"/>`);
const sqX  = S(160,160,`<rect x="10" y="10" width="140" height="140"/><path d="M10 10 L150 150 M150 10 L10 150"/>`);
const frac8 = S(170,170,`<rect x="5" y="5" width="160" height="160"/><path d="M85 5 V165 M5 85 H165"/><path d="M85 5 H165 L85 85 Z" fill="${GOLD}88"/><path d="M85 85 L165 5"/>`);
const area20 = S(170,170,`<path d="M5 85 H85 V165 H5 Z" fill="${GOLD}88" stroke="none"/><path d="M5 5 H45 V45 H5 Z" fill="${GOLD}88" stroke="none"/><rect x="5" y="5" width="160" height="160"/><path d="M85 5 V165 M5 85 H165 M45 5 V85 M5 45 H85"/>`);
const gears3 = S(330,120,`<circle cx="60" cy="60" r="44" stroke-dasharray="7 4"/><circle cx="165" cy="60" r="30" stroke-dasharray="7 4"/><circle cx="270" cy="60" r="44" stroke-dasharray="7 4"/>`+T(60,67,'أ',22)+T(165,67,'ب',22)+T(270,67,'ج',22)+`<path d="M30 20 A50 50 0 0 1 90 20" stroke="#c2453a"/><path d="M82 12 L90 20 L80 27" stroke="#c2453a"/>`);

// ================= question bank =================
// correct answer is always written first; options are reordered on display
const PARTS=[{k:'K',name:'الجزء الكمي'},{k:'R',name:'المرونة العقلية'},{k:'U',name:'جزء العلوم'}];
const MODELS=[
 {n:1,p:'K',name:'النموذج الأول'},{n:2,p:'K',name:'النموذج الثاني'},
 {n:3,p:'R',name:'النموذج الثالث'},{n:4,p:'R',name:'النموذج الرابع'},{n:5,p:'R',name:'النموذج الخامس'},
 {n:6,p:'U',name:'النموذج السادس'},{n:7,p:'U',name:'النموذج السابع'}
];
const B={};
// ================= English bank (same order as the Arabic bank; null options = use the Arabic figure options) =================
const BE={};
// ================= Verbal part (models 8–12) =================
const E=e=>`<span class="emo">${e}</span>`;
const ana=(a,b,c)=>`<div class="ana"><span>${a}</span><b>:</b><span>${b}</span><b>::</b><span>${c}</span><b>:</b><span>؟</span></div>`;
const PA_AR='اختر الصورة التي تكمل العلاقة.', PA_EN='Choose the picture that completes the relationship.';
const OD_AR='أي صورة لا تنتمي إلى المجموعة؟', OD_EN='Which picture does not belong to the group?';
const PS={
 ant:{ar:'في فصل الصيف كانت نملة صغيرة تجمع حبوب القمح وتحملها إلى بيتها تحت الأرض، بينما كان الجندب يقفز ويغني طوال اليوم. سألها الجندب: لماذا تتعبين نفسك والطعام كثير؟ فقالت النملة: أجمع طعامي للشتاء. وحين جاء الشتاء وغطى الثلج الأرض جاع الجندب، أما النملة فكانت تأكل في بيتها الدافئ.',
      en:'In summer, a little ant collected grains of wheat and carried them to her home under the ground, while the grasshopper jumped and sang all day. The grasshopper asked her: “Why do you tire yourself when there is plenty of food?” The ant said: “I am saving my food for the winter.” When winter came and snow covered the ground, the grasshopper was hungry, but the ant ate in her warm home.'},
 palm:{ar:'النخلة شجرة مباركة تنمو في المناطق الحارة، وتحتاج إلى ماء قليل. يأكل الناس ثمرها وهو التمر، ويصنعون من سعفها السلال والحصير، ومن جذوعها كانوا يصنعون سقوف البيوت قديمًا. تعيش النخلة عشرات السنين، وتبدأ في إعطاء الثمر بعد أربع إلى ثماني سنوات من زراعتها.',
       en:'The palm tree is a blessed tree that grows in hot regions and needs little water. People eat its fruit, dates, and make baskets and mats from its fronds. In the past, they used its trunks to build the roofs of houses. A palm tree lives for decades and starts giving fruit four to eight years after it is planted.'},
 bike:{ar:'أهدى الأب ابنه سلمان دراجة جديدة يوم نجاحه. فرح سلمان كثيرًا وخرج يركبها بسرعة دون أن يلبس الخوذة، فسقط وجُرحت ركبته. عاد إلى البيت باكيًا، فضمّد أبوه جرحه وقال له: الدراجة متعة، لكن السلامة أولًا. ومنذ ذلك اليوم لم يركب سلمان دراجته إلا وعلى رأسه الخوذة.',
       en:'On the day Salman passed his exams, his father gave him a new bicycle. Salman was very happy and rode it fast without wearing his helmet. He fell and hurt his knee. He came home crying, and his father bandaged the wound and said: “Cycling is fun, but safety comes first.” Since that day, Salman never rides his bicycle without his helmet.'},

        en:'Water covers about three quarters of the Earth’s surface, but most of it is salty water in the seas and oceans. Only a little is fresh water, in rivers, lakes and under the ground. People cannot live many days without drinking water, so we must protect it and not waste it.'},
 laila:{ar:'تذهب ليلى كل يوم سبت إلى بيت جدتها بعد المدرسة، وتساعدها في سقي الزرع، ثم تعود قبل المغرب.',en:'Every Saturday after school, Laila goes to her grandmother’s house, helps her water the plants, and comes back before sunset.'},

const PINK='#d9467a', BLUE='#2f6fd6', GREEN='#2f9e6b', ORANGE='#e07b1b';
// toothed gear (fragment)
const gearP=(cx,cy,r,n,fill,lab,fs=18)=>{let d='';const ro=r,ri=r-Math.max(5,r*0.16);for(let i=0;i<n;i++){const a=i*2*Math.PI/n,w=Math.PI/n;const p=[[ri,a-w*0.95],[ro,a-w*0.45],[ro,a+w*0.45],[ri,a+w*0.95]];p.forEach(([rr,aa],j)=>{d+=(i===0&&j===0?'M':'L')+(cx+rr*Math.cos(aa)).toFixed(1)+' '+(cy+rr*Math.sin(aa)).toFixed(1)+' ';});}
  return `<path d="${d}Z" fill="${fill}" stroke="#1d2b53" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${Math.max(12,ri*0.55).toFixed(1)}" fill="#fff" stroke="#1d2b53" stroke-width="2"/>`+(lab!==undefined&&lab!==''?T(cx,cy+fs*0.36,lab,fs):'');};
// rotation arrow around a point (cw=true clockwise)
const rotA=(cx,cy,r,cw=true,col='#c2453a')=>{const a1=-2.3,a2=-0.8;const p=(a)=>[(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)];const [x1,y1]=p(cw?a1:a2),[x2,y2]=p(cw?a2:a1);
  const ang=cw?a2+Math.PI/2:a1-Math.PI/2;const hx=+x2,hy=+y2;const b1=[hx-9*Math.cos(ang-0.5),hy-9*Math.sin(ang-0.5)],b2=[hx-9*Math.cos(ang+0.5),hy-9*Math.sin(ang+0.5)];
  return `<path d="M${x1} ${y1} A${r} ${r} 0 0 ${cw?1:0} ${x2} ${y2}" stroke="${col}" stroke-width="3" fill="none"/><path d="M${b1[0].toFixed(1)} ${b1[1].toFixed(1)} L${hx} ${hy} L${b2[0].toFixed(1)} ${b2[1].toFixed(1)}" stroke="${col}" stroke-width="3" fill="none"/>`;};
// belt between two wheels (open or crossed)
const belt=(a,b,cross=false)=>{const [x1,y1,r1]=a,[x2,y2,r2]=b;const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
  if(!cross)return `<path d="M${(x1+nx*r1).toFixed(1)} ${(y1+ny*r1).toFixed(1)} L${(x2+nx*r2).toFixed(1)} ${(y2+ny*r2).toFixed(1)} M${(x1-nx*r1).toFixed(1)} ${(y1-ny*r1).toFixed(1)} L${(x2-nx*r2).toFixed(1)} ${(y2-ny*r2).toFixed(1)}" stroke="#1d2b53" stroke-width="2.5"/>`;
  return `<path d="M${(x1+nx*r1).toFixed(1)} ${(y1+ny*r1).toFixed(1)} L${(x2-nx*r2).toFixed(1)} ${(y2-ny*r2).toFixed(1)} M${(x1-nx*r1).toFixed(1)} ${(y1-ny*r1).toFixed(1)} L${(x2+nx*r2).toFixed(1)} ${(y2+ny*r2).toFixed(1)}" stroke="#1d2b53" stroke-width="2.5"/>`;};
const wheel=(cx,cy,r,fill,lab)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="#1d2b53" stroke-width="2.5"/><circle cx="${cx}" cy="${cy}" r="${Math.max(13,r*0.5).toFixed(1)}" fill="#fff" stroke="#1d2b53" stroke-width="2"/>`+(lab!==undefined?T(cx,cy+6,lab,17):'');
// general machine: items {g:[cx,cy,r,teeth,fill,label]} or {w:[cx,cy,r,fill,label]}, belts [[i,j,cross]], arrow [i,cw]
const machine=(w,h,items,belts=[],arr=null,extra='')=>{let s='';belts.forEach(([i,j,c])=>{const A=items[i].g||items[i].w,B=items[j].g||items[j].w;s+=belt([A[0],A[1],A[2]],[B[0],B[1],B[2]],c);});
  items.forEach(it=>{s+=it.g?gearP(...it.g):wheel(...it.w);});if(arr){const A=items[arr[0]].g||items[arr[0]].w;s+=rotA(A[0],A[1],A[2]+9,arr[1]);}return S(w,h,s+extra);};
// pinwheel square: 8 triangles from the centre, alternate shaded
const pinwheel=(lab='8 سم')=>{const c=[[10,10],[80,10],[150,10],[150,80],[150,150],[80,150],[10,150],[10,80]];let s='';for(let i=0;i<8;i++){const a=c[i],b=c[(i+1)%8];s+=`<path d="M80 80 L${a[0]} ${a[1]} L${b[0]} ${b[1]} Z" fill="${i%2?'#fff':PINK+'aa'}" stroke="#1d2b53" stroke-width="1.5"/>`;}
  return S(185,175,s+`<rect x="10" y="10" width="140" height="140" fill="none" stroke="#1d2b53" stroke-width="2.5"/>`+T(80,170,lab,14)+`<text x="172" y="84" font-size="14" fill="currentColor" stroke="none" text-anchor="middle" transform="rotate(-90 172 80)">${lab}</text>`);};
// hexagon of 6 triangles, each split in two (12 parts); shaded = list of indexes 0..11, col per index
const hex12=(shade,col=INK)=>{const cx=80,cy=75,R=68;const v=[...Array(6)].map((_,i)=>[cx+R*Math.cos(Math.PI/3*i-Math.PI/2),cy+R*Math.sin(Math.PI/3*i-Math.PI/2)]);let s='';
  for(let i=0;i<6;i++){const a=v[i],b=v[(i+1)%6],m=[(a[0]+b[0])/2,(a[1]+b[1])/2];[[a,m],[m,b]].forEach((pp,k)=>{const idx=i*2+k;s+=`<path d="M${cx} ${cy} L${pp[0][0].toFixed(1)} ${pp[0][1].toFixed(1)} L${pp[1][0].toFixed(1)} ${pp[1][1].toFixed(1)} Z" fill="${shade.includes(idx)?col:'#fff'}" stroke="#1d2b53" stroke-width="1.5"/>`;});}
  return S(160,150,s);};
// hexagon of 6 triangles with fills array
const hex6=(fills)=>{const cx=45,cy=42,R=38;const v=[...Array(6)].map((_,i)=>[cx+R*Math.cos(Math.PI/3*i-Math.PI/2),cy+R*Math.sin(Math.PI/3*i-Math.PI/2)]);let s='';for(let i=0;i<6;i++){const a=v[i],b=v[(i+1)%6];s+=`<path d="M${cx} ${cy} L${a[0].toFixed(1)} ${a[1].toFixed(1)} L${b[0].toFixed(1)} ${b[1].toFixed(1)} Z" fill="${fills[i]||'#fff'}" stroke="#1d2b53" stroke-width="1.5"/>`;}return S(90,84,s);};
// grid with shaded cells [[col,row],...]
const gridSh=(cols,rows,cells,c=26,col=PINK+'aa')=>{let s='';cells.forEach(([x,y])=>s+=`<rect x="${6+x*c}" y="${6+y*c}" width="${c}" height="${c}" fill="${col}" stroke="none"/>`);for(let i=0;i<=cols;i++)s+=`<line x1="${6+i*c}" y1="6" x2="${6+i*c}" y2="${6+rows*c}" stroke-width="1.5"/>`;for(let j=0;j<=rows;j++)s+=`<line x1="6" y1="${6+j*c}" x2="${6+cols*c}" y2="${6+j*c}" stroke-width="1.5"/>`;return S(cols*c+12,rows*c+12,s);};
// staircase: row i has i+1 squares, shaded = i (first square of each row unshaded)
const stairs=(n)=>{const c=20;let s='';for(let r=0;r<n;r++)for(let k=0;k<=r;k++)s+=`<rect x="${6+k*c}" y="${6+r*c}" width="${c}" height="${c}" fill="${k<r?PINK+'aa':'#fff'}" stroke="#1d2b53" stroke-width="1.5"/>`;return S(n*c+12,n*c+12,s);};
// zigzag circles: top values (n), bottom values (n-1), each bottom = sum of two above; '' = empty, '★' marked
const zig=(top,bot)=>{let s='';const g=62;top.forEach((v,i)=>{const x=30+i*g;if(i<bot.length){s+=`<path d="M${x} 32 L${x+g/2} 92 L${x+g} 32"/>`;}});
  top.forEach((v,i)=>{const x=30+i*g;s+=`<circle cx="${x}" cy="32" r="21" fill="#fff"/>`+T(x,39,v,18);});bot.forEach((v,i)=>{const x=30+i*g+g/2;s+=`<circle cx="${x}" cy="92" r="21" fill="${v==='★'?GOLD+'55':'#fff'}"/>`+T(x,99,v,18);});return S(top.length*g,124,s);};
// clock face (optionally mirrored)
const clockF=(h,m,mir=false)=>{let s='<circle cx="70" cy="70" r="60" fill="#fff"/>';for(let i=1;i<=12;i++){const a=i*Math.PI/6-Math.PI/2;s+=T((70+47*Math.cos(a)).toFixed(1),(76+47*Math.sin(a)).toFixed(1),i,14);}
  const am=m*Math.PI/30-Math.PI/2,ah=((h%12)+m/60)*Math.PI/6-Math.PI/2;s+=`<path d="M70 70 L${(70+30*Math.cos(ah)).toFixed(1)} ${(70+30*Math.sin(ah)).toFixed(1)}" stroke-width="5"/><path d="M70 70 L${(70+44*Math.cos(am)).toFixed(1)} ${(70+44*Math.sin(am)).toFixed(1)}" stroke-width="3"/><circle cx="70" cy="70" r="4" fill="currentColor"/>`;

const X2P8A='في إحدى ليالي الصيف المقمرة، وبينما كان القمر بدرًا يسطع فيغمره نور الكون قرّر أفراد العائلة السهر على سطح البيت كما اعتادوا أن يفعلوا في مثل هذه الليالي.<br>طوت دينا البساط المخصص للجلوس فوق السطح وشارك أخوها ليث في نقل الوسائد الصغيرة والأب والأم أعدا العشاء، أما الجدة فلم يكن بمقدورها أن تحمل سوى طبق القش الذي باشرت بجدل عيدانه وتنسيق ألوانه، وهرّة البيت الأليفة كانت على مقربة من أفراد الأسرة تلهو بكرة صوفية بيضاء.<br>حالما انتهى الجميع من تناول العشاء قال ليث: الحمد لله لقد شبعت. فاقترح الأب على والدته وزوجته وولديه أن يقوموا بلعبة مسلية، ماذا بودكم أن تلعبوا سألت الأم؟<br>احتار الجميع وتبادلوا النظرات، ابتسم القمر وهو يسمع كلامهم ثم قال: ما رأيكم لو راح كل منكم يشبهني بشيء يحبه ومن يعجبني تشبيهه سأكافئه بهدية لطيفة. وافق الكبار والصغار على اقتراح القمر وكانوا جميعًا فرحين لأنه يحادثهم ويراهم.<br>بدأت الجدة بقولها: طبق القش الملون الذي أصنعه سيكبر ويكتمل ويصبح كاستدارتك أيها القمر.<br>قال الأب: مقود سيارتي الذي تلامسه يداي كل يوم يشبهك أيها القمر.<br>قالت الأم: كعكة العيد التي تصنعها أصابعي بمهارة قريبة من شكلك أيها القمر.<br>قالت دينا: وجه لعبتي الجميل مثل وجهك أيها القمر.<br>قال ليث: إنك كالرغيف المقمر اللذيذ هم... هم أيها القمر.<br>قفزت الهرة وماءت مياو... مياو هاي هي كرتي الصوفية البيضاء تشبهك أيها القمر.<br>ابتسم القمر وقد بدت على وجهه علامات السرور والسعادة: لقد أعجبني كل ما قلتموه ولذا سأكافئكم جميعًا بأن أزوركم من وقت لآخر لنلعب اللعبة نفسها ولكن ضعوا في حسبانكم أن شكلي لن يبقى على حاله وإنما سيتغير عندما أدخل مراحل جديدة.';

const X2P9A='كان في قديم الزمان ملك كبير حكيم اسمه حسّان وكان الملك حسّان يحب الأذكياء ويرفع قدرهم فهو يقيم مسابقة بين حين وآخر يطرح فيها سؤالًا واحدًا ومن يجب عنه يقلّده وسامًا ملكيًا رفيعًا. واليوم هو يوم المسابقة الكبرى.<br>الملك حسان في شرفة القصر وحوله الوزراء والقادة والساحة الواسعة تغص بالبشر من رجال ونساء وأطفال وكل واحد يقول في سرّه: ما سؤال اليوم؟ لقد حضر الناس من أقصى المملكة ليسمعوا السؤال الجديد وهو: ما أغلى قطرة في المملكة؟ ومتى الجواب؟ في مثل هذا اليوم من العام القادم. وانصرف الناس يفكرون في السؤال.<br>قال طفل لأبيه: إذا عرفت أغلى قطرة هل سأنال وسام الملك؟ ابتسم والده وقال: نعم يا بني. قال الطفل: قطرة العسل. لماذا؟ لأنها حلوة ولذيذة.<br>قالت طفلة لأمها: أنا أعرف أغلى قطرة. قالت: ما هي؟ قطرة العطر. لأنها طيبة الرائحة.<br>وشغل الناس بالقطرات فهذا يقول: إنها قطرة زيت وذاك يقول إنها قطرة النفط، وأكثرهم يقول: إن سؤال الملك ليس سهلًا كما تظنون فما القطرة التي يريد؟<br>قال محمد: لن أهدأ حتى أعرف الجواب. وأقبل على مطالعة الكتب ومصاحبة العلماء، تارة يقرأ في كتاب وطورًا يصغي إلى عالم. مضت عدة أشهر ولم يصل إلى ما يريد. حتى زار يومًا عالمًا كبيرًا فوجده منكبًا على تأليف كتاب، المحبرة أمامه والريشة في يده وفجأة لمع في ذهنه الجواب: إنها قطرة الحبر فهي رمز العلوم والأدب لولاها ضاع تراثنا، لولاها ما كانت الكتب.';

const X3P1A='يسّر اختراع المواصلات للإنسان التنقل من مكان لآخر بكل سهولة، ودون عناء أو مشقة، مهما كانت المسافات بعيدة، ووسائل المواصلات متنوعة منها ما هو بري كالسيارات والقطارات، ومنها ما هو بحري كالسفن، وهو موضوع نصنا.<br>قديمًا، صنع الإنسان القوارب من أخشاب الأشجار المتوافرة لديه، وكانت صناعة القوارب حينذاك بدائية، فقد كان يسيرها باستخدام المجذاف، وهذا يعني أنها بطيئة الحركة، ثم توصل الإنسان فيما بعد إلى صناعة الأشرعة، التي تُسيّر القارب بسرعة الرياح، ومع مرور الزمن، طوّر الإنسان القوارب الصغيرة؛ لتصبح مراكب شراعية أكبر حجمًا، يستطيع أن يحمل فوقها البضائع.<br>وفي العصر الحديث توصل الإنسان إلى صناعة السفن الكبيرة من ألواح الحديد لتتحمل الأمواج المتلاطمة، ولم تعد هذه السفن تعتمد على الأشرعة بل اخترع الإنسان المحركات التي تعمل بالوقود في تسيير مثل هذه السفن الكبيرة.<br>ومع التقدم العلمي طور الإنسان السفينة إلى باخرة، والباخرة أكبر من السفينة إذ تتسع لكثير من الركاب، وتحوي حمّامات سباحة، ومطاعم، وفندقًا للراحة، ويحمل عليها الإنسان آلاف الأطنان من البضائع، وتطورت بعد ذلك السفن، لتصبح بوارج عملاقة تحمل على متنها الطائرات والصواريخ والجنود، لذلك لم تعد تقتصر على حمل الركاب والبضائع فقط، بل أصبحت وسيلة فعالة في حسم المعارك والحروب، وامتلاكها يعدّ مؤشرًا على مدى قدرة الدولة عسكريًا وقوتها اقتصاديًا.';

const P_EN=`<b>Read the text, then answer:</b><br>The ruler of a country town went out at night to check on his people. He bumped into a man and became very angry, but he saw the man was frightened by the darkness, so he forgave him and went home. In the morning he gave an order that everyone walking at night must carry a lamp. When night came the ruler went out as usual and bumped into the same man. He shouted angrily: How could you disobey my order and walk without a lamp? The man said: Forgive me, my lord, here is the lamp in my hand. The ruler said: But it is empty, there is no candle in it. The man said: So was your order — it said nothing about a candle. The ruler went and gave another order in the morning that candles must be put in lamps. He went out at night and met the man a third time, caught him and said: Now I have you. Where is your lamp and its candle? The man said: Here it is, my lord, with its candle — but you did not order it to be lit. The ruler realised he had made a mistake a second time and let the man go. He learned from this, and from then on his orders were very clear and plain.`;

const P_AR=`<b>اقرأ النص ثم أجب:</b><br>جلس الصياد صالح في منزله حزينًا مكتئبًا، فالعاصفة التي ضربت المنطقة في الأيام السابقة حطمت قارب الصيد الصغير الذي يمتلكه، وليس بإمكانه تعويض خسارته بشراء قارب صيد جديد. وازداد حزنه وتفكيره بالمصير البائس الذي سيصل إليه حاله وحال أسرته. بينما كان الصياد صالح يفكر ويتأمل، تناولت زوجته إبريق الماء الزجاجي عن الطاولة، لكنه سقط من بين يديها، وانشطر إلى نصفين وتناثرت بعض الشظايا الصغيرة هنا وهناك. رفعت زوجة الصياد صالح شطري الإبريق إلى الطاولة من جديد ونظفت الأرض من بقايا الزجاج. كان الصياد صالح يراقب زوجته وكأنه يسلي نفسه بما حدث معها، مبتعدًا عن التفكير بالمصيبة التي ألمت به في تحصيل رزقه المعتمد على صيد السمك وبيعه في سوق المدينة البحرية الصغيرة. ذهبت زوجة الصياد إلى المطبخ وعادت بعلبة الغراء ودهنت الشطرين من الإبريق المكسور، وأعادت لصق كل منهما بالآخر، وقالت: لم يعد الإبريق صالحًا لحفظ الماء، لكنه على أي حال، سيكون إناءً صالحًا للزينة أو مزهرية للورد، سأطلب من ابنتنا أن تلونه وتزينه. هب الصياد صالح من مكانه وصاح مبتهجًا: وجدتها! وجدتها! شكرًا لك يا زوجتي العزيزة! شكرًا لك! نظرت إليه زوجته بدهشة وتساءلت في نفسها: ما التي وجدها يا ترى؟ انطلق الصياد صالح إلى الشاطئ وسحب بقايا قاربه المحطم إلى المنزل، ثم استعار أدوات النجارة من جاره، وشمر عن ساعديه وابتدأ العمل وهو يقول: لم تعد تصلح يا قاربي لصيد السمك لكنك تصلح الآن للزينة أو اللعب! وابتدأ ينجر الأخشاب ويحفرها ويجوفها ويحولها إلى قوارب صغيرة، ثم طلب من ابنته أن تلونها وتزينها. وعندما أصبح لديه مجموعة جميلة، حملها إلى الشاطئ وأطلقها إلى الماء. أعجب الناس بالقوارب الصغيرة، وطلبوا شراءها لأطفالهم، وطلبها بعض السياح ليحتفظوا بها كتذكارات من المدينة البحرية الصغيرة. وهكذا ابتدأت رحلة الصياد صالح من جديد لكسب الرزق.`;
const P_EN=`<b>Read the text, then answer:</b><br>Saleh the fisherman sat at home, sad and gloomy. The storm that had hit the area in the past days had smashed his small fishing boat, and he could not afford to buy a new one. He grew sadder thinking about the miserable future awaiting him and his family. While Saleh was thinking, his wife picked up the glass water jug from the table, but it slipped from her hands and broke in two, with small splinters scattered here and there. She put the two halves back on the table and cleaned the glass off the floor. Saleh watched her as if to distract himself from the disaster that had struck his living, which depended on catching fish and selling them in the market of the small seaside town. His wife went to the kitchen, came back with a tube of glue, glued the two halves of the broken jug together and said: The jug can no longer hold water, but anyway it will make a nice ornament or a flower vase; I will ask our daughter to colour and decorate it. Saleh jumped up and cried happily: I’ve got it! I’ve got it! Thank you, my dear wife! She looked at him in surprise and wondered: what has he found? Saleh hurried to the beach, dragged the remains of his broken boat home, borrowed carpentry tools from his neighbour, rolled up his sleeves and started work, saying: My boat, you can no longer catch fish, but now you are good for decoration or play! He began cutting, carving and hollowing the wood, turning it into small boats, and asked his daughter to colour and decorate them. When he had a nice collection he took them to the beach and floated them on the water. People loved the little boats and asked to buy them for their children, and some tourists bought them as souvenirs of the small seaside town. And so Saleh began a new way of earning his living.`;

const P_AR=`<b>اقرأ النص ثم أجب:</b><br>إن كل من يشاهد العقاب وهو يحوم في الجو وعلى جوانب الأخاديد (الأودية العميقة) دون أن يحرك جناحيه، يقف مندهشًا أمام هذا المنظر المدهش والغريب، خاصة عندما ينقض العقاب بسرعة هائلة نحو الأرض قاصدًا فريسته، التي يمكن أن تكون ثعلبًا أو حجلًا أو أي حيوان آخر. لقد عرف الأقدمون قوة وعظمة الطيور الجارحة، فمنذ الألف الثالث قبل الميلاد اتخذ الفراعنة هذه الطيور وسامًا وشعارًا لملكاتهم على مر سنوات عديدة، وما زالت شعوب عديدة تتخذ هذه الطيور شعارًا أو تزين بها أعلامها، كمصر والولايات المتحدة وألمانيا الغربية (سابقًا). إن حدة نظر هذه الطيور، وأجنحتها القوية، ومخالبها الحادة، جعلها تكون من أقوى الطيور وأكثرها تميزًا. تعتبر الطيور الجارحة عاملًا مساعدًا إيجابيًا للفلاح لأنها تقضي على الحشرات الضارة والقوارض والأفاعي السامة، لكنها تضررت وأصيب العديد منها نتيجة تناولها حيوانات ميتة مسممة مما أدى إلى فقدان أنواع عديدة من تلك الطيور، وأصبح تضمن قائمة الطيور المفقودة والمنقرضة مثل العقاب البازي الذي انقرض من بلادنا. تحدث العديد من الناس قديمًا عن وجود النسور بأعداد كبيرة في بلادنا، أما اليوم فلا نجد إلا القليل من هذه النسور في النقب والجليل وهضبة الجولان. لقد أصبحت قلة عدد هذه الطيور في الآونة الأخيرة يثير القلق، فهي آخذة بالنقصان يومًا بعد يوم، لذلك من الواجب علينا أن نحمي هذه الطيور وأن لا ندخر جهدًا في سبيل حمايتها ومنع قتلها. أعلنت جمعية حماية الطبيعة أن جميع الطيور الجارحة هي (طيور محمية)، إذ يمنع اصطيادها وامتلاك أي حيوان منها دون تصريح خاص، وكل من يخالف هذا القانون ويضبط لديه أي حيوان أو طير بري محمي يقدم للمحاكمة، وتفرض عليه غرامة مالية عالية، بالإضافة إلى عقوبة السجن. اتضح لنا من تجاربنا في السنوات الأخيرة، بأن حب الطبيعة، وإثارة الإعجاب، وترك الأثر الإيجابي، هي الطريقة التربوية المفضلة والناجحة في مجال الجهود المبذولة لحماية الطبيعة. ولكي تتم حماية تلك الطيور، يجب التعرف عليها، والتقرب منها لإبراز جمالها، وقوتها وعظمتها.`;
const P_EN=`<b>Read the text, then answer:</b><br>Anyone who watches the eagle circling in the sky over deep valleys without moving its wings is amazed by this strange and wonderful sight — especially when the eagle dives at great speed towards the ground after its prey, which may be a fox, a partridge or any other animal. The ancients knew the strength and greatness of birds of prey: from the third millennium BC the Pharaohs took these birds as a badge and emblem of their kings for many years, and many nations still use them as emblems or put them on their flags, such as Egypt, the United States and (former) West Germany. Their sharp eyesight, strong wings and sharp claws make them among the strongest and most remarkable birds. Birds of prey help the farmer because they kill harmful insects, rodents and poisonous snakes, but many have been harmed by eating poisoned dead animals, and several kinds have been lost and joined the list of extinct birds. Many people used to talk about the large numbers of vultures in the region; today only a few are left. The falling numbers of these birds are worrying, so we must protect them and spare no effort to stop them being killed. The nature-protection society has declared all birds of prey protected: it is forbidden to hunt or keep them without a special permit, and anyone breaking the law faces trial, a large fine and prison. Our experience in recent years shows that loving nature, inspiring admiration and leaving a positive impression is the best way to educate people about protecting nature. To protect these birds we must get to know them and come close to them to show their beauty, strength and greatness.`;

const P_AR=`<b>اقرأ النص ثم أجب:</b><br>بعد انتهاء اليوم الدراسي، التقى عمرو وسمير أمام بوابة المدرسة، وبعدما تصافحا، قال عمرو باهتمام: ينبغي أن نذهب لزيارة عمي صابر في المنزل، بعد خروجه من المستشفى بالأمس. قال سمير مندهشًا: «عمي صابر رجل طيب.. ماذا حدث له؟!» رد عمرو متأثرًا: «سمعت من ابنه صلاح، صديقنا، أن الطبيب وضع ساقه في الجبس». تعاطف سمير مع كلام عمرو قائلًا: «ينبغي أن نزوره بالفعل؛ فزيارة المريض من آداب التعامل، ولها أثر طيب في نفس المريض وأهله، وتعمل على نشر المودة والمحبة بين أفراد المجتمع. سوف أستأذن والدي في هذا الأمر، وأكيد سيأتي عندما يعرف معنا». عند المساء توجه الاثنان لزيارة العم صابر، فسلما عليه، وجلسا حوله، وبعد أن قدم الواجب لهما، سأله سمير على استحياء: «قل لي يا عمي لو سمحت.. كيف حدث ذلك؟» هز العم صابر رأسه مبتسمًا وقال: «إنها قشرة الموز يا ولدي». استغرب عمرو وقال: «قشرة موز؟!!» قال العم صابر: «نعم يا ولدي، كنت عائدًا من عملي، وإذا بي بعد خطوات من دخولي الشارع أجد نفسي واقعًا على الأرض، وساقي تؤلمني بشدة، واتضح أن قشرة موز هي التي أوقعتني دون أن أراها أو أشعر بها». سأل سمير متعجبًا: «قشرة موز تفعل كل ذلك؟!!» رد والد سمير متأثرًا: «نعم يا ولدي، وأكثر من ذلك، ولكن الله ستار». قال عمرو: «إن من قواعد الالتزام والنظافة ألا نرمي مخلفاتنا في الطريق، الذي هو ملك لنا جميعًا». أكمل سمير: «رغم الشعارات المكتوبة على الجدران واللافتات، والشعارات المذاعة التي تدعو إلى المحافظة على النظافة إلا أن هناك الكثيرين ممن يلقون مخلفاتهم في الشارع غير مهتمين بعواقب أفعالهم». قال صلاح وهو ينظر إلى والده بحنو: «لكن يجب علينا أن نستمر في دعوتنا إلى النظافة، والمحافظة على جمال مدينتنا، ولا نيأس من التوعية المستمرة». رد عليهم والد سمير مبتسمًا، فخورًا بهم: «بارك الله لنا فيكم يا أولاد، ونتمنى الشفاء لعمكم صابر...».`;
const P_EN=`<b>Read the text, then answer:</b><br>After school, Amr and Samir met at the school gate. After shaking hands Amr said: We should visit Uncle Saber at home; he left hospital yesterday. Samir said in surprise: Uncle Saber is a kind man… what happened to him? Amr said sadly: I heard from his son Salah, our friend, that the doctor put his leg in plaster. Samir agreed: We really should visit him; visiting the sick is good manners, it cheers up the patient and his family, and spreads love among people. I will ask my father’s permission for this, and I am sure he will come with us when he knows. In the evening they went to visit Uncle Saber, greeted him and sat with him. After he had served them, Samir asked shyly: Tell me, uncle, please, how did it happen? Uncle Saber smiled and said: It was a banana peel, my son. Amr was amazed: A banana peel?! Uncle Saber said: Yes, my son. I was coming home from work and a few steps into the street I found myself on the ground with my leg hurting badly. It was a banana peel that tripped me without my seeing it. Samir asked: A banana peel did all that?! Samir’s father said: Yes, my son, and worse, but God protects us. Amr said: Keeping clean means we must not throw our rubbish in the street, which belongs to all of us. Samir added: Despite the slogans on walls and signs and on the radio calling for cleanliness, many people still throw rubbish in the street without caring about what happens. Salah said, looking kindly at his father: But we must keep calling for cleanliness and keeping our city beautiful, and never give up raising awareness. Samir’s father smiled proudly: God bless you, boys, and we wish your Uncle Saber a quick recovery.`;

  const size=()=>{const r=window.devicePixelRatio||1;c.width=Math.round(innerWidth*r);c.height=Math.round(innerHeight*r);c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx=c.getContext('2d');ctx.setTransform(r,0,0,r,0,0);ctx.lineCap='round';ctx.lineJoin='round';apply();};
  const apply=()=>{if(!ctx)return;ctx.globalCompositeOperation=erase?'destination-out':'source-over';ctx.lineWidth=erase?wid*4:wid;ctx.strokeStyle=ink;c.classList.toggle('erasing',erase);};
  const wipe=()=>{if(ctx){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.restore();}};
  const off=()=>{on=false;erase=false;c.classList.remove('erasing');c.style.display='none';tl.style.display='none';wipe();store={q:null,p:null};if(paper){paper=false;c.classList.remove('paper');}last=null;label();};
  b.onclick=()=>{if(on){off();return;}on=true;size();tools();c.style.display='block';tl.style.display='flex';label();};
  tl.onclick=e=>{const x=e.target.closest('button');if(!x)return;

  c.addEventListener('pointerdown',e=>{last=pt(e);try{c.setPointerCapture(e.pointerId)}catch(x){}ctx.beginPath();ctx.arc(last[0],last[1],ctx.lineWidth/2,0,7);ctx.fillStyle=ink;ctx.fill();e.preventDefault();});
  c.addEventListener('pointermove',e=>{if(!last)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;e.preventDefault();});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>c.addEventListener(ev,()=>{last=null;}));

function syncDone(){
  stopWatch();

  if(!code||!st.user||st.user.role==='admin'||!window.RG||!window.RG.watchResults)return;
  unwatchRes=window.RG.watchResults(code,list=>{
    if(!list||st.doneKey!==key)return;
    const pend=window.RG.pendingFor?window.RG.pendingFor(code):[];
    const all=list.concat(pend).filter(r=>r&&MODELS.some(m=>m.n===r.model)).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
    const last={};all.forEach(r=>{last[r.model]=r.percent;});
    let ch=false;for(const k in last){if(done[k]!==last[k]){done[k]=last[k];ch=true;}}
    if(ch){try{localStorage.setItem(key,JSON.stringify(done))}catch(e){} reRender();}
  });
  if(window.RG.progGet){const pk=progKey();
    window.RG.progGet(pk).then(c=>{if(!c||st.doneKey!==key)return;let l=null;try{l=JSON.parse(localStorage.getItem(pk)||'null')}catch(e){}

    }).catch(e=>console.warn('progGet',e));}
}

      modelName:A.models[MODELS.filter(x=>x.p===m.p).indexOf(m)],partName:A.parts[m.p],levelName:A.levels[st.level].short,
      percent:done[st.model],right,wrong:n-right-blankN,blank:blankN,total:n,usedSec:st.det.used,totalSec:st.total,timestamp:Date.now()}};
    syncResult();
  }
  renderRes();window.scrollTo(0,0);
}
function syncResult(){
  const sy=st.sync;if(!sy)return;sy.state='saving';drawSync();
  const data=JSON.parse(JSON.stringify(sy.data));
  const ans=JSON.parse(JSON.stringify({studentCode:sy.data.studentCode,byCode:sy.data.byCode,timestamp:sy.data.timestamp,answers:sy.answers}));
  window.RG.saveResult(data,ans).then(r=>{sy.resId=r.id;sy.state=r.state;drawSync();}).catch(e=>{console.error('examResults save failed',e,data);sy.err=(e&&(e.code||e.message))||'unknown';sy.state='fail';drawSync();});
}
function syncAnswers(){
  const sy=st.sync;if(!sy||!sy.resId)return;sy.state='saving';drawSync();
  const data=JSON.parse(JSON.stringify({resultId:sy.resId,studentCode:sy.data.studentCode,byCode:sy.data.byCode,timestamp:sy.data.timestamp,answers:sy.answers}));
  Promise.resolve().then(()=>window.RG.saveAnswers(sy.resId,data)).then(()=>{sy.state='ok';drawSync();}).catch(e=>{console.error('examAnswers save failed',e);sy.err=(e&&(e.code||e.message))||'unknown';sy.state='partial';drawSync();});
}
function drawSync(){
  const el=document.getElementById('syncNote');if(!el||!st.sync)return;const T=t(),s=st.sync.state;
  el.className='sync '+s;el.hidden=false;
  el.innerHTML=s==='saving'?`<span>${T.syncing}</span>`:s==='ok'?`<span>✓ ${st.kid&&st.kid.examOnly?(lang==='en'?'Your result and answers are saved to your account.':'تم حفظ النتيجة وإجاباتك في حسابك.'):T.synced}</span>`:`<span>${s==='partial'?T.syncPartial:T.syncFail}${s==='fail'?`<br><small>${lang==='en'?'Your result is kept on this device and will be sent automatically when the connection returns.':'النتيجة محفوظة على هذا الجهاز وستُرسل تلقائياً عند عودة الاتصال.'}</small>`:''}<br><small class="muted" dir="ltr">${esc(String(st.sync.err||''))} · ${esc(st.sync.data.byCode)} → ${esc(st.sync.data.studentCode)}</small></span><button type="button" class="btn line" id="syncRetry">${T.syncRetry}</button>`;
  const b=document.getElementById('syncRetry');if(b)b.onclick=syncResult;
}
function renderRes(){
  const T=t(); updChrome();
  const Ls=st.list, n=Ls.length;
  const right=Ls.filter(id=>st.ans[id]===Q[id].ans).length;
  const blank=Ls.filter(id=>st.ans[id]===undefined).length;
  const pct=Math.round(right/n*100);
  const used=st.total-Math.max(0,st.left);
  const C=2*Math.PI*70, off=C*(1-pct/100);
  const verdict=T.verdicts[pct>=85?0:pct>=70?1:pct>=50?2:3];
  const weak=[...new Set(Ls.filter(id=>st.ans[id]!==Q[id].ans).map(id=>L(Q[id]).skill))];
  const OR=ORDERS[st.level];const nextN=OR[OR.indexOf(st.model)+1];const nextM=nextN?modelOf(nextN):null;
  const list=Ls.filter(id=>st.filter==='all'||(st.filter==='wrong'&&st.ans[id]!==Q[id].ans)||(st.filter==='flag'&&st.flag[id]));
  app.innerHTML=`<section class="res">
    <div class="sheet score">
      <svg class="ring" viewBox="0 0 170 170" role="img" aria-label="${pct}%">
        <circle cx="85" cy="85" r="70" fill="none" stroke="var(--panel)" stroke-width="14"/>
        <circle cx="85" cy="85" r="70" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 85 85)"/>
        <text x="85" y="94" text-anchor="middle" font-size="34" font-weight="600" fill="var(--fg)" font-family="IBM Plex Mono,monospace">${pct}%</text>
      </svg>
      <div>
        <div class="muted">${T.resOf(esc(st.name),mName(st.model),partName(modelOf(st.model).p))}</div>
        <h2 style="font-size:26px">${verdict}</h2>
        <div class="row" style="margin-top:10px;gap:20px">
          <span>${T.correct}: <b class="num" style="color:var(--good)">${right}</b></span>
          <span>${T.wrong}: <b class="num" style="color:var(--bad)">${n-right-blank}</b></span>
          <span>${T.blank}: <b class="num">${blank}</b></span>
          <span>${T.time}: <b class="num">${fmt(used)}</b></span>
        </div>
      </div>
    </div>
    <div class="sync" id="syncNote" role="status" hidden></div>
    <div class="row"><button class="btn gold" id="cert2">${T.certShow}</button></div>
    ${weak.length?`<div class="sheet"><h2 style="font-size:18px;margin-bottom:10px">${T.weak}</h2><div class="chips">${weak.map(w=>`<span>${w}</span>`).join('')}</div></div>`:''}
    <div class="row" style="justify-content:space-between">
      <h2 style="font-size:20px">${T.review}</h2>
      <div class="filt">
        <button data-f="all" aria-pressed="${st.filter==='all'}">${T.fAll}</button>
        <button data-f="wrong" aria-pressed="${st.filter==='wrong'}">${T.fWrong}</button>
        <button data-f="flag" aria-pressed="${st.filter==='flag'}">${T.fFlag}</button>
      </div>
    </div>
    ${list.length?list.map(id=>{const q=Q[id],Lq=L(q);const mine=st.ans[id];const ok=mine===q.ans;return `<article class="rq">
      <div class="meta"><span>${T.qn(Ls.indexOf(id)+1)} · ${Lq.skill}</span><span style="font-weight:700;color:${ok?'var(--good)':'var(--bad)'}">${ok?T.ok:mine===undefined?T.none:T.bad}</span></div>
      <div class="stem">${Lq.pass?`<div class="passage"><b>${T.readLbl}</b>${Lq.pass}</div>`:''}<p>${stemHTML(q)}</p>${Lq.fig?`<div class="fig">${Lq.fig}</div>`:''}${trBoxHTML(q,id,1)}</div>
      <div class="opts ${q.figOpts?'grid':''}">${q.order.map((k,pos)=>{const c=pos===q.ans?'ok':pos===mine?'no':'';const tag=pos===q.ans?`<span class="tag" style="color:var(--good)">${T.rightTag}</span>`:pos===mine?`<span class="tag" style="color:var(--bad)">${T.yourTag}</span>`:'';return `<button class="opt ${c}" disabled>${optHTML(q,k,pos,tag)}</button>`}).join('')}</div>
      <div class="why"><b>${T.why}</b> ${Lq.e}</div>
    </article>`}).join(''):`<p class="muted">${T.empty}</p>`}
    <div class="row"><button class="btn gold" id="cert">${T.cert}</button>${nextM?`<button class="btn" id="nextm">${T.start(mFull(nextM.n))}</button>`:''}<button class="btn line" id="again">${T.homePage}</button><button class="btn line" id="toQS">⚡ ${lang==='en'?'Practice by idea':'تدرب حسب الأفكار'}</button></div>
  </section>`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{st.filter=b.dataset.f;renderRes()});
  document.getElementById('again').onclick=()=>{renderStart();window.scrollTo(0,0)};
  const qs=document.getElementById('toQS');if(qs)qs.onclick=openTraining;
  document.getElementById('cert').onclick=()=>showCert(st.model);
  document.getElementById('cert2').onclick=()=>showCert(st.model);
  drawSync();
  const nm=document.getElementById('nextm'); if(nm)nm.onclick=()=>{st.model=nextM.n;renderStart();document.getElementById('go').click()};
}

  setLang(lang==='en'?'ar':'en');

// ---------- certificate ----------
function certHTML(model){
  const T=t();
  let date='';try{date=new Date().toLocaleDateString(T.dateLoc,{year:'numeric',month:'long',day:'numeric'})}catch(e){date=new Date().toISOString().slice(0,10)}
  const rows=MODELS.filter(m=>done[m.n]!==undefined&&levelOf(m.n)===st.level);
  const avg=rows.length?Math.round(rows.reduce((a,m)=>a+done[m.n],0)/rows.length):0;
  const body=model?T.cOne(mName(model),partName(modelOf(model).p),done[model]):T.cAll(rows.length,avg,ORDERS[st.level].length,T.levels[st.level].short);
  const d=st.det&&st.det.model===model?st.det:null;
  const table=model?(d?`<table><tr>${T.dCols.map(c=>`<th>${c}</th>`).join('')}</tr><tr><td>${d.right}</td><td>${d.wrong}</td><td>${d.blank}</td><td dir="ltr">${fmt(d.used)}</td></tr></table>`:''):rows.length?`<table><tr>${T.cCols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr><td>${mName(r.n)}</td><td>${partName(r.p)}</td><td dir="ltr">${done[r.n]}%</td></tr>`).join('')}</table>`:'';
  return `<div class="cert" dir="${T.dir}">
    <div class="medal">${lang==='en'?'M':'م'}</div>
    <div class="sub">${T.cProgram} · ${T.levels[st.level].short}</div>
    <div class="ct">${T.cTitle}</div>
    <p>${T.cGrant}</p>
    <div class="nm">${esc(st.name||'')}</div>
    ${body}${table}
    <p>${T.cWish}</p>
    <div class="sig">
      <div><span class="sub">${T.cDate}</span><b>${date}</b></div>
      <div><span class="sub">${T.cTrainer}</span><b>${T.cTrainerName}</b></div>
    </div>
  </div>`;
}
function showCert(model){
  const T=t();
  gm.innerHTML=`<div class="modal"><div class="cert-wrap">${certHTML(model)}
    <div class="row" style="justify-content:center"><button class="btn gold" id="cPrint">${T.print}</button><button class="btn line" id="cClose" style="background:var(--surface)">${T.close}</button></div>
    <p style="text-align:center;font-size:13.5px;margin:0;color:#e6eaf5">${T.printHint}</p>
  </div></div>`;
  document.getElementById('cClose').onclick=()=>gm.innerHTML='';
  document.getElementById('cPrint').onclick=()=>{
    let pc=document.getElementById('printcert');
    if(!pc){pc=document.createElement('div');pc.id='printcert';document.body.appendChild(pc);}
    pc.dir=T.dir; pc.innerHTML=certHTML(model);
    try{window.print()}catch(e){}
  };
}

applyLang();
if(st.screen==='lang')renderLang(); else if(st.screen==='level')renderLevel(); else renderBoot();
</script>
<script type="module">
/* Firebase: same project and accounts as Mr. Mohamed Ragab's platform (reads accounts, writes exam results to examResults) */
const FB="https://www.gstatic.com/firebasejs/10.7.1/";
const firebaseConfig={apiKey:"AIzaSyAlmVnaD2CnBHJqF9ZpZ1EyJp-CvmqdSAQ",authDomain:"ragabweb-c243a.firebaseapp.com",projectId:"ragabweb-c243a"};
const DOMAIN="@ragabweb.com", ADMIN_CODE="1411";
const slowT=setTimeout(()=>window.MR.bootFail('slow'),9000);
let P,A,F;
try{[P,A,F]=await Promise.all([import(FB+"firebase-app.js"),import(FB+"firebase-auth.js"),import(FB+"firebase-firestore.js")]);}
catch(e){clearTimeout(slowT);window.MR.bootFail('load');throw e;}
const fbApp=P.initializeApp(firebaseConfig), auth=A.getAuth(fbApp), db=F.getFirestore(fbApp);
let secAuth=null;const sec=()=>secAuth||(secAuth=A.getAuth(P.initializeApp(firebaseConfig,"ExamSecondary")));
/* حفظ مضمون للنتائج: تُحفظ أولاً على الجهاز ثم تُرسل، وتُعاد المحاولة تلقائياً حتى تصل */
async function putOnce(col,id,data){const ref=F.doc(db,col,id);try{await F.setDoc(ref,data);}catch(e){if(e&&e.code==="permission-denied"){try{if((await F.getDoc(ref)).exists())return;}catch(_){}}throw e;}}
const Q_={KEY:"mr_pending_results",
  list(){try{return JSON.parse(localStorage.getItem(this.KEY)||"[]")}catch(e){return[]}},
  put(l){try{localStorage.setItem(this.KEY,JSON.stringify(l));return true}catch(e){return false}},
  add(it){const l=this.list().filter(x=>x.id!==it.id);l.push(it);if(!this.put(l)){l[l.length-1]=Object.assign({},it,{answers:null});this.put(l);}},
  drop(id){this.put(this.list().filter(x=>x.id!==id));},
  async push(it){await putOnce("examResults",it.id,it.data);
    if(it.answers){try{await putOnce("examAnswers",it.id,Object.assign({resultId:it.id},it.answers));}catch(e){console.warn("examAnswers",e);this.drop(it.id);return "partial";}}
    this.drop(it.id);return "ok";},
  async save(data,answers){const id=`${data.studentCode}_${data.model}_${data.timestamp}`;const it={id,data,answers:answers||null};this.add(it);return {id,state:await this.push(it)};},
  busy:false,
  async flush(){const u=auth.currentUser;if(this.busy||!u)return;const me=(u.email||"").split("@")[0];this.busy=true;
    try{for(const it of this.list()){if(!it.data||String(it.data.byCode)!==me)continue;try{const r=await this.push(it);window.dispatchEvent(new CustomEvent("mr-result-sent",{detail:{id:it.id,state:r}}));}catch(e){console.warn("pending result",e);}}}finally{this.busy=false;}}};
window.addEventListener("online",()=>Q_.flush());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")Q_.flush();});
setInterval(()=>{if(Q_.list().length)Q_.flush();},45000);
window.RG={signIn:(code,pass)=>A.signInWithEmailAndPassword(auth,code+DOMAIN,pass),signOut:()=>A.signOut(auth),
  saveResult:(data,answers)=>Q_.save(data,answers),
  saveAnswers:(id,data)=>putOnce("examAnswers",id,data),
  watchResults:(code,cb)=>F.onSnapshot(F.query(F.collection(db,"examResults"),F.where("studentCode","==",String(code))),x=>cb(x.docs.map(d=>Object.assign({id:d.id},d.data()))),e=>{console.warn("watchResults",e);cb(null);}),
  pendingFor:code=>Q_.list().filter(x=>x.data&&String(x.data.studentCode)===String(code)).map(x=>Object.assign({id:x.id},x.data)),
  progSave:(id,data)=>F.setDoc(F.doc(db,"examProgress",id),data),
  progGet:id=>F.getDoc(F.doc(db,"examProgress",id)).then(x=>x.exists()?x.data():null),
  progDel:id=>F.deleteDoc(F.doc(db,"examProgress",id)),
  trGet:code=>F.getDoc(F.doc(db,"trainingUsers",code)).then(x=>x.exists()?x.data():null),
  trSet:(code,data)=>F.setDoc(F.doc(db,"trainingUsers",code),data,{merge:true}),
  trAdd:rec=>F.addDoc(F.collection(db,"trainingAttempts"),rec),
  trList:async(code,parent)=>{const c=F.collection(db,"trainingAttempts"),w=[];if(code)w.push(F.where("studentCode","==",code));if(parent)w.push(F.where("parentCode","==",parent));const x=await F.getDocs(w.length?F.query(c,...w):c);return x.docs.map(d=>Object.assign({id:d.id},d.data()));},
  trStudents:async()=>{const [a,b]=await Promise.all([F.getDocs(F.collection(db,"students")),F.getDocs(F.collection(db,"trainingUsers"))]);let ex=[];try{ex=(await F.getDocs(F.collection(db,"examStudents"))).docs.map(d=>({code:d.id,name:d.data().name||""}));}catch(_){}
    return {students:a.docs.map(d=>({code:d.data().code||d.id,name:d.data().name||""})).concat(ex),tu:Object.fromEntries(b.docs.map(d=>[d.id,d.data()]))};},
  trAnswers:id=>F.getDoc(F.doc(db,"examAnswers",id)).then(x=>x.exists()?x.data():null),
  exResults:async code=>{const c=F.collection(db,"examResults");const x=await F.getDocs(code?F.query(c,F.where("studentCode","==",code)):c);return x.docs.map(d=>Object.assign({id:d.id},d.data()));},
  exList:async()=>{const x=await F.getDocs(F.collection(db,"examStudents"));return x.docs.map(d=>Object.assign({code:d.id},d.data())).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));},
  exAdd:async({code,name,pass})=>{
    const inPlat=await F.getDoc(F.doc(db,"students",code));if(inPlat.exists()){const e=new Error('exists');e.code='exists';throw e;}
    const inEx=await F.getDoc(F.doc(db,"examStudents",code));if(inEx.exists()){const e=new Error('exists');e.code='exists';throw e;}
    const sa=sec();await A.createUserWithEmailAndPassword(sa,code+DOMAIN,pass);try{await A.signOut(sa);}catch(_){}
    await F.setDoc(F.doc(db,"examStudents",code),{code,name,password:pass,createdAt:Date.now(),by:"exam-site"});},
  exDel:async(code,pass)=>{const sa=sec();try{await A.signInWithEmailAndPassword(sa,code+DOMAIN,pass);await A.deleteUser(sa.currentUser);}catch(e){console.warn('auth delete',e);}try{await A.signOut(sa);}catch(_){}
    await F.deleteDoc(F.doc(db,"examStudents",code));}};
A.onAuthStateChanged(auth,async user=>{
  clearTimeout(slowT);
  if(!user){window.MR.onUser(null);return;}
  const code=(user.email||"").split("@")[0];
  Q_.flush();
  try{
    if(code===ADMIN_CODE){window.MR.onUser({code,role:"admin",kids:[]});return;}

    if(!kids.length){
      const s=await F.getDoc(F.doc(db,"students",code));
      if(!s.exists()){
        const x=await F.getDoc(F.doc(db,"examStudents",code));

        kids=[{code,name:x.data().name||"",parentCode:"",examOnly:true}];role="student";
      } else kids=[{code,name:s.data().name||"",parentCode:s.data().parentCode||""}];role="student";
    }
    kids.sort((a,b)=>(a.name||"").localeCompare(b.name||"","ar"));
    window.MR.onUser({code,role,kids});
  }catch(e){console.error(e);window.MR.onUser(null,e.code==="permission-denied"?"perm":"net");try{await A.signOut(auth)}catch(_){}}
});

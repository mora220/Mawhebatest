 ['shp','إذا تحوّل المثلث إلى سداسي (بمضاعفة عدد أضلاعه)، فإلى أي شكل يتحول المربع بالقاعدة نفسها؟','If a triangle becomes a hexagon (its sides are doubled), what does a square become by the same rule?',[poly(8),poly(6),poly(4),poly(5)],null,'المربع له 4 أضلاع، وضعفها 8: الشكل الثماني.','A square has 4 sides; double is 8: an octagon.',{figOpts:true}],
 ['rank','ثلاث قطط: مشمش وسكر ولولو. مشمش أثقل من سكر، ولولو أخف من سكر. أي العبارات صحيحة؟','Three cats: Mishmish, Sukkar and Lulu. Mishmish is heavier than Sukkar, and Lulu is lighter than Sukkar. Which is true?',['مشمش أثقل من لولو','لولو أثقل من مشمش','سكر أخف من لولو','سكر أثقل من مشمش'],['Mishmish is heavier than Lulu','Lulu is heavier than Mishmish','Sukkar is lighter than Lulu','Sukkar is heavier than Mishmish'],'الترتيب: مشمش ثم سكر ثم لولو، فمشمش أثقل من لولو.','The order is Mishmish, Sukkar, Lulu, so Mishmish is heavier than Lulu.'],
 ['earth','تكوّنت شقوق في صخرة بسبب تجمّد الماء داخلها وتمدده. تسمى هذه العملية:','Cracks formed in a rock because water inside froze and expanded. This is called:',['تجوية ميكانيكية','تجوية كيميائية','تجوية عضوية','ترسيب'],['mechanical weathering','chemical weathering','biological weathering','deposition'],'تفتيت الصخر بقوة فيزيائية دون تغيير مادته تجوية ميكانيكية.','Breaking rock by a physical force without changing its material is mechanical weathering.'],
 ['ratio','4 عمال يبنون 20 مترًا من سور في 5 أيام. في كم يومًا يبني 5 عمال 50 مترًا بالمعدل نفسه؟','4 workers build 20 m of wall in 5 days. How many days do 5 workers need to build 50 m at the same rate?',['10','8','12','15'],['10','8','12','15'],'العامل يبني في اليوم 20 ÷ (4 × 5) = 1 م، فالعمال الخمسة يبنون 5 م يوميًا، و 50 ÷ 5 = 10 أيام.','One worker builds 20 ÷ (4 × 5) = 1 m a day, so 5 workers build 5 m a day; 50 ÷ 5 = 10 days.'],
 ['mat','ما الشكل الذي يكمل المجموعة؟','Which shape completes the set?',[arrow(270),arrow(225),arrow(315),arrow(0)],null,'في كل صف يدور السهم ثُمن دورة (45°) مع عقارب الساعة، والصف الثالث: 180° ثم 225° ثم 270°.','In each row the arrow turns 45° clockwise; row three: 180°, 225°, then 270°.',{figOpts:true,fig:mx([arrow(0),arrow(45),arrow(90),arrow(90),arrow(135),arrow(180),arrow(180),arrow(225),sep('؟')])}],
 ['frac','حدد الشكل الذي يعطي علاقة مشابهة: 80 : 20 مثل الدائرة الكاملة : ......','Choose the shape that gives a similar relationship: 80 : 20 is like a whole circle : ......',[pie(4,3),pie(4,1),pie(4,2),pie(8,7)],null,'20 ربع 80، فنختار ربع الدائرة.','20 is a quarter of 80, so we choose a quarter of the circle.',{figOpts:true,fig:anaS('80','20',pie(4,0))}],
 ['rel','الزئير بالنسبة للأسد كالنهيق بالنسبة لـ:','A roar is to a lion as a bray is to:',['الحمار','الحصان','الذئب','الكلب'],['a donkey','a horse','a wolf','a dog'],'صوت الأسد زئير، وصوت الحمار نهيق.','A lion roars; a donkey brays.'],
 ['rel','علاقة الفرو بالأرنب كعلاقة ...... بالسلحفاة','Fur is to a rabbit as ...... is to a tortoise',['الدَّرَقة (الصدفة)','الخياشيم','الريش','الأجنحة'],['the shell','gills','feathers','wings'],'الفرو يغطي جسم الأرنب، والدرقة تغطي جسم السلحفاة وتحميها.','Fur covers a rabbit, and a shell covers and protects a tortoise.'],
 ['rel','العلاقة بين: نظارة : علبة تشبه:','The relationship “glasses : case” is like:',['سيف : غمد','قلم : كتابة','باب : مقبض','ماء : عطش'],['sword : sheath','pen : writing','door : handle','water : thirst'],'النظارة تُحفظ في العلبة، والسيف يُحفظ في الغمد.','Glasses are kept in a case, and a sword is kept in a sheath.'],
 ['odd','المفردة الشاذة فيما يأتي:','Which word is the odd one out?',['كرة','إبرة','مقص','دبوس'],['ball','needle','scissors','pin'],'الإبرة والمقص والدبوس أشياء حادة، أما الكرة فلا.','The needle, scissors and pin are sharp; a ball is not.'],
 ['odd','المفردة الشاذة فيما يأتي:','Which word is the odd one out?',['رمح','خوذة','درع','ترس'],['spear','helmet','armour','shield'],'الخوذة والدرع والترس للحماية، أما الرمح فللهجوم.','Helmet, armour and shield are for protection; a spear is for attacking.'],
 ['odd','أوجد المختلف فيما يأتي:','Find the odd one out:',['مكنسة','ميزان','مسطرة','ترمومتر'],['broom','scales','ruler','thermometer'],'الميزان والمسطرة والترمومتر أدوات قياس، أما المكنسة فللتنظيف.','Scales, ruler and thermometer measure things; a broom is for cleaning.'],
 ['rel','أكمل وفق النمط: أبيض : ناصع ، أصفر : ......','Complete the pattern: white : snow-white, yellow : ......',['فاقع','قانٍ','حالك','داكن'],['bright yellow','deep red','pitch black','dark'],'الناصع شديد البياض، والفاقع شديد الصفرة.','“Snow-white” is very white, and “bright yellow” is very yellow.'],
 ['rel','أكمل وفق النمط: شجرة : جذع ، جسم : ......','Complete the pattern: tree : trunk, body : ......',['العمود الفقري','الشعر','الظفر','الجلد'],['the spine','hair','a nail','skin'],'الجذع يحمل الشجرة ويسندها، والعمود الفقري يحمل الجسم ويسنده.','The trunk holds up a tree, and the spine holds up the body.'],

 ['ant','أكمل بما يناسب: نجاح : رسوب','Complete with the matching pair: success : failure',['شجاعة : جُبن','ذكاء : فطنة','سرعة : عجلة','كرم : جود'],['bravery : cowardice','intelligence : cleverness','speed : haste','generosity : giving'],'النجاح ضد الرسوب، والشجاعة ضد الجبن؛ أما البقية فمترادفات.','Success is the opposite of failure, and bravery of cowardice; the others are similar words.'],
 ['sym','إذا كان: ★ + ★ = ◆ ، و ◆ + ★ = ■ ، فإن ★ + ★ + ★ + ★ = ؟','If ★ + ★ = ◆ and ◆ + ★ = ■, then ★ + ★ + ★ + ★ = ?',['◆ + ◆','■','■ + ◆','◆'],['◆ + ◆','■','■ + ◆','◆'],'◆ = نجمتان، فأربع نجوم = ◆ + ◆. (■ = 3 نجوم فقط.)','◆ is two stars, so four stars = ◆ + ◆. (■ is only 3 stars.)'],
 ['gear','بكرتان مربوطتان بسير: نصف قطر الكبيرة 10 سم والصغيرة 5 سم. إذا دارت الكبيرة 3 دورات في الدقيقة، فكم دورة تدور الصغيرة في الدقيقة؟','Two pulleys are joined by a belt: the big one has a radius of 10 cm and the small one 5 cm. If the big one turns 3 times a minute, how many times does the small one turn?',['6','3','1.5','15'],['6','3','1.5','15'],'الصغيرة نصف الكبيرة، فتدور ضعف عدد الدورات: 3 × 2 = 6.','The small pulley is half the size, so it turns twice as often: 3 × 2 = 6.'],
 ['gear','قضيب مسنّن فوق ترس، وقضيب مسنّن آخر تحت الترس نفسه. إذا تحرّك القضيب العلوي إلى اليمين، فإن القضيب السفلي يتحرك:','A toothed bar sits above a gear and another toothed bar sits below the same gear. If the top bar moves right, the bottom bar moves:',['إلى اليسار بالسرعة نفسها','إلى اليمين بالسرعة نفسها','إلى اليسار بسرعة أكبر','لا يتحرك'],['left at the same speed','right at the same speed','left, faster','it does not move'],'يدور الترس بحركة القضيب العلوي، فيدفع أسفله القضيب الآخر في الاتجاه المعاكس بالسرعة نفسها.','The top bar turns the gear, and the bottom of the gear moves the other bar the opposite way at the same speed.'],
 ['pct','العدد الذي يمثل 50٪ من ثلث العدد 90 هو:','50% of a third of 90 is:',['15','30','45','10'],['15','30','45','10'],'ثلث 90 = 30، ونصفه 15.','A third of 90 is 30, and half of that is 15.'],
 ['phy','صف من 4 كرات معدنية متلاصقة على سطح أملس، اصطدمت بها كرة مماثلة من جهة اليسار. ماذا تتوقع أن يحدث؟','A row of 4 metal balls touches on a smooth surface. An identical ball hits the row from the left. What do you expect?',['تتحرك الكرة الأخيرة في جهة اليمين وحدها','تتحرك الكرات كلها معًا','ترتد الكرة القادمة فقط','لا يتحرك شيء'],['only the last ball on the right moves off','all the balls move together','only the incoming ball bounces back','nothing moves'],'تنتقل الحركة عبر الكرات المتلاصقة فتنطلق الكرة الأخيرة وحدها بالسرعة نفسها تقريبًا.','The movement passes through the touching balls, and the last one shoots off on its own.']

 ['chem','يتغير لون ورقة تباع الشمس الزرقاء إلى الحمراء عند غمسها في:','Blue litmus paper turns red when dipped in:',['عصير الليمون','ماء الصابون','محلول الأمونيا','الماء المقطر'],['lemon juice','soapy water','ammonia solution','distilled water'],'الحمض يحوّل ورقة تباع الشمس الزرقاء إلى حمراء، وعصير الليمون حمضي.','Acids turn blue litmus red, and lemon juice is acidic.'],
 ['chem','المادة المختلفة فيما يلي هي:','Which material is different?',['الكبريت','النحاس','الذهب','الألومنيوم'],['sulfur','copper','gold','aluminium'],'النحاس والذهب والألومنيوم فلزات، أما الكبريت فلا فلز.','Copper, gold and aluminium are metals; sulfur is a non-metal.'],
 ['phy','ملأ خالد بالونًا بالهواء تمامًا في غرفة باردة، ثم أخرجه إلى شمس الظهيرة الحارة. من المتوقع أن:','Khaled filled a balloon fully with air in a cold room, then took it into the hot midday sun. What is likely?',['يتمدد البالون كثيرًا وقد ينفجر','ينكمش البالون','يبقى كما هو تمامًا','يتحول الهواء داخله إلى ماء'],['it swells and may burst','it shrinks','it stays exactly the same','the air turns into water'],'الهواء يتمدد بالحرارة، فيزيد ضغطه داخل البالون الممتلئ.','Air expands when heated, so the pressure in the full balloon rises.'],
 ['phy','أي الأشياء الآتية إذا وُضع في دائرة كهربائية بسيطة يضيء المصباح؟','Which object, put into a simple circuit, lets the bulb light up?',['ملعقة من الألومنيوم','مسطرة خشبية','قطعة مطاط','كأس زجاجي'],['an aluminium spoon','a wooden ruler','a piece of rubber','a glass cup'],'الألومنيوم فلز موصل للكهرباء، والبقية عوازل.','Aluminium is a metal that conducts; the others are insulators.'],
 ['bio','تخيّل أن مفصل الركبة لا يتحرك، فهذا سيؤدي إلى:','Imagine your knee joint could not move. This would cause:',['صعوبة المشي وثني الرجل','سهولة الجري','زيادة طول الرجل','تقوية عظام الذراع'],['difficulty walking and bending the leg','easier running','a longer leg','stronger arm bones'],'مفصل الركبة يسمح بثني الرجل، فإذا تعطل صعب المشي.','The knee lets the leg bend; without it walking becomes hard.'],
 ['num','عددان أوليان مجموعهما 24 وحاصل ضربهما 143:','Two prime numbers add up to 24 and multiply to 143:',['11 ، 13','12 ، 12','7 ، 17','5 ، 19'],['11, 13','12, 12','7, 17','5, 19'],'11 + 13 = 24، و 11 × 13 = 143.','11 + 13 = 24 and 11 × 13 = 143.'],
 ['patt','اكتشف قانون المتتالية واكتب الحد الخامس: 1/3 ، 2/5 ، 3/7 ، 4/9 ، ......','Find the rule and the fifth term: 1/3, 2/5, 3/7, 4/9, ......',['5/11','5/10','6/11','4/11'],['5/11','5/10','6/11','4/11'],'البسط يزيد 1 والمقام يزيد 2.','The top goes up by 1 and the bottom by 2.'],
 ['clk','إذا كانت الساعة الآن 9:30 صباحًا، فكم تكون الساعة بعد 200 دقيقة؟','It is 9:30 a.m. What time will it be in 200 minutes?',['12:50 ظهرًا','12:30 ظهرًا','1:10 ظهرًا','11:50 صباحًا'],['12:50 p.m.','12:30 p.m.','1:10 p.m.','11:50 a.m.'],'200 دقيقة = 3 ساعات و 20 دقيقة، و 9:30 + 3:20 = 12:50.','200 minutes = 3 h 20 min; 9:30 + 3:20 = 12:50.'],
 ['ctx','أكمل: «ما فات لن يعود، فاستعدّ لِما ......»','Complete: “What has passed will not return, so get ready for what ......”',['سيأتي','مضى','فات','انتهى'],['is coming','went by','passed','ended'],'المعنى يقابل بين الماضي (ما فات) والمستقبل (ما سيأتي).','The sentence contrasts the past with the future.'],
 ['logic','كل الكتب طيور، وكل الطيور جبال. إذن:','All books are birds, and all birds are mountains. So:',['كل الكتب جبال','كل الجبال كتب','كل الطيور كتب','بعض الجبال ليست طيورًا'],['all books are mountains','all mountains are books','all birds are books','some mountains are not birds'],'الكتب داخل الطيور، والطيور داخل الجبال، فالكتب داخل الجبال.','Books are inside birds and birds inside mountains, so books are inside mountains.'],
 ['code','إذا رمزنا لكل مضلع بعدد أضلاعه، فما ناتج: السداسي + المثلث − المربع؟','If each polygon stands for its number of sides, what is hexagon + triangle − square?',['5','6','13','4'],['5','6','13','4'],'6 + 3 − 4 = 5.','6 + 3 − 4 = 5.'],
 ['prob','زار متحفًا 4250 زائرًا في شهر، و 3750 زائرًا في الشهر التالي، ورسم الدخول 12 ريالًا للزائر. ما مجموع رسوم الشهرين؟','A museum had 4250 visitors one month and 3750 the next. The ticket is 12 riyals. How much was collected in the two months?',['96000','86000','8000','48000'],['96000','86000','8000','48000'],'عدد الزوار 4250 + 3750 = 8000، و 8000 × 12 = 96000 ريال.','Visitors 4250 + 3750 = 8000; 8000 × 12 = 96000 riyals.']

 ['place','أصغر عدد مكوّن من خمس منازل هو:','The smallest 5-digit number is:',['10000','11111','99999','1000'],['10000','11111','99999','1000'],'أصغر عدد من خمسة أرقام يبدأ بالواحد وبعده أصفار: 10000.','The smallest 5-digit number is 1 followed by four zeros: 10000.'],
 ['ops','أنتج مصنع في سنة 3425160 علبة، وفي السنة التالية 4120300 علبة. ما مقدار الزيادة؟','A factory made 3 425 160 cans one year and 4 120 300 the next. By how much did it increase?',['695140','705140','695240','7545460'],['695140','705140','695240','7545460'],'4120300 − 3425160 = 695140.','4 120 300 − 3 425 160 = 695 140.'],

 ['ops','30 + 12 × (35 − 15) ÷ 4 = ......','30 + 12 × (35 − 15) ÷ 4 = ......',['90','210','60','150'],['90','210','60','150'],'القوس أولًا: 20، ثم 12 × 20 ÷ 4 = 60، ثم 30 + 60 = 90.','Brackets first: 20; then 12 × 20 ÷ 4 = 60; then 30 + 60 = 90.'],
 ['meas','مستطيل طوله 8 سم وعرضه 5 سم، قُصّ من أحد أركانه مستطيل صغير بعداه 3 سم و 2 سم. ما محيط الشكل الباقي؟','A rectangle 8 cm by 5 cm has a small 3 cm by 2 cm rectangle cut from one corner. What is the perimeter of the shape left?',['26 سم','20 سم','30 سم','23 سم'],['26 cm','20 cm','30 cm','23 cm'],'القص من الركن لا يغير المحيط: 2 × (8 + 5) = 26.','Cutting from a corner does not change the perimeter: 2 × (8 + 5) = 26.'],

 ['prob','قالت ريم: إذا ضربتم عدد أقلامي في 3، ثم أضفتم 4، ثم ضربتم الناتج في 2، ثم طرحتم 10، يكون الناتج 40. كم قلمًا مع ريم؟','Reem said: multiply my number of pens by 3, add 4, multiply by 2, then subtract 10, and you get 40. How many pens has she?',['7','8','6','25'],['7','8','6','25'],'نعكس: 40 + 10 = 50، ÷ 2 = 25، − 4 = 21، ÷ 3 = 7.','Work backwards: 40 + 10 = 50, ÷ 2 = 25, − 4 = 21, ÷ 3 = 7.'],
 ['earth','تخيّل لو توقفت الأرض عن الدوران حول نفسها. ماذا يحدث؟','Imagine the Earth stopped spinning on its axis. What would happen?',['يدوم النهار في جهة والليل في الجهة الأخرى مدة طويلة','تختفي الفصول الأربعة فقط','يختفي القمر','تزداد سرعة الرياح فقط'],['one side would have day and the other night for a very long time','only the seasons would disappear','the Moon would vanish','only the winds would get faster'],'تعاقب الليل والنهار سببه دوران الأرض حول نفسها.','Day and night happen because the Earth spins.'],
 ['rel','علاقة العين بالضوء كعلاقة الأذن بـ:','The eye is to light as the ear is to:',['الصوت','الرائحة','الطعم','الحرارة'],['sound','smell','taste','heat'],'العين تستقبل الضوء، والأذن تستقبل الصوت.','The eye picks up light, and the ear picks up sound.'],

 ['sci','الحقيقة الوحيدة فيما يلي:','The only fact below is:',['الجليد والبخار من مادة واحدة هي الماء','الربيع أجمل الفصول','يُقاس الوزن بالمسطرة','الشمس تدور حول الأرض'],['ice and steam are both water','spring is the nicest season','weight is measured with a ruler','the Sun goes round the Earth'],'الجليد والبخار حالتان للماء نفسه، و«أجمل» رأي، والبقيتان خطأ.','Ice and steam are both water; “nicest” is an opinion; the others are wrong.'],

 ['bio','يُضاف قليل من الزبادي إلى الحليب الدافئ لصنع زبادي جديد؛ وذلك لـ:','A little yoghurt is added to warm milk to make new yoghurt. This is to:',['توفير البكتيريا النافعة التي تحوّل الحليب إلى زبادي','تبريد الحليب','زيادة كمية الماء','منع تخمر الحليب'],['add the helpful bacteria that turn milk into yoghurt','cool the milk','add more water','stop the milk fermenting'],'الزبادي يحتوي على بكتيريا نافعة تتكاثر في الحليب الدافئ فتحوّله إلى زبادي.','Yoghurt contains helpful bacteria that grow in warm milk and turn it into yoghurt.'],

 ['place','أكبر عدد عشري مما يلي إذا قُرّب لأقرب عدد صحيح كان الناتج 7:','Which is the greatest decimal that rounds to 7 (nearest whole number)?',['7.49','7.5','6.49','7.51'],['7.49','7.5','6.49','7.51'],'7.5 و 7.51 تقربان إلى 8، و 6.49 إلى 6، فيبقى 7.49.','7.5 and 7.51 round to 8 and 6.49 to 6, leaving 7.49.'],

 ['patt','أكمل النمط: (1 ، 2) ، (2 ، 4) ، (3 ، 8) ، (4 ، 16) ، ......','Complete: (1, 2), (2, 4), (3, 8), (4, 16), ......',['(5 ، 32)','(5 ، 20)','(5 ، 25)','(6 ، 32)'],['(5, 32)','(5, 20)','(5, 25)','(6, 32)'],'العدد الأول يزيد 1، والثاني يتضاعف.','The first number goes up by 1 and the second doubles.'],

(function(){
  const b=document.createElement('button');b.type='button';b.id='penBtn';b.className='penbtn';
  const c=document.createElement('canvas');c.className='pencv';
  const col=document.createElement('div');col.className='pencol';
  const COLS=['#d6336c','#1d4ed8','#111827','#16a34a'];let ink=COLS[0];
  col.innerHTML=COLS.map((k,i)=>`<button type="button" data-ink="${k}" style="background:${k}" aria-pressed="${i===0}"></button>`).join('');
  document.body.append(c,col,b);
  let on=false,ctx=null,last=null;
  const label=()=>{b.innerHTML=on?`✖ ${lang==='en'?'Cancel pen':'إلغاء القلم'}`:`✏️ ${lang==='en'?'Pen':'القلم'}`;b.setAttribute('aria-pressed',on);};
  const size=()=>{const r=window.devicePixelRatio||1;c.width=Math.round(innerWidth*r);c.height=Math.round(innerHeight*r);c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx=c.getContext('2d');ctx.setTransform(r,0,0,r,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=3;ctx.strokeStyle=ink;};
  const off=()=>{on=false;c.style.display='none';col.style.display='none';if(ctx)ctx.clearRect(0,0,c.width,c.height);last=null;label();};
  b.onclick=()=>{if(on){off();return;}on=true;size();c.style.display='block';col.style.display='flex';label();};
  col.onclick=e=>{const k=e.target.dataset&&e.target.dataset.ink;if(!k)return;ink=k;if(ctx)ctx.strokeStyle=k;col.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.ink===k));};
  const pt=e=>[e.clientX,e.clientY];
  c.addEventListener('pointerdown',e=>{last=pt(e);try{c.setPointerCapture(e.pointerId)}catch(x){}ctx.beginPath();ctx.arc(last[0],last[1],1.4,0,7);ctx.fillStyle=ink;ctx.fill();e.preventDefault();});
  c.addEventListener('pointermove',e=>{if(!last)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;e.preventDefault();});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>c.addEventListener(ev,()=>{last=null;}));
  window.addEventListener('resize',()=>{if(on){const img=ctx.getImageData(0,0,c.width,c.height);size();try{ctx.putImageData(img,0,0)}catch(x){}}});
  window.mrPen=v=>{b.style.display=v?'inline-flex':'none';if(!v&&on)off();else label();};
  window.mrPen(true);
})();

const TRN={me:null,html:null};

const trPlain=o=>JSON.parse(JSON.stringify(o));
function trMe(){

  return {role:st.user.role,code:String(k.code),name:k.name||String(k.code),parentCode:st.user.role==='parent'?String(st.user.code):String(k.parentCode||'')};
}

  me:()=>TRN.me, lang:()=>lang||'ar', level:()=>st.level, theme:()=>document.documentElement.dataset.theme||'', close:()=>closeTraining(),

  touch:code=>window.RG.trSet(String(code),{code:String(code),lastSeen:Date.now()}).catch(()=>{}),
  saveProgress:(code,id,val)=>window.RG.trSet(String(code),trPlain({code:String(code),progress:{[String(id)]:Number(val)}})),
  addAttempt:rec=>{const m=TRN.me;return window.RG.trAdd(trPlain(Object.assign({},rec,{uid:m.code,code:m.code,studentCode:m.code,byCode:m.code,parentCode:m.parentCode||''})));},
  attempts:async code=>{const m=TRN.me;if(!window.RG||!m||m.role==='guest')return [];
    const [l,ex]=await Promise.all([window.RG.trList(code||null,m.role==='parent'?m.parentCode:null),window.RG.exResults?window.RG.exResults(code||null).catch(e=>{console.warn('examResults',e);return [];}):Promise.resolve([])]);
    const mx=ex.map(r=>({id:r.id,mode:'model',modelName:r.modelName||'',partName:r.partName||'',level:r.level,correct:r.right||0,total:r.total||0,pct:r.percent||0,secs:r.usedSec,limit:r.totalSec,atMs:r.timestamp||0,uid:r.studentCode,code:r.studentCode,name:r.studentName||'',ideaIds:[]}));
    return l.map(a=>Object.assign({},a,{uid:a.studentCode})).concat(mx).sort((a,b)=>(b.atMs||0)-(a.atMs||0));},

// ---------- autosave of an unfinished model ----------
const progKey=()=>(st.doneKey||'mr_pdone').replace('mr_pdone','mr_pprog');
function saveProg(){
  if(st.screen!=='exam'||!st.list)return;
  try{localStorage.setItem(progKey(),JSON.stringify({v:2,level:st.level,model:st.model,ans:st.ans,flag:st.flag,cur:st.cur,left:Math.max(1,st.left),total:st.total,name:st.name,ts:Date.now()}))}catch(e){}
}
function clearProg(){try{localStorage.removeItem(progKey())}catch(e){}}
function loadProg(){
  let p=null;try{p=JSON.parse(localStorage.getItem(progKey())||'null')}catch(e){}
  if(!p||!(p.v===2||(p.v===1&&p.model>12))||!LEVELS[p.level]||!MODELS.some(m=>m.n===p.model)||!(p.left>0))return null;
  return p;
}
function progBanner(){
  const p=loadProg();if(!p)return '';const T=t(),n=Q.filter(q=>q.m===p.model).length;
  return `<div class="prog" role="status"><b>${T.progTitle}</b><span>${T.progBody(mFull(p.model),Object.keys(p.ans||{}).length,n,fmt(p.left))}</span><small class="muted">${T.progNote}</small><div class="row"><button type="button" class="btn gold" id="progGo">${T.progGo}</button><button type="button" class="btn line" id="progDrop">${T.progDrop}</button></div></div>`;
}
function resumeProg(){
  const p=loadProg();if(!p)return;
  if(p.level!==st.level){st.level=p.level;try{localStorage.setItem('mr_level',p.level)}catch(e){}}
  st.model=p.model;st.list=Q.filter(q=>q.m===st.model).map(q=>q.id);
  st.ans={};Object.keys(p.ans||{}).forEach(k=>{if(st.list.includes(+k)&&p.ans[k]>=0&&p.ans[k]<4)st.ans[k]=p.ans[k];});
  st.flag=p.flag||{};st.cur=Math.min(Math.max(0,p.cur|0),st.list.length-1);st.left=p.left;st.total=p.total||LEVELS[st.level].mins*60;
  if(p.name&&!st.name)st.name=p.name;
  st.screen='exam';clearInterval(timer);timer=setInterval(tick,1000);renderExam();window.scrollTo(0,0);

  try{
    if(code===ADMIN_CODE){window.MR.onUser({code,role:"admin",kids:[]});return;}
    const ps=await F.getDocs(F.query(F.collection(db,"students"),F.where("parentCode","==",code)));
    let kids=ps.docs.map(d=>({code:d.data().code||d.id,name:d.data().name||""})), role="parent";
    if(!kids.length){
      const s=await F.getDoc(F.doc(db,"students",code));
      if(!s.exists()){
        const x=await F.getDoc(F.doc(db,"examStudents",code));
        if(!x.exists()){window.MR.onUser(null,"notLinked");await A.signOut(auth);return;}
        kids=[{code,name:x.data().name||"",parentCode:"",examOnly:true}];role="student";
      } else kids=[{code,name:s.data().name||"",parentCode:s.data().parentCode||""}];role="student";
    }
    kids.sort((a,b)=>(a.name||"").localeCompare(b.name||"","ar"));
    window.MR.onUser({code,role,kids});
  }catch(e){console.error(e);window.MR.onUser(null,e.code==="permission-denied"?"perm":"net");try{await A.signOut(auth)}catch(_){}}
});
</script>

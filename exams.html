Z27(402,[
 ['word','«العقيقة» طعامٌ يُقدَّم عند:','“Aqeeqa” is a meal served when:',['ولادة مولود','إقامة عرس','قدوم ضيف','العودة من سفر'],['a baby is born','there is a wedding','a guest arrives','someone returns from travel'],'العقيقة ذبيحة وطعام عند ولادة المولود، والوليمة للعرس، والقِرى للضيف.','Aqeeqa is for a new baby; a walima is for a wedding and qira for a guest.'],
 ['rel','علاقة المدفأة بالحرارة مثل علاقة:','Heater is to heat as:',['المصباح : الضوء','الكتاب : المكتبة','المروحة : الصيف','الساعة : الحائط'],['lamp : light','book : library','fan : summer','clock : wall'],'المدفأة تعطي الحرارة، والمصباح يعطي الضوء.','A heater gives heat, and a lamp gives light.'],
 ['ant','مضاد كلمة «الشُّح»:','The opposite of “stinginess” is:',['السخاء','البخل','الفقر','الحرص'],['generosity','meanness','poverty','greed'],'الشح شدة البخل، وضده السخاء والكرم.','Stinginess is extreme meanness; its opposite is generosity.'],
 ['read','«تذهب ريم كل يوم سبت بعد المدرسة إلى المكتبة العامة القريبة من بيتها، فتستعير قصة جديدة، ثم تزور جدتها لتقرأ لها». أي العبارات صحيحة حسب النص؟','“Every Saturday after school Reem goes to the public library near her home, borrows a new story, then visits her grandmother to read to her.” Which is true according to the text?',['تستعير ريم قصة جديدة كل يوم سبت','تقرأ ريم لجدتها كل يوم','ستصبح ريم كاتبة مشهورة','تقضي ريم ساعتين في المكتبة'],['Reem borrows a new story every Saturday','Reem reads to her grandmother every day','Reem will become a famous writer','Reem spends two hours in the library'],'النص يذكر الاستعارة يوم السبت فقط، ولم يذكر القراءة كل يوم ولا مدة البقاء ولا المستقبل.','The text only says she borrows on Saturdays; it says nothing about every day, time spent, or the future.'],
 ['infer','قال شخص: «أحب العمل مع الأطفال ومساعدتهم على التعلم». أي الوظائف الآتية قد لا تكون مناسبة له؟','Someone says: “I love working with children and helping them learn.” Which job might not suit them?',['محاسب في بنك','معلم في مدرسة ابتدائية','مرشد طلابي','أمين مكتبة أطفال'],['bank accountant','primary school teacher','school counsellor','children’s librarian'],'كل الوظائف تتعامل مع الأطفال وتعلمهم إلا المحاسب في البنك.','All the jobs involve children and learning except a bank accountant.'],
 ['logic','كل الطيور لها ريش، ولا شيء من الأسماك له ريش. اختر الاستنتاج الصحيح:','All birds have feathers, and no fish has feathers. Choose the correct conclusion:',['لا شيء من الأسماك طيور','بعض الأسماك طيور','بعض الطيور أسماك','كل ما له ريش سمك'],['no fish is a bird','some fish are birds','some birds are fish','everything with feathers is a fish'],'لو كانت سمكة طائرًا لكان لها ريش، والأسماك لا ريش لها؛ إذن لا شيء من الأسماك طيور.','If a fish were a bird it would have feathers, but fish have none; so no fish is a bird.'],
 ['odd','ما الكلمة الشاذة فيما يلي؟','Which word is the odd one out?',['حصان البحر','الشمس','المريخ','المُذنَّب'],['seahorse','the Sun','Mars','a comet'],'الشمس والمريخ والمذنب أجرام في الفضاء، أما حصان البحر فحيوان بحري.','The Sun, Mars and a comet are in space; a seahorse lives in the sea.'],
 ['exp','إذا كان 3^(س+1) = 6 ، فإن 27^س = ؟','If 3^(x+1) = 6, then 27^x = ?',['8','2','6','18'],['8','2','6','18'],'3^(س+1) = 3 × 3^س = 6 ← 3^س = 2 ، و 27^س = (3^س)³ = 8.','3^(x+1) = 3 × 3^x = 6 → 3^x = 2, and 27^x = (3^x)³ = 8.'],
 ['geo','مربع أ ب ج د طول ضلعه 10 سم، تقاطع قطراه في م، ورُسمت من م قطعة م هـ موازية للضلع أ ب وتنتهي على الضلع ب ج. طول م هـ يساوي:','Square ABCD has side 10 cm. Its diagonals meet at M. A segment ME is drawn from M parallel to AB, ending on BC. ME =',['5 سم','10 سم','2.5 سم','7 سم'],['5 cm','10 cm','2.5 cm','7 cm'],'م منتصف المربع، فالقطعة الموازية لـ أ ب منه حتى ب ج طولها نصف الضلع: 5 سم.','M is the centre, so the segment parallel to AB from M to BC is half a side: 5 cm.'],
 ['age','قال الجد: عمري يزيد 26 عامًا على عمر ابني، وعمري 15 مثل عمر حفيدي. فإذا كان مجموع أعمارنا الثلاثة 98 عامًا، فكم عمر الحفيد؟','Grandpa says: “I am 26 years older than my son, and 15 times my grandson’s age. Our three ages add to 98.” How old is the grandson?',['4','3','5','6'],['4','3','5','6'],'الجد 15ح، والابن 15ح − 26: 15ح + 15ح − 26 + ح = 98 ← 31ح = 124 ← ح = 4.','Grandpa 15g, son 15g − 26: 15g + 15g − 26 + g = 98 → 31g = 124 → g = 4.'],
 ['rank','يقف طلاب في دائرة. إذا بدأنا العد من فهد مع عقارب الساعة كان ترتيب سعد العاشر، وإذا بدأنا من فهد عكس عقارب الساعة كان ترتيب سعد السابع عشر. كم طالبًا في الدائرة؟','Pupils stand in a circle. Counting from Fahad clockwise, Saad is 10th; counting from Fahad anticlockwise, Saad is 17th. How many pupils are in the circle?',['25','27','26','24'],['25','27','26','24'],'فهد وسعد محسوبان في العدّين، فالعدد = 10 + 17 − 2 = 25.','Fahad and Saad are counted in both counts, so the total = 10 + 17 − 2 = 25.'],
 ['num','سبعة أعداد فردية متتالية متوسطها 21. ما أصغرها؟','Seven consecutive odd numbers have a mean of 21. What is the smallest?',['15','13','17','19'],['15','13','17','19'],'المتوسط هو العدد الأوسط (الرابع): 15 ، 17 ، 19 ، 21 ، 23 ، 25 ، 27.','The mean is the middle (4th) number: 15, 17, 19, 21, 23, 25, 27.'],
 ['frac','صرف رجل ثلث نقوده، ثم صرف نصف ما تبقى معه. ما الذي تبقى معه؟','A man spent a third of his money, then half of what was left. What is left?',['ثلث نقوده','نصف نقوده','سدس نقوده','ثلثا نقوده'],['a third of his money','half of his money','a sixth of his money','two thirds of his money'],'بقي 2/3، ونصفها 1/3؛ فالمتبقي 1/3.','2/3 was left, and half of that is 1/3.'],
 ['pct','إذا زدنا عددًا بنسبة 25٪ أصبح 250. ما العدد؟','A number increased by 25% becomes 250. What is the number?',['200','225','187.5','300'],['200','225','187.5','300'],'العدد × 1.25 = 250 ← العدد = 200.','Number × 1.25 = 250 → the number is 200.'],
 ['alg','الفرق بين مربعي عددين طبيعيين متتاليين يساوي:','The difference between the squares of two consecutive whole numbers equals:',['مجموع العددين','الفرق بينهما','حاصل ضربهما','ضعف مجموعهما'],['their sum','their difference','their product','twice their sum'],'(ن + 1)² − ن² = 2ن + 1 = ن + (ن + 1)، مثل 6² − 5² = 11 = 5 + 6.','(n + 1)² − n² = 2n + 1 = n + (n + 1), e.g. 6² − 5² = 11 = 5 + 6.'],
 ['area','في الشكل مستطيل بُعداه 6 و 4، وعلى كل من جانبيه مثلث قاعدته 4 وارتفاعه 3. ما نسبة مساحة الجزء المظلل إلى مساحة الشكل كاملًا؟','A 6 × 4 rectangle has a triangle on each side with base 4 and height 3. What fraction of the whole shape is shaded?',['1/12','1/6','1/8','1/24'],['1/12','1/6','1/8','1/24'],'المستطيل 24، وكل مثلث 6، فالشكل 36. المظلل نصف مثلث = 3، والنسبة 3 ÷ 36 = 1/12.','Rectangle 24, each triangle 6, total 36. The shaded part is half a triangle = 3, so 3/36 = 1/12.',{fig:hexR}],
 ['ratio','ينهي 12 عاملًا عملًا ما في 10 أيام. كم عاملًا نحتاج لننجز العمل نفسه في 8 أيام؟','12 workers finish a job in 10 days. How many workers are needed to finish it in 8 days?',['15','10','14','16'],['15','10','14','16'],'العمل = 12 × 10 = 120 يوم عمل، و 120 ÷ 8 = 15 عاملًا (تناسب عكسي).','The job = 12 × 10 = 120 worker-days, and 120 ÷ 8 = 15 workers (inverse proportion).'],
 ['exp','إذا كان ل عددًا صحيحًا و ل < √90 < ل + 1 ، فإن ل =','If L is a whole number and L < √90 < L + 1, then L =',['9','8','10','45'],['9','8','10','45'],'81 < 90 < 100 ، فالجذر بين 9 و 10.','81 < 90 < 100, so the root is between 9 and 10.'],
 ['numr','أوجد العدد المفقود في الجدول:','Find the missing number in the table:',['8','4','6','12'],['8','4','6','12'],'الناتج = (الأول − الثاني) × 2: (9 − 4) × 2 = 10 ، (7 − 3) × 2 = 8 ، (8 − 5) × 2 = 6 ، (6 − 2) × 2 = 8.','Result = (first − second) × 2: (9 − 4) × 2 = 10, (7 − 3) × 2 = 8, (8 − 5) × 2 = 6, (6 − 2) × 2 = 8.',{fig:tab(['الأول','الثاني','الناتج'],[['9','4','10'],['7','3','8'],['8','5','6'],['6','2','؟']])},{fig:tab(['First','Second','Result'],[['9','4','10'],['7','3','8'],['8','5','6'],['6','2','?']])}],
 ['read','«ليس الغنى أن تملك كثيرًا من المال؛ فكم من غنيٍّ يلهث وراء المزيد ولا يشبع، وكم من فقيرٍ قنع بما عنده فعاش مطمئن البال. فالقناعة كنزٌ لا يفنى». يُفهم من الفقرة أن الغنى الحقيقي هو:','“Wealth is not owning a lot of money. Many rich people chase more and are never satisfied, and many poor people are content with what they have and live at peace. Contentment is a treasure that never runs out.” The text means true wealth is:',['الرضا بما عند الإنسان','جمع المال الكثير','العمل ليلًا ونهارًا','امتلاك البيوت'],['being content with what you have','collecting lots of money','working day and night','owning houses'],'النص يجعل القناعة والرضا هما الغنى الحقيقي.','The text says contentment is the true wealth.'],
 ['mat','ما الشكل الذي يجب وضعه في الفراغ؟','Which shape goes in the empty cell?',[in2('t','c'),in2('c','t'),in2('t','s'),in2('s','c')],null,'في كل صف: الشكل الثالث هو الشكل المفرغ في العمود الثاني وبداخله الشكل المصمت من العمود الأول.','In each row the third shape is the outline from column 2 with the solid shape from column 1 inside it.',{figOpts:true,fig:mx([sm('s'),S(60,60,`<circle cx="30" cy="30" r="25"/>`),in2('c','s'),sm('t'),S(60,60,`<rect x="6" y="6" width="48" height="48"/>`),in2('s','t'),sm('c'),S(60,60,`<path d="M30 4 L56 54 H4 Z"/>`),sep('؟')])}],
 ['bio','ما أكبر عضو في جسم الإنسان؟','What is the largest organ of the human body?',['الجلد','الكبد','القلب','الرئتان'],['the skin','the liver','the heart','the lungs'],'الجلد يغطي الجسم كله، وهو أكبر أعضائه مساحة ووزنًا.','The skin covers the whole body and is its largest organ.'],
 ['logic','إذا كان سلق 3 بيضات معًا في قدر واحد يحتاج إلى 10 دقائق، فكم دقيقة يحتاج سلق 6 بيضات معًا في القدر نفسه؟','If boiling 3 eggs together in one pot takes 10 minutes, how long does boiling 6 eggs together in the same pot take?',['10','20','5','30'],['10','20','5','30'],'البيض يُسلق في الوقت نفسه، فالمدة لا تتغير بتغير العدد.','The eggs cook at the same time, so the time does not change.'],
 ['patt','ما العدد الذي يجب أن يكون في الفراغ: 1 ، 8 ، 27 ، ...... ، 125 ، 216','Which number fills the gap: 1, 8, 27, ......, 125, 216',['64','36','48','100'],['64','36','48','100'],'الأعداد مكعبات: 1³ ، 2³ ، 3³ ، 4³ = 64 ، 5³ ، 6³.','They are cubes: 1³, 2³, 3³, 4³ = 64, 5³, 6³.'],
 ['cnt','كم مثلثًا في الشكل؟','How many triangles are in the figure?',['10','4','8','6'],['10','4','8','6'],'خرجت من الرأس 3 خطوط فقسمت القاعدة إلى 4 أجزاء: 4 + 3 + 2 + 1 = 10.','3 lines from the top split the base into 4 parts: 4 + 3 + 2 + 1 = 10.',{fig:fanTri(3,1)}]

Z27(403,[
 ['syn','مرادف كلمة «ظمآن»:','The meaning of the Arabic word “dham’an” is:',['عطشان','جائع','تعبان','غضبان'],['thirsty','hungry','tired','angry'],'الظمأ هو العطش، فالظمآن هو العطشان.','“Dhama’” means thirst, so “dham’an” means thirsty.'],
 ['ant','مضاد كلمة «السَّغَب»:','The opposite of “saghab” (hunger) is:',['الشِّبع','الجوع','التعب','العطش'],['being full','hunger','tiredness','thirst'],'السغب هو الجوع الشديد، وضده الشبع.','Saghab means great hunger; its opposite is being full.'],
 ['idio','المثل المناسب لمن يعود من سعيه خائبًا بلا فائدة:','Which saying fits someone who comes back from his efforts with nothing?',['رجع بخُفَّي حُنين','أحرص من نملة','ربّ حالٍ أفصح من مقال','الوقت كالسيف'],['“He came back with Hunayn’s shoes”','“Keener than an ant”','“A state can say more than words”','“Time is like a sword”'],'«رجع بخفي حنين» يُقال لمن رجع خائبًا لم ينل ما أراد.','“He came back with Hunayn’s shoes” is said of someone who returns empty-handed.'],
 ['rel','علاقة الذئب بالثعلب مثل علاقة:','Wolf is to fox as:',['النسر بالصقر','الغابة بالشجرة','السماء بالنجم','العش بالعصفور'],['eagle is to falcon','forest is to tree','sky is to star','nest is to sparrow'],'الذئب والثعلب حيوانان مفترسان من النوع نفسه، والنسر والصقر طائران جارحان.','Wolf and fox are both hunting animals; eagle and falcon are both birds of prey.'],
 ['earth','ترتيب الكواكب من الأقرب إلى الشمس إلى الأبعد عنها:','The order of the planets from nearest the Sun to farthest:',['عطارد ← الزهرة ← الأرض ← المريخ','الزهرة ← عطارد ← الأرض ← المريخ','الأرض ← المريخ ← عطارد ← الزهرة','المريخ ← الأرض ← الزهرة ← عطارد'],['Mercury → Venus → Earth → Mars','Venus → Mercury → Earth → Mars','Earth → Mars → Mercury → Venus','Mars → Earth → Venus → Mercury'],'أقرب الكواكب إلى الشمس عطارد، ثم الزهرة، ثم الأرض، ثم المريخ.','Mercury is nearest the Sun, then Venus, Earth and Mars.'],
 ['infer','الوظيفة التي قد لا تكون مناسبة لمن قال: «أحب السفر والتنقل ومقابلة أناس جدد كل يوم»:','Which job might not suit someone who says “I love travelling, moving around and meeting new people every day”?',['أمين أرشيف','مرشد سياحي','مضيف طيران','مندوب مبيعات'],['records archivist','tour guide','flight attendant','sales representative'],'أمين الأرشيف يعمل في مكان ثابت مع الملفات، أما البقية ففيها سفر ولقاء ناس.','An archivist stays in one place with files; the others travel and meet people.'],
 ['logic','صندوقي صغير جدًا، ولا يتحمل أي شيء ثقيل أو كبير الحجم، وقد علمت الآن أن بداخله شيئًا. فما تظنه؟','My box is tiny and cannot hold anything heavy or big. I now know there is something inside. What do you think it is?',['شيء خفيف وصغير','شيء ثقيل','شيء كبير الحجم','شيء ثقيل وكبير'],['something light and small','something heavy','something big','something heavy and big'],'الصندوق لا يتسع للكبير ولا يتحمل الثقيل، فما بداخله لا بد أن يكون خفيفًا وصغيرًا.','The box cannot hold big or heavy things, so what is inside must be light and small.'],

 ['logic','لبست نورة وهيا ولمى ثلاثة ألوان مختلفة من أربعة (أحمر – أزرق – أخضر – أصفر). لبست نورة الأحمر، ولم تلبس هيا الأخضر ولا الأصفر، ولم تلبس لمى الأزرق ولا الأصفر. ما اللون الذي لم تلبسه أي منهن؟','Noura, Haya and Lama each wore a different one of four colours (red, blue, green, yellow). Noura wore red, Haya wore neither green nor yellow, and Lama wore neither blue nor yellow. Which colour did nobody wear?',['الأصفر','الأزرق','الأخضر','الأحمر'],['yellow','blue','green','red'],'نورة الأحمر، فيبقى لهيا الأزرق فقط، ويبقى للمى الأخضر فقط؛ فالأصفر لم يُلبس.','Noura has red, so Haya can only have blue and Lama only green; yellow is left.'],

 ['sym','إذا كان: ▲ + ▲ + ▲ = 21 ، و ▲ + ● = 19 ، و ● − ★ = 3 ، فإن ● + ▲ + ★ = ؟','If ▲ + ▲ + ▲ = 21, ▲ + ● = 19 and ● − ★ = 3, then ● + ▲ + ★ = ?',['28','24','30','32'],['28','24','30','32'],'▲ = 7 ، و ● = 12 ، و ★ = 9 ؛ والمجموع 28.','▲ = 7, ● = 12, ★ = 9; the total is 28.'],
 ['numr','ما العدد المفقود في الجدول؟','What is the missing number in the table?',['26','11','30','35'],['26','11','30','35'],'في كل عمود: العدد السفلي = الأول × الثاني − 4: 3 × 4 − 4 = 8 ، 5 × 4 − 4 = 16 ، 6 × 5 − 4 = 26.','In each column: bottom = top × middle − 4: 3 × 4 − 4 = 8, 5 × 4 − 4 = 16, 6 × 5 − 4 = 26.',{fig:tab(null,[['3','5','6'],['4','4','5'],['8','16','؟']])},{fig:tab(null,[['3','5','6'],['4','4','5'],['8','16','?']])}]
]);

// ===== تجميعات بلس · المستوى الثالث · على نمط الاختبار الخامس من كتاب المستوى الثالث (model 405) =====
Z27(405,[
 ['word','«الأصغران» هما:','In Arabic, “al-asgharan” (the two small ones) are:',['القلب واللسان','العين والأذن','الليل والنهار','الشمس والقمر'],['the heart and the tongue','the eye and the ear','night and day','the Sun and the Moon'],'يقال: «المرء بأصغريه: قلبه ولسانه».','The saying goes: “A person is judged by his two small parts: heart and tongue.”'],
 ['rel','الإسطبل للخيل مثل الخلية لـ:','A stable is to horses as a hive is to:',['النحل','النمل','العصافير','الأرانب'],['bees','ants','sparrows','rabbits'],'الإسطبل مسكن الخيل، والخلية مسكن النحل.','A stable is where horses live; a hive is where bees live.'],
 ['syn','«قائدٌ هُمام»، معنى هُمام:','“A humam leader”: humam means:',['عظيم الهمة شجاع','كثير النوم','قليل الكلام','سريع الغضب'],['brave and high-minded','sleeps a lot','speaks little','quick to anger'],'الهمام هو السيد الشجاع عظيم الهمة.','A humam is a brave, high-minded chief.'],
 ['ant','مضاد كلمة «الكَيِّس» (الفطن العاقل):','The opposite of “kayyis” (wise and clever) is:',['الأحمق','الذكي','الحكيم','الحذر'],['foolish','smart','wise','careful'],'الكيس هو العاقل الفطن، وضده الأحمق.','Kayyis means wise and clever; the opposite is foolish.'],
 ['idio','المثل المناسب لمن أضاع الفرصة وقت إمكانها ثم جاء يطلبها بعد فواتها:','Which saying fits someone who wasted a chance, then asked for it after it was gone?',['الصيفَ ضيّعتِ اللبن','إن كنت ريحًا فقد لاقيت إعصارًا','رمتني بدائها وانسلّت','يداك أوكتا وفوك نفخ'],['“In summer you wasted the milk”','“If you are wind, you have met a hurricane”','“She blamed me for her own fault and slipped away”','“Your hands tied it and your mouth blew it”'],'«الصيف ضيعت اللبن» يقال لمن فرّط في الشيء ثم طلبه بعد فوات وقته.','“In summer you wasted the milk” is said of someone who wasted something and wanted it too late.'],
 ['infer','العالِم خالد يمني الأصل، وُلد في الكويت وعاش فيها. نستنتج من ذلك أن خالدًا:','The scientist Khaled is of Yemeni origin, was born in Kuwait and lived there. So Khaled:',['نسبه يمني ووُلد في الكويت','نسبه كويتي ووُلد في اليمن','نسبه يمني ووُلد في اليمن','نسبه كويتي ووُلد في الكويت'],['is Yemeni by origin and born in Kuwait','is Kuwaiti by origin and born in Yemen','is Yemeni by origin and born in Yemen','is Kuwaiti by origin and born in Kuwait'],'الأصل (النسب) يمني، ومكان الولادة الكويت.','His origin is Yemeni and his birthplace is Kuwait.'],
 ['patt','ما الحد الأول في المتتابعة: ...... ، 3 ، 10 ، 17 ، 24','What is the first term: ......, 3, 10, 17, 24',['−4','0','4','−3'],['−4','0','4','−3'],'الفرق بين كل حدين متتاليين 7: 3 − 7 = −4.','Each term is 7 more than the last: 3 − 7 = −4.'],
 ['ratio','مشروب حجمه 60 لترًا يتكون من جزأين عصير مركّز و 3 أجزاء ماء. كم لترًا من الماء يجب إضافته لتصبح نسبة العصير إلى الماء 1 : 2؟','A 60-litre drink is 2 parts concentrate to 3 parts water. How many litres of water must be added to make the ratio of concentrate to water 1 : 2?',['12','6','18','24'],['12','6','18','24'],'المركّز 24 لترًا والماء 36. نحتاج ماءً ضعف المركّز = 48، فنضيف 12.','Concentrate 24 L, water 36 L. Water must be double the concentrate = 48, so add 12.'],
 ['prob','اشترى طالب كتابًا وقلمًا، وثمن القلم 4 أمثال ثمن الكتاب، وكلاهما عدد صحيح من الريالات. قال البائع: المجموع عدد أقل من 100 ومجموع رقميه 13. كم ثمن القلم؟','A pupil buys a book and a pen. The pen costs 4 times the book, both in whole riyals. The seller says the total is under 100 and its digits add to 13. How much is the pen?',['68','17','85','51'],['68','17','85','51'],'المجموع = 5 أمثال ثمن الكتاب، فهو من مضاعفات 5 ومجموع رقميه 13: 85. الكتاب 17 والقلم 68.','The total is 5 × the book, a multiple of 5 with digit sum 13: 85. The book is 17 and the pen 68.'],
 ['alg','صرفت سارة 15 ريالًا فبقي معها أقل من 40 ريالًا. المبلغ الذي كان معها:','Sara spent 15 riyals and had less than 40 left. The amount she had was:',['(المبلغ < 55)','(المبلغ ≤ 55)','(المبلغ > 55)','(المبلغ ≥ 55)'],['(amount < 55)','(amount ≤ 55)','(amount > 55)','(amount ≥ 55)'],'المبلغ − 15 < 40 ← المبلغ < 55.','Amount − 15 < 40 → amount < 55.'],
 ['exp','إذا كان 5^س = 2 ، فإن 5^(3س + 1) =','If 5^x = 2, then 5^(3x + 1) =',['40','30','10','125'],['40','30','10','125'],'5^(3س + 1) = (5^س)³ × 5 = 8 × 5 = 40.','5^(3x + 1) = (5^x)³ × 5 = 8 × 5 = 40.'],
 ['frac','مع فهد 60 ورقة نقدية: ربعها من فئة 10 ريالات، وثلثها من فئة 50 ريالًا، والباقي من فئة 100 ريال. كم المبلغ الذي معه؟','Fahad has 60 banknotes: a quarter are 10-riyal notes, a third are 50-riyal notes and the rest are 100-riyal notes. How much money does he have?',['3650 ريالًا','3500 ريال','3150 ريالًا','4000 ريال'],['3650 riyals','3500 riyals','3150 riyals','4000 riyals'],'15 × 10 = 150 ، و 20 × 50 = 1000 ، والباقي 25 × 100 = 2500 ؛ المجموع 3650.','15 × 10 = 150, 20 × 50 = 1000, the other 25 × 100 = 2500; total 3650.'],
 ['area','حديقة مستطيلة محيطها 56 م، لو زاد عرضها 3 م ونقص طولها 3 م لأصبحت مربعة. مساحة المربع الناتج:','A rectangular garden has perimeter 56 m. If its width grew by 3 m and its length shrank by 3 m, it would be a square. The square’s area is:',['196 م²','169 م²','180 م²','224 م²'],['196 m²','169 m²','180 m²','224 m²'],'المحيط لا يتغير (56)، فضلع المربع 56 ÷ 4 = 14 ، والمساحة 196.','The perimeter stays 56, so the square’s side is 14 and its area 196.'],
 ['data','يبين الجدول أعلى تردد صوتي يستطيع كل كائن سماعه. أي الكائنات يسمع أصواتًا ترددها أكبر من 100000 هيرتز؟','The table shows the highest sound frequency each animal can hear. Which can hear sounds above 100,000 Hz?',['الخفاش','القطة','الكلب','الفيل'],['the bat','the cat','the dog','the elephant'],'الخفاش وحده يتجاوز 100000 هيرتز (110000).','Only the bat goes above 100,000 Hz (110,000).',{fig:tab(['الكائن','أعلى تردد (هيرتز)'],[['الإنسان','20000'],['الكلب','45000'],['القطة','64000'],['الخفاش','110000'],['الفيل','12000']])},{fig:tab(['Animal','Highest frequency (Hz)'],[['human','20000'],['dog','45000'],['cat','64000'],['bat','110000'],['elephant','12000']])}],
 ['phy','في دائرة كهربائية: المصباح (أ) موصول على التوالي مع البطارية، وبعده ثلاثة مصابيح (ب ، ج ، د) موصولة على التوازي. أي مصباح إذا تعطل انطفأت كل المصابيح؟','In a circuit, bulb A is in series with the battery, and after it bulbs B, C and D are in parallel. Which bulb, if it breaks, makes all the bulbs go out?',['أ','ب','ج','د'],['A','B','C','D'],'التيار كله يمر في المصباح (أ)، فإذا تعطل انقطعت الدائرة كلها؛ أما المصابيح المتوازية فلكل منها فرع مستقل.','All the current passes through A, so if it breaks the whole circuit stops; the parallel bulbs each have their own branch.'],
 ['bio','إذا زُرعت أعداد كبيرة من الأشجار في مدينة، فماذا يحدث لنسبة ثاني أكسيد الكربون والأكسجين في هوائها؟','If many trees are planted in a city, what happens to the carbon dioxide and oxygen in its air?',['تقل نسبة ثاني أكسيد الكربون وتزداد نسبة الأكسجين','تزداد النسبتان','تقل النسبتان','يزداد ثاني أكسيد الكربون ويقل الأكسجين'],['carbon dioxide falls and oxygen rises','both rise','both fall','carbon dioxide rises and oxygen falls'],'الأشجار تمتص ثاني أكسيد الكربون وتطلق الأكسجين في البناء الضوئي.','Trees take in carbon dioxide and give out oxygen in photosynthesis.'],
 ['geo','إذا كانت النسبة بين زوايا مثلث 2 : 3 : 4 ، فإن المثلث:','If a triangle’s angles are in the ratio 2 : 3 : 4, the triangle is:',['حاد الزوايا','قائم الزاوية','منفرج الزاوية','متطابق الأضلاع'],['acute-angled','right-angled','obtuse-angled','equilateral'],'الجزء = 180 ÷ 9 = 20: الزوايا 40° و 60° و 80° ، كلها حادة.','One part = 180 ÷ 9 = 20: the angles are 40°, 60° and 80°, all acute.'],
 ['age','مجموع عمري سارة وريم 30 سنة، ومجموع عمري ريم ونوف 26 سنة، ومجموع عمري سارة ونوف 36 سنة. كم عمر ريم؟','Sara and Reem’s ages add to 30, Reem and Nouf’s to 26, and Sara and Nouf’s to 36. How old is Reem?',['10','16','20','14'],['10','16','20','14'],'مجموع الثلاثة = (30 + 26 + 36) ÷ 2 = 46 ، وريم = 46 − 36 = 10.','All three = (30 + 26 + 36) ÷ 2 = 46, so Reem = 46 − 36 = 10.'],
 ['area','وضعنا أربعة مربعات متطابقة في صف واحد فشكّلت مستطيلًا محيطه 150 سم. مساحة المربع الواحد:','Four equal squares in a row make a rectangle with perimeter 150 cm. The area of one square is:',['225 سم²','144 سم²','100 سم²','لا يمكن تحديدها'],['225 cm²','144 cm²','100 cm²','cannot be found'],'محيط المستطيل = 10 أضلاع = 150 ، فالضلع 15 والمساحة 225.','The perimeter is 10 sides = 150, so a side is 15 and the area 225.'],
 ['exp','العدد 1343 هو مجموع مكعبي عددين، أحدهما 10. ما العدد الآخر؟','1343 is the sum of the cubes of two numbers, one of which is 10. What is the other?',['7','8','9','11'],['7','8','9','11'],'1343 − 1000 = 343 = 7³.','1343 − 1000 = 343 = 7³.'],
 ['numr','ما العدد الذي يجب وضعه في الفراغ؟','Which number fills the gap?',['12','8','18','9'],['12','8','18','9'],'العدد الأخير = (الأول + الثاني) × الثالث: (1 + 3) × 4 = 16 ، (2 + 5) × 3 = 21 ، (4 + 2) × 5 = 30 ، (3 + 3) × 2 = 12.','Last = (first + second) × third: (1 + 3) × 4 = 16, (2 + 5) × 3 = 21, (4 + 2) × 5 = 30, (3 + 3) × 2 = 12.',{fig:tab(null,[['1','3','4','16'],['2','5','3','21'],['4','2','5','30'],['3','3','2','؟']])},{fig:tab(null,[['1','3','4','16'],['2','5','3','21'],['4','2','5','30'],['3','3','2','?']])}],
 ['iso','إذا قلبنا ورقة مكتوبًا عليها العدد 86 رأسًا على عقب (دورة نصف كاملة)، فإنه يُقرأ:','If a card showing 86 is turned upside down (a half turn), it reads:',['98','68','89','86'],['98','68','89','86'],'عند الدوران نصف دورة يتبادل الرقمان مكانيهما ويصبح 6 ← 9 و 8 ← 8 ، فيُقرأ 98.','A half turn swaps the digits’ places and turns 6 into 9 while 8 stays 8, so it reads 98.'],
 ['meas','صندوق مربع الشكل يحتوي على 4 قطع نقدية متساوية في صفين، نصف قطر كل قطعة 5 سم، وهي متلامسة وتلمس جوانب الصندوق. محيط الصندوق:','A square box holds 4 equal coins in two rows. Each coin has radius 5 cm; they touch each other and the sides. The box’s perimeter is:',['80 سم','40 سم','20 سم','100 سم'],['80 cm','40 cm','20 cm','100 cm'],'ضلع الصندوق = قطران = 20 سم ، والمحيط 4 × 20 = 80.','The side is two diameters = 20 cm, so the perimeter is 4 × 20 = 80.'],
 ['mat','ما الشكل الذي يكمل المصفوفة؟','Which picture completes the grid?',[dots(5),dots(4),dots(6),dots(3)],null,'في كل صف يزيد عدد النقاط واحدًا: 1 ، 2 ، 3 ثم 2 ، 3 ، 4 ثم 3 ، 4 ، 5.','Each row adds one dot: 1, 2, 3 then 2, 3, 4 then 3, 4, 5.',{figOpts:true,fig:mx([dots(1),dots(2),dots(3),dots(2),dots(3),dots(4),dots(3),dots(4),sep('؟')])}],
 ['ratio','طائرة تطير بسرعة 600 كم/ساعة، وفي الوقت نفسه يسير قطار بسرعة 150 كم/ساعة. إذا قطع القطار 375 كم، فكم كيلومترًا قطعت الطائرة؟','A plane flies at 600 km/h while a train travels at 150 km/h. If the train covered 375 km, how far did the plane fly?',['1500 كم','1200 كم','900 كم','1800 كم'],['1500 km','1200 km','900 km','1800 km'],'زمن القطار 375 ÷ 150 = 2.5 ساعة، والطائرة 600 × 2.5 = 1500 كم.','The train took 375 ÷ 150 = 2.5 h, so the plane flew 600 × 2.5 = 1500 km.']
]);

// ===== تجميعات بلس · المستوى الثالث · على نمط الاختبار السادس من كتاب المستوى الثالث (model 406) =====
Z27(406,[
 ['word','«الجُلمود» هو:','In Arabic, “julmud” means:',['الصخر الصلب','الرمل الناعم','الماء الجاري','الريح الشديدة'],['hard rock','fine sand','running water','strong wind'],'الجلمود هو الصخر الصلب الضخم.','A julmud is a big, hard rock.'],
 ['rel','علاقة الدقيقة بالساعة مثل علاقة:','A minute is to an hour as:',['الثانية بالدقيقة','اليوم بالأسبوع','الشهر بالسنة','السنتيمتر بالمتر'],['a second is to a minute','a day is to a week','a month is to a year','a centimetre is to a metre'],'الساعة 60 دقيقة، والدقيقة 60 ثانية؛ فالجزء واحد من ستين في الحالتين.','An hour is 60 minutes and a minute is 60 seconds: one sixtieth in both.'],
 ['idio','«لكل جوادٍ كبوة» مثلٌ يُضرب لـ:','The saying “Every fine horse stumbles” is said about:',['المتقن الماهر يخطئ أحيانًا','الكسول لا ينجح','الحصان يحتاج إلى راحة','من يركب الخيل كثيرًا'],['a skilled person sometimes makes a mistake','a lazy person never succeeds','a horse needs rest','someone who rides a lot'],'المثل يعني أن المجيد قد يخطئ مرة، فلا نحكم عليه بخطأ واحد.','It means a skilled person may slip once, so we should not judge by one mistake.'],
 ['ant','مضاد كلمة «اليُسر»:','The opposite of “ease” is:',['العُسر','السهولة','الفرح','الغنى'],['hardship','simplicity','joy','wealth'],'اليسر السهولة، وضده العسر.','Ease means things being easy; the opposite is hardship.'],
 ['logic','«جميع طلاب الفصل يحبون القراءة، وبعض المعلمين لا يحبون القراءة». اختر الاستنتاج الصحيح:','“All the pupils in the class love reading, and some teachers do not love reading.” Choose the correct conclusion:',['بعض المعلمين ليسوا من طلاب الفصل','كل المعلمين لا يحبون القراءة','بعض طلاب الفصل لا يحبون القراءة','كل من يحب القراءة طالب'],['some teachers are not pupils in the class','no teachers love reading','some pupils do not love reading','everyone who loves reading is a pupil'],'من لا يحب القراءة لا يمكن أن يكون من طلاب الفصل، فهؤلاء المعلمون ليسوا منهم.','Anyone who does not love reading cannot be one of the pupils, so those teachers are not.'],
 ['logic','سار سرب من البط في صف: بطتان أمام بطة، وبطتان خلف بطة، وبطة في الوسط. ما أقل عدد ممكن من البط؟','Ducks walk in a line: two ducks in front of a duck, two ducks behind a duck, and one duck in the middle. What is the fewest ducks possible?',['3','5','4','6'],['3','5','4','6'],'ثلاث بطات تكفي: أمام الأخيرة بطتان، وخلف الأولى بطتان، والثانية في الوسط.','Three is enough: two are in front of the last, two behind the first, and one is in the middle.'],
 ['num','ما أصغر عدد له نصف وثلث وربع وخمس وسدس (كلها أعداد صحيحة)؟','What is the smallest number that has a whole half, third, quarter, fifth and sixth?',['60','30','120','90'],['60','30','120','90'],'المضاعف المشترك الأصغر للأعداد 2 ، 3 ، 4 ، 5 ، 6 هو 60.','The lowest common multiple of 2, 3, 4, 5 and 6 is 60.'],
 ['rel','كلمة «قِشرة» بالنسبة لكلمة «بيضة» مثل كلمة «غلاف» بالنسبة لكلمة:','“Shell” is to “egg” as “cover” is to:',['كتاب','قلم','مكتبة','قارئ'],['book','pen','library','reader'],'القشرة تغلف البيضة من الخارج، والغلاف يغطي الكتاب من الخارج.','A shell wraps an egg, and a cover wraps a book.'],
 ['geo','مربع مساحته 50 سم². طول قطره:','A square has area 50 cm². Its diagonal is:',['10 سم','5√2 سم','25 سم','50 سم'],['10 cm','5√2 cm','25 cm','50 cm'],'مساحة المربع = نصف مربع قطره: ق² ÷ 2 = 50 ← ق² = 100 ← ق = 10.','Square area = half the diagonal squared: d² ÷ 2 = 50 → d² = 100 → d = 10.'],
 ['exp','إذا كان (3/4)^م = (4/3)^(−2) ، فإن م =','If (3/4)^m = (4/3)^(−2), then m =',['2','−2','0','1'],['2','−2','0','1'],'(4/3)^(−2) = (3/4)² ، إذن م = 2.','(4/3)^(−2) = (3/4)², so m = 2.'],
 ['alg','إذا كان 7س − 3 = 18 ، فإن قيمة 14س − 3 هي:','If 7x − 3 = 18, then 14x − 3 =',['39','33','42','لا يمكن تحديدها'],['39','33','42','cannot be found'],'7س = 21 ، فـ 14س = 42 ، و 42 − 3 = 39.','7x = 21, so 14x = 42, and 42 − 3 = 39.'],
 ['pct','باع مزارع 40٪ من دجاجه، وبقي عنده 90 دجاجة. كم كان عدد الدجاج؟','A farmer sold 40% of his hens and has 90 left. How many hens did he have?',['150','130','126','225'],['150','130','126','225'],'الباقي 60٪ = 90 ، فالكل 90 ÷ 0.6 = 150.','What is left, 60%, is 90, so the whole is 90 ÷ 0.6 = 150.'],
 ['chance','كيس فيه 40 كرة مرقمة من 1 إلى 40. سُحبت منه كرة عشوائيًا. ما احتمال أن يقبل رقمها القسمة على 3؟','A bag holds 40 balls numbered 1 to 40. One is drawn at random. What is the chance its number divides by 3?',['13/40','1/3','3/10','1/4'],['13/40','1/3','3/10','1/4'],'مضاعفات 3 من 3 إلى 39 عددها 13 ، فالاحتمال 13/40.','The multiples of 3 from 3 to 39 number 13, so the chance is 13/40.'],
 ['prob','إذا كان تقطيع لوح خشب إلى 4 قطع يستغرق 12 دقيقة، فكم يستغرق تقطيعه إلى 10 قطع؟','Cutting a plank into 4 pieces takes 12 minutes. How long does cutting it into 10 pieces take?',['36 دقيقة','30 دقيقة','40 دقيقة','32 دقيقة'],['36 minutes','30 minutes','40 minutes','32 minutes'],'4 قطع تحتاج 3 قطعات، فالقطعة 4 دقائق؛ و 10 قطع تحتاج 9 قطعات = 36 دقيقة.','4 pieces need 3 cuts, so each cut is 4 minutes; 10 pieces need 9 cuts = 36 minutes.'],
 ['ratio','انطلقت سيارتان معًا من مدينة إلى أخرى تبعد 360 كم، سرعة الأولى 90 كم/س والثانية 120 كم/س. كم دقيقة فرق الزمن بينهما في الوصول؟','Two cars set off together on a 360 km trip, one at 90 km/h and the other at 120 km/h. How many minutes apart do they arrive?',['60','30','45','90'],['60','30','45','90'],'الأولى 360 ÷ 90 = 4 ساعات، والثانية 360 ÷ 120 = 3 ساعات؛ الفرق ساعة = 60 دقيقة.','The first takes 4 h and the second 3 h; the gap is 1 h = 60 minutes.'],

 ['phy','ترتفع الطائرة إلى أعلى عند اندفاعها بسرعة؛ لأن شكل جناحها يجعل:','A plane rises as it speeds along because its wing shape makes:',['الضغط فوق الجناح أقل من الضغط تحته','الضغط فوق الجناح أكبر من الضغط تحته','الضغطين متساويين','الجاذبية الأرضية تختفي'],['the pressure above the wing lower than below','the pressure above the wing higher than below','the pressures equal','gravity vanish'],'الهواء فوق الجناح أسرع فيقل ضغطه، فيدفع الضغط الأكبر من أسفل الجناح إلى أعلى.','Air above the wing moves faster so its pressure is lower, and the higher pressure below pushes up.'],
 ['phy','للجمل أخفاف عريضة تساعده على المشي فوق الرمال دون أن يغوص؛ لأنها:','A camel’s wide feet stop it sinking into sand because they:',['توزع وزنه على مساحة أكبر فيقل الضغط','تزيد وزنه','تزيد الضغط على الرمل','تقلل مساحة التلامس'],['spread its weight over a bigger area, lowering pressure','increase its weight','increase pressure on the sand','reduce the contact area'],'الضغط = القوة ÷ المساحة؛ فكلما كبرت المساحة قل الضغط.','Pressure = force ÷ area, so a bigger area means less pressure.'],
 ['earth','في النهار تسخن اليابسة أسرع من البحر. من المتوقع أن:','By day the land heats up faster than the sea. We expect:',['يهب النسيم من البحر إلى اليابسة','يهب النسيم من اليابسة إلى البحر','يكون الهواء ساكنًا','يهب النسيم في الاتجاهين'],['a breeze to blow from sea to land','a breeze to blow from land to sea','the air to be still','breezes both ways'],'الهواء الساخن فوق اليابسة يرتفع ويقل ضغطه، فيتحرك الهواء البارد من البحر ليحل محله.','Hot air over land rises, lowering the pressure, so cooler air moves in from the sea.'],
 ['phy','رُكّب بالون على فوهة زجاجة فارغة، ثم وُضعت الزجاجة في ماء ساخن فانتفخ البالون؛ بسبب:','A balloon is fitted over an empty bottle, which is put in hot water. The balloon inflates because:',['تمدد الهواء داخل الزجاجة بالحرارة','دخول الماء إلى البالون','نقص الهواء داخل الزجاجة','انكماش الزجاجة'],['the air in the bottle expands when heated','water gets into the balloon','there is less air in the bottle','the bottle shrinks'],'الهواء يتمدد عند تسخينه فيشغل حجمًا أكبر ويملأ البالون.','Air expands when heated, takes up more room and fills the balloon.'],
 ['read','«اشتهرت المدن الإسلامية قديمًا بأسواقها المسقوفة، وكانت تُقسَّم حسب الحِرَف: سوق للعطّارين، وسوق للنحّاسين، وسوق للورّاقين. وكان يشرف على السوق رجل يُسمّى المحتسِب، يراقب الموازين ويمنع الغش». يُفهم من النص أن وجود المحتسب دليل على:','“Old Muslim cities were famous for covered markets divided by trade: perfumers, coppersmiths, booksellers. A man called the muhtasib supervised the market, checking scales and stopping cheating.” The muhtasib shows:',['الاهتمام بالأمانة ومنع الغش في التجارة','أن الأسواق كانت مكشوفة','أن التجار كانوا قليلين','أن الكتب لم تكن تُباع'],['care for honesty and stopping cheating in trade','that markets were open-air','that there were few traders','that books were not sold'],'المحتسب كان يراقب الموازين ويمنع الغش، وهذا يدل على الاهتمام بالأمانة.','The muhtasib checked scales and stopped cheating, which shows care for honesty.'],
 ['exp','√(2²⁰) =','√(2²⁰) =',['1024','512','2¹⁸','400'],['1024','512','2¹⁸','400'],'√(2²⁰) = 2¹⁰ = 1024.','√(2²⁰) = 2¹⁰ = 1024.'],
 ['frac','مصنع ينتج 600 لتر عصير: ثلثها يُعبأ في علب نصف لتر، ونصفها في علب 3 لترات، والباقي في علب لتر واحد. كم علبة ينتج المصنع؟','A factory makes 600 L of juice: a third goes into ½-litre cartons, half into 3-litre cartons and the rest into 1-litre cartons. How many cartons is that?',['600','500','400','700'],['600','500','400','700'],'200 ÷ 0.5 = 400 علبة ، و 300 ÷ 3 = 100 ، والباقي 100 ÷ 1 = 100 ؛ المجموع 600.','200 ÷ 0.5 = 400, 300 ÷ 3 = 100, and the last 100 ÷ 1 = 100; total 600.'],
 ['prob','ماء ساخن درجة حرارته 95° يبرد بمعدل 3° كل دقيقة. بعد كم دقيقة تصبح حرارته 35°؟','Hot water at 95° cools by 3° each minute. After how many minutes is it 35°?',['20','30','15','25'],['20','30','15','25'],'يحتاج إلى أن يبرد 60 درجة: 60 ÷ 3 = 20 دقيقة.','It must cool 60 degrees: 60 ÷ 3 = 20 minutes.'],
 ['num','في العدد الدوري 0.274827482748... ما الرقم في الخانة العشرية رقم 50؟','In the repeating decimal 0.274827482748..., which digit is in decimal place 50?',['7','2','4','8'],['7','2','4','8'],'الدورة (2748) طولها 4 ، و 50 = 4 × 12 + 2 ، فالرقم هو الثاني في الدورة: 7.','The block 2748 has 4 digits, and 50 = 4 × 12 + 2, so it is the 2nd digit: 7.'],
 ['num','الرقم الذي يوضع في الفراغ في العدد 7☐40 ليقبل القسمة على 2 و 3 و 5 هو:','Which digit in the box makes 7☐40 divisible by 2, 3 and 5?',['4','2','3','6'],['4','2','3','6'],'ينتهي بصفر فيقبل القسمة على 2 و 5 ، ونحتاج مجموع الأرقام من مضاعفات 3: 7 + 4 + 4 + 0 = 15.','It ends in 0, so 2 and 5 divide it; the digit sum must be a multiple of 3: 7 + 4 + 4 + 0 = 15.'],
 ['area','مثلث قائم الزاوية طولا ضلعي القائمة 6 سم و 8 سم، وُصلت منتصفات أضلاعه فتكوّن مثلث صغير في الوسط. مساحة المثلث الصغير:','A right triangle has legs 6 cm and 8 cm. Joining the midpoints of its sides makes a small middle triangle. Its area is:',['6 سم²','12 سم²','8 سم²','3 سم²'],['6 cm²','12 cm²','8 cm²','3 cm²'],'مساحة المثلث الكبير 24 ، ووصل المنتصفات يقسمه إلى 4 مثلثات متطابقة: 24 ÷ 4 = 6.','The big triangle is 24, and joining midpoints splits it into 4 equal triangles: 24 ÷ 4 = 6.'],
 ['num','عدد ضعفه أكبر من 10 ، ومربعه أصغر من 40. ما هذا العدد؟','A whole number’s double is more than 10 and its square is less than 40. What is it?',['6','5','7','4'],['6','5','7','4'],'ضعف 5 يساوي 10 وليس أكبر منها، و 7² = 49 أكبر من 40؛ فيبقى 6.','Double 5 is 10, not more; 7² = 49 is over 40; so it is 6.'],
 ['alg','في أي فترة على خط الأعداد يكون مربع العدد الموجب أكبر من العدد نفسه؟','For which positive numbers is the square bigger than the number itself?',['الأعداد الأكبر من 1','الأعداد بين 0 و 1','العدد 1 فقط','لا يوجد'],['numbers greater than 1','numbers between 0 and 1','only the number 1','none'],'مثل 3² = 9 > 3 ، أما بين 0 و 1 فالمربع أصغر: (0.5)² = 0.25.','e.g. 3² = 9 > 3, but between 0 and 1 the square is smaller: 0.5² = 0.25.'],
 ['rel','علاقة العُثّ بالصوف مثل علاقة:','Moth is to wool as:',['السوس بالقمح','النحل بالعسل','الطائر بالعش','الماء بالسمك'],['weevil is to wheat','bee is to honey','bird is to nest','water is to fish'],'العث آفة تتلف الصوف، والسوس آفة تتلف القمح.','Moths are pests that ruin wool, as weevils ruin wheat.'],
 ['odd','أيٌّ مما يلي ليس محيطًا؟','Which of these is not an ocean?',['البحر الأحمر','المحيط الهادئ','المحيط الأطلسي','المحيط الهندي'],['the Red Sea','the Pacific Ocean','the Atlantic Ocean','the Indian Ocean'],'البحر الأحمر بحر، أما الثلاثة الأخرى فمحيطات.','The Red Sea is a sea; the other three are oceans.'],
 ['geo','زاويتان متقابلتان بالرأس، قياس إحداهما (2س + 10)° والأخرى (3س − 20)°. قياس كل منهما:','Two vertically opposite angles measure (2x + 10)° and (3x − 20)°. Each angle measures:',['70°','30°','110°','50°'],['70°','30°','110°','50°'],'المتقابلتان بالرأس متساويتان: 2س + 10 = 3س − 20 ← س = 30 ، والزاوية 70°.','Vertically opposite angles are equal: 2x + 10 = 3x − 20 → x = 30, so each is 70°.'],
 ['coord','مشى رجل 2 كم شرقًا، ثم 6 كم شمالًا، ثم 6 كم شرقًا. ما المسافة بين نقطة انطلاقه ونقطة توقفه؟','A man walks 2 km east, then 6 km north, then 6 km east. How far is he from where he started?',['10 كم','14 كم','12 كم','8 كم'],['10 km','14 km','12 km','8 km'],'ابتعد 8 كم شرقًا و 6 كم شمالًا: √(8² + 6²) = 10 كم.','He is 8 km east and 6 km north: √(8² + 6²) = 10 km.'],
 ['ops','ناتج: 3 + 3 × 3 − 3 ÷ 3 =','3 + 3 × 3 − 3 ÷ 3 =',['11','5','17','3'],['11','5','17','3'],'الضرب والقسمة أولًا: 3 + 9 − 1 = 11.','Multiply and divide first: 3 + 9 − 1 = 11.'],
 ['code','إذا كان: 5 ⊕ 3 = 16 ، و 7 ⊕ 2 = 45 ، و 6 ⊕ 4 = 20 ، فكم يساوي 9 ⊕ 5؟','If 5 ⊕ 3 = 16, 7 ⊕ 2 = 45 and 6 ⊕ 4 = 20, what is 9 ⊕ 5?',['56','70','45','14'],['56','70','45','14'],'أ ⊕ ب = (أ + ب) × (أ − ب): (9 + 5) × (9 − 5) = 14 × 4 = 56.','a ⊕ b = (a + b) × (a − b): (9 + 5) × (9 − 5) = 14 × 4 = 56.'],
 ['rank','طول سارة ومنى متساويان، وهدى أقصر من ريم، وريم أقصر من منى. من الأقصر؟','Sara and Mona are the same height, Huda is shorter than Reem, and Reem is shorter than Mona. Who is the shortest?',['هدى','ريم','منى','سارة'],['Huda','Reem','Mona','Sara'],'منى = سارة > ريم > هدى ؛ فالأقصر هدى.','Mona = Sara > Reem > Huda, so Huda is shortest.'],
 ['logic','إذا كان اليوم الخميس، فما اليوم بعد 100 يوم؟','If today is Thursday, what day is it in 100 days?',['السبت','الجمعة','الأحد','الخميس'],['Saturday','Friday','Sunday','Thursday'],'100 = 7 × 14 + 2 ، فنتقدم يومين بعد الخميس: السبت.','100 = 7 × 14 + 2, so two days after Thursday: Saturday.'],
 ['cube','هرم من المكعبات: الطبقة العليا مكعب واحد، والتي تحتها 2 × 2 ، ثم 3 × 3 ، ثم 4 × 4. كم مكعبًا في الهرم كله؟','A pyramid of cubes has 1 cube on top, then a 2 × 2 layer, then 3 × 3, then 4 × 4. How many cubes in all?',['30','16','20','64'],['30','16','20','64'],'1 + 4 + 9 + 16 = 30.','1 + 4 + 9 + 16 = 30.']

 ['rel','حديقة : سياج مثل كتاب : ......','garden : fence is like book : ......',['غلاف','ورقة','قلم','مكتبة'],['cover','page','pen','library'],'السياج يحيط بالحديقة ويحميها، والغلاف يحيط بالكتاب ويحميه.','A fence goes round a garden to protect it, and a cover goes round a book to protect it.'],
 ['rel','المطر للأرض ← خُضرة ، الإهمال للحديقة ← ......','rain on the land → green, neglect of a garden → ......',['ذبول','ماء','زهور','ظل'],['wilting','water','flowers','shade'],'المطر يجعل الأرض خضراء، والإهمال يجعل نباتات الحديقة تذبل.','Rain makes the land green; neglect makes a garden’s plants wilt.'],

 ['infer','تُوضع إشارات المرور في الطرق من أجل:','Traffic lights are put on roads in order to:',['تنظيم حركة السير ومنع الحوادث','تزيين الشوارع','إضاءة البيوت','إسعاد السائقين'],['organise traffic and prevent accidents','decorate the streets','light up houses','make drivers happy'],'الهدف الأهم لإشارات المرور تنظيم السير وحماية الناس.','The main job of traffic lights is to organise traffic and keep people safe.'],

 ['syn','الكلمة الأقرب لمعنى «كريم»:','The word closest in meaning to “generous” is:',['جواد','غني','قوي','سعيد'],['giving','rich','strong','happy'],'الجواد هو الكريم كثير العطاء، أما الغني فقد يكون بخيلًا.','A generous person gives a lot; a rich person may not give anything.'],
 ['odd','الكلمة الشاذة بين: مطر ، غيث ، وابل ، رمل','The odd word out: rain, shower, downpour, sand',['رمل','مطر','غيث','وابل'],['sand','rain','shower','downpour'],'المطر والغيث والوابل كلها أسماء للماء النازل من السماء، أما الرمل فلا.','Rain, shower and downpour all mean water falling from the sky; sand does not.'],

 ['seq','ترتيب مراحل نمو النبات:','The order in which a plant grows is:',['بذرة ، بادرة ، نبتة ، شجرة مثمرة','بادرة ، بذرة ، نبتة ، شجرة مثمرة','بذرة ، نبتة ، بادرة ، شجرة مثمرة','نبتة ، بذرة ، بادرة ، شجرة مثمرة'],['seed, sprout, plant, fruiting tree','sprout, seed, plant, fruiting tree','seed, plant, sprout, fruiting tree','plant, seed, sprout, fruiting tree'],'تنبت البذرة فتخرج البادرة، ثم تكبر نبتة، ثم شجرة تحمل الثمار.','The seed sprouts, grows into a plant, then a tree that gives fruit.'],
 ['prob','وزن مقلمة يساوي وزن 6 ممحايات، ووزن حقيبة يساوي وزن 4 مقلمات. كم ممحاة وزنها يساوي وزن الحقيبة؟','A pencil case weighs the same as 6 erasers, and a bag weighs the same as 4 pencil cases. How many erasers weigh the same as the bag?',['24','10','6','4'],['24','10','6','4'],'الحقيبة = 4 مقلمات = 4 × 6 = 24 ممحاة.','Bag = 4 pencil cases = 4 × 6 = 24 erasers.'],

 ['frac','في مدرسة 40 طالبًا، والجدول يبين الكسر الذي يأتي بالحافلة والذي يأتي مشيًا. كم طالبًا يأتي مشيًا؟','A school has 40 pupils. The table shows the fraction who come by bus and who walk. How many walk?',['32','8','20','35'],['32','8','20','35'],'الذين يمشون 4/5 من 40: خُمس 40 = 8، و 4 × 8 = 32.','4/5 of 40 walk: a fifth of 40 is 8, and 4 × 8 = 32.',{fig:tab(['بالحافلة','مشيًا'],[['1/5','4/5']])},{fig:tab(['By bus','Walking'],[['1/5','4/5']])}],

 ['shp','ما الشكل المختلف؟','Which shape is different?',[shp('c','o'),poly(3),poly(4),poly(5)],null,'المثلث والمربع والخماسي لها أضلاع مستقيمة ورؤوس، أما الدائرة فليس لها أضلاع.','The triangle, square and pentagon have straight sides and corners; the circle has none.',{figOpts:true}],

 ['infer','تُستخدم الممحاة من أجل:','An eraser is used to:',['محو أي خطأ مكتوب بقلم الرصاص','محو أخطاء الرسم فقط','تزيين الحقيبة','بري الأقلام'],['rub out any pencil mistake','rub out only drawing mistakes','decorate the bag','sharpen pencils'],'الممحاة تمحو كل ما يُكتب بقلم الرصاص، والإجابة العامة أشمل من الخاصة.','An eraser rubs out anything in pencil; the general answer is better than the narrow one.'],

 ['rank','في سباق الجري كان فهد أسرع من سعد، وكان ماجد أسرع من علي، وكان سعد مثل ماجد في السرعة. من الأسرع؟','In a race Fahad was faster than Saad, Majed was faster than Ali, and Saad was as fast as Majed. Who was fastest?',['فهد','سعد','ماجد','علي'],['Fahad','Saad','Majed','Ali'],'السؤال عن الأسرع فنستبعد: علي أبطأ من ماجد، وماجد مثل سعد، وسعد أبطأ من فهد، فيبقى فهد.','For “fastest” we eliminate: Ali is slower than Majed, Majed equals Saad, Saad is slower than Fahad, so Fahad is left.'],
 ['place','العدد الذي يلي 2099 مباشرة هو:','The number just after 2099 is:',['2100','2098','2010','3000'],['2100','2098','2010','3000'],'2099 + 1 = 2100.','2099 + 1 = 2100.'],

 ['idio','معنى المثل «ما كلُّ ما يلمع ذهبًا»:','The saying “All that glitters is not gold” means:',['المظهر الجميل قد يخدع','الذهب يلمع دائمًا','كل لامع ثمين','الذهب لا يلمع'],['a nice look can fool us','gold always shines','everything shiny is valuable','gold does not shine'],'ليس كل ما يبدو جميلًا من الخارج ثمينًا في الحقيقة.','Not everything that looks good is really valuable.'],

 ['sci','العالِم العربي الذي اشتهر بدراسة الضوء والإبصار هو:','The Arab scholar famous for studying light and vision is:',['ابن الهيثم','ابن سينا','الخوارزمي','ابن بطوطة'],['Ibn al-Haytham','Ibn Sina','Al-Khwarizmi','Ibn Battuta'],'ابن الهيثم صاحب كتاب «المناظر» في الضوء، وابن سينا في الطب، والخوارزمي في الرياضيات، وابن بطوطة رحّالة.','Ibn al-Haytham wrote the Book of Optics; Ibn Sina was a doctor, Al-Khwarizmi a mathematician, Ibn Battuta a traveller.'],

 ['infer','«عملي هو بناء البيوت والمباني». أي الأشخاص لا يمكن أن يكون قائل هذه الجملة؟','“My job is building houses and buildings.” Who could NOT have said this?',['طبيب العيون','البنّاء','عامل البناء','مهندس البناء'],['an eye doctor','a bricklayer','a builder','a building engineer'],'طبيب العيون يعالج العيون ولا يبني البيوت.','An eye doctor treats eyes and does not build houses.'],

 ['place','عدد فردي من ثلاثة أرقام مجموع أرقامه 10. ما هو؟','An odd 3-digit number has digits that add up to 10. Which is it?',['325','262','334','154'],['325','262','334','154'],'3 + 2 + 5 = 10 وآحاده 5 فهو فردي، والبقية زوجية.','3 + 2 + 5 = 10 and it ends in 5 (odd); the others are even.'],
 ['place','عدد من رقمين مجموع رقميه 9، وهو من مضاعفات 5، ورقم عشراته زوجي. ما هو؟','A 2-digit number has digits adding to 9, is a multiple of 5, and its tens digit is even. What is it?',['45','90','54','36'],['45','90','54','36'],'مضاعفات 5 آحادها 0 أو 5: 45 و 90 مجموعهما 9، وعشرات 45 زوجية (4).','Multiples of 5 end in 0 or 5: 45 and 90 add to 9, and 45 has an even tens digit (4).'],

 ['ops','ما العددان المتتاليان اللذان مجموعهما 15؟','Which two consecutive numbers add up to 15?',['7 ، 8','6 ، 9','5 ، 10','8 ، 9'],['7, 8','6, 9','5, 10','8, 9'],'7 + 8 = 15، وهما متتاليان.','7 + 8 = 15 and they are consecutive.'],
 ['frac','ما الكسر الذي يمثل الجزء المظلل من الدائرة؟','What fraction of the circle is shaded?',['3/4','1/4','1/3','4/3'],['3/4','1/4','1/3','4/3'],'الدائرة 4 أجزاء متساوية، ظُلل منها 3.','The circle has 4 equal parts and 3 are shaded.',{fig:pie(4,1)}],
 ['logic','تريد أن تكتب على سبورة، وأمامك قلم سبورة مغلق بغطائه. ما أول شيء تفعله؟','You want to write on a board and your marker still has its cap on. What do you do first?',['تنزع غطاء القلم','تكتب على السبورة','تمسح السبورة','تشتري قلمًا جديدًا'],['take the cap off','write on the board','wipe the board','buy a new pen'],'لا يمكن الكتابة قبل نزع الغطاء.','You cannot write until the cap is off.'],
 ['logic','المسافة بين بيت علي والمدرسة 600 م، وبين المدرسة والمسجد 200 م. ما المسافة بين بيت علي والمسجد؟','Ali’s house is 600 m from the school, and the school is 200 m from the mosque. How far is Ali’s house from the mosque?',['لا يمكن تحديدها','800 م','400 م','300 م'],['cannot be worked out','800 m','400 m','300 m'],'لا نعرف هل المسجد في اتجاه البيت أم في الاتجاه الآخر، فقد تكون 400 أو 800 أو غيرهما.','We do not know which way the mosque is, so it could be 400 m, 800 m or something else.'],
 ['ops','أصغر عدد نضيفه إلى 347 ليصبح قابلًا للقسمة على 10 هو:','The smallest number to add to 347 so it can be divided by 10 is:',['3','7','0','13'],['3','7','0','13'],'347 + 3 = 350 وهو من مضاعفات 10.','347 + 3 = 350, which is a multiple of 10.'],
 ['place','300000 + 5000 + 80 + 2 = ......','300000 + 5000 + 80 + 2 = ......',['305082','358200','3582','350082'],['305082','358200','3582','350082'],'ثلاثمئة ألف وخمسة آلاف وثمانون واثنان = 305082.','Three hundred thousand + five thousand + eighty + two = 305082.'],
 ['num','مجموع عدد زوجي وعدد فردي يكون دائمًا:','An even number plus an odd number is always:',['فرديًا','زوجيًا','صفرًا','أكبر من 100'],['odd','even','zero','more than 100'],'مثل 2 + 3 = 5 و 4 + 7 = 11، الناتج فردي دائمًا.','For example 2 + 3 = 5 and 4 + 7 = 11: always odd.'],
 ['ops','عددان مجموعهما 10 والفرق بينهما 4. ما حاصل ضربهما؟','Two numbers add to 10 and differ by 4. What is their product?',['21','24','40','16'],['21','24','40','16'],'العددان 7 و 3، و 7 × 3 = 21.','The numbers are 7 and 3; 7 × 3 = 21.'],
 ['place','العدد المكوّن من 20 ألفًا و 20 مئة و 20 هو:','The number made of 20 thousands, 20 hundreds and 20 is:',['22020','202020','20220','2220'],['22020','202020','20220','2220'],'20000 + 2000 + 20 = 22020.','20000 + 2000 + 20 = 22020.'],
 ['rel','اختر الكلمة التي تشترك مع «نسر» في صفة واحدة:','Choose the word that shares a feature with “eagle”:',['صقر','دجاجة','حمامة','بطة'],['falcon','hen','pigeon','duck'],'النسر والصقر من الطيور الجارحة التي تصطاد.','The eagle and the falcon are both birds of prey.'],
 ['frac','ربع مبلغ سعد يساوي نصف مبلغ فهد. إذن مبلغ سعد:','A quarter of Saad’s money equals half of Fahad’s money. So Saad’s money is:',['ضعف مبلغ فهد','نصف مبلغ فهد','يساوي مبلغ فهد','أقل من مبلغ فهد'],['twice Fahad’s','half of Fahad’s','equal to Fahad’s','less than Fahad’s'],'لو كان مع فهد 4 فنصفها 2، فربع مبلغ سعد 2 أي مبلغه 8 وهو ضعف 4.','If Fahad has 4, half is 2, so a quarter of Saad’s is 2 and Saad has 8 — twice as much.'],
 ['clk','يعمل خالد في مكتبه من الساعة 8 صباحًا حتى الساعة 2 ظهرًا. كم ساعة يعمل؟','Khaled works from 8 a.m. until 2 p.m. How many hours does he work?',['6','10','8','12'],['6','10','8','12'],'من 8 إلى 12 أربع ساعات، ومن 12 إلى 2 ساعتان: 6 ساعات.','8 to 12 is 4 hours, 12 to 2 is 2 hours: 6 hours.'],
 ['rank','طول سلمى 130 سم، وطول ريم 136 سم، وطول هدى أكبر من طول سلمى وأصغر من طول ريم. يمكن أن يكون طول هدى:','Salma is 130 cm, Reem is 136 cm, and Huda is taller than Salma but shorter than Reem. Huda could be:',['133 سم','128 سم','140 سم','136 سم'],['133 cm','128 cm','140 cm','136 cm'],'طول هدى بين 130 و 136، والوحيد بينهما 133.','Huda is between 130 and 136; only 133 fits.'],
 ['logic','يحب ماجد اللعب مع فهد وسعد، لكن فهدًا وعمر وعليًّا لا يحبون اللعب معه. أيهم يُظن أنه صديقه؟','Majed likes playing with Fahad and Saad, but Fahad, Omar and Ali do not like playing with him. Who is probably his friend?',['سعد','فهد','عمر','علي'],['Saad','Fahad','Omar','Ali'],'سعد هو الوحيد الذي يحبه ماجد ولم يُذكر أنه لا يحب اللعب معه.','Saad is the only one Majed likes who was not said to dislike playing with him.'],
 ['patt','أكمل: 3 ، 4 ، 8 ، 13 ، 14 ، 18 ، 23 ، ...... ، ......','Complete: 3, 4, 8, 13, 14, 18, 23, ......, ......',['24 ، 28','25 ، 29','24 ، 27','26 ، 30'],['24, 28','25, 29','24, 27','26, 30'],'كل ثلاثة أعداد مجموعة، والمجموعة التالية تزيد 10: (3 ، 4 ، 8) ثم (13 ، 14 ، 18) ثم (23 ، 24 ، 28).','Groups of three, each 10 more than the last: (3, 4, 8), (13, 14, 18), (23, 24, 28).'],
 ['rank','هند أسرع من نورة، ونورة أبطأ من ريم. إذن:','Hind is faster than Noura, and Noura is slower than Reem. So:',['لا يمكن معرفة أيهما أسرع: هند أم ريم','هند أسرع من ريم','ريم أسرع من هند','نورة أسرع من ريم'],['we cannot tell who is faster, Hind or Reem','Hind is faster than Reem','Reem is faster than Hind','Noura is faster than Reem'],'كلتاهما أسرع من نورة، لكن لم يُذكر شيء يقارن بينهما.','Both are faster than Noura, but nothing compares the two of them.'],
 ['infer','نذهب إلى المستشفى من أجل:','We go to hospital in order to:',['العلاج','النزهة','الدراسة','الشراء'],['get treatment','have a picnic','study','go shopping'],'المستشفى مكان العلاج.','A hospital is where people get treated.'],
 ['idio','معنى «من جرّب المجرَّب حلّت به الندامة»:','“Whoever tries again what already failed will regret it” means:',['من كرر تجربة فاشلة يندم','التجربة دائمًا مفيدة','لا تجرب شيئًا أبدًا','الندم لا فائدة منه'],['repeating a failed attempt leads to regret','trying is always useful','never try anything','regret is useless'],'العاقل يتعلم من خطئه ولا يكرره.','A wise person learns from a mistake and does not repeat it.'],
 ['infer','قالت سارة لأمها: «ما أطيبَ هذا الطعام!». نستنتج أنها:','Sara said to her mother: “What tasty food this is!” We can tell that she is:',['تمدح الطعام','تسأل عن الطعام','ترفض الطعام','تطلب طعامًا آخر'],['praising the food','asking about the food','refusing the food','asking for other food'],'«ما أطيب!» أسلوب تعجب يدل على المدح لا السؤال.','“What tasty food!” is an exclamation of praise, not a question.'],
 ['infer','الهاتف نستخدمه:','We use a telephone:',['للتواصل مع الآخرين','للاتصال بالطبيب فقط','للتصوير فقط','للعب فقط'],['to keep in touch with others','only to call the doctor','only to take photos','only to play'],'الإجابة الأعم والأشمل هي التواصل مع الآخرين.','The broadest, most complete answer is keeping in touch with others.']

 ['cat','ما الشيء المشترك بين التفاحة والبرتقالة والموزة؟','What do an apple, an orange and a banana have in common?',['كلها فواكه','كلها حمراء','كلها مستديرة','كلها حامضة'],['they are all fruits','they are all red','they are all round','they are all sour'],'الصفة الوحيدة المشتركة بينها كلها أنها فواكه.','The only thing true of all three is that they are fruits.'],
 ['logic','في صف أطفال: طفل أمامه طفلان، وطفل خلفه طفلان، وطفل بين طفلين. ما أقل عدد ممكن للأطفال؟','In a line of children: one has two children in front, one has two behind, and one is between two. What is the smallest possible number of children?',['3','5','6','4'],['3','5','6','4'],'ثلاثة أطفال فقط في صف يحققون كل الشروط: الأخير أمامه اثنان، والأول خلفه اثنان، والأوسط بين اثنين.','Just three in a line works: the last has two in front, the first has two behind, the middle one is between two.'],

 ['gear','ترسان متعاشقان. إذا دار الترس (أ) مع عقارب الساعة، ففي أي اتجاه يدور الترس (ب)؟','Two gears touch. If gear A turns clockwise, which way does gear B turn?',['عكس عقارب الساعة','مع عقارب الساعة','لا يدور','نحو الأعلى'],['anticlockwise','clockwise','it does not turn','upwards'],'الترسان المتعاشقان يدوران في اتجاهين متعاكسين.','Two touching gears turn in opposite directions.',{fig:gTeeth(16,12,'أ','ب')}],
 ['earth','أي مما يلي مورد طبيعي متجدد؟','Which is a renewable natural resource?',['ضوء الشمس','النفط','الفحم الحجري','الغاز الطبيعي'],['sunlight','oil','coal','natural gas'],'ضوء الشمس لا ينفد، أما النفط والفحم والغاز فتحتاج ملايين السنين لتتكون.','Sunlight does not run out; oil, coal and gas take millions of years to form.'],
 ['code','إذا رمزنا لكل شكل بعدد أضلاعه: المثلث = 3، والمربع = 4، والخماسي = 5. فالعدد المكتوب «مربع ، مثلث ، خماسي» هو:','Each shape stands for its number of sides: triangle = 3, square = 4, pentagon = 5. The number written “square, triangle, pentagon” is:',['435','345','534','12'],['435','345','534','12'],'المربع 4 ثم المثلث 3 ثم الخماسي 5: 435.','Square 4, triangle 3, pentagon 5: 435.'],

 ['meas','كم ثانية في دقيقتين؟','How many seconds are in two minutes?',['120','60','200','2'],['120','60','200','2'],'الدقيقة 60 ثانية، و 2 × 60 = 120.','A minute is 60 seconds; 2 × 60 = 120.'],
 ['shp','أي الأشكال الآتية له 4 أضلاع متساوية و 4 زوايا قائمة؟','Which shape has 4 equal sides and 4 right angles?',['المربع','المستطيل','المثلث','الدائرة'],['square','rectangle','triangle','circle'],'المربع أضلاعه الأربعة متساوية وزواياه قائمة، والمستطيل أضلاعه غير متساوية كلها.','A square has 4 equal sides and right angles; a rectangle’s sides are not all equal.'],

 ['meas','النشاط الذي يستغرق دقيقة واحدة تقريبًا:','Which activity takes about one minute?',['غسل اليدين','قراءة قصة طويلة','النوم ليلًا','رمشة العين'],['washing your hands','reading a long story','sleeping at night','blinking'],'غسل اليدين يأخذ نحو دقيقة، والقصة والنوم أطول بكثير، والرمشة أقل من ثانية.','Washing hands takes about a minute; the story and sleep take much longer, a blink less than a second.'],
 ['infer','من أسباب كثرة تسوس الأسنان عند الأطفال أكل الحلويات كثيرًا. نستنتج أن سبب تسوس أسنانهم هو:','Eating lots of sweets is one reason children get tooth decay. So the cause of their tooth decay is:',['كثرة السكريات على الأسنان','قلة النوم','شرب الماء','لبس النظارة'],['too much sugar on the teeth','too little sleep','drinking water','wearing glasses'],'النص يربط التسوس بكثرة الحلويات أي السكريات.','The text links decay to eating lots of sweets, that is sugar.'],
 ['seq','رتّب الكلمات لتكوّن جملة مفيدة: الطالب ، يجب ، يحترم ، أن ، معلّمه','Put the words in order to make a sentence: teacher, must, the, respect, pupils',['يجب أن يحترم الطالب معلمه','الطالب يجب معلمه أن يحترم','يحترم يجب الطالب أن معلمه','أن الطالب يجب يحترم معلمه'],['pupils must respect the teacher','the pupils teacher must respect','respect must the pupils teacher','must pupils the teacher respect'],'الجملة الصحيحة المفهومة: يجب أن يحترم الطالب معلمه.','The correct sentence is: Pupils must respect the teacher.'],
 ['frac','ما الكسر المناسب للجزء المظلل؟','Which fraction is shaded?',['1/3','2/3','1/6','1/2'],['1/3','2/3','1/6','1/2'],'ظُلل جزءان من 6 أجزاء: 2/6 = 1/3.','2 of 6 parts are shaded: 2/6 = 1/3.',{fig:pie(6,4)}],
 ['area','شكل مكوّن من مربعين كاملين و 6 أنصاف مربعات (مثلثات). كم وحدة مربعة مساحته؟','A shape is made of 2 whole squares and 6 half squares (triangles). How many square units is its area?',['5','8','6','4'],['5','8','6','4'],'كل نصفين = مربع، فالأنصاف الستة = 3 مربعات، و 2 + 3 = 5.','Every two halves make one square, so 6 halves = 3 squares, and 2 + 3 = 5.'],
 ['numr','في هرم الأعداد: كل عدد = مجموع العددين اللذين تحته. القاعدة: 3 ، 5 ، 2. ما العدد في القمة؟','In a number pyramid each number is the sum of the two below it. The bottom row is 3, 5, 2. What is the top number?',['15','10','13','17'],['15','10','13','17'],'الصف الأوسط: 3 + 5 = 8 و 5 + 2 = 7، والقمة 8 + 7 = 15.','Middle row: 3 + 5 = 8 and 5 + 2 = 7; top: 8 + 7 = 15.'],
 ['rel','كوب إلى ماء مثل طبق إلى ......','cup is to water as plate is to ......',['طعام','ملعقة','مطبخ','مائدة'],['food','spoon','kitchen','table'],'نضع الماء في الكوب، ونضع الطعام في الطبق.','We put water in a cup and food on a plate.'],

 ['earth','إذا حدث فيضان في مكان ما، فإن من آثاره:','If a flood happens somewhere, one of its effects is:',['غرق البيوت والمزارع','زيادة الجفاف','انتشار الحرائق','تساقط الثلوج'],['houses and farms are flooded','more drought','fires spread','snow falls'],'الفيضان يغمر الأرض بالماء فيُغرق البيوت والمزارع.','A flood covers the land with water, drowning houses and farms.'],
 ['odd','ضع دائرة حول الكلمة التي لا تنتمي: مشط ، فرشاة أسنان ، صابون ، مسطرة','Circle the word that does not belong: comb, toothbrush, soap, ruler',['مسطرة','مشط','فرشاة أسنان','صابون'],['ruler','comb','toothbrush','soap'],'المشط والفرشاة والصابون أدوات نظافة شخصية، أما المسطرة فأداة مدرسية.','Comb, toothbrush and soap are for keeping clean; a ruler is for school.'],
 ['syn','الكلمة التي تعطي معنى «تعاون»:','The word that means “cooperation”:',['تكاتُف','تنافُس','تكاسُل','تخاصُم'],['working together','competition','laziness','quarrelling'],'التعاون هو التكاتف ومساعدة بعضنا بعضًا.','Cooperation means working together and helping each other.'],
 ['rel','اختر الإجابة المناسبة لتعطي العلاقة نفسها: تفاح : فاكهة','Choose the pair with the same relationship: apple : fruit',['جزر : خضراوات','شجرة : ورقة','بقرة : حليب','قمح : خبز'],['carrot : vegetables','tree : leaf','cow : milk','wheat : bread'],'التفاح نوع من الفاكهة، والجزر نوع من الخضراوات.','An apple is a kind of fruit, and a carrot is a kind of vegetable.'],
 ['bio','في السلسلة الغذائية: نبات ← أرنب ← ثعلب. ماذا يحدث إذا اختفت الثعالب؟','In the food chain plant → rabbit → fox, what happens if the foxes disappear?',['يزداد عدد الأرانب','يزداد النبات','يقل عدد الأرانب','لا يحدث شيء'],['the number of rabbits goes up','plants increase','rabbits decrease','nothing happens'],'الثعالب تأكل الأرانب، فإذا اختفت كثرت الأرانب.','Foxes eat rabbits, so without foxes there are more rabbits.'],
 ['ant','عكس كلمة «شجاعة»:','The opposite of “bravery” is:',['جُبن','قوة','إقدام','بطولة'],['cowardice','strength','daring','heroism'],'ضد الشجاعة الجبن.','The opposite of bravery is cowardice.'],

 ['ant','ما الكلمتان المتضادتان في المعنى: سكت ، صمت ، نطق ، هدأ','Which two words are opposites: silent, quiet, spoke, calm',['سكت ، نطق','سكت ، صمت','صمت ، هدأ','سكت ، هدأ'],['silent, spoke','silent, quiet','quiet, calm','silent, calm'],'سكت عكس نطق، أما سكت وصمت وهدأ فمتقاربة.','“Silent” is the opposite of “spoke”; the others have similar meanings.'],

 ['place','إذا حذفنا الرقم 3 من العدد 4038 نحصل على:','If we remove the digit 3 from 4038 we get:',['408','438','48','4008'],['408','438','48','4008'],'4038 بدون الرقم 3 تصبح 408.','4038 without the 3 becomes 408.'],

 ['frac','كسر بسطه 3، ومقامه أكبر من بسطه بـ 4. ما الكسر؟','A fraction has 3 on top, and its bottom is 4 more than the top. What is it?',['3/7','7/3','3/4','4/7'],['3/7','7/3','3/4','4/7'],'المقام 3 + 4 = 7، فالكسر 3/7.','The bottom is 3 + 4 = 7, so the fraction is 3/7.'],

 ['infer','دخلت أم سعد المطبخ فوجدت كأسًا مكسورًا على الأرض. أي جملة نستنتجها مباشرة من النص؟','Saad’s mother went into the kitchen and found a broken glass on the floor. Which sentence follows directly from the text?',['يوجد كأس مكسور على الأرض','القطة كسرت الكأس','سعد كسر الكأس','الكأس كان قديمًا'],['there is a broken glass on the floor','the cat broke the glass','Saad broke the glass','the glass was old'],'النص لم يذكر من كسر الكأس ولا عمره، بل ذكر فقط وجود كأس مكسور.','The text does not say who broke it or how old it was, only that a broken glass is there.'],
 ['age','عندما كان عمر هند 6 سنوات كان عمر أبيها 33 سنة. عمر أبيها الآن 50 سنة. كم عمر هند الآن؟','When Hind was 6, her father was 33. Her father is now 50. How old is Hind now?',['23','17','27','44'],['23','17','27','44'],'الفرق بين عمريهما 33 − 6 = 27 ثابت، فعمر هند 50 − 27 = 23.','The age gap is 33 − 6 = 27 and never changes, so Hind is 50 − 27 = 23.'],
 ['prob','كم ريالًا اقترضت ريم من هند؟','How many riyals did Reem borrow from Hind?',['56','80','140','24'],['56','80','140','24'],'ثمن الساعة 196 ومعها 140، فاقترضت 196 − 140 = 56.','The watch costs 196 and she has 140, so she borrowed 196 − 140 = 56.',{pass:PS_RM.ar},{pass:PS_RM.en}],

 PR('إذا كان الحليب وقودًا، فإن الحليب يُستخدم ......','If milk were fuel, then milk is used ......',['لتشغيل السيارات','للشرب','لصنع الجبن','للطبخ'],['to run cars','for drinking','to make cheese','for cooking'],'حسب المقدمة الحليب وقود، والوقود يشغّل السيارات.','According to the statement milk is fuel, and fuel runs cars.'),
 ['rel','اختر ما يناسب: تفاح : برتقال','Choose the matching pair: apple : orange',['خيار : جزر','قمح : خبز','عنب : عصير','شجرة : ثمرة'],['cucumber : carrot','wheat : bread','grapes : juice','tree : fruit'],'التفاح والبرتقال من الفئة نفسها (فواكه)، والخيار والجزر من الفئة نفسها (خضراوات).','Apple and orange are the same kind (fruits), as cucumber and carrot are (vegetables).'],
 ['anag','اختر الكلمة المناسبة: علم – لمع – ......','Choose the next word: EAT – ATE – ......',['معل','عمل','ملع','لعم'],['TEA','ETA','TAE','AET'],'في كل مرة ينتقل الحرف الأول إلى آخر الكلمة: علم ← لمع ← معل.','Each time the first letter moves to the end: EAT → ATE → TEA.'],
 PR('إذا كانت الساعة قطة، وكان صوت الريح حفيفًا، فإن صوت الساعة ......','If a clock were a cat, and the wind’s sound is rustling, then the clock’s sound is ......',['مواء','حفيف','زئير','نباح'],['miaowing','rustling','roaring','barking'],'حسب المقدمة الساعة قطة، وصوت القطة مواء.','According to the statement the clock is a cat, and a cat miaows.'),
 ['odd','الكلمة الشاذة فيما يلي:','The odd word out is:',['مطرقة','مِجهر','منظار','عدسة مكبرة'],['hammer','microscope','binoculars','magnifying glass'],'المجهر والمنظار والعدسة أدوات للرؤية والتكبير، أما المطرقة فللطرق.','Microscope, binoculars and magnifier help us see; a hammer is for hitting.'],
 PR('إذا كانت الصحراء بحرًا، وكانت القطارات تسير على القضبان، فإن في الصحراء ......','If the desert were a sea and trains run on rails, then in the desert there are ......',['سفن','جمال','رمال','قطارات'],['ships','camels','sand','trains'],'حسب المقدمة الصحراء بحر، وفي البحر سفن.','According to the statement the desert is a sea, and the sea has ships.'),
 PR('إذا كانت الشجرة كتابًا، وكان العسل من النحل، فإن أوراق الشجر تأتي من ......','If a tree were a book and honey comes from bees, then leaves come from ......',['الكتب','الأشجار','النحل','الأقلام'],['books','trees','bees','pens'],'حسب المقدمة الشجرة كتاب، فالأوراق تأتي من الكتب.','According to the statement a tree is a book, so leaves come from books.'),
 ['frac','حدد الشكل الذي يملأ الفراغ ليعطي علاقة مماثلة لما في الصندوق الأيمن: 60 : 20 مثل الدائرة الكاملة : ......','Choose the shape for a similar relationship: 60 : 20 is like the whole circle : ......',[pie(6,4),pie(6,2),pie(6,3),pie(6,5)],null,'20 ثلث 60، فنختار ثلث الدائرة (جزأين من 6).','20 is a third of 60, so choose a third of the circle (2 of 6 parts).',{figOpts:true,fig:anaS('60','20',pie(6,0))}],
 ['anag','اختر ما يناسب: سلم : ملس ، رسم : ......','Choose the pattern match: STOP : POTS, LIVE : ......',['مسر','سمر','رمس','مرس'],['EVIL','VILE','VEIL','LEVI'],'الكلمة الثانية هي الأولى مقلوبة الحروف: رسم ← مسر.','The second word is the first written backwards: LIVE → EVIL.'],
 ['frac','قضى سعد نصف يومه في النوم والراحة، وسدسه في المدرسة، وما تبقى في أنشطة أخرى. ما الكسر الذي يمثل ما تبقى؟','Saad spent half his day sleeping and resting, a sixth at school, and the rest on other things. What fraction is the rest?',['1/3','2/3','1/6','5/6'],['1/3','2/3','1/6','5/6'],'1 − 1/2 − 1/6 = 6/6 − 3/6 − 1/6 = 2/6 = 1/3.','1 − 1/2 − 1/6 = 6/6 − 3/6 − 1/6 = 2/6 = 1/3.'],
 ['seq','الترتيب الصحيح من الأصغر إلى الأكبر:','The correct order from smallest to largest is:',['ذرة ، جزيء ، خلية ، نسيج','خلية ، ذرة ، جزيء ، نسيج','جزيء ، ذرة ، خلية ، نسيج','نسيج ، خلية ، جزيء ، ذرة'],['atom, molecule, cell, tissue','cell, atom, molecule, tissue','molecule, atom, cell, tissue','tissue, cell, molecule, atom'],'الذرات تكوّن الجزيئات، والجزيئات تبني الخلايا، والخلايا تكوّن الأنسجة.','Atoms make molecules, molecules build cells, cells make tissues.'],
 PR('إذا كان العصير صابونًا، فإن العصير يُستخدم في ......','If juice were soap, then juice is used for ......',['غسل اليدين','الشرب','الطبخ','الري'],['washing hands','drinking','cooking','watering plants'],'حسب المقدمة العصير صابون، والصابون لغسل اليدين.','According to the statement juice is soap, and soap is for washing hands.'),
 PR('إذا كانت الأحلام مصنوعة من الحلوى، فإن الأحلام ......','If dreams were made of sweets, then dreams ......',['تُؤكل','تُرى في النوم','تُكتب','تُسمع'],['can be eaten','are seen in sleep','are written','are heard'],'حسب المقدمة الأحلام حلوى، والحلوى تُؤكل.','According to the statement dreams are sweets, and sweets are eaten.'),
 ['rel','اختر الكلمة المناسبة لتعطي علاقة مشابهة: مقص – ورق – قص ، فرشاة – ...... – طلاء','Choose the word for a similar relationship: scissors – paper – cutting, brush – ...... – painting',['جدار','دهان','رسام','لون'],['wall','paint','painter','colour'],'الأداة – ما نستخدمها عليه – العمل: المقص على الورق للقص، والفرشاة على الجدار للطلاء.','Tool – what it works on – the job: scissors on paper to cut, a brush on a wall to paint.'],
 ['rel','أكمل وفق النمط: سمك : بحر','Complete the pattern: fish : sea',['طيور : سماء','قمر : ليل','عسل : نحل','ريش : طائر'],['birds : sky','moon : night','honey : bees','feathers : bird'],'السمك يتحرك ويعيش في البحر، والطيور تطير في السماء.','Fish move about in the sea, and birds fly in the sky.'],
 ['logic','رتّبت ريم أربعة كتب في صف: لم يكن الأحمر ثانيًا، ووضعت بعده مباشرة الكتاب الأصفر، ووضعت الأزرق بعد الأخضر مباشرة، ولم يكن الأزرق آخرًا. ما الكتاب الذي وضعته أولًا؟','Reem lined up four books. Red was not second, yellow came right after red, blue came right after green, and blue was not last. Which book was first?',['الأخضر','الأحمر','الأزرق','الأصفر'],['green','red','blue','yellow'],'الترتيب الوحيد الممكن: أخضر ، أزرق ، أحمر ، أصفر.','The only possible order is green, blue, red, yellow.'],
 ['logic','اشترت سلمى ثلاث حقائب: الحمراء قبل الزرقاء، والخضراء بعد الزرقاء. ما الحقيبة التي اشترتها ثانيًا؟','Salma bought three bags: the red one before the blue one, and the green one after the blue one. Which did she buy second?',['الزرقاء','الحمراء','الخضراء','لا يمكن تحديدها'],['blue','red','green','cannot tell'],'الترتيب: الحمراء ثم الزرقاء ثم الخضراء.','The order is red, blue, green.'],
 ['ops','ما ناتج: (4 + 7 + 2 + 6 + 1) − (3 + 5 + 6 + 2 + 4)؟','What is (4 + 7 + 2 + 6 + 1) − (3 + 5 + 6 + 2 + 4)?',['0','20','40','10'],['0','20','40','10'],'كل قوس مجموعه 20، و 20 − 20 = 0.','Each bracket adds to 20, and 20 − 20 = 0.'],
 ['logic','تريد أن تشرب عصيرًا من علبة مغلقة، وأمامك كأس ومصاصة. ما أول شيء تفعله؟','You want to drink juice from a closed carton, and you have a glass and a straw. What do you do first?',['تفتح العلبة','تضع المصاصة في الكأس','تغسل الكأس','تشرب'],['open the carton','put the straw in the glass','wash the glass','drink'],'لا يمكن صبّ العصير أو شربه قبل فتح العلبة.','You cannot pour or drink before opening the carton.'],
 ['sym','إذا كان: ★ أكبر من ■ + ■ ، و ● = ★ + ★ ، و ▲ أصغر من ■. أي الرموز له القيمة الأكبر؟','If ★ is more than ■ + ■, ● = ★ + ★, and ▲ is less than ■, which symbol has the greatest value?',['●','★','■','▲'],['●','★','■','▲'],'● ضعف ★، و ★ أكبر من ■، و ■ أكبر من ▲.','● is double ★, ★ is more than ■, and ■ is more than ▲.'],
 ['phy','لو انعدمت جاذبية الأرض فجأة، ماذا يحدث لكرة يرميها لاعب إلى أعلى؟','If Earth’s gravity suddenly vanished, what would happen to a ball thrown upwards?',['تستمر في الصعود ولا تعود','تعود أسرع','تقف في الهواء','تدور حول اللاعب'],['it keeps going up and never comes back','it comes back faster','it stops in mid-air','it circles the player'],'الجاذبية هي التي تُبطئ الكرة وتعيدها، فإذا انعدمت استمرت في حركتها.','Gravity is what slows the ball and brings it back; without it the ball keeps moving.'],
 ['logic','يقف ماجد في طابور، أمامه 5 أشخاص وخلفه 9 أشخاص. كم عدد الأشخاص في الطابور؟','Majed stands in a queue with 5 people in front and 9 behind. How many are in the queue?',['15','14','16','9'],['15','14','16','9'],'5 + 9 + ماجد = 15.','5 + 9 + Majed = 15.'],
 ['seq','اختر الكلمة المناسبة لتعطي علاقة مشابهة: قليل – كافٍ – كثير جدًا ، صامت – متكلم – ......','Choose the word for a similar relationship: too little – enough – far too much, silent – talking – ......',['ثرثار','هادئ','أبكم','خطيب'],['chatterbox','calm','mute','speaker'],'الكلمة الثالثة زيادة مبالغ فيها، والثرثار يكثر الكلام زيادة عن الحاجة.','The third word is “too much”; a chatterbox talks far more than needed.']

 ['cat','في رأس السؤال كلمة: (بغل). اختر الزوج الذي يكون من نفس الفئة:','The word is “mule”. Choose the pair from the same group:',['حصان ، جمل','دجاجة ، بطة','أسد ، نمر','سمكة ، حوت'],['horse, camel','hen, duck','lion, tiger','fish, whale'],'البغل والحصان والجمل حيوانات يركبها الإنسان ويحمل عليها.','The mule, horse and camel are animals people ride and load.'],

 ['rel','حدد الكلمة التي تملأ الفراغ لتعطي علاقة مشابهة: دقيق – خبّاز – خبز ، قماش – خيّاط – ......','Fill the gap for a similar relationship: flour – baker – bread, cloth – tailor – ......',['ثوب','إبرة','مقص','خيط'],['garment','needle','scissors','thread'],'المادة – الصانع – الناتج: الخياط يصنع من القماش ثوبًا.','Material – maker – product: a tailor makes a garment from cloth.'],
 ['rel','حدد الكلمة التي تملأ الفراغ لتعطي علاقة مشابهة: مطبخ – فرن – صينية ، مكتبة – رفّ – ......','Fill the gap for a similar relationship: kitchen – oven – tray, library – shelf – ......',['كتاب','قلم','موظف','كرسي'],['book','pen','librarian','chair'],'المكان – شيء كبير فيه – ما يوضع عليه: الصينية في الفرن، والكتاب على الرف.','Place – a big thing in it – what goes in/on it: a tray in the oven, a book on the shelf.'],

 ['bio','ورقة نبات لا تستطيع صنع غذائها رغم توفر الماء والضوء. أي جزء في خلاياها به خلل على الأرجح؟','A leaf cannot make its food even with water and light. Which part of its cells is most likely faulty?',['البلاستيدات الخضراء','الجدار الخلوي','الفجوة العصارية','النواة'],['chloroplasts','cell wall','vacuole','nucleus'],'البلاستيدات الخضراء هي المسؤولة عن صنع الغذاء (البناء الضوئي).','Chloroplasts are where the plant makes its food (photosynthesis).'],
 ['bio','إذا كانت المدرسة خلية، فمن يشبه النواة التي تتحكم في كل أنشطتها؟','If a school were a cell, who would be like the nucleus that controls everything?',['المدير','الحارس','السور','المقصف'],['the head teacher','the guard','the wall','the canteen'],'النواة مركز التحكم في الخلية، والمدير يدير المدرسة.','The nucleus is the control centre of the cell; the head teacher runs the school.'],

 ['bio','في عملية البناء الضوئي، ما الغاز الذي يخرج من أوراق النبات؟','In photosynthesis, which gas comes out of the leaves?',['الأكسجين','ثاني أكسيد الكربون','بخار الكلور','الهيدروجين'],['oxygen','carbon dioxide','chlorine','hydrogen'],'يأخذ النبات ثاني أكسيد الكربون ويُخرج الأكسجين.','The plant takes in carbon dioxide and gives out oxygen.'],
 ['area','في الشكل مثلث قاعدته ضلع المستطيل ورأسه على الضلع المقابل. إذا كانت مساحة المثلث المظلل 12 سم²، فما مساحة المستطيل؟','The triangle’s base is a side of the rectangle and its top touches the opposite side. If the shaded triangle is 12 cm², what is the rectangle’s area?',['24 سم²','36 سم²','12 سم²','48 سم²'],['24 cm²','36 cm²','12 cm²','48 cm²'],'المثلث له نفس قاعدة المستطيل ونفس ارتفاعه، فمساحته نصف مساحة المستطيل: 12 × 2 = 24.','The triangle has the same base and height as the rectangle, so it is half of it: 12 × 2 = 24.',{fig:sqTriIn}],
 ['logic','ثلاثة ألوان (أبيض – أسود – بني). أخذ الدب القطبي اللون الأبيض، ولم يأخذ الغراب البني. ما لون الجمل؟','Three colours: white, black, brown. The polar bear took white, and the crow did not take brown. What colour is the camel?',['البني','الأبيض','الأسود','لا يمكن تحديده'],['brown','white','black','cannot tell'],'الأبيض للدب، والغراب لم يأخذ البني فأخذ الأسود، فيبقى البني للجمل.','White is the bear’s; the crow did not take brown so it took black; brown is left for the camel.'],
 ['logic','سارة في فصل هند، ومنى في فصل ريم، وهند في فصل منى. من في الفصل نفسه مع ريم؟','Sara is in Hind’s class, Mona is in Reem’s class, and Hind is in Mona’s class. Who is in the same class as Reem?',['جميعهن في الفصل نفسه','منى فقط','هند ومنى فقط','سارة فقط'],['they are all in the same class','only Mona','only Hind and Mona','only Sara'],'سارة مع هند، وهند مع منى، ومنى مع ريم؛ فالأربع في فصل واحد.','Sara is with Hind, Hind with Mona, Mona with Reem, so all four share a class.'],
 ['syn','اختر الكلمة المناسبة لتوافق المعنى: سيف : حُسام ، شجاع : ......','Choose the word that matches the meaning: sword : blade, brave : ......',['باسل','جبان','قوي','سريع'],['bold','coward','strong','fast'],'حسام مرادف سيف، وباسل مرادف شجاع.','“Blade” goes with sword as a synonym, and “bold” is a synonym of brave.'],
 ['prob','في كيس 12 حلوى. في كل جولة يضع أحد الأطفال حلوى واحدة ثم يسحب آخر 3 حلويات. بعد أي جولة يصبح الكيس فارغًا؟','A bag has 12 sweets. Each round one child puts in 1 sweet, then another takes out 3. After which round is the bag empty?',['السادسة','الخامسة','الرابعة','السابعة'],['6th','5th','4th','7th'],'كل جولة ينقص الكيس 2: بعد 5 جولات يبقى 2، وفي السادسة يصبح 3 ثم تُسحب كلها.','Each round the bag loses 2: after 5 rounds 2 are left; in round 6 it becomes 3 and all 3 are taken.'],
 ['numr','في الأشكال الآتية العدد في الأعلى ناتج عملية على العددين في الأسفل. ما قيمة ل؟','In each figure the top number comes from the two numbers below it. What is L?',['5','4','6','3'],['5','4','6','3'],'العدد العلوي = حاصل ضرب العددين ÷ 3: 2 × 6 ÷ 3 = 4 ، 3 × 9 ÷ 3 = 9 ، ل × 12 ÷ 3 = 20 ، فـ ل = 5.','Top = product of the two ÷ 3: 2 × 6 ÷ 3 = 4, 3 × 9 ÷ 3 = 9, L × 12 ÷ 3 = 20, so L = 5.',{fig:seq([cir3('4','2','6'),cir3('9','3','9'),cir3('20','ل','12')])},{fig:seq([cir3('4','2','6'),cir3('9','3','9'),cir3('20','L','12')])}]
]);
